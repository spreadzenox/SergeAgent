# Names only. Values live in serge.secrets.age after decrypt.
# Never commit a production sidecar.
# maps_to = observed julien-vps path (catalogue). Kit does not copy those files.
schema_version: 1
cipher: age
sidecar_filename: serge.secrets.age
plaintext_format: dotenv
forbidden_in_toml:
  - any key listed under keys[]
  - sk_live / sk_test / whsec_ / age secret keys
keys:
  - name: openrouter_api_key
    required_for: llm
    required_when_feature: llm
    maps_to: /home/serge/.config/serge/secrets/openrouter-api-key

  - name: owner_dashboard_token
    required_for: owner_ui
    required_when_feature: owner_ui
    maps_to: /home/serge/.config/serge/secrets/owner-dashboard.token

  - name: xai_api_key
    required_for: owner_ui
    required_when_feature: voice
    maps_to: /home/serge/.config/serge/secrets/xai-voice.env
    env_name_inside_file: XAI_API_KEY

  - name: openai_api_key
    required_for: owner_ui
    required_when_feature: voice
    optional_if_sibling_present: xai_api_key
    maps_to: /home/serge/.config/serge/secrets/openai-direct.env

  - name: stripe_live_key
    required_for: payments
    required_when_feature: payments_live
    maps_to: /home/serge/.config/serge/secrets/stripe-live.key

  - name: stripe_test_key
    required_for: payments
    required_when_feature: stripe
    maps_to: /home/serge/.config/serge/secrets/stripe-test.key

  - name: stripe_webhook_live_key
    required_for: payments
    required_when_feature: payments_live
    maps_to: /home/serge/.config/serge/secrets/stripe-webhook-live.key

  - name: stripe_webhook_test_key
    required_for: payments
    required_when_feature: stripe
    maps_to: /home/serge/.config/serge/secrets/stripe-webhook-test.key

  - name: discord_bot_token
    required_for: owner_ui
    required_when_feature: discord
    maps_to: /home/serge/.config/serge/secrets/discord-bot-token

  - name: browserbase_key
    required_for: pipeline
    required_when_feature: openclaw
    maps_to: /home/serge/.config/serge/secrets/browserbase.key
    notes: Needed when OpenClaw/web operator is on; kit may split later.

  - name: cloudflare_infra_key
    required_for: ingress
    required_when_feature: ingress
    maps_to: /home/serge/.config/serge/secrets/cloudflare-infra.key

  - name: cloudflare_registrar_key
    required_for: ingress
    required_when_feature: ingress
    maps_to: /home/serge/.config/serge/secrets/cloudflare-registrar.key

  - name: credential_vault_key
    required_for: payments
    required_when_feature: payments_live
    maps_to: /home/serge/.config/serge/secrets/credential-vault.key

  - name: payment_card_enc
    required_for: payments
    required_when_feature: payments_live
    maps_to: /home/serge/.config/serge/secrets/payment-card.enc
    notes: Ciphertext blob, not a token string.

  - name: gog_env
    required_for: pipeline
    required_when_feature: gmail
    multiline: true
    maps_to: /home/serge/.config/openclaw/gog.env
    notes: Gmail provider env. Outside ~/.config/serge/secrets/.

  - name: sms_gateway_token
    required_for: phone_sms
    required_when_feature: phone_sms
    maps_to: /home/serge/.config/serge/secrets/sms-gateway.token
    notes: Shared webhook secret (owner-generated, 32+ bytes hex). Android app signs or presents it; sms_receiver verifies before SmsInbox.

  - name: sip_trunk_password
    required_for: phone_voice
    required_when_feature: phone_voice
    maps_to: /home/serge/.config/serge/secrets/sip-trunk-password
    notes: SIP trunk auth password. Rendered into asterisk pjsip.conf (0600) by the builder, never into units or TOML.

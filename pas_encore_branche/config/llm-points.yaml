# Registre des points LLM. Les tools et capsules runtime vivent dans SQLite.
schema_version: 1

points:
  # ---- Méta-funnel venture ----
  draft_hypothesis_smoke:
    verdict: LLM-B
    tier: T2
    output_mode: structured
    external_info: true
    context: {}
    garde_fou: schéma dét (N 30-50, seuils A, fenêtre <= 10j, prix draft non-owné) ; smokes auto + FYI
    repli: template min + ticket QNA
    enabled: true
  draft_hypothesis_full:
    verdict: LLM-B
    tier: T2
    output_mode: structured
    external_info: true
    context: {}
    garde_fou: schéma + ticket HYPOTHESIS bloquant (version précise) ; gate collect vérifié dét avant ticket
    repli: template min + ticket QNA
    enabled: true
  plan_scale:
    verdict: LLM-L
    tier: T3
    output_mode: structured
    external_info: true
    propagation: maximale
    context: {}
    garde_fou: dans bornes -> auto + FYI ; hors bornes -> VETO_AMONT bloquant ; justification par section
    repli: rejouer le test gagnant à l'identique + FYI
    enabled: true
  options_pivot:
    verdict: LLM-L
    tier: T3
    output_mode: structured
    external_info: true
    propagation: maximale
    context: {}
    garde_fou: chaque option = pré-enregistrement -> ticket HYPOTHESIS ; diff non vide vérifiée dét ; jamais d'auto-pivot
    repli: PIVOT -> EXTEND (variation min) + FYI + QNA optionnel
    enabled: true
  resume_test:
    verdict: LLM-R
    tier: T1
    output_mode: structured
    external_info: false
    context: {}
    garde_fou: lecture seule mécanique (pas d'outil d'écriture) ; chiffres = DB ou rien
    repli: chiffres bruts sans résumé
    enabled: true

  # ---- Prospection ----
  fill_slots:
    verdict: LLM-B
    tier: T1
    output_mode: structured
    external_info: true
    context:
      tool_quotas: {memory_search: 1}
    garde_fou: checkers dét post-génération ; échec -> regen 1x puis template brut
    repli: template brut (envoyé quand même)
    enabled: true
  write_followup:
    verdict: LLM-B
    tier: T2
    output_mode: text
    external_info: true
    context: {}
    garde_fou: checkers P2 + détecteur agressivité + historique des touches
    repli: template générique
    enabled: true
  voice_script:
    verdict: LLM-B
    tier: T2
    output_mode: text
    external_info: true
    context: {}
    garde_fou: checkers dét (durée, disclosure, interdites, prix) + ticket initial par type, puis trust zone
    repli: script validé précédent (pinné)
    enabled: true
  voice_dialog:
    verdict: LLM-B
    tier: T2
    output_mode: text
    external_info: true
    context: {}
    note: Point temps réel comptant le speech-to-speech ; tour-par-tour = repli.
    garde_fou: tours/durée max ; détecteur dérive (recentrage 1x puis raccrochage propre) ; enregistrement ; DTMF1 -> ticket ; kill manuel
    repli: message secours pré-enregistré + répondeur + ticket + rappel planifié
    enabled: true
  summarize_thread:
    verdict: LLM-R
    tier: T1
    output_mode: text
    external_info: false
    context: {}
    note: Fusionné P6+O5 (un seul point paramétré par usage).
    garde_fou: lecture seule ; régénérable
    repli: brut tronqué (derniers K)
    enabled: true
  score_lead_departage:
    verdict: LLM-1
    tier: T1
    output_mode: structured
    external_info: false
    context: {}
    note: "Hybride (P7) : score DET par défaut, LLM-1 seulement en zone grise + décision coûteuse."
    garde_fou: seuil zone grise en policy
    repli: score DET seul
    enabled: true

  # ---- Builder ----
  build_artifact:
    verdict: LLM-L
    tier: T3
    output_mode: structured
    external_info: true
    context: {}
    note: Coeur opérationnel - pas d'économie de modèle (validé).
    garde_fou: sandbox (pas secret/mutation externe, réseau allowlist) ; sortie = artifact versionné ; 3 passes max partagées avec review_build
    repli: ticket QNA (spec + tentatives + recommandation) - pas de repli dét pour créer
    enabled: true
  review_build:
    verdict: LLM-1
    tier: T2
    output_mode: structured
    external_info: false
    context: {}
    note: Multimodal obligatoire (screenshots + interaction sandboxée). Juge DISTINCT du builder.
    garde_fou: verdict enum strict ; FIX <= 5 localisés ; passe 3 = binaire + dette ; FAIL-CLOSED
    repli: aucun (fail-closed)
    enabled: true
  summarize_build_debt:
    verdict: LLM-R
    tier: T1
    output_mode: structured
    external_info: false
    context: {}
    garde_fou: lecture seule (écriture DB dét) ; dédupliqué dét
    repli: réserves brutes copiées
    enabled: true

  # ---- Observation ----
  classify_reply:
    verdict: LLM-1
    tier: T1
    output_mode: structured
    external_info: false
    context:
      tool_quotas: {memory_search: 1}
    garde_fou: enum strict P3 ; confiance < 0,6 -> file review groupée ; UNSUBSCRIBE/SPAM = double-check dét
    repli: règles mots-clés + confiance basse forcée -> review
    enabled: true
  extract_meeting:
    verdict: LLM-1
    tier: T1
    output_mode: structured
    external_info: false
    context: {}
    garde_fou: vérif agenda dét ; confiance < 0,8 OU ambiguïté -> clarification, jamais de booking deviné ; booking = 3 actes dét idempotents
    repli: clarification générique (2-3 créneaux)
    enabled: true
  reply_intent:
    verdict: LLM-B
    tier: T2
    output_mode: text
    external_info: true
    context: {}
    garde_fou: détecteur d'engagement contractuel ; prix/délai = catalogue vérifié dét ; full auto + traçabilité post-hoc
    repli: accusé + ticket QNA
    enabled: true
  review_other:
    verdict: LLM-1
    tier: T1
    output_mode: structured
    external_info: true
    context: {}
    note: Batch quotidien, jamais bloquant temps réel.
    garde_fou: proposition catégorie = ticket ; reclassements logués + confiance
    repli: OTHER s'accumule (alerte si > 50) + traités REPLIED conservateur
    enabled: true
  score_call:
    verdict: LLM-R
    tier: T1
    output_mode: structured
    external_info: false
    context: {}
    note: Scoring post-appel F4b (note 1-5 + flags à réécouter).
    garde_fou: lecture seule ; note + flags vers file écoute
    repli: pas de score (file chronologique)
    enabled: true

  # ---- Collect ----

  # ---- Alloueur ----
  judge_allocator:
    verdict: LLM-1
    tier: T3
    output_mode: structured
    external_info: true
    propagation: maximale (allocation des semaines suivantes)
    context: {}
    note: Quotidien + déclenché (budget 80 %, seuils, ALERT, signal chaud, oscillation).
    garde_fou: bornes A (clamp + log) + justification revirements + écart > 15 pts vs B justifié + tickets irréversible
    repli: proposition B brute
    enabled: true

  # ---- Mémoire ----
  consolidate:
    verdict: LLM-B
    tier: T2
    output_mode: structured
    external_info: true
    context: {}
    note: Batch 3 jours. Le plus gros contexte batch.
    garde_fou: K max, budget mesuré, ticket MEMORY ; jamais d'écriture directe
    repli: pas de nouvelles leçons (+ FYI)
    enabled: true

  # ---- Interactivité ----
  render_context_fr:
    verdict: LLM-R
    tier: T1
    output_mode: text
    external_info: false
    context: {}
    garde_fou: lecture seule mécanique
    repli: champs bruts (titre + état + lien)
    enabled: true
  classify_owner_intent:
    verdict: LLM-1
    tier: T1
    output_mode: structured
    external_info: false
    context: {}
    garde_fou: ambigu + irréversible -> clarification, jamais d'exécution devinée
    repli: ticket QNA "précise ta demande"
    enabled: true
  judge_consequence:
    verdict: LLM-1
    tier: T2
    output_mode: structured
    external_info: true
    context:
      tool_quotas: {memory_search: 1}
    garde_fou: doute -> confirmation ; bypass respecté ; §14.1a jamais bypassé (check dét après)
    repli: confirmation systématique
    enabled: true

  # ---- Écoute ----
  listen_discover_needs_a:
    verdict: LLM-B
    tier: T2
    output_mode: structured
    external_info: true
    context:
      tool_quotas: {memory_search: 3, web_search: 3}
    garde_fou: validation JSON, preuves documentaires et déduplication déterministe
    repli: aucun candidat nouveau, conserver les documents pour le cycle suivant
    enabled: true
  listen_discover_needs_b:
    verdict: LLM-B
    tier: T2
    output_mode: structured
    external_info: true
    context:
      tool_quotas: {memory_search: 3, web_search: 3}
    garde_fou: même corpus et même contrat que A, déduplication déterministe
    repli: aucun candidat nouveau, conserver les documents pour le cycle suivant
    enabled: true
  listen_choose_poc:
    verdict: LLM-1
    tier: T2
    output_mode: structured
    external_info: false
    context: {}
    garde_fou: IDs existants, p borné, veto déterministe si POC déjà actif
    repli: aucune sélection, file owner
    enabled: true

  discover_contacts:
    verdict: LLM-1
    tier: T1
    output_mode: structured
    external_info: false
    context:
      tool_quotas: {contact_upsert: 1}
    note: Point minimal de preparation; aucune recherche web n'est integree.
    garde_fou: references fournies par le contexte uniquement; deduplication deterministe avant ecriture
    repli: aucun contact nouveau, conserver la demande pour integration specialisee
    enabled: true

  # ---- Guide installateur (kit, pas runtime) ----
  install_guide:
    verdict: LLM-R
    tier: T2
    output_mode: text
    external_info: false
    context: {}
    note: Guide FR de serge-install. Réponses courtes, aucun état modifié, secours local.
    garde_fou: lecture seule ; échec -> hint statique (jamais bloquant)
    repli: hints statiques TOPIC_HINTS
    enabled: true

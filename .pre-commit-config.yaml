# Serge pre-commit: lint + format + type-check + secrets scan (charte R2).
# Install: uv sync --group dev && uv run pre-commit install
# (installe aussi pre-push : gates + suite complète, clé OpenRouter obligatoire).
# CI PR = scripts/ci.sh (déterministe, zéro secret). orchestrator/ n'existe plus.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
        files: &charte-files ^(kit/|serge/|scripts/|tests/)
      - id: ruff-format
        files: *charte-files

  - repo: local
    hooks:
      - id: ty-check
        name: ty check (périmètre charte)
        entry: uv run ty check kit serge scripts/serge-builder.py scripts/serge-instance-wizard.py scripts/serge-mandate-wizard.py scripts/serge-update.py scripts/serge-deploy.py scripts/pre-push-check.py
        language: system
        types: [python]
        files: *charte-files
        pass_filenames: false
      - id: scan-secrets
        name: scan repo secrets
        entry: uv run python scripts/scan-repo-secrets.py
        language: system
        pass_filenames: false
      - id: pre-push-check
        name: gates + suite + LLM live (pre-push)
        entry: uv run python scripts/pre-push-check.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

# Les types de tickets de départ. Au démarrage, un type nouveau s'ajoute
# en base ; un type déjà en base n'est jamais touché : son délai, sa
# décision annoncée et ses boutons se règlent dans Mission Control (page
# Décisions, décision Q85). Le moteur ne connaît que le cycle de vie
# générique (DRAFT→OPEN→DISCUSSING→DECIDED→EXECUTED→CLOSED, EXPIRED,
# CANCELLED).
schema_version: 1

types:
  GUICHET:
    role: &role_guichet >-
      « Appeler un humain », second temps : un humain prêt reçoit le lien
      de l'écran du vrai Chrome (Mission Control) et y fait ce qui bloque
      (un captcha) pendant que la tâche attend ; « C'est fait » la laisse
      continuer (décision Q97).
    render: {color: 16711680, emoji: "🔴"}
    urgency: urgente
    expiry_minutes: [10, 30]
    default: pause_propre_reproposee
    default_detail: >-
      Sans « C'est fait » à temps, la tâche s'arrête et redemande si un
      humain est prêt.
    fields: &champs_guichet [contexte, action_requise, lien_stream]
    buttons: &boutons_guichet [cest_fait, abandonner]
  GUICHET_PRET:
    role: >-
      « Appeler un humain », premier temps : une page demande un humain (un
      captcha) et la tâche s'est arrêtée. « Je suis prêt » la fait
      repartir, et le lien de l'écran arrive dans un second ticket ;
      « Abandonner » la fait continuer sans humain (décision Q97).
    render: {color: 16711680, emoji: "🙋"}
    urgency: urgente
    expiry_hours: null
    default: attend
    default_detail: La tâche attend qu'un humain soit prêt, sans limite de temps.
    fields: [en_bref, action_requise, point_llm]
    buttons: [pret, abandonner]
  FYI:
    role: Digest, résultats, signaux, rapports (pas de réponse)
    render: {color: 9807270, emoji: "ℹ️"}
    urgency: aucune
    expiry_hours: null
    default: rien
    default_detail: Lecture seule.
    fields: [contenu]
    buttons: [discuter_fil]
  REQUESTED:
    role: &role_demande >-
      Une invocation demande à Julien ce qui lui manque (un outil, un accès,
      une information). Sa tâche attend la réponse, sans limite de temps :
      « Répondre » (un texte libre) ou « Faire sans » la fait repartir du
      début, avec la réponse.
    render: {color: 5793266, emoji: "💡"}
    urgency: normale
    expiry_hours: null
    default: attend
    default_detail: La tâche qui demande attend la réponse, sans limite de temps.
    fields: &champs_demande [en_bref, demande, contexte, point_llm]
    buttons: &boutons_demande [reponse_libre, faire_sans, discuter_fil]
  SERVICE:
    role: >-
      Un produit en construction demande un service gratuit d'un autre site
      que son plan validé ne nomme pas (décision Q118). « Valider » : Serge
      crée son compte sur ce site et va y chercher une clé d'API gratuite.
      « Rejeter » : le constructeur fait sans. La tâche de construction
      attend la réponse.
    render: {color: 5793266, emoji: "🔌"}
    urgency: normale
    expiry_hours: null
    default: attend
    default_detail: La construction attend la réponse, sans limite de temps.
    fields: *champs_demande
    buttons: [valider, rejeter, discuter]
  CONVERSATION:
    role: >-
      Serge a besoin d'un humain pour répondre à un prospect : un brouillon
      à valider, une question que la fiche produit ne couvre pas, un
      engagement qu'il ne peut pas prendre (lot 8 bis, Q50 et Q85).
    render: {color: 3447003, emoji: "💬"}
    urgency: normale
    expiry_hours: 24
    default: reponse_attente
    default_detail: >-
      Serge envoie une réponse d'attente prudente au contact ; le ticket
      reste ouvert.
    # Expiré, le ticket n'est pas fermé : sa décision par défaut (la
    # réponse d'attente) s'applique une fois, et il attend toujours.
    rester_ouvert: true
    # Ce que montre le ticket, dans cet ordre : des outils en base, et la
    # colonne de l'envoi que chacun reçoit (Q50).
    contenu: &contenu_conversation
      - {label: Le business, tool: fiche_business, params: {venture_id: venture_id}}
      - {label: Le prospect, tool: fiche_contact, params: {contact_id: contact_id}}
      # « fin » : la carte Discord garde la fin du fil (les derniers
      # messages), pas son début.
      - {label: Le fil, tool: fil_du_contact, params: {contact_id: contact_id}, fin: true}
      - {label: Le brouillon de Serge, tool: brouillon_de_l_envoi, params: {touch_id: id}}
    fields: [Le business, Le prospect, Le fil, Le brouillon de Serge, Pourquoi, La question]
    buttons: [envoyer_brouillon, ma_reponse, reecrire, ne_rien_envoyer]
  PLAN_POC:
    role: >-
      Le plan d'un POC et sa fiche produit, à valider avant la construction
      (lot 10, Q34, Q35 et Q91). « Valider » lance la construction ; « À
      corriger » renvoie le plan à la conception avec tes consignes.
    render: {color: 3066993, emoji: "🧭"}
    urgency: normale
    expiry_hours: 48
    default: valider
    default_detail: >-
      Le plan s'applique : la construction du POC commence (Q34).
    contenu:
      - {label: Le business, tool: fiche_business, params: {venture_id: venture_id}}
      - {label: Le plan, tool: plan_par_numero, params: {plan_id: id}}
      - {label: La critique, tool: critiques_du_plan, params: {plan_id: id}}
      - {label: La fiche produit, tool: fiche_produit, params: {venture_id: venture_id}}
    fields: [Le business, Le plan, La critique, La fiche produit, Pourquoi]
    buttons: [valider, a_corriger, arreter_business, discuter]
  TEST_POC:
    role: &role_test_poc >-
      Le POC en ligne en staging, à essayer comme un prospect avant la
      prospection légère (lot 10, Q91). « Valider » le met en prod ; « À
      corriger » relance la construction avec tes consignes (un bug, un
      détail) ; « Revoir le plan » renvoie le produit à la conception avec
      tes consignes, puis au critique et au ticket « Plan » (une
      fonctionnalité à changer, à ajouter ou à retirer, décision Q116).
    render: {color: 15105570, emoji: "🧪"}
    urgency: normale
    expiry_hours: null
    default: attend
    default_detail: >-
      Le POC attend qu'un humain l'essaie, sans limite de temps : rien ne
      part vers des prospects avant.
    contenu:
      - {label: Le business, tool: fiche_business, params: {venture_id: venture_id}}
      - {label: Le staging, tool: staging_du_business, params: {venture_id: venture_id}}
      - {label: Les scénarios de test, tool: plan_valide_du_poc, params: {venture_id: venture_id}}
      - {label: Le relecteur, tool: passage_par_numero, params: {build_id: id}}
    fields: [Le business, Le staging, Les scénarios de test, Le relecteur, Pourquoi]
    buttons: &boutons_test [valider, a_corriger, revoir_plan, arreter_business, discuter]
  CHOIX_PRINCIPAL:
    role: >-
      La proposition de business principal, à valider (lot 12, Q16 bis) :
      le business dont Serge construira le produit fini, puis qu'il vendra
      en masse. « Valider » applique la proposition ; « Choisir un autre »
      prend le business dont tu écris le nom, parmi ceux du ticket ;
      « Aucun » les met tous de côté.
    render: {color: 15844367, emoji: "🏆"}
    urgency: normale
    expiry_hours: 48
    default: valider
    default_detail: >-
      La proposition s'applique : le business proposé entre en construction
      de son produit fini, les autres sont mis de côté (Q16 bis).
    contenu:
      - {label: La proposition de Serge, tool: choix_par_numero, params: {choice_id: id}}
      - {label: Les business qui attendent, tool: business_retenus}
      - {label: Les comptes rendus de leurs tests, tool: comptes_rendus_des_retenus}
    fields: [La proposition de Serge, Les business qui attendent, Les comptes rendus de leurs tests, Pourquoi]
    buttons: [valider, choisir_autre, aucun, discuter]
  PLAN_PRODUIT:
    role: >-
      Le plan du produit fini, payant, d'un business : son prix définitif,
      son nom de domaine, sa fiche produit et ce qu'il fait des demandes
      des clients (lot 10, Q41 et Q91). « Valider » lance la construction ;
      le domaine sera acheté après ton essai du produit. « À corriger »
      renvoie le plan à la conception avec tes consignes.
    render: {color: 3066993, emoji: "🧭"}
    urgency: normale
    expiry_hours: null
    default: attend
    default_detail: >-
      Le plan attend un humain, sans limite de temps : il fixe le prix et
      le nom de domaine (Q91).
    contenu: &contenu_plan_produit
      - {label: En bref, tool: plan_produit_en_bref, params: {plan_id: id}}
      - {label: Le business, tool: fiche_business, params: {venture_id: venture_id}}
      - {label: Le plan, tool: plan_produit_par_numero, params: {plan_id: id}}
      - {label: La critique, tool: critiques_du_plan, params: {plan_id: id}}
      - {label: La fiche produit, tool: fiche_produit, params: {venture_id: venture_id}}
      - {label: Les demandes des clients, tool: demandes_des_clients, params: {venture_id: venture_id}}
    fields: &champs_plan_produit [En bref, Le business, Le plan, La critique, La fiche produit, Les demandes des clients, Pourquoi]
    buttons: [valider, a_corriger, arreter_business, discuter]
  TEST_PRODUIT:
    role: &role_test_produit >-
      Le produit fini en ligne en staging, avec Stripe en mode test, à
      essayer comme un client, paiement compris, avant sa mise en vente
      (lot 10, Q91). « Valider » achète son domaine, le met en vente et le
      publie en prod ; « À corriger » relance la construction avec tes
      consignes (un bug, un détail) ; « Revoir le plan » renvoie le produit
      à la conception avec tes consignes, puis au critique et au ticket
      « Plan » (une fonctionnalité à changer, à ajouter ou à retirer,
      décision Q116).
    render: {color: 15105570, emoji: "🧪"}
    urgency: normale
    expiry_hours: null
    default: attend
    default_detail: >-
      Le produit attend qu'un humain l'essaie, sans limite de temps : rien
      n'est mis en vente avant.
    contenu:
      - {label: Le business, tool: fiche_business, params: {venture_id: venture_id}}
      - {label: Le staging, tool: staging_du_produit, params: {venture_id: venture_id}}
      - {label: Les scénarios de test, tool: plan_valide_du_produit, params: {venture_id: venture_id}}
      - {label: Le relecteur, tool: passage_par_numero, params: {build_id: id}}
    fields: [Le business, Le staging, Les scénarios de test, Le relecteur, Pourquoi]
    buttons: *boutons_test
  DOMAINE_PRODUIT:
    role: >-
      Le domaine d'un produit fini n'a pas pu être acheté : pris, trop
      cher, ou refusé par le bureau d'enregistrement (lot 10, Q91).
      « À corriger » avec un nom (exemple : devis-artisan.fr) achète ce
      nom ; « Valider » réessaie le domaine du plan, par exemple après
      avoir relevé le prix maximum sur la page Policy.
    render: {color: 15844367, emoji: "🌐"}
    urgency: normale
    expiry_hours: null
    default: attend
    default_detail: Le produit attend un nom de domaine, sans limite de temps.
    contenu:
      - {label: Le business, tool: fiche_business, params: {venture_id: venture_id}}
      - {label: Le plan validé, tool: plan_valide_du_produit, params: {venture_id: venture_id}}
    fields: [Le business, Le plan validé, Pourquoi]
    buttons: [valider, a_corriger, arreter_business, discuter]
  PASSAGE:
    role: >-
      Un lien réglé à la main attend un feu vert : passer à l'invocation
      suivante, avec ces paramètres (Q62). Le bouton « Passer à la suite »
      de Mission Control reste ; le premier qui passe l'emporte.
    render: {color: 15844367, emoji: "🚦"}
    urgency: normale
    expiry_hours: null
    default: attend
    default_detail: Le passage attend un feu vert, sans limite de temps.
    fields: [Le lien, Ce qui passe]
    buttons: [passer, ne_pas_passer]

# Changer un type déjà en base (serge/tickets/types.py) : une seule fois par
# instance, et seulement si la valeur en base est encore « from ».
changes:
  - id: demande_bloquante
    why: >-
      Une demande gèle la tâche qui la fait jusqu'à la réponse de Julien
      (lot 11) ; le ticket dit d'abord en bref ce qui est demandé.
    type: REQUESTED
    set:
      role:
        from: Demandes d'évolution P3 des LLM (lecture seule owner, batch Meta-Grok)
        to: *role_demande
      fields: {from: [demande, contexte, point_llm], to: *champs_demande}
      buttons: {from: [discuter_fil], to: *boutons_demande}
  - id: plan_produit_en_bref
    why: Le ticket du plan dit d'abord le nom, le domaine et le prix (lot 11).
    type: PLAN_PRODUIT
    set:
      contenu:
        from:
          - {label: Le business, tool: fiche_business, params: {venture_id: venture_id}}
          - {label: Le plan, tool: plan_produit_par_numero, params: {plan_id: id}}
          - {label: La critique, tool: critiques_du_plan, params: {plan_id: id}}
          - {label: La fiche produit, tool: fiche_produit, params: {venture_id: venture_id}}
          - {label: Les demandes des clients, tool: demandes_des_clients, params: {venture_id: venture_id}}
        to: *contenu_plan_produit
      fields:
        from: [Le business, Le plan, La critique, La fiche produit, Les demandes des clients, Pourquoi]
        to: *champs_plan_produit
  - id: conversation_fin_du_fil
    why: >-
      La carte montre maintenant le début d'un long bloc ; pour le fil, ce
      sont les derniers messages qui comptent (lot 11).
    type: CONVERSATION
    set:
      contenu:
        from:
          - {label: Le business, tool: fiche_business, params: {venture_id: venture_id}}
          - {label: Le prospect, tool: fiche_contact, params: {contact_id: contact_id}}
          - {label: Le fil, tool: fil_du_contact, params: {contact_id: contact_id}}
          - {label: Le brouillon de Serge, tool: brouillon_de_l_envoi, params: {touch_id: id}}
        to: *contenu_conversation
  - id: guichet_appeler_un_humain
    why: >-
      Un captcha passe par « Appeler un humain », en deux temps : ce ticket
      est le second, avec le lien de l'écran du vrai Chrome (décision Q97).
    type: GUICHET
    set:
      role:
        from: Étapes déléguées humaines (CAPTCHA stream, KYC, signature, 3DS)
        to: *role_guichet
      fields:
        from: [contexte, progres, action_requise, lien_stream, ttl]
        to: *champs_guichet
      buttons: {from: [cest_fait, abandonner, discuter], to: *boutons_guichet}
  # Depuis un ticket de test, on choisit où revenir : à la construction
  # (un bug) ou à la conception (une fonctionnalité), décision Q116.
  - id: test_poc_revoir_le_plan
    why: >-
      Un changement de fonctionnalité demandé à l'essai du POC doit
      repasser par la conception et le critique, pas seulement par la
      construction (Q116).
    type: TEST_POC
    set:
      role:
        from: >-
          Le POC en ligne en staging, à essayer comme un prospect avant la
          prospection légère (lot 10, Q91). « Valider » le met en prod ; « À
          corriger » relance la construction avec tes consignes.
        to: *role_test_poc
      buttons:
        from: [valider, a_corriger, arreter_business, discuter]
        to: *boutons_test
  - id: test_produit_revoir_le_plan
    why: Le même choix pour le produit fini (Q116).
    type: TEST_PRODUIT
    set:
      role:
        from: >-
          Le produit fini en ligne en staging, avec Stripe en mode test, à
          essayer comme un client, paiement compris, avant sa mise en vente
          (lot 10, Q91). « Valider » achète son domaine, le met en vente et le
          publie en prod ; « À corriger » relance la construction avec tes
          consignes.
        to: *role_test_produit
      buttons:
        from: [valider, a_corriger, arreter_business, discuter]
        to: *boutons_test

# Les types retirés de ce fichier, effacés aussi de la base (comme la section
# `deleted` de policy.yaml). Aucune invocation ne les a jamais ouverts
# (nettoyage du 17 novembre 2026). Ne jamais redonner un de ces noms à un
# nouveau type.
deleted:
  - HYPOTHESIS
  - VETO_AMONT
  - PUBLICATION
  - MEMORY
  - POLICY
  - R1_OVERRIDE
  - OWNER_ORDER
  - QNA
  - ALERT
  - COLLECT_READINESS

    to: demander_choix_principal
    condition: {field: redemander, op: '=', value: oui}
    params:
      choice_id: {source: field, value: choice_id}
      raison: {source: field, value: raison}
  - id: lourde_vers_interesses
    title: Les intéressés du test sont prévenus les premiers
    from: preparer_prospection_lourde
    to: prevenir_interesses
    params:
      venture_id: {source: task, value: venture_id}
  - id: lourde_vers_ticket
    title: La prospection lourde est lancée
    from: preparer_prospection_lourde
    to: prevenir_prospection
    params:
      titre: {source: fixed, value: La prospection lourde d'un business est lancée}
      raison: {source: field, value: compte_rendu}
  - id: premiere_vente_vers_ticket
    title: La première vente d'un business
    from: enregistrer_vente
    to: prevenir_prospection
    condition: {field: premiere, op: '=', value: oui}
    params:
      titre: {source: fixed, value: Première vente d'un business}
      raison: {source: field, value: montant}

  # L'essai total (Q99) : le départ, puis les seuls endroits où l'essai
  # quitte le vrai chemin.
  - id: essai_total_vers_contact
    title: "Essai total : le business est créé ; son contact aussi"
    from: lancer_essai_total
    to: creer_contact_essai_total
    mode: per_row
    write: 0
    params:
      venture_id: {source: row, value: id}
      name: {source: task, value: name}
      email: {source: task, value: email}
      phone: {source: task, value: phone}
      depart: {source: task, value: depart}
  - id: essai_total_depart_1
    title: "Essai total : départ à l'étape 1, l'écoute du web"
    from: creer_contact_essai_total
    to: ouvrir_cycle
    condition: {field: depart, op: '=', value: '1'}
    params: &guide_essai
      guide: {source: fixed, value: "Essai total de Serge : cherche des besoins autour des calculatrices et des petits outils de calcul en ligne."}
  - id: essai_total_depart_defaut
    title: "Essai total : sans étape de départ, l'écoute du web"
    from: creer_contact_essai_total
    to: ouvrir_cycle
    condition: {field: depart, op: '=', value: ''}
    params: *guide_essai
  - id: essai_total_depart_2
    title: "Essai total : départ à l'étape 2, le POC"
    from: creer_contact_essai_total
    to: essai_depart_poc
    condition: {field: depart, op: '=', value: '2'}
    params: &business_essai
      venture_id: {source: task, value: venture_id}
  - id: essai_total_depart_3
    title: "Essai total : départ à l'étape 3, le test léger"
    from: creer_contact_essai_total
    to: essai_depart_test_leger
    condition: {field: depart, op: '=', value: '3'}
    params: *business_essai
  - id: essai_total_depart_5
    title: "Essai total : départ à l'étape 5, le produit fini"
    from: creer_contact_essai_total
    to: essai_depart_produit
    condition: {field: depart, op: '=', value: '5'}
    params: *business_essai
  - id: essai_total_depart_6
    title: "Essai total : départ à l'étape 6, la prospection lourde"
    from: creer_contact_essai_total
    to: essai_depart_vente
    condition: {field: depart, op: '=', value: '6'}
    params: *business_essai
  - id: essai_choisi_vers_plan
    title: "Essai total : la calculatrice est choisie ; son plan est tout fait"
    from: essai_depart_poc
    to: essai_plan_poc
    mode: per_row
    write: 0
    params:
      venture_id: {source: row, value: id}
  - id: choix_vers_plan_tout_fait
    title: "Essai total : le business choisi a un plan tout fait"
    from: choisir_business
    to: essai_plan_poc
    mode: per_row
    write: 0
    lane: trial
    condition: {field: lifecycle, op: '=', value: POC_SELECTED}
    params:
      venture_id: {source: row, value: id}
  - id: plan_tout_fait_vers_ticket
    title: "Essai total : le plan tout fait part au ticket « Plan »"
    from: essai_plan_poc
    to: demander_validation_plan
    mode: per_row
    write: 0
    params:
      plan_id: {source: row, value: id}
  - id: essai_produit_vers_conception
    title: "Essai total : le produit fini de la calculatrice est conçu"
    from: essai_depart_produit
    to: concevoir_produit
    mode: per_row
    write: 0
    params:
      venture_id: {source: row, value: id}
      tour: {source: fixed, value: '1'}
  - id: paiement_vers_captcha_essai
    title: "Essai total : après le paiement test, le captcha avec un humain"
    from: paiement_test
    to: essayer_captcha
    lane: trial
    condition: {field: paye, op: '=', value: oui}
    params:
      venture_id: {source: task, value: venture_id}
      compte_rendu: {source: field, value: compte_rendu}
  - id: captcha_vers_produit_pret_essai
    title: "Essai total : le captcha est essayé ; le produit est en vente"
    from: essayer_captcha
    to: produit_pret
    lane: trial
    params:
      venture_id: {source: task, value: venture_id}
      compte_rendu: {source: task, value: compte_rendu}
  - id: essai_sans_domaine_commun
    title: "Essai total : sans domaine commun, pas d'achat de domaine"
    from: choisir_domaine
    to: prevenir_produit
    lane: trial
    condition: {field: domaine_commun, op: '=', value: ''}
    params:
      titre: {source: fixed, value: Il manque le domaine commun des produits}
      raison: {source: fixed, value: "Un essai n'achète jamais de domaine. Règle « Le domaine commun des produits finis » (page Policy, « Choisir le domaine du produit »), puis fais repartir l'essai de la tâche « Choisir le domaine du produit »."}
  # --- Les comptes web (lot 13, Q104) ---
  - id: compte_ouvert_vers_creation
    title: Le compte est prêt en base ; le créer sur le site
    from: ouvrir_compte_web
    to: creer_compte_web
    condition: {field: ok, op: '=', value: 'True'}
    params:
      compte: {source: field, value: compte}
      url: {source: field, value: url}
      naissance: {source: task, value: naissance}
      pseudo: {source: task, value: pseudo}
  - id: compte_refuse_vers_ticket
    title: Un compte web qui ne peut pas être ouvert
    from: ouvrir_compte_web
    to: prevenir_compte_web
    condition: {field: ok, op: '!=', value: 'True'}
    params:
      titre: {source: fixed, value: "Un compte web n'a pas pu être ouvert"}
      raison: {source: field, value: detail}
  - id: compte_cree_vers_ticket
    title: Prévenir qu'un compte web est créé
    from: creer_compte_web
    to: prevenir_compte_web
    condition: {field: cree, op: '=', value: oui}
    params:
      titre: {source: fixed, value: Un compte web est créé}
      raison: {source: field, value: compte_rendu}
  - id: compte_pas_cree_vers_ticket
    title: Prévenir qu'un compte web n'a pas pu être créé
    from: creer_compte_web
    to: prevenir_compte_web
    condition: {field: cree, op: '!=', value: oui}
    params:
      titre: {source: fixed, value: "Un compte web n'a pas pu être créé"}
      raison: {source: field, value: compte_rendu}
  # Un message d'essai qui attend un contact (lot 13, Q110). Ces liens ne
  # jouent que pour une tâche lancée par le bouton : un vrai envoi passe
  # par « Envoyer un message », qui confie l'envoi en mission et fait
  # attendre l'envoi lui-même (serge/channels/web.py). Les deux suivent la
  # même liste d'attentes de la Policy : le délai du second lien prend
  # celle du rappel en cours.
  - id: essai_attend_un_contact
    title: Un message d'essai attend que la personne accepte le contact
    from: envoyer_par_le_web
    to: compter_rappels_contact
    condition: {field: envoye, op: '=', value: attente}
    params: &message_d_essai
      compte: {source: task, value: compte}
      canal: {source: task, value: canal}
      adresse: {source: task, value: adresse}
      message: {source: task, value: message}
      sorte: {source: task, value: sorte}
      rappel: {source: task, value: rappel}
  - id: essai_retourne_voir
    title: Retourner voir si le message d'essai peut partir
    from: compter_rappels_contact
    to: envoyer_par_le_web
    condition: {field: suite, op: '=', value: encore}
    delay:
      min: 'web_accounts.contact_waits_minutes[{rappel}]'
      max: 'web_accounts.contact_waits_minutes[{rappel}]'
    params:
      <<: *message_d_essai
      rappel: {source: field, value: tour_suivant}

triggers:
  - id: lancer_cycle
    title: Lancer un cycle d'écoute
    invocation: ouvrir_cycle
    event: button
    only_if_room_in: [places_de_test, cycles_ouverts]
    params:
      guide: {source: form, value: guide}
  - id: bouton_abandonner_cycle
    title: Abandonner le cycle en cours
    invocation: abandonner_cycle
    event: button
    confirm: >-
      Le cycle ouvert est fermé et ses tâches en attente sont annulées ;
      sa chaîne s'arrête après la tâche en cours. On peut alors en lancer
      un autre.
  - id: veille_flux
    title: Lire chaque flux RSS suivi
    invocation: lire_un_flux
    event: every
    every_minutes: 360
    table: listen_feeds
    filter_column: active
    filter_value: '1'
    params:
      url: {source: row, value: url}
      feed_id: {source: row, value: id}
  - id: oubli_quotidien_pages
    title: Oublier les vieilles pages, chaque jour
    invocation: oublier_pages
    event: every
    every_minutes: 1440
  - id: oubli_quotidien_besoins
    title: Oublier les besoins jamais utilisés, chaque jour
    invocation: oublier_besoins
    event: every
    every_minutes: 1440
  - id: releve_des_canaux
    title: Relever chaque canal qui se relève
    invocation: relever_messages
    event: every
    every_minutes: 2
    table: canaux
    filter_column: poll_pace
    filter_value: fast
    params:
      channel: {source: row, value: id}
  - id: releve_des_messageries
    title: Relever la messagerie de chaque canal du navigateur
    invocation: relever_messages
    event: every
    every_minutes: 240
    table: canaux
    filter_column: poll_pace
    filter_value: slow
    params:
      channel: {source: row, value: id}
  - id: message_recu
    title: Un contact a écrit
    invocation: traiter_reponse
    event: row_written
    table: inbound_events
    filter_column: status
    filter_value: attached
    params:
      inbound_id: {source: row, value: id}
      contact_id: {source: row, value: contact_id}
      venture_id: {source: row, value: venture_id}
      channel: {source: row, value: channel}
      address: {source: row, value: address}
      subject: {source: row, value: subject}
  - id: envoi_attend_julien
    title: Un envoi attend un humain
    invocation: demander_julien
    event: row_written
    table: touches
    filter_column: status
    filter_value: waiting_owner
    params:
      touch_id: {source: row, value: id}
      raison: {source: row, value: last_error}
      question: {source: row, value: owner_question}
      version: {source: row, value: updated_at}
  - id: julien_envoie_le_brouillon
    title: « Envoyer le brouillon »
    invocation: valider_envoi
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: envoyer_brouillon
    params:
      touch_id: {source: row, value: ref_id}
  - id: julien_donne_sa_reponse
    title: « Ma réponse »
    invocation: envoyer_reponse_de_julien
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: ma_reponse
    params:
      touch_id: {source: row, value: ref_id}
      texte: {source: row, value: text}
      objet: &param_objet_de_julien {source: row, value: subject}
  - id: reponse_de_julien_en_question_frequente
    title: « Ma réponse » à une question sur le produit
    invocation: ajouter_question_frequente
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: ma_reponse
    params:
      venture_id: {source: row, value: venture_id}
      question: {source: row, value: question}
      texte: {source: row, value: text}
  - id: julien_demande_de_reecrire
    title: « Réécrire »
    invocation: reecrire_brouillon
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: reecrire
    params:
      touch_id: {source: row, value: ref_id}
      consignes: {source: row, value: text}
      contact_id: {source: row, value: contact_id}
      venture_id: {source: row, value: venture_id}
  - id: julien_n_envoie_rien
    title: « Ne rien envoyer »
    invocation: annuler_envoi
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: ne_rien_envoyer
    params:
      touch_id: {source: row, value: ref_id}
  - id: personne_n_a_repondu
    title: Le ticket d'une conversation a expiré
    invocation: preparer_reponse_attente
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: reponse_attente
    params:
      touch_id: {source: row, value: ref_id}
  - id: feu_vert_d_un_passage
    title: « Passer à la suite » sur un ticket
    invocation: passer_la_main
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: passer
    params:
      passage: {source: row, value: ref_id}
  - id: relances_regulieres
    title: Chercher les relances à faire
    invocation: preparer_relances
    event: every
    every_minutes: 15

  - id: reponse_au_ticket_plan_poc
    title: Une réponse au ticket « Plan » d'un POC
    invocation: suite_plan_poc
    event: row_written
    table: ticket_answers
    filter_column: ticket_type
    filter_value: PLAN_POC
    params:
      acte: {source: row, value: acte}
      texte: {source: row, value: text}
      plan_id: {source: row, value: ref_id}
      venture_id: {source: row, value: venture_id}
  - id: reponse_au_ticket_test_poc
    title: Une réponse au ticket « Tester le produit » d'un POC
    invocation: suite_test_poc
    event: row_written
    table: ticket_answers
    filter_column: ticket_type
    filter_value: TEST_POC
    params:
      acte: {source: row, value: acte}
      texte: {source: row, value: text}
      build_id: {source: row, value: ref_id}
      venture_id: {source: row, value: venture_id}

  - id: reponse_au_ticket_plan_produit
    title: Une réponse au ticket « Plan » d'un produit
    invocation: suite_plan_produit
    event: row_written
    table: ticket_answers
    filter_column: ticket_type
    filter_value: PLAN_PRODUIT
    params:
      acte: {source: row, value: acte}
      texte: {source: row, value: text}
      plan_id: {source: row, value: ref_id}
      venture_id: {source: row, value: venture_id}
  - id: reponse_au_ticket_test_produit
    title: Une réponse au ticket « Tester le produit » d'un produit fini
    invocation: suite_test_produit
    event: row_written
    table: ticket_answers
    filter_column: ticket_type
    filter_value: TEST_PRODUIT
    params:
      acte: {source: row, value: acte}
      texte: {source: row, value: text}
      build_id: {source: row, value: ref_id}
      venture_id: {source: row, value: venture_id}
  - id: reponse_au_ticket_domaine_produit
    title: Une réponse au ticket « Domaine » d'un produit
    invocation: suite_domaine
    event: row_written
    table: ticket_answers
    filter_column: ticket_type
    filter_value: DOMAINE_PRODUIT
    params:
      acte: {source: row, value: acte}
      texte: {source: row, value: text}
      build_id: {source: row, value: ref_id}
      venture_id: {source: row, value: venture_id}

  - id: bouton_supprimer_stripe_test
    title: Supprimer de Stripe (mode test)
    invocation: supprimer_de_stripe
    event: button
    confirm: >-
      Serge archive dans Stripe, en mode test, les prix et les produits de
      ce business : ils ne pourront plus être payés.
    params:
      venture_id: {source: form, value: venture_id}
      service: {source: fixed, value: stripe_test}
  - id: bouton_supprimer_stripe_live
    title: Supprimer de Stripe (vrai mode)
    invocation: supprimer_de_stripe
    event: button
    confirm: >-
      Attention, vrai mode : Serge archive dans Stripe les prix et les
      produits de ce business. Plus personne ne pourra les payer ; les
      abonnements en cours ne sont pas résiliés.
    params:
      venture_id: {source: form, value: venture_id}
      service: {source: fixed, value: stripe_live}

  # Le lot 12. `only_if_rows` : le déclencheur ne part que si ces nombres
  # de lignes sont bons, comptés dans le couloir de la tâche à créer.
  - id: campagne_prete
    title: Une campagne est prête
    invocation: demarrer_campagne
    event: row_written
    table: campaigns
    filter_column: state
    filter_value: READY
    params:
      campaign_id: {source: row, value: id}
  - id: suivi_des_campagnes
    title: Suivre chaque campagne en cours
    invocation: suivre_campagne
    event: every
    every_minutes: 60
    table: campaigns
    filter_column: state
    filter_value: RUNNING
    params:
      campaign_id: {source: row, value: id}
  - id: premier_message_a_rediger
    title: Un premier message est à rédiger
    invocation: rediger_premier_message
    event: row_written
    table: touches
    filter_column: kind
    filter_value: first
    params:
      touch_id: {source: row, value: id}
      contact_id: {source: row, value: contact_id}
      venture_id: {source: row, value: venture_id}
      channel: {source: row, value: channel}
  - id: test_retenu
    title: Un test léger est retenu
    invocation: choisir_principal
    event: row_written
    table: ventures
    filter_column: lifecycle
    filter_value: SMOKE_DONE
    only_if_room_in: [place_lourde, propositions_de_principal]
    only_if_rows: &conditions_du_choix
      - {table: ventures, column: lifecycle, values: [POC_SELECTED, SMOKE_READY, SMOKE_RUNNING], at_most: 0, description: Tests légers encore en cours}
      - {table: ventures, column: lifecycle, values: [SMOKE_DONE, PARKED], at_least: 1, description: Tests retenus qui attendent}
  - id: business_arrete
    title: Un business est arrêté
    invocation: choisir_principal
    event: row_written
    table: ventures
    filter_column: lifecycle
    filter_value: KILLED
    only_if_room_in: [place_lourde, propositions_de_principal]
    only_if_rows: *conditions_du_choix
  - id: reponse_au_ticket_choix_principal
    title: Une réponse au ticket « Choix du principal »
    invocation: appliquer_choix_principal
    event: row_written
    table: ticket_answers
    filter_column: ticket_type
    filter_value: CHOIX_PRINCIPAL
    params:
      acte: {source: row, value: acte}
      texte: {source: row, value: text}
      choice_id: {source: row, value: ref_id}
  - id: lecon_d_un_business_arrete
    title: Un business arrêté donne une leçon
    invocation: tirer_lecon
    event: row_written
    table: ventures
    filter_column: lifecycle
    filter_value: KILLED
    lane: real
    params:
      venture_id: {source: row, value: id}
  - id: oubli_des_vieux_tests
    title: Oublier les vieux tests, chaque jour
    invocation: oublier_vieux_tests
    event: every
    every_minutes: 1440
  # L'étape 1 repart toute seule dès qu'une place de test se libère (Q92).
  - id: place_liberee_par_un_arret
    title: Une place de test se libère (un business est arrêté)
    invocation: ouvrir_cycle
    event: row_written
    table: ventures
    filter_column: lifecycle
    filter_value: KILLED
    lane: real
    only_if_room_in: [places_de_test, cycles_ouverts]
  - id: place_liberee_par_une_mise_de_cote
    title: Une place de test se libère (un business est mis de côté)
    invocation: ouvrir_cycle
    event: row_written
    table: ventures
    filter_column: lifecycle
    filter_value: PARKED
    lane: real
    only_if_room_in: [places_de_test, cycles_ouverts]
  - id: place_liberee_par_le_principal
    title: Une place de test se libère (le principal est choisi)
    invocation: ouvrir_cycle
    event: row_written
    table: ventures
    filter_column: lifecycle
    filter_value: PRODUCT_BUILDING
    lane: real
    only_if_room_in: [places_de_test, cycles_ouverts]
  - id: produit_en_vente
    title: Un produit fini est en vente
    invocation: preparer_prospection_lourde
    event: row_written
    table: ventures
    filter_column: lifecycle
    filter_value: PRODUCT_READY
    params:
      venture_id: {source: row, value: id}
  - id: vente_arrivee
    title: Un paiement est arrivé
    invocation: enregistrer_vente
    event: row_written
    table: transactions
    filter_column: status
    filter_value: paid
    params:
      transaction_id: {source: row, value: id}
  # L'essai total (Q99) : le seul bouton d'essai. `lane: trial` : il
  # démarre un essai, qui remplace le précédent.
  - id: bouton_essai_total
    title: Lancer l'essai total
    invocation: lancer_essai_total
    event: button
    lane: trial
    confirm: >-
      Serge arrête l'essai précédent, s'il y en a un, puis fait traverser
      tout le pipeline à un business d'essai « Calculatrice », à part de
      ce qui tourne : écoute du web (2 recherches), plan tout fait, POC,
      un e-mail et un appel à ces coordonnées (l'appel part à toute
      heure), mesure du test, choix du principal, produit fini, Stripe en
      vrai mode, paiement test de 1 € remboursé, captcha avec un humain,
      prospection lourde. Tu valides les tickets marqués « Essai » comme
      en vrai. Étape de départ : 1 (rien), 2, 3, 5 ou 6. Compter quelques
      euros de modèles.
    params:
      name: {source: form, value: nom}
      email: {source: form, value: e-mail}
      phone: {source: form, value: téléphone (+33…)}
      depart: {source: form, value: 'étape de départ (1, 2, 3, 5 ou 6)'}
      valider: {source: form_case, value: Valider chaque brouillon}

  # --- Les comptes web (lot 13, Q104) : deux boutons de la page Système ---
  - id: bouton_creer_compte_web
    title: Créer un compte web
    invocation: ouvrir_compte_web
    event: button
    confirm: >-
      Serge crée lui-même un compte sur ce site, dans le vrai Chrome, avec
      son identité et son adresse e-mail. Il choisit le mot de passe et le
      garde en base, chiffré, avec la session. Devant un captcha, un
      ticket t'appelle. À la fin, un ticket d'information dit comment ça
      s'est passé. Compter quelques dizaines de centimes de modèle.
    params:
      compte: {source: form, value: 'le site, en un mot : reddit, linkedin, instagram ou x (pas le pseudo)'}
      lien: {source: form, value: 'adresse du site (https://www.reddit.com)'}
      naissance: {source: form, value: 'date de naissance, si le site la demande (JJ/MM/AAAA)'}
      pseudo: {source: form, value: 'pseudo voulu sur ce site (vide : celui de la page Identité)'}
  - id: bouton_verifier_compte_web
    title: Vérifier un compte web
    invocation: verifier_compte_web
    event: button
    confirm: >-
      Serge ouvre le site de ce compte dans le vrai Chrome et vérifie qu'il
      y est connecté ; sinon il s'y connecte, et t'appelle devant un
      captcha. Le résultat est noté sur la fiche du compte.
    params:
      compte: {source: form, value: 'nom du compte (reddit, linkedin, x…)'}

  - id: bouton_fouiller_reseau
    title: Fouiller un réseau
    invocation: fouiller_reseau
    event: button
    confirm: >-
      Serge navigue sur ce réseau avec son compte, dans le vrai Chrome,
      cherche ce sujet et rend quelques discussions ; le résultat est sur
      la fiche de la tâche. Pour essayer un compte sur un sujet sans
      enjeu. Compter quelques dizaines de centimes de modèle.
    params:
      compte: {source: form, value: 'nom du compte (reddit, instagram, x…)'}
      mission: {source: form, value: 'ce que tu cherches (« ce que les gens disent des calculatrices en ligne »)'}

  - id: bouton_message_d_essai_reseau
    title: Envoyer un message d'essai sur un réseau
    invocation: envoyer_par_le_web
    event: button
    confirm: >-
      Serge envoie ce texte à ce profil, avec son compte, dans le vrai
      Chrome : par la même invocation que les vrais messages du canal,
      mais sans contact ni campagne. À faire vers un de tes comptes. Si le
      réseau demande d'abord un contact, Serge te suit ou te demande la
      connexion, puis retourne voir quelques fois (page Policy, « Comptes
      web ») : accepte, ou suis-le en retour, et le message part. Le
      résultat est sur la fiche de chaque tâche. Compter quelques dizaines
      de centimes de modèle par passage.
    params:
      compte: {source: form, value: 'nom du compte (linkedin, instagram, x…)'}
      adresse: {source: form, value: "à qui écrire : son pseudo sur ce réseau, ou l'adresse de son profil (LinkedIn : l'adresse)"}
      message: {source: form, value: 'texte du message (280 caractères au plus pour LinkedIn)'}
      sorte: {source: fixed, value: first}
  - id: bouton_lire_conversation_reseau
    title: Lire une conversation d'essai sur un réseau
    invocation: lire_messagerie
    event: button
    confirm: >-
      Serge ouvre la messagerie de ce compte, dans le vrai Chrome, et rend
      ce que ce profil a répondu : par la même invocation que la relève
      des vrais canaux. À faire après un message d'essai auquel tu as
      répondu. Le résultat est sur la fiche de la tâche.
    params:
      compte: {source: form, value: 'nom du compte (linkedin, instagram, x…)'}
      adresse: {source: form, value: "de qui lire la réponse : son pseudo sur ce réseau, ou l'adresse de son profil"}

# Les modifications d'objets déjà en base sur une instance existante (le
# fichier ne les écrase jamais) : chacune n'est appliquée qu'une fois, et
# seulement si la valeur en base est encore celle d'origine (`from`) ; une
# valeur changée dans Mission Control est gardée. Résultat : table
# pipeline_changes.

changes:
  - id: titre_qui_est_serge
    why: Les textes envoyés au modèle ont un titre et une aide (page Pipeline).
    table: serge_texts
    where: {id: presentation}
    set:
      title: {from: '', to: Qui est Serge}
      help:
        from: ''
        to: >-
          En tête du prompt des invocations qui le demandent, suivi de la
          chaîne des 8 étapes et de leur place, lues en base.
  - id: lot7_explorer_10_tours
    why: Moins de jetons renvoyés ; avec plusieurs outils par tour, 10 tours suffisent.
    table: invocations
    where: {id: explorer_web}
    set: {max_tool_turns: {from: 25, to: 10}}
  - id: lot7_formuler_a_5_tours
    why: Moins de jetons renvoyés ; les pages se lisent plusieurs à la fois.
    table: invocations
    where: {id: formuler_a}
    set: {max_tool_turns: {from: 10, to: 5}}
  - id: lot7_formuler_b_5_tours
    why: Moins de jetons renvoyés ; les pages se lisent plusieurs à la fois.
    table: invocations
    where: {id: formuler_b}
    set: {max_tool_turns: {from: 10, to: 5}}
  - id: lot7_formuler_a_pages_bornees
    why: Au plus 10 pages lues en entier par passage, même lues plusieurs à la fois.
    table: invocation_tools
    where: {invocation_id: formuler_a, tool_id: lire_page_entiere}
    set: {max_calls: {from: '', to: pages_entieres_max}}
  - id: lot7_formuler_b_pages_bornees
    why: Au plus 10 pages lues en entier par passage, même lues plusieurs à la fois.
    table: invocation_tools
    where: {invocation_id: formuler_b, tool_id: lire_page_entiere}
    set: {max_calls: {from: '', to: pages_entieres_max}}
  - id: lot7_formuler_a_150_lignes
    why: Moins de jetons renvoyés à chaque tour.
    table: invocation_settings
    where: {invocation_id: formuler_a, name: lignes_page_entiere}
    set: {value: {from: '300', to: '150'}}
  - id: lot7_formuler_b_150_lignes
    why: Moins de jetons renvoyés à chaque tour.
    table: invocation_settings
    where: {invocation_id: formuler_b, name: lignes_page_entiere}
    set: {value: {from: '300', to: '150'}}
  - id: lot7_explorer_plusieurs_recherches
    why: Plusieurs recherches d'un coup, pour moins d'allers-retours.
    table: invocations
    where: {id: explorer_web}
    set:
      prompt:
        from: &ancienne_consigne_explorer |
          Tu cherches sur le web des besoins réels, exprimés par de vraies
          personnes ou de vraies entreprises, qui pourraient donner des idées
          de business à Serge.

          Ton point de départ est le texte de guidage du cycle, s'il y en a
          un. Sans texte de guidage, cherche librement dans ces familles de
          business : produits numériques, petits logiciels en ligne, services
          faits par Serge, automatisation sur mesure, téléphone et SMS pour
          les autres, veille et rapports, médias et audience, mise en
          relation, formation, commerce sans stock, prospection pour les
          autres.

          Cherche d'abord en France : fais tes recherches en français. Une
          page en anglais est acceptée si elle montre un besoin utile.

          Méthode :
          - Fais au plus {recherches_max} recherches, sous des angles variés :
            plaintes, questions sur des forums, demandes d'aide, avis
            négatifs, offres d'emploi, appels d'offres.
          - Avant de retenir une page, lis son aperçu (ses {lignes_apercu}
            premières lignes) avec l'outil d'aperçu. Ne lis jamais une page
            en entier.
          - Ne retiens que les pages qui montrent un besoin concret :
            quelqu'un qui cherche une solution, se plaint d'un problème, ou
            paie déjà pour quelque chose. Écarte les publicités, les pages
            vides et les pages que Serge a déjà gardées (tu en vois la
            liste).
          - Tu vois les business que Serge connaît déjà : cherche d'autres
            besoins.
          - Retiens au plus {pages_max} pages. Pour chacune, recopie son
            adresse, son titre et un aperçu de quelques lignes.
          - Si tu trouves un flux RSS qui publie régulièrement ce genre de
            besoins (un forum, une rubrique, un site d'annonces), ajoute-le :
            au plus {flux_max} nouveaux flux, jamais un flux que Serge suit
            déjà.
        to: *consigne_explorer
  - id: lot7_formuler_a_plusieurs_pages
    why: Plusieurs pages lues d'un coup, au plus 10 par passage.
    table: invocations
    where: {id: formuler_a}
    set:
      prompt:
        from: &ancienne_consigne_formuler |
          Tu formules des idées de business pour Serge, à partir de pages web
          qui montrent des besoins nouveaux.

          Tu reçois l'aperçu des pages « besoin nouveau » pas encore
          utilisées. Lis en entier celles qui te semblent les plus
          prometteuses, avec l'outil de lecture (au plus
          {lignes_page_entiere} lignes par page).

          Propose au plus {nombre_idees} idées de business. Pour chacune :
          - un nom court ;
          - ce qu'il vend et à qui ;
          - ce que tu as observé dans les pages : le besoin, qui l'exprime, ce
            qu'on paie déjà ;
          - l'offre qu'on pourrait vendre tout de suite, si tu la vois ;
          - sa famille de business ;
          - les numéros des pages qui prouvent le besoin : au moins une.

          Règles :
          - Ne propose jamais un business qui ressemble à un business que
            Serge connaît déjà : tu vois leur liste, y compris ceux qu'une
            autre invocation vient d'écrire. Serge ne fait jamais deux fois la
            même chose.
          - Chaque idée repose sur les pages citées, pas sur ton imagination.
          - Le business doit être légal. En dehors de la loi, ne t'arrête pas
            sur des scrupules moraux : un business légal qui dérange est
            acceptable. Serge assume d'être un agent IA et ne trompe personne.
          - Si les pages ne montrent aucun besoin assez solide, propose moins
            d'idées, ou aucune.
        to: *consigne_formuler
  - id: lot7_formuler_b_plusieurs_pages
    why: Plusieurs pages lues d'un coup, au plus 10 par passage.
    table: invocations
    where: {id: formuler_b}
    set:
      prompt: {from: *ancienne_consigne_formuler, to: *consigne_formuler}
  - id: lot7_abandon_annule_les_taches_question
    why: Abandonner un cycle annule maintenant ses tâches en attente (Q67).
    table: triggers
    where: {id: bouton_abandonner_cycle}
    set:
      confirm_text:
        from: Le cycle ouvert est fermé, pour pouvoir en lancer un autre. Ses tâches déjà en file continuent, mais ne peuvent plus le fermer.
        to: Le cycle ouvert est fermé et ses tâches en attente sont annulées ; sa chaîne s'arrête après la tâche en cours. On peut alors en lancer un autre.
  - id: lot7_abandon_annule_les_taches_role
    why: Abandonner un cycle annule maintenant ses tâches en attente (Q67).
    table: invocations
    where: {id: abandonner_cycle}
    set:
      role:
        from: Ferme le cycle resté ouvert (une invocation qui a échoué, par exemple), pour pouvoir en lancer un autre. Sans LLM.
        to: Ferme le cycle resté ouvert (une invocation qui a échoué, par exemple), et annule ses tâches en attente, pour pouvoir en lancer un autre. Sans LLM.
  - id: modele_fast_prix_max
    why: Les niveaux de modèle reçoivent un prix maximum pour la recommandation.
    table: llm_models
    where: {tier: fast}
    set: {max_price_usd: {from: 0.0, to: 0.3}, tolerance_pct: {from: 95, to: 85}}
  - id: modele_mid_prix_max
    why: Les niveaux de modèle reçoivent un prix maximum pour la recommandation.
    table: llm_models
    where: {tier: mid}
    set: {max_price_usd: {from: 0.0, to: 1.5}}
  - id: modele_smart_prix_max
    why: Les niveaux de modèle reçoivent un prix maximum pour la recommandation.
    table: llm_models
    where: {tier: smart}
    set: {max_price_usd: {from: 0.0, to: 8.0}}
  - id: lot8_traiter_un_appel
    why: La suite d'un appel part par e-mail si Serge a l'adresse, sinon par un rappel (Q83).
    table: invocations
    where: {id: traiter_reponse}
    set:
      prompt:
        from: |
          Tu réponds, au nom de Serge, à un contact qui vient d'écrire à propos
          d'un business que Serge teste.

          Tu reçois le fil du contact (tout ce qui s'est dit, tous canaux
          confondus, du plus ancien au plus récent), sa fiche, la fiche du
          business, la fiche produit et ses questions fréquentes. Tu réponds au
          dernier message du fil ; si le contact a écrit plusieurs fois depuis
          la dernière réponse de Serge, réponds à tout d'un coup.

          Rends :
          - reaction : ce que fait le message, l'une de : intéressé, question,
            objection, rendez-vous, refus, désinscription, absence, hors sujet.
            « désinscription » : la personne demande à ne plus être contactée
            (« STOP », « ne m'écrivez plus »). « absence » : une réponse
            automatique (congés, absence).
          - reply : le texte de ta réponse, prêt à partir, sans objet ni
            signature d'humain. Laisse-le vide pour une désinscription, une
            absence ou un message hors sujet : Serge ne répond rien.
          - requests : les demandes sur le produit que contient le message, s'il
            y en a : un bug, une insatisfaction, une idée (une fonctionnalité
            qui manque).

          Règles :
          - Un refus : remercie poliment, sans insister.
          - Un rendez-vous : confirme-le.
          - Ne promets jamais une date, un prix ou une fonctionnalité absents de
            la fiche produit. Une fonctionnalité qui manque devient une demande
            « idée ». En cas de doute, réponds sans t'engager.
          - Écris dans la langue du contact, simplement et brièvement.
          - Serge assume d'être un agent IA : ne prétends jamais être un humain.
        to: *consigne_traiter_reponse
  - id: voix_adresse_confirmee
    why: >-
      Au premier essai réel, l'agent vocal notait une adresse avant que la
      personne la confirme, et faisait épeler un e-mail que Serge avait
      déjà. Il propose désormais l'e-mail qu'il a et ne note une adresse
      qu'une fois confirmée.
    table: invocations
    where: {id: parler_au_telephone}
    set:
      prompt:
        from: |
          Tu es Serge, au téléphone. Tu parles français, simplement, une ou
          deux phrases courtes à la fois, sans liste ni formule écrite.

          Tu reçois peut-être la fiche de ton interlocuteur, son fil (ce qui
          s'est déjà dit, tous canaux confondus), la fiche du business et la
          fiche produit, et, pour un appel que tu passes, son but.

          - Un appel que tu passes : présente-toi, dis pourquoi tu appelles
            (son but), demande si c'est le bon moment.
          - Un appel que tu reçois d'un numéro inconnu : « Bonjour, je suis
            Serge, en quoi puis-je vous aider ? ». Demande à qui tu parles,
            puis cherche sa fiche avec l'outil « Chercher un contact » (son
            nom, son entreprise, son e-mail ou son numéro).
          - Une personne reconnue seulement par son nom : ne lui répète
            aucune information sensible (montants, adresses, propos d'un
            collègue).
          - Une proposition faite à Serge (un partenariat, une offre) :
            réponds poliment que tu ne peux pas traiter ce genre de demande
            pour l'instant.
          - Un document à envoyer (une documentation, un devis) : demande son
            adresse e-mail, fais-la épeler, relis-la, puis note-la avec
            l'outil « Noter une adresse ». Dis que le document arrive par
            e-mail.
          - Ne promets jamais une date, un prix ou une fonctionnalité absents
            de la fiche produit. En cas de doute, dis que tu vérifies et que
            tu reviens vers la personne.
          - Une personne qui ne veut plus être contactée : dis que c'est noté,
            puis au revoir.
          - Tu es un agent IA : dis-le si on te le demande, ne prétends
            jamais être un humain.
          - Pour finir, dis au revoir.
        to: *consigne_parler_au_telephone
  - id: reponse_besoin_de_julien
    why: >-
      « Traiter une réponse » dit quand un humain doit voir sa réponse avant
      qu'elle parte, et quelle question sur le produit reste sans réponse
      (lot 8 bis, Q85).
    table: invocations
    where: {id: traiter_reponse}
    set:
      prompt:
        from: |
          Tu réponds, au nom de Serge, à un contact qui vient d'écrire à propos
          d'un business que Serge teste.

          Tu reçois le fil du contact (tout ce qui s'est dit, tous canaux
          confondus, du plus ancien au plus récent), sa fiche, la fiche du
          business, la fiche produit et ses questions fréquentes. Tu réponds au
          dernier message du fil ; si le contact a écrit plusieurs fois depuis
          la dernière réponse de Serge, réponds à tout d'un coup.

          Le dernier message peut être la transcription d'un appel (canal
          voice). La suite part alors par e-mail si Serge a son adresse, sinon
          Serge rappelle : écris-la comme un e-mail court qui reprend ce qui a
          été promis (un document, un devis), ou laisse-la vide s'il n'y a
          rien à ajouter après l'appel.

          Rends :
          - reaction : ce que fait le message, l'une de : intéressé, question,
            objection, rendez-vous, refus, désinscription, absence, hors sujet.
            « désinscription » : la personne demande à ne plus être contactée
            (« STOP », « ne m'écrivez plus »). « absence » : une réponse
            automatique (congés, absence).
          - reply : le texte de ta réponse, prêt à partir, sans objet ni
            signature d'humain. Laisse-le vide pour une désinscription, une
            absence ou un message hors sujet : Serge ne répond rien.
          - requests : les demandes sur le produit que contient le message, s'il
            y en a : un bug, une insatisfaction, une idée (une fonctionnalité
            qui manque).

          Règles :
          - Un refus : remercie poliment, sans insister.
          - Un rendez-vous : confirme-le.
          - Ne promets jamais une date, un prix ou une fonctionnalité absents de
            la fiche produit. Une fonctionnalité qui manque devient une demande
            « idée ». En cas de doute, réponds sans t'engager.
          - Écris dans la langue du contact, simplement et brièvement.
          - Serge assume d'être un agent IA : ne prétends jamais être un humain.
        to: *consigne_traiter_reponse
  - id: reponse_sorties_besoin_de_julien
    why: Les deux champs nouveaux de la réponse de « Traiter une réponse ».
    invocation: traiter_reponse
    add_outputs: [*sortie_besoin_julien, *sortie_question_produit]
  - id: reponse_envoi_besoin_de_julien
    why: L'envoi écrit garde pourquoi il attend un humain, et la question.
    invocation: traiter_reponse
    write: 2
    add_write_values:
      needs_owner: *valeur_besoin_julien
      owner_question: *valeur_question_produit
  - id: ma_reponse_objet_parametre
    why: >-
      « Ma réponse » change aussi l'objet de l'e-mail : la réponse en porte
      un, et le déclencheur le transmet.
    trigger: julien_donne_sa_reponse
    add_trigger_params:
      objet: *param_objet_de_julien
  - id: ma_reponse_objet_role
    why: Le rôle dit que l'objet est repris aussi.
    table: invocations
    where: {id: envoyer_reponse_de_julien}
    set:
      role:
        from: '« Ma réponse » : le texte de Julien remplace le brouillon, et part tel quel. Sans LLM.'
        to: *role_ma_reponse
  - id: ma_reponse_objet_ecrit
    why: L'objet saisi avec « Ma réponse » remplace celui du brouillon.
    invocation: envoyer_reponse_de_julien
    write: 0
    add_write_values:
      subject: *objet_de_julien
  - id: reponse_decision_arreter
    why: >-
      « Traiter une réponse » peut décider d'arrêter avec un contact quand
      la conversation ne mène nulle part (lot 10 bis, Q93).
    invocation: traiter_reponse
    add_outputs:
      - *sortie_arreter
  - id: reponse_consigne_arreter
    why: La consigne de « Traiter une réponse » dit quand arrêter (lot 10 bis, Q93).
    table: invocations
    where: {id: traiter_reponse}
    set:
      prompt:
        from: |
          Tu réponds, au nom de Serge, à un contact qui vient d'écrire à propos
          d'un business que Serge teste.

          Tu reçois le fil du contact (tout ce qui s'est dit, tous canaux
          confondus, du plus ancien au plus récent), sa fiche, la fiche du
          business, la fiche produit et ses questions fréquentes. Tu réponds au
          dernier message du fil ; si le contact a écrit plusieurs fois depuis
          la dernière réponse de Serge, réponds à tout d'un coup.

          Le dernier message peut être la transcription d'un appel (canal
          voice). La suite part alors par e-mail si Serge a son adresse, sinon
          Serge rappelle : écris-la comme un e-mail court qui reprend ce qui a
          été promis (un document, un devis), ou laisse-la vide s'il n'y a
          rien à ajouter après l'appel.

          Rends :
          - reaction : ce que fait le message, l'une de : intéressé, question,
            objection, rendez-vous, refus, désinscription, absence, hors sujet.
            « désinscription » : la personne demande à ne plus être contactée
            (« STOP », « ne m'écrivez plus »). « absence » : une réponse
            automatique (congés, absence).
          - reply : le texte de ta réponse, prêt à partir, sans objet ni
            signature d'humain. Laisse-le vide pour une désinscription, une
            absence ou un message hors sujet : Serge ne répond rien.
          - requests : les demandes sur le produit que contient le message, s'il
            y en a : un bug, une insatisfaction, une idée (une fonctionnalité
            qui manque).
          - besoin_julien : vide si tu peux répondre seul. Sinon, en une phrase,
            pourquoi un humain doit voir ta réponse avant qu'elle parte : une
            question sur le produit à laquelle la fiche produit et les
            questions fréquentes ne répondent pas, un prix, une date ou un
            engagement que tu ne peux pas prendre, une proposition faite à
            Serge (un partenariat, une offre), un échange tendu, ou un doute
            réel. Écris quand même ton meilleur brouillon dans reply : Julien
            l'enverra, le remplacera par sa réponse, ou te demandera de le
            réécrire.
          - question_produit : si le message pose une question sur le produit
            à laquelle la fiche produit ne répond pas, cette question en une
            phrase ; sinon vide. La réponse de Julien rejoindra les questions
            fréquentes, et la fois suivante tu répondras seul.

          Règles :
          - Un refus : remercie poliment, sans insister.
          - Un rendez-vous : confirme-le.
          - Ne promets jamais une date, un prix ou une fonctionnalité absents de
            la fiche produit. Une fonctionnalité qui manque devient une demande
            « idée ». En cas de doute, réponds sans t'engager et remplis
            besoin_julien.
          - Écris dans la langue du contact, simplement et brièvement.
          - Serge assume d'être un agent IA : ne prétends jamais être un humain.
        to: *consigne_traiter_reponse
  - id: essais_a_part_places
    why: >-
      Un business d'essai ne prend pas de place de test : lancer la
      calculatrice d'un essai ne bloque plus l'étape 1 (lot 12, Q98).
    table: table_quotas
    where: {id: places_de_test}
    set:
      where_column: {from: '', to: trial}
      where_value: {from: '', to: '0'}
  - id: voix_email_du_contact
    why: >-
      L'agent vocal reçoit au décrochage l'e-mail que Serge a pour la
      personne (reconnue par son numéro), pour le proposer au lieu de le
      faire épeler.
    invocation: parler_au_telephone
    add_tools: [*outil_email_du_contact]

# Ce qui a été retiré du pipeline de départ : marqué supprimé sur une
# instance existante (retirer une ligne du fichier ne l'efface jamais).
# Le demi-cycle de démonstration du lot 6 est remplacé par l'étape 1.
  # Les relances suivent un rythme commun à tous les business (Q37,
  # corrigée par Q92) : le plan d'un POC ne l'écrit plus (lot 10).
  - id: lot10_plan_poc_sans_relances_prompt
    why: Les relances suivent un rythme commun à tous les business (Q37, corrigée par Q92).
    table: invocations
    where: {id: concevoir_poc}
    set:
      prompt:
        from: |
          Tu conçois le POC d'un business que Serge va tester auprès de vrais
          prospects. Un POC est un petit produit web qu'on peut vraiment
          essayer, pas une promesse. Exemple : « un générateur de devis en
          ligne : on crée un compte et on fait trois devis gratuits ». Il est
          gratuit pour les prospects : il mesure leur intérêt. Le vrai produit,
          payant, viendra plus tard, pour le business retenu.

          Tu reçois la fiche du business, les pages qui prouvent le besoin, et
          ce que Serge sait faire. À partir du deuxième tour, tu reçois aussi ton
          plan précédent et les remarques du critique ; les paramètres de la
          tâche peuvent contenir les consignes d'un humain (« consignes ») :
          corrige d'abord ce qu'ils demandent.

          Pour construire, Serge a un chantier (un conteneur Linux avec Node,
          Python et git, où un modèle code et lance le produit), un navigateur
          pour l'essayer, et la mise en ligne d'un site web sur un sous-domaine
          de Serge ; le produit garde ses données dans un dossier à lui. Il n'y
          a pas d'humain pour faire le travail, pas de compte à créer sur
          d'autres sites, pas d'API payante, pas de connexion au logiciel des
          prospects : un plan qui en a besoin est irréaliste, trouve autre
          chose.

          Écris un plan de A à Z, réalisable avec ça :
          - hypothese : ce qu'on veut vérifier, en une phrase ;
          - cible : les prospects, des professionnels (métier, taille, lieu) ;
          - canal : email ou voice (le téléphone) ;
          - prospects : combien, entre {prospects_min} et {prospects_max} ;
          - duree_jours : la durée du test, {duree_max_jours} jours au plus ;
          - prix : le prix indicatif du futur produit payant ;
          - relances : leur rythme (exemple : « une relance 3 jours après le
            premier message, une autre 7 jours après ») ;
          - livrable : ce que le prospect peut essayer, en deux phrases ;
          - plan : ce que le constructeur doit faire, page par page et fonction
            par fonction, pourquoi, et comment le prospect s'en sert ;
          - scenarios : 3 à 6 scénarios de test ; chacun dit ce que fait un
            prospect ordinaire, pas à pas, du début à la fin, et ce qu'il doit
            voir. Le relecteur et l'humain qui essaie le POC les suivent tels
            quels ;
          - la fiche produit : fiche_resume (ce que fait le produit et pour
            qui), fiche_limites (ce qu'il ne fait pas), fiche_prix,
            fiche_delais, fiche_usage (comment on s'en sert) ;
          - faq : 3 à 6 questions qu'un prospect posera, avec leur réponse.

          Le business doit être légal. Ne t'arrête pas sur des considérations
          morales qui ne sont pas contraires à la loi.
        to: |

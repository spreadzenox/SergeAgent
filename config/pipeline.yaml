  - id: reponse_consigne_arreter
    why: La consigne de « Traiter une réponse » dit quand arrêter (lot 10 bis, Q93).
    table: invocations
    where: {id: traiter_reponse}
    set:
      prompt:
        from: |
          Tu réponds, au nom de Serge, à un contact qui vient d'écrire à propos

      - {name: id, short: true, description: Le numéro de la page.}
      - {name: title, short: true, description: Son titre.}
      - {name: url, description: Son adresse.}
      - {name: excerpt, description: Son aperçu.}
      - {name: source, description: D'où elle vient (web ou rss).}
      - {name: label, description: Son étiquette de tri.}
      - {name: published, description: Sa date de publication.}
      - {name: fetched_at, description: Quand elle a été gardée.}
      - {name: cycle_id, description: Le cycle où elle a été triée.}
  - table: listen_feeds
    title: Les flux RSS suivis
    description: Les flux RSS que Serge a choisis de suivre.
    order: created_at
    columns:
      - {name: id, short: true, description: Le numéro du flux.}
      - {name: url, short: true, description: Son adresse.}
      - {name: title, description: Son titre.}
      - {name: active, description: Suivi (1) ou coupé (0).}

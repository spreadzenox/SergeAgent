          lifecycle: {source: fixed, value: PRODUCT_READY}

  - id: prevenir_produit
    title: Prévenir d'une étape du produit
    role: >-
      Un ticket d'information à Julien et Clem pendant l'étape 5 : le
      produit est en vente, ou une étape a raté (Stripe, la prod, le
      paiement test), avec la raison. Sans LLM.
    step: build_venture
    type: capability
    capability: inform_owners
    queue: conversations
    priority: 80
    params:
      title: {source: task, value: titre}
      text: {source: task, value: raison}

  # L'étape 3 (lot 12) : le test léger. Les mêmes invocations servent à la
  # prospection lourde (étape 6) : elles lisent la phase et le canal dans
  # la campagne qu'elles traitent.
  - id: demarrer_campagne
    title: Démarrer une campagne
    role: >-
      Démarre une campagne prête : vérifie que son canal est branché, fixe
      son volume (les réglages du canal), note son début et, pour un test,
      sa fin prévue, et passe le business à « test en cours » ou « vente en
      cours ». Une campagne sur un canal qui n'est pas branché est annulée.
      Sans LLM.
    step: prospection_light
    type: capability
    capability: start_campaign
    queue: works
    priority: 30
    settings:
      email_test: {value: 40, min: 1, max: 500, policy: true, trial: 1, description: "E-mail : les prospects d'un test léger."}
      voice_test: {value: 20, min: 1, max: 500, policy: true, trial: 1, description: "Appel : les prospects d'un test léger."}
      email_semaine: {value: 200, min: 1, max: 5000, policy: true, description: 'E-mail : les prospects par semaine, en prospection lourde.'}
      voice_semaine: {value: 50, min: 1, max: 5000, policy: true, description: 'Appel : les prospects par semaine, en prospection lourde.'}
      email_total: {value: 1000, min: 1, max: 50000, policy: true, trial: 1, description: 'E-mail : les prospects au total, en prospection lourde.'}
      voice_total: {value: 250, min: 1, max: 50000, policy: true, trial: 1, description: 'Appel : les prospects au total, en prospection lourde.'}
      linkedin_test: {value: 10, min: 1, max: 500, policy: true, trial: 1, description: "LinkedIn : les prospects d'un test léger."}
      linkedin_semaine: {value: 30, min: 1, max: 5000, policy: true, description: 'LinkedIn : les prospects par semaine, en prospection lourde.'}
      linkedin_total: {value: 100, min: 1, max: 50000, policy: true, trial: 1, description: 'LinkedIn : les prospects au total, en prospection lourde.'}
      instagram_test: {value: 10, min: 1, max: 500, policy: true, trial: 1, description: "Instagram : les prospects d'un test léger."}
      instagram_semaine: {value: 30, min: 1, max: 5000, policy: true, description: 'Instagram : les prospects par semaine, en prospection lourde.'}
      instagram_total: {value: 100, min: 1, max: 50000, policy: true, trial: 1, description: 'Instagram : les prospects au total, en prospection lourde.'}
      duree_max_jours: {value: 30, min: 1, max: 90, policy: true, description: "La durée d'un test léger, en jours, au plus."}
    params:

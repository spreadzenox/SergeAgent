# --- Étape 1 : la pré-prospection (lot 7, décision Q65) -------------------
# La veille lit les flux toutes les 6 heures. Le cycle se lance à la main
# depuis la page Écoute : ouvrir → explorer → rattacher → trier → formuler
# A → formuler B → choisir. Détail : docs/etapes/1-pre-prospection.md.
invocations:
  - id: ouvrir_cycle
    title: Ouvrir un cycle d'écoute
    role: >-
      Enregistre un cycle d'écoute avec le texte de guidage écrit dans
      Mission Control. Sans LLM : elle rend ses paramètres, et sa règle
      d'écriture les range dans la table des cycles. Un seul cycle est
      ouvert à la fois (quota).
    step: pre_prospection
    type: capability
    capability: echo
    queue: works
    priority: 10
    params:
      guide: {source: task, value: guide}
    output:
      - {path: guide, type: text, required: false, description: Le texte de guidage.}
    writes:
      - table: listen_cycles
        operation: insert
        values:
          guide: {source: field, value: guide}
          status: {source: fixed, value: OPEN}
          started_at: {source: now}

  - id: explorer_web
    title: Explorer le web
    role: >-
      Cherche sur le web des pages qui montrent des besoins réels, à partir
      du texte de guidage (sinon dans les 11 familles de business) et des
      business déjà connus. Ne lit qu'un aperçu des pages, garde celles
      qu'elle retient, et ajoute les flux RSS utiles.
    step: pre_prospection
    type: llm
    model_tier: mid
    queue: works
    priority: 10
    gets_serge_intro: true
    default_max_rows: 50
    max_tool_turns: 10
    settings:
      recherches_max: {value: 10, min: 1, max: 30, policy: true, description: Le nombre maximum de recherches par cycle.}
      lignes_apercu: {value: 5, min: 1, max: 30, policy: true, description: Les lignes lues dans l'aperçu d'une page.}
      pages_max: {value: 30, min: 1, max: 100, policy: true, description: Le nombre maximum de pages retenues par cycle.}
      flux_max: {value: 2, min: 0, max: 10, policy: true, description: Le nombre maximum de nouveaux flux RSS par cycle.}
    compare:
      ventures: true
    prompt: &consigne_explorer |
      Tu cherches sur le web des besoins réels, exprimés par de vraies
      personnes ou de vraies entreprises, qui pourraient donner des idées
      de business à Serge.

      Ton point de départ est le texte de guidage du cycle, s'il y en a
      un. Sans texte de guidage, cherche librement dans ces familles de
      business : produits numériques, petits logiciels en ligne, services
      faits par Serge, automatisation sur mesure, téléphone et SMS pour
      les autres, veille et rapports, médias et audience, mise en
      relation, formation, commerce sans stock, prospection pour les
      autres.

      Cherche d'abord en France : fais tes recherches en français. Une
      page en anglais est acceptée si elle montre un besoin utile.

      Méthode :
      - Fais au plus {recherches_max} recherches, sous des angles variés,
        plusieurs d'un coup plutôt qu'une à la fois :
        plaintes, questions sur des forums, demandes d'aide, avis
        négatifs, offres d'emploi, appels d'offres.
      - Avant de retenir une page, lis son aperçu (ses {lignes_apercu}
        premières lignes) avec l'outil d'aperçu. Ne lis jamais une page
        en entier.
      - Ne retiens que les pages qui montrent un besoin concret :
        quelqu'un qui cherche une solution, se plaint d'un problème, ou
        paie déjà pour quelque chose. Écarte les publicités, les pages
        vides et les pages que Serge a déjà gardées (tu en vois la
        liste).
      - Tu vois les business que Serge connaît déjà : cherche d'autres
        besoins.
      - Retiens au plus {pages_max} pages. Pour chacune, recopie son
        adresse, son titre et un aperçu de quelques lignes.
      - Si tu trouves un flux RSS qui publie régulièrement ce genre de
        besoins (un forum, une rubrique, un site d'annonces), ajoute-le :
        au plus {flux_max} nouveaux flux, jamais un flux que Serge suit
        déjà.
    tools:
      - tool: current_listen_cycle
        mode: given
        label: Le cycle en cours
        params:
          cycle_id: {source: task, value: cycle_id}
      - tool: web_search
        mode: callable
        max_calls: recherches_max
      - tool: apercu_page
        mode: callable
        params:
          max_lines: {source: setting, value: lignes_apercu}
          table: {source: fixed, value: ''}
          id: {source: fixed, value: ''}
    output:
      - {path: pages, type: list, max_items: pages_max, description: Les pages retenues.}
      - {path: pages.url, type: text, description: L'adresse de la page.}
      - {path: pages.titre, type: text, description: Son titre.}
      - {path: pages.apercu, type: text, description: Un aperçu de quelques lignes.}
      - {path: flux, type: list, required: false, max_items: flux_max, description: Les nouveaux flux RSS à suivre.}
      - {path: flux.url, type: text, description: L'adresse du flux.}
      - {path: flux.titre, type: text, description: Son titre.}
    writes:
      - table: listen_docs
        operation: insert
        for_each: pages
        max_rows: pages_max
        values:
          url: {source: field, value: pages.url}
          title: {source: field, value: pages.titre}
          excerpt: {source: field, value: pages.apercu}
          source: {source: fixed, value: web}
          fetched_at: {source: now}
      - table: listen_feeds
        operation: insert
        for_each: flux
        max_rows: flux_max
        values:
          url: {source: field, value: flux.url}
          title: {source: field, value: flux.titre}
          added_by: {source: fixed, value: explorer_web}
          active: {source: fixed, value: '1'}

  - id: rattacher_pages
    title: Rattacher les pages au cycle
    role: >-
      Rattache au cycle les pages gardées qui n'ont pas encore été triées
      (celles des flux et du web), les plus récentes d'abord. Sans LLM.
    step: pre_prospection
    type: capability
    capability: db_read
    queue: works
    priority: 10
    settings:
      pages_par_cycle: {value: 60, min: 1, max: 300, policy: true, description: Le nombre maximum de pages triées par cycle.}
    params:
      tool_id: {source: fixed, value: pages_a_rattacher}
      limit: {source: setting, value: pages_par_cycle}
    writes:
      - table: listen_docs
        operation: update
        for_each: rows
        key: {column: id, source: field, value: rows.id}
        values:
          cycle_id: {source: task, value: cycle_id}

  - id: trier_pages
    title: Trier les pages
    role: >-
      Range chaque page du cycle d'après son aperçu : elle enrichit un
      business existant (elle lui est rattachée comme preuve), elle montre
      un besoin nouveau, ou c'est du bruit. Par paquets de pages.
    step: pre_prospection
    type: llm
    model_tier: fast
    queue: works
    priority: 10
    default_max_rows: 100
    max_tool_turns: 2
    settings:
      taille_paquet: {value: 20, min: 1, max: 100, policy: true, description: Le nombre de pages triées par appel au modèle.}
    compare:
      ventures: true
      listen_docs: false
    prompt: |
      Tu tries des pages web gardées par Serge. Pour chaque page du
      paquet, lis son titre et son aperçu, puis range-la dans une seule
      catégorie :
      - « enrichit » : la page parle d'un besoin déjà couvert par un
        business que Serge connaît (tu en vois la liste). Donne alors le
        numéro de ce business.
      - « besoin_nouveau » : la page montre un besoin concret que ne
        couvre aucun business connu.
      - « bruit » : la page ne montre aucun besoin utile (publicité,
        actualité sans besoin, page vide, hors sujet).
      Range chaque page du paquet une seule fois. N'invente jamais un
      numéro de page ou de business.
    tools:
      - tool: pages_a_trier
        mode: given
        label: Les pages à trier
        batch_size: taille_paquet
        params:
          cycle_id: {source: task, value: cycle_id}
    output:
      - {path: enrichit, type: list, required: false, description: Les pages qui enrichissent un business connu.}
      - {path: enrichit.page, type: text, description: Le numéro de la page.}
      - {path: enrichit.business, type: text, description: Le numéro du business qu'elle enrichit.}
      - {path: besoin_nouveau, type: list, required: false, description: Les numéros des pages qui montrent un besoin nouveau.}
      - {path: bruit, type: list, required: false, description: Les numéros des pages sans besoin utile.}
    writes:
      - table: listen_docs
        operation: update
        for_each: besoin_nouveau
        key: {column: id, source: field, value: besoin_nouveau}
        values:
          label: {source: fixed, value: besoin_nouveau}
          labelled_at: {source: now}
      - table: listen_docs
        operation: update
        for_each: bruit
        key: {column: id, source: field, value: bruit}
        values:
          label: {source: fixed, value: bruit}
          labelled_at: {source: now}
      - table: listen_docs
        operation: update
        for_each: enrichit
        key: {column: id, source: field, value: enrichit.page}
        values:
          label: {source: fixed, value: enrichit}
          labelled_at: {source: now}
      - table: venture_sources
        operation: insert
        for_each: enrichit
        parent: 2
        values:
          venture_id: {source: field, value: enrichit.business}
          doc_id: {source: parent_row, value: id}
          cycle_id: {source: task, value: cycle_id}

  - id: formuler_a
    title: Formuler des business A
    role: >-
      Lit les pages « besoin nouveau » pas encore utilisées, en entier
      quand il le faut, et écrit des idées de business avec leurs preuves.
      Tourne juste avant B.
    step: pre_prospection
    type: llm
    model_tier: smart
    queue: works
    priority: 10
    gets_serge_intro: true
    default_max_rows: 100
    max_tool_turns: 5
    settings:
      nombre_idees: {value: 3, min: 0, max: 10, policy: true, description: Le nombre maximum d'idées par passage.}
      lignes_page_entiere: {value: 150, min: 10, max: 2000, policy: true, description: Les lignes lues au plus dans une page lue en entier.}
      pages_entieres_max: {value: 10, min: 1, max: 30, policy: true, description: Le nombre maximum de pages lues en entier par passage.}
    compare:
      listen_docs: false
    prompt: &consigne_formuler |
      Tu formules des idées de business pour Serge, à partir de pages web
      qui montrent des besoins nouveaux.

      Tu reçois l'aperçu des pages « besoin nouveau » pas encore
      utilisées. Lis en entier celles qui te semblent les plus
      prometteuses, avec l'outil de lecture : au plus
      {pages_entieres_max} pages, {lignes_page_entiere} lignes par page.
      Demande plusieurs pages d'un coup plutôt qu'une à la fois.

      Propose au plus {nombre_idees} idées de business. Pour chacune :
      - un nom court ;
      - ce qu'il vend et à qui ;
      - ce que tu as observé dans les pages : le besoin, qui l'exprime, ce
        qu'on paie déjà ;
      - l'offre qu'on pourrait vendre tout de suite, si tu la vois ;
      - sa famille de business ;
      - les numéros des pages qui prouvent le besoin : au moins une.

      Règles :
      - Ne propose jamais un business qui ressemble à un business que
        Serge connaît déjà : tu vois leur liste, y compris ceux qu'une
        autre invocation vient d'écrire. Serge ne fait jamais deux fois la
        même chose.
      - Chaque idée repose sur les pages citées, pas sur ton imagination.
      - Le business doit être légal. En dehors de la loi, ne t'arrête pas
        sur des scrupules moraux : un business légal qui dérange est
        acceptable. Serge assume d'être un agent IA et ne trompe personne.
      - Si les pages ne montrent aucun besoin assez solide, propose moins
        d'idées, ou aucune.
    tools:
      - tool: pages_besoin_nouveau
        mode: given
        label: Les pages « besoin nouveau »
        max_rows: 60
      - tool: lire_page_entiere
        mode: callable
        max_calls: pages_entieres_max
        params:
          table: {source: fixed, value: listen_docs}
          url: {source: fixed, value: ''}
          max_lines: {source: setting, value: lignes_page_entiere}
    output:
      - {path: fiches, type: list, max_items: nombre_idees, description: Les idées de business.}
      - {path: fiches.titre, type: text, description: Le nom court du business.}
      - {path: fiches.description, type: text, description: Ce qu'il vend et à qui.}
      - {path: fiches.observations, type: text, required: false, description: Ce qu'on a observé dans les pages.}
      - {path: fiches.offre, type: text, required: false, description: L'offre qu'on pourrait vendre tout de suite.}
      - path: fiches.famille
        type: choice
        choices: [produits_numeriques, petits_logiciels, services_faits_par_serge, automatisation_sur_mesure, telephone_sms, veille_rapports, medias_audience, mise_en_relation, formation, commerce_sans_stock, prospection_pour_autres, autre]
        description: La famille de business (autre si aucune ne convient).
      - {path: fiches.pages, type: list, min_items: 1, description: Les numéros des pages qui prouvent le besoin.}
    writes:
      - table: ventures
        operation: insert
        for_each: fiches
        values:
          name: {source: field, value: fiches.titre}
          description: {source: field, value: fiches.description}
          observations: {source: field, value: fiches.observations}
          sellable_offer: {source: field, value: fiches.offre}
          family: {source: field, value: fiches.famille}
          lifecycle: {source: fixed, value: CANDIDATE}
      - table: venture_sources
        operation: insert
        for_each: fiches.pages
        parent: 0
        values:
          venture_id: {source: parent_row, value: id}
          doc_id: {source: field, value: fiches.pages}
          cycle_id: {source: task, value: cycle_id}
      - table: listen_docs
        operation: update
        for_each: fiches.pages
        parent: 0
        key: {column: id, source: field, value: fiches.pages}
        values:
          label: {source: fixed, value: preuve}
          labelled_at: {source: now}

  - id: formuler_b
    title: Formuler des business B
    role: >-
      Lit les pages « besoin nouveau » pas encore utilisées, en entier
      quand il le faut, et écrit des idées de business avec leurs preuves.
      Tourne juste après A et voit les business qu'elle a écrits.
    step: pre_prospection
    type: llm
    model_tier: smart
    queue: works
    priority: 10
    gets_serge_intro: true
    default_max_rows: 100
    max_tool_turns: 5
    settings:
      nombre_idees: {value: 3, min: 0, max: 10, policy: true, description: Le nombre maximum d'idées par passage.}
      lignes_page_entiere: {value: 150, min: 10, max: 2000, policy: true, description: Les lignes lues au plus dans une page lue en entier.}
      pages_entieres_max: {value: 10, min: 1, max: 30, policy: true, description: Le nombre maximum de pages lues en entier par passage.}
    compare:
      listen_docs: false
    prompt: *consigne_formuler
    tools:
      - tool: pages_besoin_nouveau
        mode: given
        label: Les pages « besoin nouveau »
        max_rows: 60
      - tool: lire_page_entiere
        mode: callable
        max_calls: pages_entieres_max
        params:
          table: {source: fixed, value: listen_docs}
          url: {source: fixed, value: ''}
          max_lines: {source: setting, value: lignes_page_entiere}
    output:
      - {path: fiches, type: list, max_items: nombre_idees, description: Les idées de business.}
      - {path: fiches.titre, type: text, description: Le nom court du business.}
      - {path: fiches.description, type: text, description: Ce qu'il vend et à qui.}
      - {path: fiches.observations, type: text, required: false, description: Ce qu'on a observé dans les pages.}
      - {path: fiches.offre, type: text, required: false, description: L'offre qu'on pourrait vendre tout de suite.}
      - path: fiches.famille
        type: choice
        choices: [produits_numeriques, petits_logiciels, services_faits_par_serge, automatisation_sur_mesure, telephone_sms, veille_rapports, medias_audience, mise_en_relation, formation, commerce_sans_stock, prospection_pour_autres, autre]
        description: La famille de business (autre si aucune ne convient).
      - {path: fiches.pages, type: list, min_items: 1, description: Les numéros des pages qui prouvent le besoin.}
    writes:
      - table: ventures
        operation: insert
        for_each: fiches
        values:
          name: {source: field, value: fiches.titre}
          description: {source: field, value: fiches.description}
          observations: {source: field, value: fiches.observations}
          sellable_offer: {source: field, value: fiches.offre}
          family: {source: field, value: fiches.famille}
          lifecycle: {source: fixed, value: CANDIDATE}
      - table: venture_sources
        operation: insert
        for_each: fiches.pages
        parent: 0
        values:
          venture_id: {source: parent_row, value: id}
          doc_id: {source: field, value: fiches.pages}
          cycle_id: {source: task, value: cycle_id}
      - table: listen_docs
        operation: update
        for_each: fiches.pages
        parent: 0
        key: {column: id, source: field, value: fiches.pages}
        values:
          label: {source: fixed, value: preuve}
          labelled_at: {source: now}

  - id: choisir_business
    title: Choisir les business à tester
    role: >-
      Choisit parmi tous les candidats au plus autant de business qu'il
      reste de places de test, garde la raison de chaque choix, puis ferme
      le cycle.
    step: pre_prospection
    type: llm
    model_tier: mid
    queue: works
    priority: 10
    gets_serge_intro: true
    default_max_rows: 50
    max_tool_turns: 4
    compare:
      ventures: false
      listen_cycles: false
    prompt: |
      Tu choisis les business que Serge va tester. Serge a
      {quota.places_de_test} places de test en tout ; tu vois les
      business qui en occupent déjà une. Choisis au plus autant de
      business qu'il reste de places libres, parmi les candidats.

      Tes critères, dans l'ordre :
      1. la force des preuves : des pages qui montrent un vrai besoin,
         exprimé par de vraies personnes ;
      2. la facilité d'un test rapide : on peut proposer vite quelque chose
         de concret ;
      3. un premier revenu rapide ;
      4. la légalité.

      Pour chaque business choisi, donne son numéro et la raison du choix,
      en une phrase. Tu peux n'en choisir aucun si aucun candidat n'est
      assez solide : dis alors pourquoi dans la note. N'invente jamais un
      numéro.
    tools:
      - tool: business_en_test
        mode: given
        label: Les business en test
      - tool: business_candidats
        mode: given
        label: Les business candidats
      - tool: preuves_des_candidats
        mode: given
        label: Les preuves des candidats
        max_rows: 150
    output:
      - {path: choix, type: list, required: false, description: Les business choisis.}
      - {path: choix.business, type: text, description: Le numéro du business.}
      - {path: choix.raison, type: text, description: 'Pourquoi, en une phrase.'}
      - {path: note, type: text, required: false, description: "Ce que tu dis du cycle, par exemple pourquoi tu n'as rien choisi."}
    writes:
      - table: ventures
        operation: update
        for_each: choix
        key: {column: id, source: field, value: choix.business}
        values:
          lifecycle: {source: fixed, value: POC_SELECTED}
          choice_reason: {source: field, value: choix.raison}
      - table: listen_cycles
        operation: update
        key: {column: id, source: task, value: cycle_id}
        values:
          status: {source: fixed, value: CLOSED}
          finished_at: {source: now}
          choice_note: {source: field, value: note}

  - id: abandonner_cycle
    title: Abandonner le cycle en cours
    role: >-
      Ferme le cycle resté ouvert (une invocation qui a échoué, par
      exemple), et annule ses tâches en attente, pour pouvoir en lancer un
      autre. Sans LLM.
    step: pre_prospection
    type: capability
    capability: echo
    queue: works
    priority: 20
    writes:
      - table: listen_cycles
        operation: update
        key: {column: status, source: fixed, value: OPEN}
        values:
          status: {source: fixed, value: ABANDONED}
          finished_at: {source: now}

  - id: lire_un_flux
    title: Lire un flux RSS
    role: >-
      La veille : lit un flux RSS suivi et garde ses pages nouvelles, avec
      un aperçu tiré du résumé du flux. Sans LLM.
    step: pre_prospection
    type: capability
    capability: rss_read
    queue: works
    priority: 5
    settings:
      pages_par_flux: {value: 20, min: 1, max: 100, policy: true, description: Les pages lues au plus dans un flux à chaque passage.}
      lignes_apercu: {value: 5, min: 1, max: 30, policy: true, description: Les lignes de l'aperçu d'une page de flux.}
    params:
      url: {source: task, value: url}
      max_items: {source: setting, value: pages_par_flux}
      max_lines: {source: setting, value: lignes_apercu}
    writes:
      - table: listen_docs
        operation: insert
        for_each: rows
        values:
          url: {source: field, value: rows.url}
          title: {source: field, value: rows.title}
          excerpt: {source: field, value: rows.excerpt}
          published: {source: field, value: rows.published}
          source: {source: fixed, value: rss}
          feed_id: {source: task, value: feed_id}
          fetched_at: {source: now}
      - table: listen_feeds
        operation: update
        key: {column: id, source: task, value: feed_id}
        values:
          last_read_at: {source: now}

  - id: oublier_pages
    title: Oublier les vieilles pages
    role: >-
      Supprime les pages « bruit » et les pages jamais triées plus vieilles
      que le nombre de jours réglé. Une page qui sert de preuve n'est
      jamais supprimée. Sans LLM.
    step: pre_prospection
    type: capability
    capability: db_read
    queue: works
    priority: 1
    settings:
      jours: {value: 30, min: 1, max: 365, policy: true, description: Les jours avant d'oublier une page bruit ou jamais triée.}
    params:
      tool_id: {source: fixed, value: pages_a_oublier}
      jours: {source: setting, value: jours}
    writes:
      - table: listen_docs
        operation: delete
        for_each: rows
        key: {column: id, source: field, value: rows.id}

  - id: oublier_besoins
    title: Oublier les besoins jamais utilisés
    role: >-
      Supprime les pages « besoin nouveau » jamais utilisées plus vieilles
      que le nombre de jours réglé. Sans LLM.
    step: pre_prospection
    type: capability
    capability: db_read
    queue: works
    priority: 1
    settings:
      jours: {value: 60, min: 1, max: 365, policy: true, description: Les jours avant d'oublier une page « besoin nouveau » jamais utilisée.}
    params:
      tool_id: {source: fixed, value: besoins_a_oublier}
      jours: {source: setting, value: jours}
    writes:
      - table: listen_docs
        operation: delete
        for_each: rows
        key: {column: id, source: field, value: rows.id}

  - id: effacer_idees
    title: Effacer les idées (test)
    role: >-
      Bouton temporaire, pour tester le cycle en production autant de fois
      qu'on veut : détruit tous les business encore candidats ou choisis,
      et leurs preuves. Les pages restent. À retirer avant le vrai
      lancement de Serge. Sans LLM.
    step: pre_prospection
    type: capability
    capability: db_read
    queue: works
    priority: 20
    params:
      tool_id: {source: fixed, value: idees}
    writes:
      - table: ventures
        operation: delete
        for_each: rows
        key: {column: id, source: field, value: rows.id}
      - table: venture_sources
        operation: delete
        for_each: rows
        key: {column: venture_id, source: field, value: rows.id}

# --- Les conversations (lot 8, décision Q79) -------------------------------
# Un message reçu réveille « Traiter une réponse », qui écrit la réponse ;
# « Envoyer un message » la fait partir après le délai du canal. Les
# relances sont cherchées toutes les 15 minutes. Une désinscription bloque
# partout et prévient Julien et Clem. Détail : docs/LOT8_CONCEPTION.md.
  - id: relever_messages
    title: Relever les messages
    role: >-
      Lit les messages reçus sur un canal depuis sa dernière relève, les
      rattache à leur contact (par le fil, sinon par l'adresse) et les
      écrit dans les messages reçus. Sans LLM.
    type: capability
    capability: receive_messages
    queue: conversations
    priority: 80
    params:
      channel: {source: task, value: channel}
    writes:
      - table: inbound_events
        operation: insert
        for_each: rows
        values:
          channel: {source: task, value: channel}
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          native_type: {source: field, value: rows.native_type}
          address: {source: field, value: rows.address}
          subject: {source: field, value: rows.subject}
          body: {source: field, value: rows.body}
          message_ref: {source: field, value: rows.message_ref}
          external_ref: {source: field, value: rows.external_ref}
          status: {source: field, value: rows.status}
          received_at: {source: now}
      - table: canaux
        operation: update
        key: {column: id, source: task, value: channel}
        values:
          polled_at: {source: now}

  - id: traiter_reponse
    title: Traiter une réponse
    role: >-
      Lit le message d'un contact avec tout son fil, dit ce qu'il fait
      (question, refus, désinscription…), écrit la réponse de Serge et note
      les demandes sur le produit. Une seule tâche attend par contact :
      deux messages coup sur coup n'ont qu'une réponse.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 100
    gets_serge_intro: true
    max_tool_turns: 3
    single_pending: contact_id
    compare:
      inbound_events: false
      touches: false
      contacts: false
      customer_requests: false
    prompt: |
      Tu réponds, au nom de Serge, à un contact qui vient d'écrire à propos
      d'un business que Serge teste.

      Tu reçois le fil du contact (tout ce qui s'est dit, tous canaux
      confondus, du plus ancien au plus récent), sa fiche, la fiche du
      business, la fiche produit et ses questions fréquentes. Tu réponds au
      dernier message du fil ; si le contact a écrit plusieurs fois depuis
      la dernière réponse de Serge, réponds à tout d'un coup.

      Le dernier message peut être la transcription d'un appel (canal
      voice). La suite part alors par e-mail si Serge a son adresse, sinon
      Serge rappelle : écris-la comme un e-mail court qui reprend ce qui a
      été promis (un document, un devis), ou laisse-la vide s'il n'y a
      rien à ajouter après l'appel.

      Rends :
      - reaction : ce que fait le message, l'une de : intéressé, question,
        objection, rendez-vous, refus, désinscription, absence, hors sujet.
        « désinscription » : la personne demande à ne plus être contactée
        (« STOP », « ne m'écrivez plus »). « absence » : une réponse
        automatique (congés, absence).
      - reply : le texte de ta réponse, prêt à partir, sans objet ni
        signature d'humain. Laisse-le vide pour une désinscription, une
        absence ou un message hors sujet : Serge ne répond rien.
      - requests : les demandes sur le produit que contient le message, s'il
        y en a : un bug, une insatisfaction, une idée (une fonctionnalité
        qui manque).

      Règles :
      - Un refus : remercie poliment, sans insister.
      - Un rendez-vous : confirme-le.
      - Ne promets jamais une date, un prix ou une fonctionnalité absents de
        la fiche produit. Une fonctionnalité qui manque devient une demande
        « idée ». En cas de doute, réponds sans t'engager.
      - Écris dans la langue du contact, simplement et brièvement.
      - Serge assume d'être un agent IA : ne prétends jamais être un humain.
    tools:
      - tool: fil_du_contact
        mode: given
        label: Le fil du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_contact
        mode: given
        label: La fiche du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: reaction, type: choice, choices: [intéressé, question, objection, rendez-vous, refus, désinscription, absence, hors sujet], description: Ce que fait le message.}
      - {path: reply, type: text, description: 'Le texte de la réponse, ou vide pour ne rien répondre.'}
      - {path: requests, type: list, required: false, description: Les demandes sur le produit.}
      - {path: requests.kind, type: choice, choices: [bug, insatisfaction, idée], description: La sorte de demande.}
      - {path: requests.text, type: text, description: 'La demande, en une phrase.'}
    writes:
      - table: inbound_events
        operation: update
        key: {column: id, source: task, value: inbound_id}
        values:
          reaction: {source: field, value: reaction}
      - table: inbound_events
        operation: update
        key: {column: id, source: task, value: inbound_id}
        condition: {field: reaction, op: '=', value: absence}
        values:
          status: {source: fixed, value: ignored}
      - table: touches
        operation: insert
        condition: {field: reply, op: non_vide}
        values:
          contact_id: {source: task, value: contact_id}
          venture_id: {source: task, value: venture_id}
          channel: {source: task, value: channel}
          address: {source: task, value: address}
          subject: {source: task, value: subject}
          body: {source: field, value: reply}
          kind: {source: fixed, value: reply}
          status: {source: fixed, value: pending}
          reply_to: {source: task, value: inbound_id}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: question}
        values:
          funnel_state: {source: fixed, value: ENGAGED}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: objection}
        values:
          funnel_state: {source: fixed, value: ENGAGED}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: intéressé}
        values:
          funnel_state: {source: fixed, value: INTENT}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: rendez-vous}
        values:
          funnel_state: {source: fixed, value: MEETING}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: refus}
        values:
          funnel_state: {source: fixed, value: REJECTED}
      - table: customer_requests
        operation: insert
        for_each: requests
        values:
          venture_id: {source: task, value: venture_id}
          contact_id: {source: task, value: contact_id}
          inbound_id: {source: task, value: inbound_id}
          kind: {source: field, value: requests.kind}
          text: {source: field, value: requests.text}

  - id: envoyer_message
    title: Envoyer un message
    role: >-
      Fait partir un envoi par son canal, après les garde-fous, sans jamais
      l'envoyer deux fois. Annule un envoi devenu inutile (le contact a
      écrit depuis, ou s'est désinscrit). Sans LLM.
    type: capability
    capability: send_message
    queue: conversations
    priority: 50
    params:
      touch_id: {source: task, value: touch_id}

  - id: preparer_relances
    title: Préparer les relances
    role: >-
      Cherche les contacts qui n'ont pas répondu au dernier message de Serge
      depuis le délai réglé, et écrit pour chacun une relance à rédiger, sur
      le canal du premier message. Sans LLM.
    type: capability
    capability: due_followups
    queue: conversations
    priority: 50
    settings:
      premiere_relance_minutes: {value: 4320, min: 0, max: 43200, policy: true, description: Les minutes entre le premier message et la première relance (4320 = 3 jours).}
      relance_suivante_minutes: {value: 10080, min: 0, max: 43200, policy: true, description: Les minutes entre deux relances (10080 = 7 jours).}
      relances_max: {value: 2, min: 0, max: 5, policy: true, description: Le nombre maximum de relances par contact.}
    params:
      first_delay_minutes: {source: setting, value: premiere_relance_minutes}
      next_delay_minutes: {source: setting, value: relance_suivante_minutes}
      max_followups: {source: setting, value: relances_max}
    writes:
      - table: touches
        operation: insert
        for_each: rows
        values:
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          channel: {source: field, value: rows.channel}
          address: {source: field, value: rows.address}
          subject: {source: field, value: rows.subject}
          followup_of: {source: field, value: rows.followup_of}
          kind: {source: fixed, value: followup}
          status: {source: fixed, value: to_write}

  - id: ecrire_relance
    title: Écrire une relance
    role: >-
      Rédige une relance courte pour un contact qui n'a pas répondu, à
      partir de son fil et de la fiche produit.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 50
    gets_serge_intro: true
    max_tool_turns: 3
    compare:
      touches: false
    prompt: |
      Tu écris une relance, au nom de Serge, à un contact qui n'a pas
      répondu au dernier message de Serge.

      Tu reçois le fil du contact, sa fiche, la fiche du business et la
      fiche produit. Écris un message court et poli, qui rappelle l'offre en
      une phrase et apporte quelque chose de neuf (un détail de la fiche
      produit, une question simple). Ne répète pas le message précédent.
      Ne promets rien qui ne soit pas dans la fiche produit. Écris dans la
      langue du fil, sans objet ni signature d'humain : Serge assume d'être
      un agent IA.
    tools:
      - tool: fil_du_contact
        mode: given
        label: Le fil du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_contact
        mode: given
        label: La fiche du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: body, type: text, description: Le texte de la relance.}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          body: {source: field, value: body}
          status: {source: fixed, value: pending}

  - id: desinscrire
    title: Désinscrire
    role: >-
      Une personne demande à ne plus être contactée : bloque toutes ses
      adresses sur tous les canaux, passe toutes ses fiches, dans tous les
      business, à « Désinscrit », et annule ses envois en attente. Sans LLM.
    type: capability
    capability: unsubscribe_contact
    queue: conversations
    priority: 100
    params:
      contact_id: {source: task, value: contact_id}

  - id: prevenir_julien_et_clem
    title: Prévenir Julien et Clem
    role: >-
      Ouvre un ticket d'information quand un contact s'est désinscrit, pour
      que Julien et Clem voient ce qui se passe. Sans LLM.
    type: capability
    capability: inform_owners
    queue: conversations
    priority: 100
    params:
      title: {source: fixed, value: Un contact s'est désinscrit}
      text: {source: fixed, value: 'Serge ne le contactera plus, sur aucun canal ni pour aucun business.'}
      contact_id: {source: task, value: contact_id}

  - id: parler_au_telephone
    title: Parler au téléphone
    role: >-
      L'agent vocal : il mène chaque appel, entrant ou sortant, en direct.
      Il reçoit au décrochage la fiche du contact, son fil, la fiche du
      business et la fiche produit ; il peut chercher un appelant inconnu
      et noter une adresse. À la fin, ce qui s'est dit entre dans le fil
      du contact, ce qui lance la suite.
    type: llm
    model_tier: ''
    queue: voice
    priority: 100
    gets_serge_intro: true
    compare:
      inbound_events: false
    settings:
      duree_max_secondes: {value: 180, min: 30, max: 1800, policy: true, description: 'La durée maximale d''un appel, en secondes.'}
      fournisseurs: {type: text, value: 'xai,openai', description: 'Les fournisseurs de la voix en direct, dans l''ordre (xai, openai) : le second sert si le premier ne répond pas.'}
      modele_xai: {type: text, value: grok-voice-think-fast-2.0, description: Le modèle vocal chez xAI.}
      voix_xai: {type: text, value: eve, description: La voix chez xAI.}
      modele_openai: {type: text, value: gpt-realtime-2.1-mini, description: Le modèle vocal chez OpenAI.}
      voix_openai: {type: text, value: alloy, description: La voix chez OpenAI.}
      modele_secours: {type: text, value: openai/gpt-4o-mini, description: 'Le modèle du secours tour par tour (OpenRouter), quand la voix en direct ne répond pas.'}
      tours_secours: {value: 4, min: 1, max: 20, description: Les tours de parole au plus dans le secours tour par tour.}
    prompt: |
      Tu es Serge, au téléphone. Tu parles français, simplement, une ou
      deux phrases courtes à la fois, sans liste ni formule écrite.

      Tu reçois peut-être la fiche de ton interlocuteur, son fil (ce qui
      s'est déjà dit, tous canaux confondus), la fiche du business et la
      fiche produit, et, pour un appel que tu passes, son but.

      - Un appel que tu passes : présente-toi, dis pourquoi tu appelles
        (son but), demande si c'est le bon moment.
      - Un appel que tu reçois d'un numéro inconnu : « Bonjour, je suis
        Serge, en quoi puis-je vous aider ? ». Demande à qui tu parles,
        puis cherche sa fiche avec l'outil « Chercher un contact » (son
        nom, son entreprise, son e-mail ou son numéro).
      - Une personne reconnue seulement par son nom : ne lui répète
        aucune information sensible (montants, adresses, propos d'un
        collègue).
      - Une proposition faite à Serge (un partenariat, une offre) :
        réponds poliment que tu ne peux pas traiter ce genre de demande
        pour l'instant.
      - Un document à envoyer (une documentation, un devis) : demande son
        adresse e-mail, fais-la épeler, relis-la, puis note-la avec
        l'outil « Noter une adresse ». Dis que le document arrive par
        e-mail.
      - Ne promets jamais une date, un prix ou une fonctionnalité absents
        de la fiche produit. En cas de doute, dis que tu vérifies et que
        tu reviens vers la personne.
      - Une personne qui ne veut plus être contactée : dis que c'est noté,
        puis au revoir.
      - Tu es un agent IA : dis-le si on te le demande, ne prétends
        jamais être un humain.
      - Pour finir, dis au revoir.
    tools:
      - tool: but_de_l_appel
        mode: given
        label: Le but de l'appel
        params:
          touch_id: {source: task, value: touch_id}
      - tool: fil_du_contact
        mode: given
        label: Le fil de ton interlocuteur
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_contact
        mode: given
        label: Sa fiche
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: chercher_contact
        mode: callable
      - tool: noter_adresse
        mode: callable
    output:
      - {path: transcript, type: text, description: 'Ce qui s''est dit, une ligne par phrase.'}
      - {path: contact_id, type: text, required: false, description: Le contact de l'appel.}
      - {path: venture_id, type: text, required: false, description: Son business.}
      - {path: status, type: text, description: 'attached (contact connu) ou unattached.'}
    writes:
      - table: inbound_events
        operation: insert
        values:
          channel: {source: fixed, value: voice}
          contact_id: {source: field, value: contact_id}
          venture_id: {source: field, value: venture_id}
          native_type: {source: fixed, value: call}
          address: {source: task, value: phone}
          subject: {source: fixed, value: Suite à notre appel}
          body: {source: field, value: transcript}
          external_ref: {source: task, value: cdr_id}
          status: {source: field, value: status}
          received_at: {source: now}

# --- Le kit d'essai (lot 8, PR 4, décision Q79) -----------------------------
# Temporaire : à retirer avant le vrai lancement de Serge. Le bouton
# « Lancer un essai » (page Système) crée un business bidon avec une
# demi-fiche produit, la fiche de la personne qui essaie (ses coordonnées
# restent en base, jamais dans le dépôt) avec son accord pour l'appel de
# test, puis Serge lui écrit et l'appelle.
  - id: lancer_essai
    title: Lancer un essai (temporaire)
    role: >-
      Temporaire, pour essayer les canaux : remplace le business d'essai
      précédent par un business bidon neuf, avec sa demi-fiche produit et
      ses questions fréquentes. Sans LLM.
    type: capability
    capability: echo
    queue: conversations
    priority: 60
    params:
      name: {source: task, value: name}
      email: {source: task, value: email}
      phone: {source: task, value: phone}
    writes:
      - table: ventures
        operation: delete
        key: {column: lifecycle, source: fixed, value: TEST}
      - table: ventures
        operation: insert
        values:
          name: {source: fixed, value: Devis Vocal}
          description: {source: fixed, value: 'Les artisans dictent leurs devis au téléphone ; Devis Vocal les met en page et les envoie au client.'}
          sellable_offer: {source: fixed, value: 'Un mois d''essai gratuit, puis 29 € par mois, sans engagement.'}
          lifecycle: {source: fixed, value: TEST}
      - table: product_sheets
        operation: insert
        parent: 1
        values:
          venture_id: {source: parent_row, value: id}
          summary: {source: fixed, value: 'Pour les artisans du bâtiment : on appelle un numéro, on dicte son devis en parlant normalement, et le devis mis en page part au client par e-mail en moins de 10 minutes.'}
          limits: {source: fixed, value: 'Pas d''export vers un logiciel de comptabilité ; pas de factures, seulement des devis ; en français seulement.'}
          price: {source: fixed, value: 'Un mois d''essai gratuit, puis 29 € par mois, sans engagement.'}
          delays: {source: fixed, value: 'Un devis part en moins de 10 minutes après l''appel.'}
          usage: {source: fixed, value: 'On appelle le numéro Devis Vocal, on dit le nom du client, les prestations et les prix ; on relit le devis reçu par e-mail avant qu''il parte.'}
      - table: product_faq
        operation: insert
        parent: 1
        values:
          venture_id: {source: parent_row, value: id}
          question: {source: fixed, value: 'Est-ce que je peux corriger un devis avant qu''il parte ?'}
          answer: {source: fixed, value: 'Oui : vous le recevez d''abord par e-mail, et il ne part au client que quand vous répondez « OK ».'}
      - table: product_faq
        operation: insert
        parent: 1
        values:
          venture_id: {source: parent_row, value: id}
          question: {source: fixed, value: 'Ça marche avec mon logo ?'}
          answer: {source: fixed, value: 'Oui : vous envoyez votre logo une fois par e-mail, il est mis sur tous vos devis.'}

  - id: creer_contact_essai
    title: Créer le contact d'essai (temporaire)
    role: >-
      Temporaire : crée la fiche de la personne qui essaie, avec son accord
      pour l'appel de test (à toute heure, décision Q79), puis un premier
      e-mail et un premier appel à rédiger. Sans LLM.
    type: capability
    capability: add_contact
    queue: conversations
    priority: 60
    params:
      venture_id: {source: task, value: venture_id}
      name: {source: task, value: name}
      email: {source: task, value: email}
      phone: {source: task, value: phone}
      call_consent: {source: fixed, value: test}
    writes:
      - table: touches
        operation: insert
        for_each: rows
        condition: {field: rows.email, op: non_vide}
        values:
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          channel: {source: fixed, value: email}
          address: {source: field, value: rows.email}
          kind: {source: fixed, value: first}
          status: {source: fixed, value: to_write}
      - table: touches
        operation: insert
        for_each: rows
        condition: {field: rows.phone, op: non_vide}
        values:
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          channel: {source: fixed, value: voice}
          address: {source: field, value: rows.phone}
          kind: {source: fixed, value: first}
          status: {source: fixed, value: to_write}

  - id: ecrire_premier_message
    title: Écrire le premier message (temporaire)
    role: >-
      Temporaire : rédige le premier e-mail au contact d'essai, qui lui
      présente le business et son offre.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 50
    gets_serge_intro: true
    max_tool_turns: 3
    compare:
      touches: false
      contacts: false
    prompt: |
      Tu écris le premier e-mail de Serge à une personne qu'il ne connaît
      pas encore, pour lui présenter un business.

      Tu reçois la fiche du business, la fiche produit et ses questions
      fréquentes, et la fiche de la personne. Écris un objet court et un
      message de quelques phrases : le problème que le produit résout, ce
      qu'il fait, l'offre, et une question simple pour l'inviter à
      répondre. Ne promets rien qui ne soit pas dans la fiche produit.
      Serge assume d'être un agent IA : pas de signature d'humain.
    tools:
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_contact
        mode: given
        label: La fiche de la personne
        params:
          contact_id: {source: task, value: contact_id}
    output:
      - {path: subject, type: text, description: L'objet de l'e-mail.}
      - {path: body, type: text, description: Le texte de l'e-mail.}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          subject: {source: field, value: subject}
          body: {source: field, value: body}
          status: {source: fixed, value: pending}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        values:
          funnel_state: {source: fixed, value: CONTACTING}

  - id: preparer_premier_appel
    title: Préparer le premier appel (temporaire)
    role: >-
      Temporaire : écrit le but du premier appel au contact d'essai, que
      l'agent vocal reçoit au décrochage.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 50
    gets_serge_intro: true
    max_tool_turns: 3
    compare:
      touches: false
      contacts: false
    prompt: |
      Tu prépares le premier appel de Serge à une personne qu'il ne connaît
      pas encore, pour lui présenter un business.

      Tu reçois la fiche du business, la fiche produit et la fiche de la
      personne. Écris le but de l'appel en deux ou trois phrases, pour
      l'agent vocal : ce qu'il présente, l'offre, et ce qu'il veut obtenir
      (un intérêt, un rendez-vous, une adresse e-mail pour envoyer la
      documentation).
    tools:
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_contact
        mode: given
        label: La fiche de la personne
        params:
          contact_id: {source: task, value: contact_id}
    output:
      - {path: body, type: text, description: Le but de l'appel.}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          subject: {source: fixed, value: 'Appel d''essai'}
          body: {source: field, value: body}
          status: {source: fixed, value: pending}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        values:
          funnel_state: {source: fixed, value: CONTACTING}


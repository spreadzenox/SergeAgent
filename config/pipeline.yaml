      base_domain: {source: task, value: domaine_commun}
      env_secrets: {source: fixed, value: STRIPE_SECRET_KEY=stripe-produits-live.key}
      task_id: {source: task, value: task_id}

  - id: paiement_test
    title: Le paiement test de 1 €
    role: >-
      Vérifie que l'argent arrive : crée un prix de 1 € et un lien de
      paiement pour le produit, paie avec la carte de Serge dans le
      navigateur (sans jamais voir ses numéros), vérifie dans Stripe que le
      paiement est arrivé et porte le business, se rembourse, puis
      désactive le lien et archive le prix (Q41, Q91).
    step: build_venture
    type: llm
    model_tier: web
    queue: works
    priority: 30
    max_tool_turns: 60
    prompt: |
      Tu fais le paiement test de 1 € d'un produit qui vient d'être mis en
      vente (Stripe en vrai mode : c'est de l'argent réel, rendu à la fin).
      Le numéro du business est dans les paramètres de la tâche
      (venture_id), son adresse aussi (« url »).

      1. Retrouve le produit du business dans Stripe : « Trouver un prix
         Stripe par sa clé de recherche » rend le prix de son abonnement
         (la clé, le numéro du business, est ajoutée toute seule) ; son
         produit est le champ product (prod_…). Si aucun prix n'est
         rendu, arrête-toi : paye « non ».
      2. Crée un prix de 1 € (100 centimes, eur, un paiement unique, sans
         intervalle) pour ce produit, avec le nom court « paiement test »,
         puis un lien de paiement pour ce prix, quantité 1.
      3. Ouvre le lien dans le vrai Chrome et paie comme une personne :
         l'adresse e-mail que te donne « Ma boîte e-mail » (appelle-la
      avec wait à faux),
         puis la carte de Serge avec l'action taper_secret, sans jamais
         écrire ses numéros toi-même : payment-card.enc#pan pour le
         numéro, payment-card.enc#expiration pour la date (MM/AA),
         payment-card.enc#cvc pour le code, payment-card.enc#cardholder_name
         pour le nom. Valide, et attends la page
         qui confirme le paiement. Si la banque demande une confirmation
         (3-D Secure) que tu ne peux pas donner, arrête-toi : paye « non ».
         Si un captcha bloque (« je ne suis pas un robot », des images à
         choisir), appelle « Appeler un humain » : la première fois, la
         tâche s'arrête et repartira du début quand un humain sera prêt ;
         la fois suivante, au même blocage, il le résout dans l'écran
         pendant que tu attends ; relis alors la page et continue.
      4. Vérifie dans Stripe, par les sessions du lien de paiement, qu'une
         session est payée (payment_status : paid), de 100 centimes, et
         note son paiement (payment_intent, pi_…).
      5. Rembourse ce paiement en entier.
      6. Désactive le lien de paiement et archive le prix de 1 €.

      Rends paye « oui » si le paiement est arrivé, avec son identifiant
      (pi_…), et rembourse « oui » s'il est remboursé ; ton compte rendu
      dit, en deux phrases, l'adresse du produit, ce qui s'est passé et ce
      qui a raté.
    tools:
      - tool: stripe_prix_par_cle
        mode: callable
        params:
          service: {source: fixed, value: stripe_live}
          'lookup_keys[0]': {source: task, value: venture_id}
          active: {source: fixed, value: 'true'}
          task_id: {source: task, value: task_id}
      - tool: stripe_creer_prix
        mode: callable
        max_calls: 1
        params:
          service: {source: fixed, value: stripe_live}
          'metadata[venture_id]': {source: task, value: venture_id}
          task_id: {source: task, value: task_id}
      - tool: stripe_creer_lien_paiement
        mode: callable
        max_calls: 1
        params:
          service: {source: fixed, value: stripe_live}
          'metadata[venture_id]': {source: task, value: venture_id}
          task_id: {source: task, value: task_id}
      - tool: stripe_sessions_du_lien
        mode: callable
        params:
          service: {source: fixed, value: stripe_live}
          task_id: {source: task, value: task_id}
      - tool: stripe_rembourser
        mode: callable
        max_calls: 1
        params:
          service: {source: fixed, value: stripe_live}
          'metadata[venture_id]': {source: task, value: venture_id}
          task_id: {source: task, value: task_id}
      - tool: stripe_desactiver_lien
        mode: callable
        params:
          service: {source: fixed, value: stripe_live}
          active: {source: fixed, value: 'false'}
          task_id: {source: task, value: task_id}
      - tool: stripe_archiver_prix
        mode: callable
        params:
          service: {source: fixed, value: stripe_live}
          active: {source: fixed, value: 'false'}
          task_id: {source: task, value: task_id}
      - tool: vrai_chrome_agir
        mode: callable
        params: &vrai_chrome_paiement
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: produit}
          task_id: {source: task, value: task_id}
          secrets: {source: fixed, value: 'payment-card.enc#pan,payment-card.enc#expiration,payment-card.enc#cvc,payment-card.enc#cardholder_name'}
      - tool: vrai_chrome_lire
        mode: callable
        params: *navigateur_produit
      - tool: vrai_chrome_capture
        mode: callable
        params: *navigateur_produit
      - tool: appeler_un_humain
        mode: callable
        params: &humain_de_la_tache
          task_id: {source: task, value: task_id}
      - tool: boite_mail
        mode: callable
        params: *boite_de_la_tache
    output:
      - {path: paye, type: choice, choices: [oui, non], description: 'Le paiement de 1 € est-il arrivé ?'}
      - {path: paiement, type: text, required: false, description: Le paiement (pi_…).}
      - {path: rembourse, type: choice, choices: [oui, non], description: 'Est-il remboursé ?'}
      - {path: compte_rendu, type: text, description: "L'adresse du produit, ce qui s'est passé, ce qui a raté."}
    writes:
      - table: transactions
        operation: insert
        condition: {field: paye, op: '=', value: oui}
        values:
          venture_id: {source: task, value: venture_id}
          kind: {source: fixed, value: canary}
          amount_eur: {source: fixed, value: '1'}
          intent_id: {source: field, value: paiement}
          status: {source: fixed, value: succeeded}
          doc_ref: {source: fixed, value: Paiement test de 1 € de l'étape 5.}

  - id: produit_pret
    title: Produit en vente
    role: >-
      Le produit est en ligne sur son domaine et le paiement test est

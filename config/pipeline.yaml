    condition: {field: state, op: '=', value: RUNNING}
    params:
      campaign_id: {source: field, value: campaign_id}
      venture_id: {source: field, value: venture_id}
      channel: {source: field, value: channel}
      address_kind: {source: field, value: address_kind}

      - table: ventures
        operation: update
        condition: {field: venture_status, op: non_vide}
        key: {column: id, source: field, value: venture_id}
        values:
          lifecycle: {source: field, value: venture_status}

  - id: trouver_prospects
    title: Trouver des prospects
    role: >-
      Cherche sur le web des personnes précises à contacter pour une
      campagne : leur nom, leur rôle, leur adresse directe sur le canal de
      la campagne, et la page où elle a été trouvée. Jamais d'adresse
      générique. Chaque prospect accepté reçoit un premier message à
      rédiger.
    step: prospection_light
    type: llm
    model_tier: smart
    queue: works
    priority: 20
    gets_serge_intro: true
    max_tool_turns: 25
    settings:
      prospects_par_passage: {value: 10, min: 1, max: 50, policy: true, description: 'Le nombre maximum de prospects ajoutés par passage.'}
      recherches_max: {value: 15, min: 1, max: 60, policy: true, description: 'Le nombre maximum de recherches par passage.'}
      pages_max: {value: 20, min: 1, max: 80, policy: true, description: 'Le nombre maximum de pages lues par passage.'}
      lignes_page: {value: 120, min: 10, max: 2000, policy: true, description: 'Les lignes lues au plus dans une page.'}
      ajouts_max: {value: 30, min: 1, max: 150, description: "Les essais d'ajout au plus par passage, refus compris."}
      fouilles_max: {value: 2, min: 0, max: 10, policy: true, description: 'Le nombre maximum de fouilles de chaque réseau par passage (0 : aucune).'}
    prompt: |
      Tu trouves des prospects pour une campagne de Serge : de vraies
      personnes, à qui il va écrire ou téléphoner.

      Tu reçois la campagne (son canal, sa cible), le plan, la fiche du
      business, la fiche produit, et les contacts déjà trouvés pour ce
      business : n'en propose aucun une seconde fois.

      Ce que tu cherches : une personne nommée, avec son rôle (« Marie
      Dupont, gérante »), dans une entreprise qui correspond à la cible, et
      son adresse directe sur le canal de la campagne :
      - canal email : une adresse e-mail à son nom (marie.dupont@…). Jamais
        une adresse générique (contact@, info@, accueil@…) : une entreprise
        dont tu ne trouves que celle-là est laissée de côté ;
      - canal voice : son numéro professionnel, au format international
        (+33…) ;
      - canal linkedin, instagram ou x : l'adresse de son profil sur ce
        réseau (https://www.linkedin.com/in/…), jamais celle d'une
        recherche ni d'une publication. Sur Instagram et X, seulement un
        compte professionnel, tenu au nom de son activité. Pour ces
        canaux, tu peux fouiller le réseau lui-même, au plus
        {fouilles_max} fois : une autre invocation y navigue avec le
        compte de Serge et te rend des profils.

      Où chercher : le site de l'entreprise (sa page équipe, ses mentions
      légales), les annuaires professionnels, les fiches d'entreprise, les
      articles et les publications. Une adresse doit avoir été lue sur une
      page : ne la devine jamais, ne la construis jamais d'après un modèle
      (prenom.nom@…).

      Commence par « Chercher des contacts sur Apollo », au plus
      {fouilles_max} fois : c'est un annuaire de contacts professionnels,
      où une autre invocation cherche avec le compte de Serge des personnes
      par métier, taille d'entreprise et lieu. Une adresse e-mail qu'Apollo
      affiche en entier compte comme lue sur une page : donne l'adresse de
      la fiche Apollo pour source. Une adresse masquée, ou qu'Apollo dit
      seulement probable, ne compte pas. Si l'outil répond que Serge n'a pas
      de compte Apollo en service, ou s'il ne donne pas assez de monde,
      cherche sur le web comme dit ci-dessus.

      Exception, pour une campagne sur Instagram : ne passe pas par Apollo.
      Cherche les comptes directement sur Instagram, avec « Fouiller
      Instagram » : dis à l'autre invocation la cible de la campagne (le
      métier, le lieu) et demande-lui des comptes professionnels, tenus au
      nom d'une activité, avec l'adresse exacte de chaque profil. C'est
      cette adresse que tu donnes à « Ajouter un prospect », avec elle-même
      pour source.

      Méthode :
      - fais au plus {recherches_max} recherches et lis au plus {pages_max}
        pages ;
      - dès que tu tiens une personne et son adresse, appelle « Ajouter un
        prospect », avec la page où tu as trouvé l'adresse. L'outil
        vérifie tout de suite : s'il refuse, lis pourquoi et cherche
        quelqu'un d'autre ; s'il dit que la campagne ou le passage a son
        compte, arrête-toi ;
      - ajoute au plus {prospects_par_passage} prospects.

      À la fin, dis en deux phrases ce que tu as trouvé, et ce qui a
      manqué.
    tools:
      - tool: campagne_par_numero
        mode: given
        label: La campagne
        params:
          campaign_id: {source: task, value: campaign_id}
      - tool: plan_valide_du_poc
        mode: given
        label: Le plan du POC
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: contacts_du_business
        mode: given
        label: Les contacts déjà trouvés
        max_rows: 300
        params:
          venture_id: {source: task, value: venture_id}
      - tool: web_search
        mode: callable
        max_calls: recherches_max
      - tool: lire_page_entiere
        mode: callable
        max_calls: pages_max
        params:
          table: {source: fixed, value: ''}
          id: {source: fixed, value: ''}
          max_lines: {source: setting, value: lignes_page}
      - tool: chercher_sur_apollo
        mode: callable
        max_calls: fouilles_max
        params:
          invocation: {source: fixed, value: fouiller_reseau}
          account: {source: fixed, value: apollo}
          task_id: {source: task, value: task_id}
      - tool: fouiller_linkedin
        mode: callable
        max_calls: fouilles_max
        params:
          invocation: {source: fixed, value: fouiller_reseau}
          account: {source: fixed, value: linkedin}
          task_id: {source: task, value: task_id}
      - tool: fouiller_instagram
        mode: callable
        max_calls: fouilles_max
        params:
          invocation: {source: fixed, value: fouiller_reseau}
          account: {source: fixed, value: instagram}
          task_id: {source: task, value: task_id}
      - tool: ajouter_prospect
        mode: callable
        max_calls: ajouts_max
        params:
          campaign_id: {source: task, value: campaign_id}
    output:
      - {path: compte_rendu, type: text, description: 'Ce que tu as trouvé et ce qui a manqué, en deux phrases.'}

  - id: suivre_campagne
    title: Suivre une campagne
    role: >-
      Regarde une campagne en cours, toutes les heures : la clôt si elle est
      finie (elle a son compte et toutes ses relances sont faites, la durée
      du test est atteinte, ou elle ne trouve plus de prospects), relance
      « Trouver des prospects » s'il lui en manque, ou attend. Quand la
      dernière campagne de test d'un business est close, son test est
      mesuré. Sans LLM.
    step: prospection_light
    type: capability
    capability: follow_campaign
    queue: works
    priority: 20
    settings:
      jours_sans_envoi: {value: 8, min: 0, max: 60, policy: true, trial: 0, description: "Les jours sans aucun envoi avant de clore une campagne qui a son compte : un de plus que le plus long délai entre deux relances."}
      recherches_vides_max: {value: 3, min: 1, max: 20, policy: true, description: 'Les recherches de suite sans nouveau prospect avant de ne plus en chercher.'}
      jours_d_avance: {value: 1, min: 1, max: 14, policy: true, description: "Les jours d'envois d'avance que Serge garde au plus, en premiers messages qui attendent."}
    params:
      campaign_id: {source: task, value: campaign_id}
    writes:
      - table: campaigns
        operation: update
        condition: {field: action, op: '=', value: clore}
        key: {column: id, source: field, value: campaign_id}
        values:
          state: {source: field, value: state}
          end_reason: {source: field, value: raison}

  - id: rediger_premier_message
    title: Rédiger un premier message
    role: >-
      Un premier message attend d'être rédigé : passe la main à
      l'invocation du canal de ce message (« Écrire le premier e-mail »,
      « Préparer le premier appel »). Un nouveau canal ajoute ici son
      lien. Sans LLM.
    step: prospection_light
    type: capability
    capability: echo
    queue: conversations
    priority: 50
    params:
      touch_id: {source: task, value: touch_id}
      channel: {source: task, value: channel}

  - id: premier_email
    title: Écrire le premier e-mail
    role: >-
      Rédige le premier e-mail de Serge à un prospect : pourquoi il lui
      écrit, ce que fait le produit, et où l'essayer. Pendant le test, le
      lien est celui du POC ; ensuite, celui du produit fini, avec son
      prix.
    step: prospection_light
    type: llm
    model_tier: mid
    queue: conversations
    priority: 50
    gets_serge_intro: true
    max_tool_turns: 3
    compare:
      touches: false
      contacts: false
    prompt: |
      Tu écris le premier e-mail de Serge à une personne qu'il ne connaît
      pas encore, pour lui présenter un business.

      Tu reçois la fiche du business, la fiche produit et ses questions
      fréquentes, le plan (la cible et ce qu'on veut vérifier), la fiche de
      la personne (qui elle est, pourquoi elle est visée), la page où son
      adresse a été trouvée, et ce qui est en ligne.

      Écris un objet court et un message de quelques phrases :
      - une première phrase qui montre que tu sais à qui tu écris (son
        métier, son entreprise), sans flatterie ;
      - le problème que le produit résout, et ce qu'il fait ;
      - où l'essayer : l'adresse de ce qui est en ligne, précédée de
        https://. Si le produit fini est en ligne (livrable « produit »),
        donne son adresse et son prix ; sinon celle du POC, gratuit
        pendant le test. Si rien n'est en ligne, ne donne aucun lien ;
      - une question simple pour l'inviter à répondre.

      Ne promets rien qui ne soit pas dans la fiche produit. Dis où tu as
      trouvé son adresse si elle le demande ; ne l'écris pas d'office.
      Serge assume d'être un agent IA : pas de signature d'humain.
    tools:
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: plan_valide_du_poc
        mode: given
        label: Le plan du POC
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_prospect
        mode: given
        label: La fiche de la personne
        params:
          contact_id: {source: task, value: contact_id}
      - tool: adresses_du_prospect
        mode: given
        label: Où son adresse a été trouvée
        params:
          contact_id: {source: task, value: contact_id}
      - tool: en_ligne_du_business
        mode: given
        label: Ce qui est en ligne
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: subject, type: text, description: L'objet de l'e-mail.}
      - {path: body, type: text, description: Le texte de l'e-mail.}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          subject: {source: field, value: subject}
          body: {source: field, value: body}
          status: {source: fixed, value: pending}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        values:
          funnel_state: {source: fixed, value: CONTACTING}

  - id: premier_message_reseau
    title: Écrire le premier message d'un réseau
    role: >-
      Rédige le premier message de Serge à un prospect sur un réseau
      (LinkedIn, Instagram, X) : court, à la mesure de ce que le réseau
      permet à un inconnu. Pendant le test, le lien est celui du POC ;
      ensuite, celui du produit fini.
    step: prospection_light
    type: llm
    model_tier: mid
    queue: conversations
    priority: 50
    gets_serge_intro: true
    max_tool_turns: 3
    compare:
      touches: false
      contacts: false
    prompt: |
      Tu écris le premier message de Serge à une personne qu'il ne connaît
      pas encore, sur un réseau, pour lui présenter un business. Le réseau
      est dans les paramètres de la tâche (« canal »).

      Tu reçois la fiche du business, la fiche produit et ses questions
      fréquentes, le plan (la cible et ce qu'on veut vérifier), la fiche de
      la personne (qui elle est, pourquoi elle est visée), la page où son
      profil a été trouvé, et ce qui est en ligne.

      La longueur dépend du réseau, et elle ne se dépasse pas :
      - **linkedin** : 280 caractères au plus, espaces compris. C'est la
        note d'une demande de connexion ;
      - **instagram** et **x** : 500 caractères au plus.

      Dans cet ordre, sans formule de politesse inutile :
      - qui écrit : « Serge, un agent IA » ;
      - pourquoi à elle (son métier, son entreprise), sans flatterie ;
      - ce que fait le produit, en une phrase ;
      - où l'essayer : l'adresse de ce qui est en ligne, précédée de
        https://, si elle tient dans la longueur. Si rien n'est en ligne,
        aucun lien ;
      - une question simple pour l'inviter à répondre.

      Ne promets rien qui ne soit pas dans la fiche produit. Pas d'objet,
      pas de signature d'humain, pas de mot-dièse.
    tools:
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: plan_valide_du_poc
        mode: given
        label: Le plan du POC
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_prospect
        mode: given
        label: La fiche de la personne
        params:
          contact_id: {source: task, value: contact_id}
      - tool: adresses_du_prospect
        mode: given
        label: Où son profil a été trouvé
        params:
          contact_id: {source: task, value: contact_id}
      - tool: en_ligne_du_business
        mode: given
        label: Ce qui est en ligne
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: body, type: text, description: 'Le texte du message, dans la longueur du réseau.'}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          body: {source: field, value: body}
          status: {source: fixed, value: pending}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        values:
          funnel_state: {source: fixed, value: CONTACTING}

  - id: premier_appel
    title: Préparer le premier appel
    role: >-
      Écrit le but du premier appel de Serge à un prospect, que l'agent
      vocal reçoit au décrochage : ce qu'il présente, l'offre, et ce qu'il
      veut obtenir.
    step: prospection_light
    type: llm
    model_tier: mid
    queue: conversations
    priority: 50
    gets_serge_intro: true
    max_tool_turns: 3
    compare:
      touches: false
      contacts: false
    prompt: |
      Tu prépares le premier appel de Serge à une personne qu'il ne connaît
      pas encore, pour lui présenter un business.

      Tu reçois la fiche du business, la fiche produit, le plan (la cible
      et ce qu'on veut vérifier), la fiche de la personne (qui elle est,
      pourquoi elle est visée) et ce qui est en ligne.

      Écris le but de l'appel en trois ou quatre phrases, pour l'agent
      vocal : à qui il parle, ce qu'il présente, l'offre (le POC gratuit
      pendant le test ; le produit fini et son prix s'il est en ligne), et
      ce qu'il veut obtenir (un intérêt, un rendez-vous, une adresse
      e-mail pour envoyer le lien).
    tools:
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: plan_valide_du_poc
        mode: given
        label: Le plan du POC
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_prospect
        mode: given
        label: La fiche de la personne
        params:
          contact_id: {source: task, value: contact_id}
      - tool: en_ligne_du_business
        mode: given
        label: Ce qui est en ligne
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: body, type: text, description: Le but de l'appel.}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          subject: {source: fixed, value: Premier appel}
          body: {source: field, value: body}
          status: {source: fixed, value: pending}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        values:
          funnel_state: {source: fixed, value: CONTACTING}

  - id: mesurer_test
    title: Mesurer le test
    role: >-
      Écrit le compte rendu chiffré du test léger d'un business (prospects
      contactés par canal, réactions, points, dépense, points par euro) et
      le juge avec des seuils en chiffres absolus : retenu, ou non, avec la
      raison. Sans LLM.
    step: prospection_light
    type: capability
    capability: measure_test
    queue: works
    priority: 30
    settings:
      prospects_min: {value: 30, min: 0, max: 500, policy: true, trial: 0, description: 'Les prospects contactés, au moins, pour qu''un test compte.'}
      points_min: {value: 10, min: 0, max: 1000, policy: true, trial: 0, description: 'Les points, au moins, pour qu''un test soit retenu.'}
      points_par_euro_min: {value: 0, min: 0, max: 1000, policy: true, description: 'Les points par euro dépensé, au moins, pour qu''un test soit retenu.'}
    params:
      venture_id: {source: task, value: venture_id}
    writes:
      - table: test_reports
        operation: insert
        values:
          venture_id: {source: field, value: venture_id}
          contacted: {source: field, value: contacted}
          replies: {source: field, value: replies}
          points: {source: field, value: points}
          spend_eur: {source: field, value: spend_eur}
          points_per_eur: {source: field, value: points_per_eur}
          figures: {source: field, value: figures}
          verdict: {source: field, value: verdict}
          verdict_reason: {source: field, value: verdict_reason}

  - id: faire_bilan
    title: Faire le bilan du test
    role: >-
      Lit le compte rendu chiffré d'un test, les réponses des prospects et
      leurs demandes, et écrit un bilan en quelques lignes : ce qui a plu,
      ce qui a bloqué, les prospects qui ont le mieux répondu. Le bilan
      sert au choix du principal, au produit fini et à la prospection
      lourde.
    step: prospection_light
    type: llm
    model_tier: smart
    queue: works
    priority: 30
    gets_serge_intro: true
    max_tool_turns: 4
    prompt: |
      Tu fais le bilan du test léger d'un business : Serge a montré un POC
      à des prospects, par e-mail ou par téléphone.

      Tu reçois la fiche du business, le plan du POC (ce qu'on voulait
      vérifier), le compte rendu chiffré du test avec son verdict, ses
      campagnes, les réponses des prospects et leurs demandes sur le
      produit.

      Écris le bilan en quelques lignes, sans rien inventer :
      - ce qui a plu, avec les mots des prospects quand ils en ont ;
      - ce qui a bloqué : les objections, les refus, les silences ;
      - les prospects qui ont le mieux répondu (leur métier, la taille de
        leur entreprise, leur région), et ceux qui n'ont pas répondu ;
      - ce qu'il faudrait changer au produit ou au message.
      Si presque personne n'a répondu, dis-le simplement : un bilan court
      vaut mieux qu'un bilan inventé.
    tools:
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: plan_valide_du_poc
        mode: given
        label: Le plan du POC
        params:
          venture_id: {source: task, value: venture_id}
      - tool: compte_rendu_du_test
        mode: given
        label: Le compte rendu chiffré
        params:
          venture_id: {source: task, value: venture_id}
      - tool: campagnes_du_business
        mode: given
        label: Ses campagnes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: reponses_des_prospects
        mode: given
        label: Les réponses des prospects
        max_rows: 100
        params:
          venture_id: {source: task, value: venture_id}
      - tool: demandes_des_clients
        mode: given
        label: Leurs demandes sur le produit
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: bilan, type: text, description: 'Le bilan du test, en quelques lignes.'}
    writes:
      - table: test_reports
        operation: update
        key: {column: id, source: task, value: report_id}
        values:
          summary: {source: field, value: bilan}

  - id: conclure_test
    title: Conclure le test
    role: >-
      Le test est mesuré et son bilan écrit : le business retenu passe à
      « test fini », avec la date ; l'autre est arrêté, et libère sa place
      de test. Sans LLM.
    step: prospection_light
    type: capability
    capability: echo
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
      verdict: {source: task, value: verdict}
    writes:
      - table: ventures
        operation: update
        condition: {field: verdict, op: '=', value: retenu}
        key: {column: id, source: task, value: venture_id}
        values:
          lifecycle: {source: fixed, value: SMOKE_DONE}
          smoke_ended_at: {source: now}
      - table: ventures
        operation: update
        condition: {field: verdict, op: '!=', value: retenu}
        key: {column: id, source: task, value: venture_id}
        values:
          lifecycle: {source: fixed, value: KILLED}
          smoke_ended_at: {source: now}

  - id: tirer_lecon
    title: Tirer la leçon d'un business arrêté
    role: >-
      Un business vient d'être arrêté : écrit une ou deux leçons, au statut
      « proposée », que Julien garde ou jette sur la page Mémoire (Q46).
    step: prospection_light
    type: llm
    model_tier: mid
    queue: works
    priority: 10
    gets_serge_intro: true
    max_tool_turns: 4
    prompt: |
      Un business de Serge vient d'être arrêté. Tu en tires une ou deux
      leçons, pour que Serge ne refasse pas la même erreur.

      Tu reçois la fiche du business, ses plans, le compte rendu de son
      test s'il en a eu un, et les réponses de ses prospects.

      Une leçon est une phrase courte, concrète et vérifiable, utile au
      prochain business : « Les artisans ne répondent pas aux e-mails le
      lundi », pas « mieux cibler ». Dis d'où elle vient (le chiffre, la
      réponse d'un prospect). Si rien ne permet de conclure (un test sans
      réponse, un arrêt décidé par un humain sans raison donnée), ne rends
      aucune leçon.
    tools:
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: plan_valide_du_poc
        mode: given
        label: Le plan du POC
        params:
          venture_id: {source: task, value: venture_id}
      - tool: compte_rendu_du_test
        mode: given
        label: Le compte rendu de son test
        params:
          venture_id: {source: task, value: venture_id}
      - tool: reponses_des_prospects
        mode: given
        label: Les réponses des prospects
        max_rows: 100
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: lecons, type: list, required: false, max_items: 2, description: 'Les leçons, deux au plus.'}
      - {path: lecons.lecon, type: text, description: 'La leçon, en une phrase, avec d''où elle vient.'}
    writes:
      - table: lessons
        operation: insert
        for_each: lecons
        values:
          statement: {source: field, value: lecons.lecon}
          scope: {source: fixed, value: global}
          status: {source: fixed, value: candidate}
          created_by: {source: fixed, value: tirer_lecon}

  - id: prevenir_prospection
    title: Prévenir d'une étape de la prospection
    role: >-
      Un ticket d'information prévient Julien et Clem : une campagne n'a
      pas pu démarrer, la prospection lourde est lancée, une première
      vente est arrivée. Sans LLM.
    step: prospection_light
    type: capability
    capability: inform_owners
    queue: conversations
    priority: 80
    params:
      title: {source: task, value: titre}
      text: {source: task, value: raison}

  # L'étape 4 (lot 12) : choisir le business principal.
  - id: choisir_principal
    title: Choisir le business principal
    role: >-
      Quand plus aucun test léger ne tourne et que la place lourde est
      libre, compare les business dont le test est retenu (et ceux mis de
      côté depuis moins de 60 jours) et propose le principal, ou aucun,
      avec une phrase par business. Julien valide par ticket.
    step: choix_venture
    type: llm
    model_tier: smart
    queue: works
    priority: 30
    gets_serge_intro: true
    max_tool_turns: 4
    prompt: |
      Tu proposes le business principal de Serge : celui dont il va
      construire le vrai produit, payant, puis le vendre en masse. Un seul
      à la fois.

      Tu reçois les business qui attendent (leur test léger est retenu, ou
      ils ont été mis de côté par un choix précédent), le compte rendu
      chiffré et le bilan de chaque test, et les réponses de leurs
      prospects.

      Tes critères, dans l'ordre :
      1. les points par euro dépensé ;
      2. les points ;
      3. la facilité de vendre le produit fini : des prospects qui ont dit
         ce qu'ils paieraient, un produit simple à construire et à
         expliquer.

      Propose un business, par son numéro, ou aucun (laisse alors le champ
      vide) si aucun ne mérite d'y passer des semaines. Écris une phrase
      par business comparé : pourquoi lui, ou pourquoi pas. N'invente
      jamais un numéro.
    tools:
      - tool: business_retenus
        mode: given
        label: Les business qui attendent
      - tool: comptes_rendus_des_retenus
        mode: given
        label: Les comptes rendus de leurs tests
      - tool: reponses_des_prospects
        mode: callable
        max_calls: 6
    output:
      - {path: business, type: text, required: false, description: 'Le numéro du business proposé, ou vide pour aucun.'}
      - {path: notes, type: text, description: 'Une phrase par business comparé.'}
    writes:
      - table: principal_choices
        operation: insert
        values:
          proposed_venture_id: {source: field, value: business}
          notes: {source: field, value: notes}
          status: {source: fixed, value: PROPOSED}

  - id: demander_choix_principal
    title: Faire valider le choix du principal
    role: >-
      Ouvre le ticket « Choix du principal » : la proposition de Serge, et
      pour chaque business ses chiffres et son bilan. Sans réponse sous 48
      heures, la proposition s'applique (Q16 bis). Sans LLM.
    step: choix_venture
    type: capability
    capability: ask_owners
    queue: conversations
    priority: 80
    params:
      ticket_type: {source: fixed, value: CHOIX_PRINCIPAL}
      ref_table: {source: fixed, value: principal_choices}
      ref_id: {source: task, value: choice_id}
      raison: {source: task, value: raison}
      title: {source: fixed, value: Le choix du business principal attend ton avis}

  - id: appliquer_choix_principal
    title: Appliquer le choix du principal
    role: >-
      La réponse au ticket « Choix du principal » : le business choisi
      entre en construction de son produit fini ; les autres tests retenus
      sont mis de côté. Avec « Aucun », tous sont mis de côté. Un nom qui
      ne désigne aucun business du ticket rouvre le ticket. Sans LLM.
    step: choix_venture
    type: capability
    capability: apply_principal
    queue: conversations
    priority: 80
    params:
      choice_id: {source: task, value: choice_id}
      acte: {source: task, value: acte}
      texte: {source: task, value: texte}
    writes:
      - table: ventures
        operation: update
        condition: {field: chosen, op: non_vide}
        key: {column: id, source: field, value: chosen}
        values:
          lifecycle: {source: fixed, value: PRODUCT_BUILDING}
      - table: ventures
        operation: update
        for_each: parked
        key: {column: id, source: field, value: parked}
        values:
          lifecycle: {source: fixed, value: PARKED}
      - table: principal_choices
        operation: update
        condition: {field: ok, op: '=', value: oui}
        key: {column: id, source: task, value: choice_id}
        values:
          status: {source: fixed, value: DECIDED}
          decision: {source: field, value: decision}
          chosen_venture_id: {source: field, value: chosen}

  - id: oublier_vieux_tests
    title: Oublier les vieux tests
    role: >-
      Un business mis de côté dont le test a fini il y a plus de 60 jours
      redevient candidat : l'étape 1 peut le choisir de nouveau (Q44).
      Sans LLM.
    step: choix_venture
    type: capability
    capability: db_read
    queue: works
    priority: 5
    settings:
      jours_max: {value: 60, min: 1, max: 365, policy: true, description: "L'âge maximum d'un business mis de côté, en jours, après la fin de son test."}
    params:
      tool_id: {source: fixed, value: business_mis_de_cote_anciens}
      jours: {source: setting, value: jours_max}
    writes:
      - table: ventures
        operation: update
        for_each: rows
        key: {column: id, source: field, value: rows.id}
        values:
          lifecycle: {source: fixed, value: CANDIDATE}

  # L'étape 6 (lot 12) : vendre en masse le produit fini, tel qu'il est
  # sorti de la construction (Q93).
  - id: preparer_prospection_lourde
    title: Préparer la prospection lourde
    role: >-
      Le produit fini est en vente : écrit une campagne lourde par canal,
      avec la cible précise, affinée par ce que le test a appris, et
      l'angle des messages. Les volumes sont les réglages de chaque canal.
    step: prospection_lourde
    type: llm
    model_tier: smart
    queue: works
    priority: 30
    gets_serge_intro: true
    max_tool_turns: 4
    compare:
      campaigns: false
    prompt: |
      Le produit fini d'un business est en vente. Tu prépares sa
      prospection lourde : Serge va le vendre en masse, tel qu'il est, à
      de nouveaux prospects.

      Tu reçois la fiche du business, la fiche produit (avec son prix), le
      plan du produit, le compte rendu et le bilan de son test léger, les
      campagnes de ce test, et les canaux branchés sur ce serveur.

      Écris une campagne par canal utile, parmi les canaux branchés ; un
      canal qui n'a rien donné pendant le test peut être laissé de côté.
      Pour chacune :
      - canal : le numéro du canal, tel qu'il est dans la liste ;
      - cible : les prospects visés, précisément : les métiers, les
        tailles d'entreprise et les régions qui ont le mieux répondu
        pendant le test ; sans réponse au test, reprends la cible du
        plan ;
      - angle : ce que les messages doivent mettre en avant, d'après ce
        qui a plu et ce qui a bloqué.
      Tu ne fixes ni le nombre de prospects ni le prix : ils sont réglés
      ailleurs. Ton compte rendu dit, en deux phrases, ce que tu as
      décidé et pourquoi.
    tools:
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: plan_valide_du_produit
        mode: given
        label: Le plan du produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: compte_rendu_du_test
        mode: given
        label: Le compte rendu et le bilan du test
        params:
          venture_id: {source: task, value: venture_id}
      - tool: campagnes_du_business
        mode: given
        label: Les campagnes du test
        params:
          venture_id: {source: task, value: venture_id}
      - tool: canaux_branches
        mode: given
        label: Les canaux branchés
    output:
      - {path: campagnes, type: list, min_items: 1, description: 'Les campagnes lourdes, une par canal.'}
      - {path: campagnes.canal, type: text, description: Le numéro du canal.}
      - {path: campagnes.cible, type: text, description: 'Les prospects visés, précisément.'}
      - {path: campagnes.angle, type: text, description: Ce que les messages mettent en avant.}
      - {path: compte_rendu, type: text, description: 'Ce que tu as décidé et pourquoi, en deux phrases.'}
    writes:
      - table: campaigns
        operation: insert
        for_each: campagnes
        values:
          venture_id: {source: task, value: venture_id}
          phase: {source: fixed, value: full}
          channel: {source: field, value: campagnes.canal}
          target: {source: field, value: campagnes.cible}
          angle: {source: field, value: campagnes.angle}
          state: {source: fixed, value: READY}

  - id: prevenir_interesses
    title: Prévenir les intéressés du test
    role: >-
      Chaque contact du test qui avait dit « intéressé » ou « rendez-vous »
      reçoit un premier message à rédiger : il apprend le premier que le
      produit existe, avec son lien. Sans LLM.
    step: prospection_lourde
    type: capability
    capability: db_read
    queue: works
    priority: 30
    params:
      tool_id: {source: fixed, value: interesses_du_test}
      venture_id: {source: task, value: venture_id}
    writes:
      - table: touches
        operation: insert
        for_each: rows
        values:
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          channel: {source: field, value: rows.channel}
          address: {source: field, value: rows.address}
          kind: {source: fixed, value: first}
          status: {source: fixed, value: to_write}

  - id: enregistrer_vente
    title: Enregistrer une vente
    role: >-
      Un paiement est arrivé : le contact de ce business qui a l'e-mail du
      payeur passe à « client », et ne reçoit plus de relance. Un acheteur
      inconnu devient un contact entrant. La première vente d'un business
      ouvre un ticket d'information. Sans LLM.
    step: prospection_lourde
    type: capability
    capability: record_sale
    queue: conversations
    priority: 60
    params:
      transaction_id: {source: task, value: transaction_id}

  # L'essai total (lot 12, décision Q99) : un seul essai, de bout en bout,
  # qui suit le vrai pipeline dans le couloir d'essai. Ces invocations ne
  # font que poser l'état de départ : le business « Calculatrice », son
  # contact, puis, selon l'étape de départ, ce que les étapes d'avant
  # auraient laissé. Tout le reste est le vrai pipeline.
  - id: lancer_essai_total
    title: Lancer l'essai total
    role: >-
      Crée le business d'essai « Calculatrice ». Lancée par le bouton de la
      page Système, dans le couloir d'essai : tout ce que l'essai écrit
      est marqué, et rien du vrai pipeline n'est touché. Sans LLM.
    type: capability
    capability: echo
    queue: works
    priority: 30
    params:
      depart: {source: task, value: depart}
    writes:
      - table: ventures
        operation: insert
        dedup: false
        values:
          name: {source: fixed, value: Calculatrice}
          description: {source: fixed, value: "Une calculatrice en ligne, simple et lisible, sur ordinateur comme sur mobile."}
          sellable_offer: {source: fixed, value: "Gratuite pendant l'essai."}
          family: {source: fixed, value: autre}
          lifecycle: {source: fixed, value: CANDIDATE}
          validate_drafts: {source: task, value: valider}

  - id: creer_contact_essai_total
    title: Créer le contact de l'essai total
    role: >-
      Crée la fiche de la personne qui essaie, avec les coordonnées tapées
      au lancement et son accord pour l'appel de test (à toute heure,
      décision Q79). C'est à elle, et à elle seule, que l'essai écrira et
      téléphonera. Puis l'essai part de l'étape demandée. Sans LLM.
    type: capability
    capability: add_contact
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
      name: {source: task, value: name}
      email: {source: task, value: email}
      phone: {source: task, value: phone}
      call_consent: {source: fixed, value: test}

  - id: essai_depart_poc
    title: "Essai total : partir de l'étape 2"
    role: >-
      La calculatrice de l'essai est choisie pour un POC, comme par
      « Choisir les business ». Sans LLM.
    type: capability
    capability: echo
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
    writes:
      - table: ventures
        operation: update
        key: {column: id, source: task, value: venture_id}
        values:
          lifecycle: {source: fixed, value: POC_SELECTED}
          choice_reason: {source: fixed, value: "Essai total : départ à l'étape 2."}

  - id: essai_plan_poc
    title: "Essai total : le plan tout fait du POC"
    role: >-
      Dans l'essai total, le plan du POC de la calculatrice est tout fait
      (on sait à quoi s'attendre, et on dépense peu) : sa fiche produit,
      ses questions fréquentes, ses deux campagnes de test (un e-mail, un
      appel) et son plan, qui part au ticket « Plan ». Sans LLM.
    type: capability
    capability: echo
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
    writes:
      - table: product_plans
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          kind: {source: fixed, value: poc}
          round: {source: fixed, value: '1'}
          status: {source: fixed, value: challenged}
          channel: {source: fixed, value: email}
          hypothesis: {source: fixed, value: "Des visiteurs veulent une calculatrice en ligne simple, qui marche aussi bien au doigt qu'au clavier."}
          target: {source: fixed, value: "Tout le monde ; c'est l'essai total de Serge."}
          duration_days: {source: fixed, value: "10"}
          price: {source: fixed, value: "Gratuite."}
          deliverable: {source: fixed, value: "Une calculatrice en ligne : les quatre opérations, les nombres à virgule, l'effacement."}
          plan: {source: fixed, value: "Une seule page, en français. En haut, l'écran : il affiche le calcul en cours et le résultat, avec une virgule décimale (3,5) ; 0 au départ. Dessous, le pavé : les chiffres 0 à 9, la virgule, les quatre opérations (+, −, ×, ÷), « = », « C » (tout effacer) et « ← » (effacer le dernier chiffre). Le clavier marche aussi : chiffres, + - * /, la virgule ou le point, Entrée pour « = », Échap pour « C », Retour arrière pour « ← ». Les calculs se font dans l'ordre où on les tape (12 + 7 × 2 = 38, comme une calculatrice de poche). Une division par zéro affiche « Erreur » jusqu'à « C ». Les résultats sont arrondis à 10 chiffres significatifs, pour que 0,1 + 0,2 donne 0,3. Sur mobile, tout le pavé tient dans l'écran sans défiler, avec des boutons d'au moins 48 pixels. Aucun compte, aucune donnée gardée, aucun service extérieur."}
          scenarios: {source: fixed, value: "1. Ouvrir la page : l'écran affiche 0 et tout le pavé est visible. 2. Taper 12 + 7 = avec les boutons : l'écran affiche 19. 3. Taper 7 ÷ 2 = : l'écran affiche 3,5. 4. Taper 5 ÷ 0 = : l'écran affiche Erreur ; appuyer sur C : l'écran affiche 0. 5. Taper 0,1 + 0,2 = : l'écran affiche 0,3. 6. Taper 123 puis ← : l'écran affiche 12. 7. Au clavier, taper 9*9 puis Entrée : l'écran affiche 81. 8. Sur mobile, refaire le scénario 2 au doigt : tout le pavé tient dans l'écran, sans défiler."}
          challenge: {source: fixed, value: "Plan tout fait de l'essai total : pas de critique."}
      - table: product_sheets
        operation: delete
        key: {column: venture_id, source: task, value: venture_id}
      - table: product_sheets
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          summary: {source: fixed, value: "Une calculatrice en ligne pour les quatre opérations, lisible sur ordinateur et sur mobile, sans compte."}
          limits: {source: fixed, value: "Pas de fonctions scientifiques, pas d'historique des calculs."}
          price: {source: fixed, value: "Gratuite."}
          delays: {source: fixed, value: "Tout de suite : on ouvre la page et on calcule."}
          usage: {source: fixed, value: "On tape le calcul avec les boutons ou le clavier, puis « = »."}
      - table: product_faq
        operation: delete
        key: {column: venture_id, source: task, value: venture_id}
      - table: product_faq
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          question: {source: fixed, value: "Faut-il créer un compte ?"}
          answer: {source: fixed, value: "Non : on ouvre la page et on calcule."}
      - table: product_faq
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          question: {source: fixed, value: "Que se passe-t-il si je divise par zéro ?"}
          answer: {source: fixed, value: "L'écran affiche « Erreur » ; la touche C remet à zéro."}
      - table: campaigns
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          phase: {source: fixed, value: smoke}
          channel: {source: fixed, value: email}
          state: {source: fixed, value: DRAFT}
      - table: campaigns
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          phase: {source: fixed, value: smoke}
          channel: {source: fixed, value: voice}
          state: {source: fixed, value: DRAFT}

  - id: essai_depart_test_leger
    title: "Essai total : partir de l'étape 3"
    role: >-
      Pose l'état d'où part le test léger : la calculatrice a son plan

    from: preparer_reponse_attente
    to: envoyer_message
    mode: per_row
    write: 0
    params:
      touch_id: {source: row, value: id}
  - id: relance_a_rediger
    title: Chaque relance à faire est rédigée
    from: preparer_relances
    to: ecrire_relance
    mode: per_row
    write: 0
    params:
      touch_id: {source: row, value: id}
      contact_id: {source: row, value: contact_id}
      venture_id: {source: row, value: venture_id}
  - id: relance_vers_envoi
    title: La relance rédigée part
    from: ecrire_relance
    to: envoyer_message
    params:
      touch_id: {source: task, value: touch_id}
  - id: essai_vers_contact
    title: Le business d'essai reçoit son contact
    from: lancer_essai
    to: creer_contact_essai
    mode: per_row
    write: 1
    params:
      venture_id: {source: row, value: id}
      name: {source: task, value: name}
      email: {source: task, value: email}
      phone: {source: task, value: phone}
  - id: contact_essai_vers_message
    title: Le premier e-mail est rédigé
    from: creer_contact_essai
    to: ecrire_premier_message
    mode: per_row
    write: 0
    params:
      touch_id: {source: row, value: id}
      contact_id: {source: row, value: contact_id}
      venture_id: {source: row, value: venture_id}
  - id: contact_essai_vers_appel
    title: Le premier appel est préparé
    from: creer_contact_essai
    to: preparer_premier_appel
    mode: per_row
    write: 1
    params:
      touch_id: {source: row, value: id}
      contact_id: {source: row, value: contact_id}
      venture_id: {source: row, value: venture_id}
  - id: premier_message_vers_envoi
    title: Le premier e-mail part
    from: ecrire_premier_message
    to: envoyer_message
    params:
      touch_id: {source: task, value: touch_id}
  - id: premier_appel_vers_envoi
    title: Le premier appel part
    from: preparer_premier_appel
    to: envoyer_message
    params:
      touch_id: {source: task, value: touch_id}

  # --- L'étape 2 : du choix d'un business à son test léger (lot 10, Q91) ---
  - id: choix_vers_conception_poc
    title: Un business choisi pour un POC part en conception
    from: choisir_business
    to: concevoir_poc
    mode: per_row
    write: 0
    condition: {field: lifecycle, op: '=', value: POC_SELECTED}
    params:
      venture_id: {source: row, value: id}
      tour: {source: fixed, value: '1'}
  - id: essai_vers_choix_etape2
    title: Le business de l'essai est choisi pour un POC
    from: creer_business_essai
    to: choisir_business_essai
    mode: per_row
    write: 0
    params:
      venture_id: {source: row, value: id}
  - id: essai_choisi_vers_conception
    title: Le business de l'essai part en conception
    from: choisir_business_essai
    to: concevoir_poc
    mode: per_row
    write: 0
    condition: {field: lifecycle, op: '=', value: POC_SELECTED}
    params:
      venture_id: {source: row, value: id}
      tour: {source: fixed, value: '1'}
  - id: bout_en_bout_poc_vers_construction
    title: "Bout en bout : la calculatrice part en construction"
    from: bout_en_bout_poc
    to: construire_poc
    mode: per_row
    write: 0
    params:
      venture_id: {source: row, value: id}
      passage: {source: fixed, value: '1'}
      reprise: {source: fixed, value: '1'}
  - id: plan_vers_critique
    title: Le plan part à la critique
    from: concevoir_poc
    to: challenger_poc
    mode: per_row
    write: 0
    params:
      plan_id: {source: row, value: id}
      venture_id: {source: row, value: venture_id}
      tour: {source: task, value: tour}
  - id: critique_a_corriger_vers_compte
    title: Un plan à corriger
    from: challenger_poc
    to: compter_tours_plan
    condition: {field: verdict, op: '=', value: a_corriger}
    params:
      venture_id: {source: task, value: venture_id}
      plan_id: {source: task, value: plan_id}
      tour: {source: task, value: tour}
  - id: critique_bonne_vers_ticket
    title: Un plan bon part au ticket « Plan »
    from: challenger_poc
    to: demander_validation_plan
    condition: {field: verdict, op: '=', value: bon}
    params:
      plan_id: {source: task, value: plan_id}
  - id: tours_restants_vers_conception
    title: Il reste des tours de critique
    from: compter_tours_plan
    to: concevoir_poc
    condition: {field: suite, op: '=', value: encore}
    params:
      venture_id: {source: task, value: venture_id}
      tour: {source: field, value: tour_suivant}
      plan_precedent: {source: task, value: plan_id}
  - id: tours_finis_vers_ticket
    title: Plus de tours de critique
    from: compter_tours_plan
    to: demander_validation_plan
    condition: {field: suite, op: '=', value: fini}
    params:
      plan_id: {source: task, value: plan_id}
  - id: plan_valide_vers_construction
    title: Le plan validé part en construction
    from: suite_plan_poc
    to: construire_poc
    condition: {field: acte, op: '=', value: valider}
    params:
      venture_id: {source: task, value: venture_id}
      passage: {source: fixed, value: '1'}
      reprise: {source: fixed, value: '1'}
  - id: plan_a_corriger_vers_conception
    title: Le plan est à corriger d'après un humain
    from: suite_plan_poc
    to: concevoir_poc
    condition: {field: acte, op: '=', value: a_corriger}
    params:
      venture_id: {source: task, value: venture_id}
      tour: {source: fixed, value: '1'}
      plan_precedent: {source: task, value: plan_id}
      consignes: {source: task, value: texte}
  - id: construction_finie_vers_staging
    title: Le POC construit part en staging
    from: construire_poc
    to: publier_staging_poc
    mode: per_row
    write: 0
    params:
      venture_id: {source: row, value: venture_id}
      build_id: {source: row, value: id}
      passage: {source: task, value: passage}
      reprise: {source: task, value: reprise}
  - id: construction_pas_finie_vers_reprise
    title: Une construction pas finie reprend
    from: construire_poc
    to: compter_reprises
    mode: per_row
    write: 1
    params:
      venture_id: {source: row, value: venture_id}
      build_id: {source: row, value: id}
      passage: {source: task, value: passage}
      reprise: {source: task, value: reprise}
  - id: reprise_vers_construction
    title: La construction reprend, dans le même passage
    from: compter_reprises
    to: construire_poc
    condition: {field: suite, op: '=', value: encore}
    params:
      venture_id: {source: task, value: venture_id}
      passage: {source: task, value: passage}
      reprise: {source: field, value: tour_suivant}
      probleme: {source: task, value: probleme}
      journal: {source: task, value: journal}
  - id: reprises_finies_vers_test
    title: "Plus de reprises : un humain essaie ce qu'il y a"
    from: compter_reprises
    to: demander_test_poc
    condition: {field: suite, op: '=', value: fini}
    params:
      build_id: {source: task, value: build_id}
  - id: staging_vers_relecture
    title: Le POC en staging part à la relecture
    from: publier_staging_poc
    to: relire_poc
    condition: {field: ok, op: '=', value: 'True'}
    params:
      venture_id: {source: task, value: venture_id}
      build_id: {source: task, value: build_id}
      passage: {source: task, value: passage}
      url: {source: field, value: url}
  - id: staging_rate_vers_reprise
    title: Une publication ratée repart à la construction
    from: publier_staging_poc
    to: compter_reprises
    condition: {field: ok, op: '!=', value: 'True'}
    params:
      venture_id: {source: task, value: venture_id}
      build_id: {source: task, value: build_id}
      passage: {source: task, value: passage}
      reprise: {source: task, value: reprise}
      probleme: {source: field, value: detail}
      journal: {source: field, value: log}
  - id: relecture_bonne_vers_test
    title: Le relecteur trouve le POC bon
    from: relire_poc
    to: demander_test_poc
    condition: {field: verdict, op: '=', value: bon}
    params:
      build_id: {source: task, value: build_id}
  - id: relecture_a_corriger_vers_compte
    title: Le relecteur trouve à corriger
    from: relire_poc
    to: compter_passages
    condition: {field: verdict, op: '=', value: a_corriger}
    params:
      venture_id: {source: task, value: venture_id}
      build_id: {source: task, value: build_id}
      passage: {source: task, value: passage}
  - id: passages_restants_vers_construction
    title: Un nouveau passage de construction
    from: compter_passages
    to: construire_poc
    condition: {field: suite, op: '=', value: encore}
    params:
      venture_id: {source: task, value: venture_id}
      passage: {source: field, value: tour_suivant}
      reprise: {source: fixed, value: '1'}
  - id: passages_finis_vers_test
    title: "Plus de passages : un humain essaie ce qu'il y a"
    from: compter_passages
    to: demander_test_poc
    condition: {field: suite, op: '=', value: fini}
    params:
      build_id: {source: task, value: build_id}
  - id: test_valide_vers_prod
    title: Le POC essayé et validé passe en prod
    from: suite_test_poc
    to: publier_prod_poc
    condition: {field: acte, op: '=', value: valider}
    params:
      venture_id: {source: task, value: venture_id}
  - id: test_a_corriger_vers_construction
    title: Le POC est à corriger d'après un humain
    from: suite_test_poc
    to: construire_poc
    condition: {field: acte, op: '=', value: a_corriger}
    params:
      venture_id: {source: task, value: venture_id}
      passage: {source: fixed, value: '1'}
      reprise: {source: fixed, value: '1'}
      consignes: {source: task, value: texte}
  - id: prod_vers_test_leger
    title: Le POC en prod est prêt pour le test léger
    from: publier_prod_poc
    to: poc_pret
    condition: {field: ok, op: '=', value: 'True'}
    params:
      venture_id: {source: task, value: venture_id}
  - id: prod_ratee_vers_ticket
    title: Une mise en prod ratée
    from: publier_prod_poc
    to: prevenir_prod_ratee
    condition: {field: ok, op: '!=', value: 'True'}
    params:
      raison: {source: field, value: detail}

triggers:
  - id: lancer_cycle
    title: Lancer un cycle d'écoute
    invocation: ouvrir_cycle
    event: button
    only_if_room_in: [places_de_test, cycles_ouverts]
    params:
      guide: {source: form, value: guide}
  - id: bouton_abandonner_cycle
    title: Abandonner le cycle en cours
    invocation: abandonner_cycle
    event: button
    confirm: >-
      Le cycle ouvert est fermé et ses tâches en attente sont annulées ;
      sa chaîne s'arrête après la tâche en cours. On peut alors en lancer
      un autre.
  - id: bouton_effacer_idees
    title: Effacer les idées (test)
    invocation: effacer_idees
    event: button
    confirm: >-
      Tous les business encore candidats ou choisis, et leurs preuves, sont
      détruits. Les pages restent. Bouton temporaire, pour tester.
  - id: veille_flux
    title: Lire chaque flux RSS suivi
    invocation: lire_un_flux
    event: every
    every_minutes: 360
    table: listen_feeds
    filter_column: active
    filter_value: '1'
    params:
      url: {source: row, value: url}
      feed_id: {source: row, value: id}
  - id: oubli_quotidien_pages
    title: Oublier les vieilles pages, chaque jour
    invocation: oublier_pages
    event: every
    every_minutes: 1440
  - id: oubli_quotidien_besoins
    title: Oublier les besoins jamais utilisés, chaque jour
    invocation: oublier_besoins
    event: every
    every_minutes: 1440
  - id: releve_des_canaux
    title: Relever chaque canal qui se relève
    invocation: relever_messages
    event: every
    every_minutes: 2
    table: canaux
    filter_column: polls
    filter_value: '1'
    params:
      channel: {source: row, value: id}
  - id: message_recu
    title: Un contact a écrit
    invocation: traiter_reponse
    event: row_written
    table: inbound_events
    filter_column: status
    filter_value: attached
    params:
      inbound_id: {source: row, value: id}
      contact_id: {source: row, value: contact_id}
      venture_id: {source: row, value: venture_id}
      channel: {source: row, value: channel}
      address: {source: row, value: address}
      subject: {source: row, value: subject}
  - id: envoi_attend_julien
    title: Un envoi attend un humain
    invocation: demander_julien
    event: row_written
    table: touches
    filter_column: status
    filter_value: waiting_owner
    params:
      touch_id: {source: row, value: id}
      raison: {source: row, value: last_error}
      question: {source: row, value: owner_question}
      version: {source: row, value: updated_at}
  - id: julien_envoie_le_brouillon
    title: « Envoyer le brouillon »
    invocation: valider_envoi
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: envoyer_brouillon
    params:
      touch_id: {source: row, value: ref_id}
  - id: julien_donne_sa_reponse
    title: « Ma réponse »
    invocation: envoyer_reponse_de_julien
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: ma_reponse
    params:
      touch_id: {source: row, value: ref_id}
      texte: {source: row, value: text}
      objet: &param_objet_de_julien {source: row, value: subject}
  - id: reponse_de_julien_en_question_frequente
    title: « Ma réponse » à une question sur le produit
    invocation: ajouter_question_frequente
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: ma_reponse
    params:
      venture_id: {source: row, value: venture_id}
      question: {source: row, value: question}
      texte: {source: row, value: text}
  - id: julien_demande_de_reecrire
    title: « Réécrire »
    invocation: reecrire_brouillon
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: reecrire
    params:
      touch_id: {source: row, value: ref_id}
      consignes: {source: row, value: text}
      contact_id: {source: row, value: contact_id}
      venture_id: {source: row, value: venture_id}
  - id: julien_n_envoie_rien
    title: « Ne rien envoyer »
    invocation: annuler_envoi
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: ne_rien_envoyer
    params:
      touch_id: {source: row, value: ref_id}
  - id: personne_n_a_repondu
    title: Le ticket d'une conversation a expiré
    invocation: preparer_reponse_attente
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: reponse_attente
    params:
      touch_id: {source: row, value: ref_id}
  - id: feu_vert_d_un_passage
    title: « Passer à la suite » sur un ticket
    invocation: passer_la_main
    event: row_written
    table: ticket_answers
    filter_column: acte
    filter_value: passer
    params:
      passage: {source: row, value: ref_id}
  - id: relances_regulieres
    title: Chercher les relances à faire
    invocation: preparer_relances
    event: every
    every_minutes: 15
  - id: bouton_lancer_essai
    title: Lancer un essai
    invocation: lancer_essai
    event: button
    confirm: >-
      Serge crée un business bidon (il remplace le précédent), puis écrit à
      cette adresse et appelle ce numéro pour lui présenter le business.
      L'appel part à toute heure : c'est un essai. Les coordonnées restent
      en base.
    params:
      name: {source: form, value: nom}
      email: {source: form, value: e-mail}
      phone: {source: form, value: 'téléphone (+33…)'}
      valider: &case_essai_valider {source: form_case, value: Valider chaque brouillon}

  - id: bouton_essayer_chantier
    title: Essayer le chantier
    invocation: essayer_chantier
    event: button
    confirm: >-
      Serge ouvre le chantier d'essai (un conteneur sur le serveur) et y
      fait la mission, avec le modèle du niveau intelligent. Le compte
      rendu est sur la fiche de la tâche.
    params:
      mission: {source: form, value: mission}

  - id: bouton_essayer_navigateur
    title: Essayer l'interface web
    invocation: essayer_navigateur
    event: button
    confirm: >-
      Serge ouvre l'adresse dans son navigateur (un conteneur sur le
      serveur) et y fait la mission comme une personne, avec le modèle du
      niveau « code ». Le compte rendu et les captures sont sur la fiche de
      la tâche.
    params:
      adresse: {source: form, value: adresse}
      mission: {source: form, value: mission}

  - id: bouton_publier_essai
    title: Publier le chantier d'essai
    invocation: publier_essai
    event: button
    confirm: >-
      Serge fige le chantier d'essai, construit son image (il lui faut un
      Dockerfile qui écoute sur le port de la variable PORT) et le met en
      ligne en staging (staging-essai.<domaine>, non indexé) ; avec
      « prod », il passe la version du staging sur essai.<domaine>. Le
      résultat est dans l'îlot « Produits en ligne ».
    params:
      cible: {source: form, value: cible (staging ou prod)}

  - id: reponse_au_ticket_plan_poc
    title: Une réponse au ticket « Plan » d'un POC
    invocation: suite_plan_poc
    event: row_written
    table: ticket_answers
    filter_column: ticket_type
    filter_value: PLAN_POC
    params:
      acte: {source: row, value: acte}
      texte: {source: row, value: text}
      plan_id: {source: row, value: ref_id}
      venture_id: {source: row, value: venture_id}
  - id: reponse_au_ticket_test_poc
    title: Une réponse au ticket « Tester le produit » d'un POC
    invocation: suite_test_poc
    event: row_written
    table: ticket_answers
    filter_column: ticket_type
    filter_value: TEST_POC
    params:
      acte: {source: row, value: acte}
      texte: {source: row, value: text}
      build_id: {source: row, value: ref_id}
      venture_id: {source: row, value: venture_id}
  - id: bouton_essayer_etape2
    title: Essayer l'étape 2
    invocation: creer_business_essai
    event: button
    only_if_room_in: [places_de_test]
    confirm: >-
      Serge crée ce business, le choisit pour un POC (il prend une place de
      test) et lance l'étape 2 : concevoir, critiquer, puis le ticket
      « Plan ». Après ta validation, il construit le POC (niveau « code »),
      le relit, et ouvre le ticket « Tester le produit ». Compter quelques
      euros de modèles.
    params:
      nom: {source: form, value: nom}
      description: {source: form, value: description}
      offre: {source: form, value: offre}

  - id: bouton_bout_en_bout_poc
    title: "Bout en bout : le POC d'une calculatrice"
    invocation: bout_en_bout_poc
    event: button
    only_if_room_in: [places_de_test]
    confirm: >-
      Serge met en base un business « Calculatrice » avec sa fiche produit
      et un plan déjà validé (il prend une place de test), puis lance la
      vraie construction du POC : le constructeur code au niveau « code »,
      Serge publie en staging, le relecteur l'essaie dans son navigateur.
      Puis le ticket « Tester le produit » : ouvre le lien du staging et
      essaie la calculatrice ; « Valider » la met en prod. Compter quelques
      euros de modèles.

  # Les boutons de la fiche d'un business : leur formulaire attend le
  # business, que Mission Control remplit (lot 10, Q91).
  - id: bouton_essayer_stripe
    title: Essayer Stripe (mode test)
    invocation: essayer_stripe
    event: button
    confirm: >-
      Serge crée dans Stripe, en mode test (aucun argent réel), un produit,
      un prix de 1 € par mois et un lien de paiement pour ce business. Le
      lien est sur la fiche de la tâche ; « Supprimer de Stripe (mode
      test) » les archive ensuite.
    params:
      venture_id: {source: form, value: venture_id}
  - id: bouton_supprimer_stripe_test
    title: Supprimer de Stripe (mode test)
    invocation: supprimer_de_stripe
    event: button
    confirm: >-
      Serge archive dans Stripe, en mode test, les prix et les produits de
      ce business : ils ne pourront plus être payés.
    params:
      venture_id: {source: form, value: venture_id}
      service: {source: fixed, value: stripe_test}
  - id: bouton_supprimer_stripe_live
    title: Supprimer de Stripe (vrai mode)
    invocation: supprimer_de_stripe
    event: button
    confirm: >-
      Attention, vrai mode : Serge archive dans Stripe les prix et les
      produits de ce business. Plus personne ne pourra les payer ; les
      abonnements en cours ne sont pas résiliés.
    params:
      venture_id: {source: form, value: venture_id}
      service: {source: fixed, value: stripe_live}

# Les modifications d'objets déjà en base sur une instance existante (le
# fichier ne les écrase jamais) : chacune n'est appliquée qu'une fois, et
# seulement si la valeur en base est encore celle d'origine (`from`) ; une
# valeur changée dans Mission Control est gardée. Résultat : table
# pipeline_changes.
changes:
  - id: titre_qui_est_serge
    why: Les textes envoyés au modèle ont un titre et une aide (page Pipeline).
    table: serge_texts
    where: {id: presentation}
    set:
      title: {from: '', to: Qui est Serge}
      help:
        from: ''
        to: >-
          En tête du prompt des invocations qui le demandent, suivi de la
          chaîne des 8 étapes et de leur place, lues en base.
  - id: lot7_explorer_10_tours
    why: Moins de jetons renvoyés ; avec plusieurs outils par tour, 10 tours suffisent.
    table: invocations
    where: {id: explorer_web}
    set: {max_tool_turns: {from: 25, to: 10}}
  - id: lot7_formuler_a_5_tours
    why: Moins de jetons renvoyés ; les pages se lisent plusieurs à la fois.
    table: invocations
    where: {id: formuler_a}
    set: {max_tool_turns: {from: 10, to: 5}}
  - id: lot7_formuler_b_5_tours
    why: Moins de jetons renvoyés ; les pages se lisent plusieurs à la fois.
    table: invocations
    where: {id: formuler_b}
    set: {max_tool_turns: {from: 10, to: 5}}
  - id: lot7_formuler_a_pages_bornees
    why: Au plus 10 pages lues en entier par passage, même lues plusieurs à la fois.
    table: invocation_tools
    where: {invocation_id: formuler_a, tool_id: lire_page_entiere}

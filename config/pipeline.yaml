# --- Les conversations (lot 8, décision Q79) -------------------------------
# Un message reçu réveille « Traiter une réponse », qui écrit la réponse ;
# « Envoyer un message » la fait partir après le délai du canal. Les
# relances sont cherchées toutes les 15 minutes. Une désinscription bloque
# partout et prévient Julien et Clem. Détail : docs/LOT8_CONCEPTION.md.
  - id: relever_messages
    title: Relever les messages
    role: >-
      Lit les messages reçus sur un canal depuis sa dernière relève, les
      rattache à leur contact (par le fil, sinon par l'adresse) et les
      écrit dans les messages reçus. Sans LLM.
    type: capability
    capability: receive_messages
    queue: conversations
    priority: 80
    params:
      channel: {source: task, value: channel}
    writes:
      - table: inbound_events
        operation: insert
        for_each: rows
        values:
          channel: {source: task, value: channel}
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          native_type: {source: field, value: rows.native_type}
          address: {source: field, value: rows.address}
          subject: {source: field, value: rows.subject}
          body: {source: field, value: rows.body}
          message_ref: {source: field, value: rows.message_ref}
          external_ref: {source: field, value: rows.external_ref}
          status: {source: field, value: rows.status}
          received_at: {source: now}
      - table: canaux
        operation: update
        key: {column: id, source: task, value: channel}
        values:
          polled_at: {source: now}

  - id: traiter_reponse
    title: Traiter une réponse
    role: >-
      Lit le message d'un contact avec tout son fil, dit ce qu'il fait
      (question, refus, désinscription…), écrit la réponse de Serge et note
      les demandes sur le produit. Une seule tâche attend par contact :
      deux messages coup sur coup n'ont qu'une réponse.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 100
    gets_serge_intro: true
    max_tool_turns: 3
    single_pending: contact_id
    compare:
      inbound_events: false
      touches: false
      contacts: false
      customer_requests: false
    prompt: &consigne_traiter_reponse |
      Tu réponds, au nom de Serge, à un contact qui vient d'écrire à propos
      d'un business que Serge teste.

      Tu reçois le fil du contact (tout ce qui s'est dit, tous canaux
      confondus, du plus ancien au plus récent), sa fiche, la fiche du
      business, la fiche produit et ses questions fréquentes. Tu réponds au
      dernier message du fil ; si le contact a écrit plusieurs fois depuis
      la dernière réponse de Serge, réponds à tout d'un coup.

      Le dernier message peut être la transcription d'un appel (canal
      voice). La suite part alors par e-mail si Serge a son adresse, sinon
      Serge rappelle : écris-la comme un e-mail court qui reprend ce qui a
      été promis (un document, un devis), ou laisse-la vide s'il n'y a
      rien à ajouter après l'appel.

      Rends :
      - reaction : ce que fait le message, l'une de : intéressé, question,
        objection, rendez-vous, refus, désinscription, absence, hors sujet.
        « désinscription » : la personne demande à ne plus être contactée
        (« STOP », « ne m'écrivez plus »). « absence » : une réponse
        automatique (congés, absence).
      - reply : le texte de ta réponse, prêt à partir, sans objet ni
        signature d'humain. Laisse-le vide pour une désinscription, une
        absence ou un message hors sujet : Serge ne répond rien.
      - requests : les demandes sur le produit que contient le message, s'il
        y en a : un bug, une insatisfaction, une idée (une fonctionnalité
        qui manque).
      - besoin_julien : vide si tu peux répondre seul. Sinon, en une phrase,
        pourquoi un humain doit voir ta réponse avant qu'elle parte : une
        question sur le produit à laquelle la fiche produit et les
        questions fréquentes ne répondent pas, un prix, une date ou un
        engagement que tu ne peux pas prendre, une proposition faite à
        Serge (un partenariat, une offre), un échange tendu, ou un doute
        réel. Écris quand même ton meilleur brouillon dans reply : Julien
        l'enverra, le remplacera par sa réponse, ou te demandera de le
        réécrire.
      - question_produit : si le message pose une question sur le produit
        à laquelle la fiche produit ne répond pas, cette question en une
        phrase ; sinon vide. La réponse de Julien rejoindra les questions
        fréquentes, et la fois suivante tu répondras seul.
      - arreter : « oui » pour que Serge arrête avec ce contact, sinon
        « non ». Réponds « oui » quand la conversation ne mène nulle part :
        un robot qui répond à chaque message, un accusé de réception
        automatique (« votre demande n° 1234 est bien reçue »), une liste
        de diffusion, ou une conversation qui tourne en rond sans personne
        en face. Laisse alors reply vide : Serge ne lui écrira plus, et ce
        qu'il écrira ensuite ne sera plus traité.

      Règles :
      - Un refus : remercie poliment, sans insister.
      - Une demande de rendez-vous, d'appel ou de visioconférence : Serge
        ne téléphone pas pour l'instant. Ne la confirme pas et ne promets
        rien de tel : propose de tout régler par écrit, ici, et réponds
        tout de suite à ce que la personne voulait voir en rendez-vous. Si
        elle tient à parler à quelqu'un, remplis besoin_julien.
      - Si la personne demande d'où Serge tient son adresse : dis-le
        simplement (elle est publique, sa fiche dit où elle a été lue), et
        propose de ne plus lui écrire.
      - Si elle te renvoie vers quelqu'un d'autre (« voyez avec ma
        collègue »), remercie-la et remplis besoin_julien : écrire à une
        nouvelle personne ne se décide pas ici.
      - Une demande hors de ce que Serge vend (du sur-mesure, une
        intégration à son logiciel, une prestation sur place) : dis ce que
        le produit fait, ne promets pas le reste, note-la dans requests
        comme une « idée », et remplis besoin_julien si elle pèse dans sa
        décision.
      - Ne promets jamais une date, un prix ou une fonctionnalité absents de
        la fiche produit. Une fonctionnalité qui manque devient une demande
        « idée ». En cas de doute, réponds sans t'engager et remplis
        besoin_julien.
      - Écris dans la langue du contact, simplement et brièvement.
      - Serge assume d'être un agent IA : ne prétends jamais être un humain.
    tools:
      - tool: fil_du_contact
        mode: given
        label: Le fil du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_contact
        mode: given
        label: La fiche du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: reaction, type: choice, choices: [intéressé, question, objection, rendez-vous, refus, désinscription, absence, hors sujet], description: Ce que fait le message.}
      - {path: reply, type: text, description: 'Le texte de la réponse, ou vide pour ne rien répondre.'}
      - {path: requests, type: list, required: false, description: Les demandes sur le produit.}
      - {path: requests.kind, type: choice, choices: [bug, insatisfaction, idée], description: La sorte de demande.}
      - {path: requests.text, type: text, description: 'La demande, en une phrase.'}
      - &sortie_besoin_julien {path: besoin_julien, type: text, required: false, description: 'Vide si Serge répond seul ; sinon pourquoi un humain doit voir la réponse avant qu''elle parte.'}
      - &sortie_question_produit {path: question_produit, type: text, required: false, description: 'La question du contact sur le produit à laquelle la fiche ne répond pas, ou vide.'}
      - &sortie_arreter {path: arreter, type: choice, choices: [non, oui], required: false, description: '« oui » pour que Serge arrête avec ce contact : la conversation ne mène nulle part (un robot qui répond à chaque message, un accusé de réception automatique, une liste de diffusion). Sinon « non ».'}
    writes:
      - table: inbound_events
        operation: update
        key: {column: id, source: task, value: inbound_id}
        values:
          reaction: {source: field, value: reaction}
      - table: inbound_events
        operation: update
        key: {column: id, source: task, value: inbound_id}
        condition: {field: reaction, op: '=', value: absence}
        values:
          status: {source: fixed, value: ignored}
      - table: touches
        operation: insert
        condition: {field: reply, op: non_vide}
        values:
          contact_id: {source: task, value: contact_id}
          venture_id: {source: task, value: venture_id}
          channel: {source: task, value: channel}
          address: {source: task, value: address}
          subject: {source: task, value: subject}
          body: {source: field, value: reply}
          kind: {source: fixed, value: reply}
          status: {source: fixed, value: pending}
          reply_to: {source: task, value: inbound_id}
          needs_owner: &valeur_besoin_julien {source: field, value: besoin_julien}
          owner_question: &valeur_question_produit {source: field, value: question_produit}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: question}
        values:
          funnel_state: {source: fixed, value: ENGAGED}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: objection}
        values:
          funnel_state: {source: fixed, value: ENGAGED}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: intéressé}
        values:
          funnel_state: {source: fixed, value: INTENT}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: rendez-vous}
        values:
          funnel_state: {source: fixed, value: MEETING}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: refus}
        values:
          funnel_state: {source: fixed, value: REJECTED}
      - table: customer_requests
        operation: insert
        for_each: requests
        values:
          venture_id: {source: task, value: venture_id}
          contact_id: {source: task, value: contact_id}
          inbound_id: {source: task, value: inbound_id}
          kind: {source: field, value: requests.kind}
          text: {source: field, value: requests.text}

  - id: envoyer_message
    title: Envoyer un message
    role: >-
      Fait partir un envoi par son canal, après les garde-fous, sans jamais
      l'envoyer deux fois. Annule un envoi devenu inutile (le contact a
      écrit depuis, ou s'est désinscrit). Sans LLM.
    type: capability
    capability: send_message
    queue: conversations
    priority: 50
    params:
      touch_id: {source: task, value: touch_id}

  # --- Julien dans la conversation (lot 8 bis, décisions Q85 et Q86) ------
  # Un envoi qui attend un humain ouvre un ticket « Conversation », dans le
  # forum « tickets » du serveur Discord (Q88). Chaque bouton est une réponse
  # (table ticket_answers) qui réveille une de ces invocations.
  - id: demander_julien
    title: Demander à Julien
    role: >-
      Un envoi attend un humain : ouvre son ticket « Conversation » (le
      business, le prospect, le fil, le brouillon, pourquoi Serge demande,
      la question), ou le met à jour et le rouvre si le brouillon a été
      réécrit. Sans LLM.
    type: capability
    capability: ask_owners
    queue: conversations
    priority: 90
    params:
      ticket_type: {source: fixed, value: CONVERSATION}
      ref_table: {source: fixed, value: touches}
      ref_id: {source: task, value: touch_id}
      raison: {source: task, value: raison}
      question: {source: task, value: question}
      title: {source: fixed, value: Une réponse attend ton avis}

  - id: valider_envoi
    title: Envoyer le brouillon validé
    role: >-
      « Envoyer le brouillon » : l'envoi qui attendait est validé, et part.
      Sans LLM.
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      touch_id: {source: task, value: touch_id}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          status: {source: fixed, value: pending}
          owner_ok_at: {source: now}

  - id: envoyer_reponse_de_julien
    title: Envoyer la réponse de Julien
    role: &role_ma_reponse >-
      « Ma réponse » : le texte et l'objet de Julien remplacent le
      brouillon, et partent tels quels. Sans LLM.
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      touch_id: {source: task, value: touch_id}
      texte: {source: task, value: texte}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          body: {source: task, value: texte}
          subject: &objet_de_julien {source: task, value: objet}
          status: {source: fixed, value: pending}
          owner_ok_at: {source: now}

  - id: ajouter_question_frequente
    title: Ajouter aux questions fréquentes
    role: >-
      « Ma réponse » à une question sur le produit : la question du contact
      et la réponse de Julien rejoignent les questions fréquentes de la
      fiche produit ; la fois suivante, Serge répond seul (Q50). Sans LLM.
    type: capability
    capability: echo
    queue: conversations
    priority: 70
    params:
      venture_id: {source: task, value: venture_id}
      question: {source: task, value: question}
      texte: {source: task, value: texte}
    writes:
      - table: product_faq
        operation: insert
        condition: {field: question, op: non_vide}
        values:
          venture_id: {source: task, value: venture_id}
          question: {source: task, value: question}
          answer: {source: task, value: texte}

  - id: annuler_envoi
    title: Ne rien envoyer
    role: >-
      « Ne rien envoyer » : l'envoi qui attendait est annulé. Sans LLM.
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      touch_id: {source: task, value: touch_id}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          status: {source: fixed, value: cancelled}
          last_error: {source: fixed, value: annulé par un administrateur}

  - id: reecrire_brouillon
    title: Réécrire un brouillon
    role: >-
      « Réécrire » : réécrit le brouillon qui attend selon les consignes de
      Julien ; le nouveau brouillon revient dans le même ticket.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 80
    gets_serge_intro: true
    max_tool_turns: 2
    compare:
      touches: false
    prompt: |
      Tu réécris, au nom de Serge, une réponse à un contact. Julien a lu le
      brouillon et te donne ses consignes (dans les paramètres de la tâche,
      « consignes ») : suis-les à la lettre.

      Tu reçois le brouillon, le fil du contact, la fiche du business, la
      fiche produit et ses questions fréquentes.

      Rends reply : la nouvelle réponse, prête à partir, sans objet ni
      signature d'humain. Écris dans la langue du contact, simplement et
      brièvement. Ne promets jamais une date, un prix ou une fonctionnalité
      absents de la fiche produit, sauf si Julien te le demande. Serge
      assume d'être un agent IA.
    tools:
      - tool: brouillon_de_l_envoi
        mode: given
        label: Le brouillon
        params:
          touch_id: {source: task, value: touch_id}
      - tool: fil_du_contact
        mode: given
        label: Le fil du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: reply, type: text, description: 'La nouvelle réponse, prête à partir.'}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          body: {source: field, value: reply}

  - id: preparer_reponse_attente
    title: Préparer une réponse d'attente
    role: >-
      Personne n'a répondu au ticket à temps : prépare une réponse
      d'attente prudente au contact, par le même canal ; le ticket reste
      ouvert et le brouillon attend toujours Julien (Q85). Sans LLM.
    type: capability
    capability: db_read
    queue: conversations
    priority: 80
    params:
      tool_id: {source: fixed, value: envoi_en_attente}
      touch_id: {source: task, value: touch_id}
    writes:
      - table: touches
        operation: insert
        for_each: rows
        values:
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          channel: {source: field, value: rows.channel}
          address: {source: field, value: rows.address}
          subject: {source: field, value: rows.subject}
          reply_to: {source: field, value: rows.reply_to}
          body: {source: fixed, value: 'Merci pour votre message. Je vérifie ce point et je reviens vers vous très vite.'}
          kind: {source: fixed, value: reply}
          status: {source: fixed, value: pending}
          owner_ok_at: {source: now}

  - id: passer_la_main
    title: Passer à la suite (ticket)
    role: >-
      Le feu vert d'un ticket « Passage » : fait partir le passage qui
      attendait un clic, comme le bouton de Mission Control (Q62). Sans
      LLM.
    type: capability
    capability: pass_link
    queue: conversations
    priority: 90
    params:
      passage: {source: task, value: passage}

  - id: preparer_relances
    title: Préparer les relances
    role: >-
      Cherche les contacts qui n'ont pas répondu au dernier message de Serge
      depuis le délai réglé, et écrit pour chacun une relance à rédiger, sur
      le canal du premier message. Sans LLM.
    type: capability
    capability: due_followups
    queue: conversations
    priority: 50
    settings:
      premiere_relance_minutes: {value: 4320, min: 0, max: 43200, policy: true, description: Les minutes entre le premier message et la première relance (4320 = 3 jours).}
      relance_suivante_minutes: {value: 10080, min: 0, max: 43200, policy: true, description: Les minutes entre deux relances (10080 = 7 jours).}
      relances_max: {value: 2, min: 0, max: 5, policy: true, description: Le nombre maximum de relances par contact.}
    params:
      first_delay_minutes: {source: setting, value: premiere_relance_minutes}
      next_delay_minutes: {source: setting, value: relance_suivante_minutes}
      max_followups: {source: setting, value: relances_max}
    writes:
      - table: touches
        operation: insert
        for_each: rows
        values:
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          channel: {source: field, value: rows.channel}
          address: {source: field, value: rows.address}
          subject: {source: field, value: rows.subject}
          followup_of: {source: field, value: rows.followup_of}
          kind: {source: fixed, value: followup}
          status: {source: fixed, value: to_write}

  - id: ecrire_relance
    title: Écrire une relance
    role: >-
      Rédige une relance courte pour un contact qui n'a pas répondu, à
      partir de son fil et de la fiche produit.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 50
    gets_serge_intro: true
    max_tool_turns: 3
    compare:
      touches: false
    prompt: |
      Tu écris une relance, au nom de Serge, à un contact qui n'a pas
      répondu au dernier message de Serge.

      Tu reçois le fil du contact, sa fiche, la fiche du business et la
      fiche produit. Écris un message court et poli, qui rappelle l'offre en
      une phrase et apporte quelque chose de neuf (un détail de la fiche
      produit, une question simple). Ne répète pas le message précédent.
      Ne promets rien qui ne soit pas dans la fiche produit. Écris dans la
      langue du fil, sans objet ni signature d'humain : Serge assume d'être
      un agent IA.
    tools:
      - tool: fil_du_contact
        mode: given
        label: Le fil du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_contact
        mode: given
        label: La fiche du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: body, type: text, description: Le texte de la relance.}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          body: {source: field, value: body}
          status: {source: fixed, value: pending}

  - id: desinscrire
    title: Désinscrire
    role: >-
      Une personne demande à ne plus être contactée : bloque toutes ses
      adresses sur tous les canaux, passe toutes ses fiches, dans tous les
      business, à « Désinscrit », et annule ses envois en attente. Sans LLM.
    type: capability
    capability: unsubscribe_contact
    queue: conversations
    priority: 100
    params:
      contact_id: {source: task, value: contact_id}

  - id: arreter_contact
    title: Arrêter avec un contact
    role: >-
      Une conversation ne mène nulle part (un robot qui répond à chaque
      message, un accusé de réception automatique) : passe le contact à
      « Arrêté » ; Serge ne lui écrit plus et ne lui répond plus, et ses
      envois en attente sont annulés. Ce qu'il écrit ensuite reste dans son
      fil, sans être traité. Sans LLM (lot 10 bis, Q93).
    type: capability
    capability: stop_contact
    queue: conversations
    priority: 100
    params:
      contact_id: {source: task, value: contact_id}
      reason: {source: task, value: reason}

  - id: prevenir_julien_et_clem
    title: Prévenir Julien et Clem
    role: >-
      Ouvre un ticket d'information quand un contact s'est désinscrit, pour
      que Julien et Clem voient ce qui se passe. Sans LLM.
    type: capability
    capability: inform_owners
    queue: conversations
    priority: 100
    params:
      title: {source: fixed, value: Un contact s'est désinscrit}
      text: {source: fixed, value: 'Serge ne le contactera plus, sur aucun canal ni pour aucun business.'}
      contact_id: {source: task, value: contact_id}

  - id: parler_au_telephone
    title: Parler au téléphone
    role: >-
      L'agent vocal : il mène chaque appel, entrant ou sortant, en direct.
      Il reçoit au décrochage la fiche du contact, son fil, la fiche du
      business et la fiche produit ; il peut chercher un appelant inconnu
      et noter une adresse. À la fin, ce qui s'est dit entre dans le fil
      du contact, ce qui lance la suite.
    type: llm
    model_tier: ''
    queue: voice
    priority: 100
    gets_serge_intro: true
    compare:
      inbound_events: false
    settings:
      duree_max_secondes: {value: 180, min: 30, max: 1800, policy: true, description: 'La durée maximale d''un appel, en secondes.'}
      fournisseurs: {type: text, value: 'xai,openai', description: 'Les fournisseurs de la voix en direct, dans l''ordre (xai, openai) : le second sert si le premier ne répond pas.'}
      modele_xai: {type: text, value: grok-voice-think-fast-2.0, description: Le modèle vocal chez xAI.}
      voix_xai: {type: text, value: eve, description: La voix chez xAI.}
      modele_openai: {type: text, value: gpt-realtime-2.1-mini, description: Le modèle vocal chez OpenAI.}
      voix_openai: {type: text, value: alloy, description: La voix chez OpenAI.}
      modele_secours: {type: text, value: openai/gpt-4o-mini, description: 'Le modèle du secours tour par tour (OpenRouter), quand la voix en direct ne répond pas.'}
      tours_secours: {value: 4, min: 1, max: 20, description: Les tours de parole au plus dans le secours tour par tour.}
    prompt: &consigne_parler_au_telephone |
      Tu es Serge, au téléphone. Tu parles français, simplement, une ou
      deux phrases courtes à la fois, sans liste ni formule écrite.

      Tu reçois peut-être la fiche de ton interlocuteur, son e-mail, son
      fil (ce qui s'est déjà dit, tous canaux confondus), la fiche du
      business et la fiche produit, et, pour un appel que tu passes, son
      but.

      - Un appel que tu passes : présente-toi, dis pourquoi tu appelles
        (son but), demande si c'est le bon moment.
      - Un appel que tu reçois d'un numéro inconnu : « Bonjour, je suis
        Serge, en quoi puis-je vous aider ? ». Demande à qui tu parles,
        puis cherche sa fiche avec l'outil « Chercher un contact » (son
        nom, son entreprise, son e-mail ou son numéro).
      - Une personne reconnue seulement par son nom : ne lui répète
        aucune information sensible (montants, adresses, propos d'un
        collègue).
      - Une proposition faite à Serge (un partenariat, une offre) :
        réponds poliment que tu ne peux pas traiter ce genre de demande
        pour l'instant.
      - Un document à envoyer (une documentation, un devis) : il part par
        e-mail. Si tu as son e-mail (« Son e-mail »), propose-le : « Je
        vous l'envoie à cette adresse, c'est bien la bonne ? ». Sinon,
        ou si elle n'est plus bonne, demande-lui son adresse, fais-la
        épeler et relis-la lettre par lettre.
      - Une adresse ne se note qu'une fois confirmée : attends que la
        personne dise « oui » à ta relecture avant d'appeler « Noter une
        adresse ». Si elle corrige, reprends la relecture depuis le
        début. Si elle remplace une adresse que tu avais, passe
        l'ancienne dans « replaces » : elle ne servira plus.
        Ensuite seulement, dis que le document arrive par e-mail.
      - Ne promets jamais une date, un prix ou une fonctionnalité absents
        de la fiche produit. En cas de doute, dis que tu vérifies et que
        tu reviens vers la personne.
      - Une personne qui ne veut plus être contactée : dis que c'est noté,
        puis au revoir.
      - Tu es un agent IA : dis-le si on te le demande, ne prétends
        jamais être un humain.
      - Pour finir, dis au revoir.
    tools:
      - tool: but_de_l_appel
        mode: given
        label: Le but de l'appel
        params:
          touch_id: {source: task, value: touch_id}
      - tool: fil_du_contact
        mode: given
        label: Le fil de ton interlocuteur
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_contact
        mode: given
        label: Sa fiche
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: chercher_contact
        mode: callable
      - tool: noter_adresse
        mode: callable
      - &outil_email_du_contact
        tool: email_du_contact
        mode: given
        label: Son e-mail
        params:
          contact_id: {source: task, value: contact_id}
    output:
      - {path: transcript, type: text, description: 'Ce qui s''est dit, une ligne par phrase.'}
      - {path: contact_id, type: text, required: false, description: Le contact de l'appel.}
      - {path: venture_id, type: text, required: false, description: Son business.}
      - {path: status, type: text, description: 'attached (contact connu) ou unattached.'}
    writes:
      - table: inbound_events
        operation: insert
        values:
          channel: {source: fixed, value: voice}
          contact_id: {source: field, value: contact_id}
          venture_id: {source: field, value: venture_id}
          native_type: {source: fixed, value: call}
          address: {source: task, value: phone}
          subject: {source: fixed, value: Suite à notre appel}
          body: {source: field, value: transcript}
          external_ref: {source: task, value: cdr_id}
          status: {source: field, value: status}
          received_at: {source: now}

# --- Le kit d'essai (lot 8, PR 4, décision Q79) -----------------------------
# Temporaire : à retirer avant le vrai lancement de Serge. Le bouton
# « Lancer un essai » (page Système) crée un business bidon avec une
# demi-fiche produit, la fiche de la personne qui essaie (ses coordonnées
# restent en base, jamais dans le dépôt) avec son accord pour l'appel de
# test, puis Serge lui écrit et l'appelle.

  - id: essayer_captcha
    title: Essayer le captcha avec un humain
    role: >-
      Une étape de l'essai total, après le paiement test (Q97, Q99) :
      ouvre dans le vrai Chrome une page d'essai qui tient lieu de captcha,
      appelle un humain, attend qu'il ait cliqué dans l'écran, puis rend le
      code que la page montre alors.
    type: llm
    model_tier: web
    queue: works
    priority: 30
    max_tool_turns: 15
    prompt: |
      Tu essaies le passage de main à un humain, sur une page d'essai qui
      tient lieu de captcha.

      1. Ouvre dans le vrai Chrome la page
         https://<domaine>/static/essai/captcha.html, où <domaine> est le
         nom du serveur de Serge (« hostname », donné plus bas).
      2. Son bouton « Je suis un humain » ne doit être cliqué que par un
         humain : ne le clique jamais toi-même, et n'essaie pas de le
         contourner. Appelle « Appeler un humain », avec la raison « un
         captcha d'essai (essai total) ». La première fois, la tâche
         s'arrête et repartira du début quand un humain sera prêt ; la fois
         suivante, il clique le bouton dans l'écran pendant que tu attends.
      3. Quand l'outil répond que l'humain a fini, lis la page : elle
         montre « Captcha résolu » et un code à quatre chiffres.

      Rends resolu « oui » et le code si la page le montre. Sinon rends
      « non », et dis pourquoi dans ton compte rendu (personne n'était
      disponible, l'écran n'a pas pu s'ouvrir, la page n'a pas changé).
    tools:
      - tool: adresse_du_serveur
        mode: given
        label: Le serveur de Serge
      - tool: vrai_chrome_agir
        mode: callable
        params: &vrai_chrome_essai
          venture_id: {source: fixed, value: essai}
          deliverable: {source: fixed, value: chantier}
          task_id: {source: task, value: task_id}
      - tool: vrai_chrome_lire
        mode: callable
        params: *vrai_chrome_essai
      - tool: vrai_chrome_capture
        mode: callable
        params: *vrai_chrome_essai
      - tool: appeler_un_humain
        mode: callable
        params:
          task_id: {source: task, value: task_id}
    output:
      - {path: resolu, type: choice, choices: [oui, non], description: 'La page montre-t-elle « Captcha résolu » ?'}
      - {path: code, type: text, required: false, description: Le code à quatre chiffres que montre la page.}
      - {path: compte_rendu, type: text, description: 'Ce qui s''est passé, en deux phrases.'}

  # --- Les comptes web (lot 13, Q104) ---
  # Serge a un compte par site (web_accounts). « Créer un compte web » et
  # « Vérifier un compte web » sont lancées par leur bouton de la page
  # Système ; une invocation à qui on donne le compte sur ses outils de
  # navigateur navigue connectée (paramètre account).
  - id: ouvrir_compte_web
    title: Ouvrir un compte web
    role: >-
      Prépare en base la ligne d'un compte de Serge sur un site, avec le
      nom et l'adresse tapés dans le bouton « Créer un compte web » de la
      page Système ; la création sur le site vient ensuite. Sans LLM.
    type: capability
    capability: open_web_account
    queue: works
    priority: 30
    params:
      account: {source: task, value: compte}
      url: {source: task, value: lien}

  - id: creer_compte_web
    title: Créer un compte web
    role: >-
      Crée sur un site le compte de Serge : remplit l'inscription dans le
      vrai Chrome avec son identité, fait taper le mot de passe par Serge,
      lit le code ou le lien de confirmation reçu par e-mail ou par SMS,
      appelle un humain devant un captcha. À la fin, l'identifiant, le mot
      de passe et la session du compte sont en base, chiffrés.
    type: llm
    model_tier: web
    queue: works
    priority: 30
    max_tool_turns: 80
    prompt: |
      Tu crées le compte de Serge sur un site. Le nom du compte et l'adresse
      du site sont dans les paramètres de la tâche (« compte », « url »),
      avec le pseudo voulu sur ce site (« pseudo » ; vide : celui de
      l'identité) et la date de naissance à donner si le site la demande
      (« naissance »). Tu reçois l'identité à utiliser et l'état du compte.
      Si l'identité dit qu'il lui manque un champ que le site demande,
      arrête-toi tout de suite, avant d'ouvrir le site : demande-le avec
      « Demander une nouvelle capacité », en disant où le remplir.

      Ce compte est celui de Serge, un agent IA. Tu agis pour la personne
      dont tu reçois l'identité, qui l'a demandé et qui en répond : c'est
      son compte, pas celui d'un inconnu. Trois règles, sans exception :

      - **Tu ne mens pas.** Tu donnes l'identité reçue, telle quelle. Dans
        un champ libre (une biographie, une présentation), tu écris que
        Serge est un agent IA. Tu ne coches jamais une case qui affirme
        le contraire à ta place.
      - **Un captcha n'est pas pour toi.** « Je ne suis pas un robot »,
        des images à choisir, un puzzle : tu n'y touches pas et tu
        n'essaies pas de le contourner. Appelle « Appeler un humain » : la
        première fois, la tâche s'arrête et repartira du début quand un
        humain sera prêt ; la fois suivante, au même endroit, il le résout
        dans l'écran pendant que tu attends, puis tu relis la page et tu
        continues. Juste avant de l'appeler, prends une capture avec
        « keep » à oui : elle est gardée, et montre ce que tu voyais.
      - **Tu ne vois jamais le mot de passe.** Pour le taper, fais l'action
        taper_secret sur le champ, avec text « mot_de_passe_du_compte » :
        Serge le tape à ta place. Ne l'invente pas, ne le demande pas.
        Si le site refuse ce mot de passe (trop long, trop court, un signe
        qu'il n'accepte pas), appelle « Changer le mot de passe du compte »
        avec la longueur que le site accepte (et signes à non s'il refuse
        les signes), vide le champ, puis retape-le de la même façon, dans
        chaque champ qui le demande.

      Comment faire :

      1. Ouvre le site et trouve son inscription. Si le site te montre
         déjà connecté à ce compte (une tâche précédente l'avait créé),
         vérifie-le et rends tout de suite cree « oui ».
      2. Remplis le formulaire avec l'identité reçue : l'adresse e-mail,
         le prénom et le nom, le pseudo voulu comme nom d'utilisateur (s'il
         est pris, ajoute « _ia », puis un chiffre). Pour un numéro de
         téléphone : ne le donne que si le site l'exige, sans autre moyen
         de continuer, et c'est alors celui des SMS. Si l'inscription
         propose d'abord le téléphone, cherche son lien « Utiliser un
         e-mail » et inscris-toi avec l'adresse e-mail. Refuse tout ce qui
         est facultatif (carnet d'adresses, notifications, abonnement
         payant, lettre d'information).
      3. Après l'envoi, le site envoie souvent un code ou un lien, par
         e-mail ou par SMS : appelle « Mes messages de vérification »
         (rappelle-le s'il ne rend rien, jusqu'à trois fois). Un code, tu
         le tapes. Un lien, tu l'ouvres dans le vrai Chrome (écrit sans
         « https:// », tu l'ajoutes). Si le message attendu n'arrive pas,
         ne redonne pas l'adresse ni le numéro : arrête-toi, et dis dans
         ton compte rendu lequel n'est pas arrivé.
      4. Vérifie que tu es connecté : la page montre le compte (son nom,
         son profil, un menu « Déconnexion »).

      Si un bouton ne fait rien, ou si la page ne réagit plus, réessaie une
      fois, pas plus : ne remplis pas le formulaire en boucle. Prends une
      capture avec « keep » à oui, arrête-toi, et rends cree « non » en
      décrivant ce que la page montre.

      Trois précisions. Quand l'inscription n'offre que le téléphone (avec
      ou sans « Continuer avec Google » ou « Apple », que tu n'utilises
      pas), le téléphone est exigé : donne celui des SMS, sans chercher
      une voie par e-mail. Un champ « E-mail ou nom d'utilisateur » sert à
      se connecter à un compte qui existe, pas à s'inscrire : ne t'en sers
      pas pour créer le compte. Et un bouton qui ne fait rien sur une voie
      ne t'arrête pas tant que le site en propose une autre : essaie-la
      d'abord. Quand un bouton ne fait rien, cite dans ton compte rendu ce
      que l'outil t'a rendu dans « nouvelles_erreurs » après le clic (une
      requête refusée, avec son code HTTP) : c'est la réponse du site.

      Si le site demande une date de naissance et que « naissance » est
      vide, ou une information que tu n'as pas (un numéro de téléphone
      quand celui des SMS est vide, une pièce d'identité), arrête-toi :
      demande-la avec « Demander une nouvelle capacité », la tâche
      repartira avec la réponse.

      Rends cree « oui » seulement si tu es connecté au compte à la fin ;
      l'identifiant qui sert à se connecter (l'e-mail ou le nom
      d'utilisateur) ; le nom public du compte ; et un compte rendu de
      trois phrases : ce qui a été fait, ce qui a bloqué, ce qu'il reste à
      un humain à faire.
    tools:
      - tool: compte_web
        mode: given
        label: Le compte
        params:
          account: {source: task, value: compte}
      - tool: identite_de_serge
        mode: given
        label: L'identité à utiliser
      - tool: vrai_chrome_agir
        mode: callable
        params: &vrai_chrome_du_compte
          venture_id: {source: fixed, value: comptes}
          deliverable: {source: task, value: compte}
          task_id: {source: task, value: task_id}
          account: {source: task, value: compte}
      - tool: vrai_chrome_lire
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: vrai_chrome_capture
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: messages_de_verification
        mode: callable
        params: &tache_de_verification
          task_id: {source: task, value: task_id}
      - tool: appeler_un_humain
        mode: callable
        params:
          task_id: {source: task, value: task_id}
      - tool: changer_mot_de_passe_du_compte
        mode: callable
        max_calls: 3
        params:
          account: {source: task, value: compte}
    output:
      - {path: cree, type: choice, choices: [oui, non], description: 'Es-tu connecté au compte, à la fin ?'}
      - {path: identifiant, type: text, required: false, description: "Ce qui sert à se connecter : l'e-mail ou le nom d'utilisateur."}
      - {path: nom_public, type: text, required: false, description: Le nom public du compte sur le site.}
      - {path: compte_rendu, type: text, description: 'Ce qui a été fait, ce qui a bloqué, ce qu''il reste à faire.'}
    writes:
      - table: web_accounts
        operation: update
        key: {column: id, source: task, value: compte}
        condition: {field: cree, op: '=', value: oui}
        values:
          login: {source: field, value: identifiant}
          handle: {source: field, value: nom_public}
          status: {source: fixed, value: active}
          note: {source: field, value: compte_rendu}
      - table: web_accounts
        operation: update
        key: {column: id, source: task, value: compte}
        condition: {field: cree, op: '!=', value: oui}
        values:
          note: {source: field, value: compte_rendu}

  - id: verifier_compte_web
    title: Vérifier un compte web
    role: >-
      Ouvre le site d'un compte de Serge et vérifie qu'il y est connecté ;
      sinon s'y connecte (identifiant, mot de passe tapé par Serge, code
      reçu par e-mail ou SMS, humain devant un captcha). Sert après avoir
      enregistré à la main un compte qui existait déjà, ou quand un compte
      semble déconnecté.
    type: llm
    model_tier: web
    queue: works
    priority: 30
    max_tool_turns: 40
    prompt: |
      Tu vérifies que Serge est connecté à l'un de ses comptes. Le nom du
      compte est dans les paramètres de la tâche (« compte ») ; tu reçois
      son site et son identifiant.

      Ce compte est celui de Serge, un agent IA. Tu agis pour la personne
      dont tu reçois l'identité, qui l'a demandé et qui en répond : c'est
      son compte, pas celui d'un inconnu. Trois règles, sans exception :

      - **Tu ne mens pas.** Tu donnes l'identité reçue, telle quelle. Dans
        un champ libre (une biographie, une présentation), tu écris que
        Serge est un agent IA. Tu ne coches jamais une case qui affirme
        le contraire à ta place.
      - **Un captcha n'est pas pour toi.** « Je ne suis pas un robot »,
        des images à choisir, un puzzle : tu n'y touches pas et tu
        n'essaies pas de le contourner. Appelle « Appeler un humain » : la
        première fois, la tâche s'arrête et repartira du début quand un
        humain sera prêt ; la fois suivante, au même endroit, il le résout
        dans l'écran pendant que tu attends, puis tu relis la page et tu
        continues.
      - **Tu ne vois jamais le mot de passe.** Pour le taper, fais l'action
        taper_secret sur le champ, avec text « mot_de_passe_du_compte » :
        Serge le tape à ta place. Ne l'invente pas, ne le demande pas.

      Comment faire :

      1. Ouvre le site. Si la page montre le compte connecté (son nom, son
         profil, un menu « Déconnexion »), c'est fini.
      2. Sinon, trouve la connexion : tape l'identifiant reçu, fais taper
         le mot de passe, valide. Si le site envoie un code ou un lien,
         appelle « Mes messages de vérification ». Si Serge te répond que
         ce compte se connecte avec Google, clique plutôt « Continuer avec
         Google » (ou « Se connecter avec Google ») et choisis le compte
         de Serge ; si Google demande alors un mot de passe ou un code,
         appelle « Appeler un humain ».
      3. Si le site dit que le compte est suspendu, fermé ou banni, ne
         cherche pas à en créer un autre : rends etat « ferme ».

      Rends etat « connecte », « deconnecte » (tu n'as pas pu te
      connecter) ou « ferme » (le site a fermé le compte), le nom public
      que montre la page, et un compte rendu de deux phrases.
    tools:
      - tool: compte_web
        mode: given
        label: Le compte
        params:
          account: {source: task, value: compte}
      - tool: vrai_chrome_agir
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: vrai_chrome_lire
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: vrai_chrome_capture
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: messages_de_verification
        mode: callable
        params: *tache_de_verification
      - tool: appeler_un_humain
        mode: callable
        params:
          task_id: {source: task, value: task_id}
    output:
      - {path: etat, type: choice, choices: [connecte, deconnecte, ferme], description: 'Où en est le compte, à la fin.'}
      - {path: nom_public, type: text, required: false, description: Le nom public que montre la page.}
      - {path: compte_rendu, type: text, description: 'Ce qui s''est passé, en deux phrases.'}
    writes:
      - table: web_accounts
        operation: update
        key: {column: id, source: task, value: compte}
        condition: {field: etat, op: '=', value: ferme}
        values:
          status: {source: fixed, value: blocked}
          note: {source: field, value: compte_rendu}
      - table: web_accounts
        operation: update
        key: {column: id, source: task, value: compte}
        condition: {field: etat, op: '!=', value: ferme}
        values:
          note: {source: field, value: compte_rendu}

  - id: fouiller_reseau
    title: Fouiller un réseau
    role: >-
      Cherche sur un réseau social (Reddit, Instagram, X), connectée au
      compte de Serge dans le vrai Chrome, ce que de vraies personnes
      disent d'un sujet, et rend les discussions utiles avec un extrait.
      C'est une mission : « Explorer le web » la confie quand une recherche
      ordinaire ne suffit pas ; le bouton « Fouiller un réseau » de la page
      Système l'essaie sur un sujet sans enjeu.
    type: llm
    model_tier: web
    queue: works
    priority: 30
    max_tool_turns: 40
    settings:
      trouvailles_max: {value: 8, min: 1, max: 30, policy: true, description: Le nombre maximum de discussions rendues par une fouille.}
    prompt: |
      Tu fouilles un réseau social pour Serge. Ce qu'on te demande est dans
      les paramètres de la tâche (« mission »), avec le nom du compte de
      Serge sur ce réseau (« compte ») ; tu reçois son site et son
      identifiant. Tu navigues dans le vrai Chrome, connecté à ce compte.

      Ce compte est celui de Serge, un agent IA ; la personne qui en
      répond l'a demandé. Tes règles, sans exception :

      - **Tu lis, c'est tout.** Tu ne publies rien, tu ne commentes pas,
        tu ne votes pas, tu n'écris à personne, tu ne t'abonnes à rien.
      - **Un captcha n'est pas pour toi.** Tu n'y touches pas et tu
        n'essaies pas de le contourner : appelle « Appeler un humain ».
        La première fois, la tâche s'arrête et repartira du début quand un
        humain sera prêt ; la fois suivante, il le résout dans l'écran
        pendant que tu attends.
      - **Tu ne vois jamais le mot de passe.** Si le site te montre
        déconnecté, connecte-toi : l'identifiant reçu, puis l'action
        taper_secret sur le champ du mot de passe, avec text
        « mot_de_passe_du_compte ». Si le site envoie un code, appelle
        « Mes messages de vérification ». Si Serge te répond que ce compte
        se connecte avec Google, clique sur le site « Continuer avec
        Google » (ou « Se connecter avec Google ») et choisis le compte de
        Serge ; si Google demande alors un mot de passe ou un code,
        appelle « Appeler un humain ».
      - **Tu t'arrêtes quand on te le dit.** Si une action est refusée
        parce que le compte a fait ses actions du jour, ou si le site dit
        que le compte est limité ou suspendu, n'insiste pas : rends ce que
        tu as, et dis-le dans ton résumé.

      Comment faire :

      1. Ouvre le site et cherche avec sa propre recherche, sous deux ou
         trois angles : les mots que les gens emploient, pas un mot-clé
         de professionnel. Sur Reddit, cherche aussi les communautés du
         sujet.
      2. Si on te demande ce que disent les gens : ouvre les discussions
         qui montrent un besoin concret (quelqu'un qui demande une
         solution, se plaint, compare, ou dit ce qu'il paie), et lis la
         discussion et ses réponses. Écarte la publicité.
         Si on te demande des personnes : rends leur profil (son adresse
         exacte, celle qui s'ouvre sur la personne), son nom et son rôle
         pour titre, et pour extrait ce qui montre qu'elle correspond.
      3. Fais peu d'actions : une vingtaine suffit. Lire la page ne coûte
         rien ; chaque clic et chaque défilement comptent dans les actions
         du jour du compte.

      Rends au plus {trouvailles_max} discussions. Pour chacune : son
      adresse exacte, son titre, et un extrait de quelques lignes avec les
      mots des gens (ce qu'ils demandent, ce qui leur manque, ce qu'ils
      paient). Puis un résumé de trois phrases : ce qui revient le plus,
      et ce que tu n'as pas pu voir.
    tools:
      - tool: compte_web
        mode: given
        label: Le compte
        params:
          account: {source: task, value: compte}
      - tool: vrai_chrome_agir
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: vrai_chrome_lire
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: vrai_chrome_capture
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: messages_de_verification
        mode: callable
        params: *tache_de_verification
      - tool: appeler_un_humain
        mode: callable
        params:
          task_id: {source: task, value: task_id}
    output:
      - {path: trouvailles, type: list, required: false, max_items: trouvailles_max, description: Les discussions utiles.}
      - {path: trouvailles.url, type: text, description: L'adresse exacte de la discussion.}
      - {path: trouvailles.titre, type: text, description: Son titre.}
      - {path: trouvailles.extrait, type: text, description: 'Ce qui y est dit, en quelques lignes, avec les mots des gens.'}
      - {path: resume, type: text, description: 'Ce qui revient le plus, et ce que tu n''as pas pu voir.'}

  - id: envoyer_par_le_web
    title: Envoyer un message par le navigateur
    role: >-
      Envoie un message à une personne sur un réseau (LinkedIn, Instagram,
      X), connectée au compte de Serge dans le vrai Chrome. C'est une
      mission : « Envoyer un message » la confie, après ses garde-fous,
      pour un canal du navigateur. Elle regarde d'abord si le message est
      déjà parti, pour ne jamais l'envoyer deux fois. Quand le réseau ne
      laisse pas encore écrire à la personne, elle lui demande le contact
      (la suivre, se connecter) et le message attend : on la rappelle plus
      tard.
    type: llm
    model_tier: web
    queue: conversations
    priority: 50
    max_tool_turns: 30
    prompt: |
      Tu envoies un message de Serge à une personne, sur un réseau. Tout
      est dans les paramètres de la tâche : le réseau (« canal » ; sans
      lui, c'est celui du compte), le compte de Serge (« compte »),
      la personne (« adresse » : l'adresse de son profil, ou son pseudo
      sur ce réseau), le texte à envoyer (« message ») et sa sorte
      (« sorte » : first, un premier message ; reply, une réponse ;
      followup, une relance). Tu reçois le site et l'identifiant du compte.

      Ce compte est celui de Serge, un agent IA ; la personne qui en
      répond l'a demandé. Tes règles, sans exception :

      - **Tu ne mens pas.** Tu ne te fais jamais passer pour un humain.
      - **Un captcha n'est pas pour toi.** Tu n'y touches pas et tu
        n'essaies pas de le contourner : appelle « Appeler un humain ».
        La première fois, la tâche s'arrête et repartira du début quand un
        humain sera prêt ; la fois suivante, il le résout dans l'écran
        pendant que tu attends.
      - **Tu ne vois jamais le mot de passe.** Si le site te montre
        déconnecté, connecte-toi : l'identifiant reçu, puis l'action
        taper_secret sur le champ du mot de passe, avec text
        « mot_de_passe_du_compte ». Si le site envoie un code, appelle
        « Mes messages de vérification ». Si Serge te répond que ce compte
        se connecte avec Google, clique sur le site « Continuer avec
        Google » (ou « Se connecter avec Google ») et choisis le compte de
        Serge ; si Google demande alors un mot de passe ou un code,
        appelle « Appeler un humain ».
      - **Tu t'arrêtes quand on te le dit.** Si une action est refusée
        parce que le compte a fait ses actions du jour, ou si le site dit
        que le compte est limité ou suspendu, n'insiste pas.
      - **Tu envoies ce texte, et rien d'autre** : tel qu'il est, à cette
        personne seulement. Tu ne le réécris pas, tu n'ajoutes rien, tu
        n'écris à personne d'autre, tu ne publies rien. Un seul autre geste
        est permis, quand le réseau l'exige pour lui écrire : demander le
        contact à cette personne (la suivre, lui demander la connexion). Pas
        de « j'aime », pas de commentaire, et tu ne suis personne d'autre.

      Comment faire :

      1. Ouvre le profil de la personne. Si « adresse » est une adresse
         (https://…), ouvre-la. Si c'est un pseudo, trouve le profil comme
         le ferait une personne : par la recherche du site, puis le profil
         dont le pseudo est exactement celui-là. S'il n'y en a pas, ou si
         tu hésites entre plusieurs, n'écris à personne : rends envoye
         « non », avec la raison. Sur LinkedIn, un nom ne désigne
         personne (plusieurs le portent) : sans adresse de profil, rends
         envoye « non ». Vérifie que c'est bien un profil, pas une page
         d'erreur.
      2. Ouvre la conversation avec elle, si le réseau te la montre. Si
         ton texte y est déjà, il est parti : n'envoie rien et rends envoye
         « deja ».
      3. Si le réseau te laisse lui écrire, envoie le texte :
         - **LinkedIn** : à une relation, par « Message ». À un inconnu,
           par « Se connecter », puis « Ajouter une note » : le texte est
           la note, et il part avec la demande ;
         - **Instagram** : par « Message » (ou « Envoyer un message »)
           sur le profil ;
         - **X** : par l'enveloppe du profil ;
         - **ailleurs** : par ce que le site propose pour écrire en privé à
           cette personne.
         Vérifie ensuite que le texte apparaît dans la conversation, ou que
         la demande, avec sa note, est « en attente ».
      4. Si le réseau ne te laisse pas encore lui écrire (aucun bouton pour
         écrire, les messages réservés aux relations ou aux abonnés, une
         note refusée parce qu'elle est trop longue ou qu'il n'en reste plus
         ce mois-ci), la personne doit d'abord accepter le contact.
         Demande-le comme le réseau le propose, une seule fois : « Suivre »
         (X, Instagram), « Se connecter » sans note (LinkedIn). Si c'est
         déjà fait (tu la suis déjà, la demande est « en attente »), ne
         refais rien. N'envoie pas le texte, ni ailleurs ni autrement :
         rends envoye « attente », et dis dans raison ce que tu as demandé
         et ce que la personne doit faire (accepter la demande, te suivre en
         retour). On te rappellera plus tard avec le même texte, et tu
         l'enverras dès que le réseau te laissera lui écrire.
      5. Si le réseau ne propose ni de lui écrire ni de lui demander le
         contact (un compte fermé, privé sans demande possible, ou qui t'a
         bloqué), rends envoye « non ».

      Rends envoye « oui » (parti), « deja » (il y était déjà), « attente »
      (le contact est demandé, le texte n'est pas encore parti) ou « non »
      (pas parti, et attendre n'y changera rien), l'adresse de la
      conversation si le site en donne une, et, s'il n'est pas parti, la
      raison en une phrase.
    tools:
      - tool: compte_web
        mode: given
        label: Le compte
        params:
          account: {source: task, value: compte}
      - tool: vrai_chrome_agir
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: vrai_chrome_lire
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: vrai_chrome_capture
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: messages_de_verification
        mode: callable
        params: *tache_de_verification
      - tool: appeler_un_humain
        mode: callable
        params:
          task_id: {source: task, value: task_id}
    output:
      - {path: envoye, type: choice, choices: [oui, deja, attente, non], description: 'Le message est-il dans la conversation ? « attente » : le contact est demandé, le message partira plus tard.'}
      - {path: reference, type: text, required: false, description: "L'adresse de la conversation, si le site en donne une."}
      - {path: raison, type: text, required: false, description: "Pourquoi il n'est pas parti, en une phrase."}

  - id: lire_messagerie
    title: Lire la messagerie d'un réseau
    role: >-
      Lit, dans le vrai Chrome, la messagerie du compte de Serge sur un
      réseau, et rend ce que les personnes à qui il a écrit ont répondu.
      C'est une mission : « Relever les messages » la confie pour un canal
      du navigateur, toutes les 4 heures, tant qu'une conversation est en
      cours ; elle rattache ensuite chaque message à son contact.
    type: llm
    model_tier: web
    queue: conversations
    priority: 80
    max_tool_turns: 30
    settings:
      jours_de_suivi: {value: 30, min: 1, max: 180, policy: true, description: Les conversations suivies sont celles où Serge a écrit depuis moins de jours que ce réglage.}
    prompt: |
      Tu relèves la messagerie du compte de Serge sur un réseau. Le réseau
      (« canal ») et le compte (« compte ») sont dans les paramètres de la
      tâche. Tu reçois le site et l'identifiant du compte, et les messages
      que Serge a envoyés par ce canal ces {jours_de_suivi} derniers
      jours : à qui, quand, et le texte.

      Ce compte est celui de Serge, un agent IA ; la personne qui en
      répond l'a demandé. Tes règles, sans exception :

      - **Tu ne mens pas.** Tu ne te fais jamais passer pour un humain.
      - **Un captcha n'est pas pour toi.** Tu n'y touches pas et tu
        n'essaies pas de le contourner : appelle « Appeler un humain ».
        La première fois, la tâche s'arrête et repartira du début quand un
        humain sera prêt ; la fois suivante, il le résout dans l'écran
        pendant que tu attends.
      - **Tu ne vois jamais le mot de passe.** Si le site te montre
        déconnecté, connecte-toi : l'identifiant reçu, puis l'action
        taper_secret sur le champ du mot de passe, avec text
        « mot_de_passe_du_compte ». Si le site envoie un code, appelle
        « Mes messages de vérification ». Si Serge te répond que ce compte
        se connecte avec Google, clique sur le site « Continuer avec
        Google » (ou « Se connecter avec Google ») et choisis le compte de
        Serge ; si Google demande alors un mot de passe ou un code,
        appelle « Appeler un humain ».
      - **Tu t'arrêtes quand on te le dit.** Si une action est refusée
        parce que le compte a fait ses actions du jour, ou si le site dit
        que le compte est limité ou suspendu, n'insiste pas.
      - **Tu lis, c'est tout.** Tu ne réponds à personne, tu n'acceptes
        et ne refuses rien, tu ne publies rien : la réponse de Serge sera
        écrite ensuite, par une autre invocation.

      Comment faire :

      1. Ouvre la messagerie du site (sur LinkedIn, regarde aussi les
         invitations acceptées : une personne qui accepte sans écrire n'a
         pas répondu).
      2. Pour chaque personne à qui Serge a écrit, ouvre sa conversation
         et lis ce qu'elle a écrit **après** le dernier message de Serge.
         Si les paramètres de la tâche donnent une « adresse » (un essai
         depuis la page Système : l'adresse d'un profil, ou un pseudo),
         lis seulement la conversation de cette personne, que tu
         retrouves dans la messagerie par son nom ou son pseudo.
      3. Ne rends rien pour une conversation sans réponse, ni pour un
         message d'une personne à qui Serge n'a pas écrit.

      Rends un message par réponse reçue : l'adresse du profil de la
      personne, telle que Serge la connaît (reprends-la de la liste ;
      pour un essai, ce que donne « adresse »), et
      son texte entier, mot pour mot. Si plusieurs messages se suivent,
      réunis-les en un seul texte. Puis un résumé d'une phrase.
    tools:
      - tool: compte_web
        mode: given
        label: Le compte
        params:
          account: {source: task, value: compte}
      - tool: vrai_chrome_agir
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: vrai_chrome_lire
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: vrai_chrome_capture
        mode: callable
        params: *vrai_chrome_du_compte
      - tool: messages_de_verification
        mode: callable
        params: *tache_de_verification
      - tool: appeler_un_humain
        mode: callable
        params:
          task_id: {source: task, value: task_id}
      - tool: conversations_du_canal
        mode: given
        label: Ce que Serge a envoyé par ce canal
        max_rows: 100
        params:
          channel: {source: task, value: canal}
          jours: {source: setting, value: jours_de_suivi}
    output:
      - {path: messages, type: list, required: false, description: Les réponses reçues.}
      - {path: messages.de, type: text, description: "L'adresse du profil de la personne, telle que Serge la connaît."}
      - {path: messages.texte, type: text, description: 'Son texte entier, mot pour mot.'}
      - {path: resume, type: text, description: 'Ce que tu as vu, en une phrase.'}

  - id: compter_rappels_contact
    title: Compter les rappels d'un message d'essai
    role: >-
      Un message d'essai (page Système) attend que la personne accepte le
      contact : Serge retourne voir autant de fois que la Policy a
      d'attentes (« Demande de contact, attentes avant chaque rappel »),
      puis s'arrête ; la dernière tâche dit où il en est resté. Sans LLM.
    type: capability
    capability: next_round
    queue: conversations
    priority: 50
    params:
      round: {source: task, value: rappel}
      waits: {source: fixed, value: web_accounts.contact_waits_minutes}

  - id: prevenir_compte_web
    title: Prévenir pour un compte web
    role: >-
      Un ticket d'information à Julien et Clem : un compte web est créé, ou
      sa création a raté, avec le compte rendu. Sans LLM.
    type: capability
    capability: inform_owners
    queue: conversations
    priority: 80
    params:
      title: {source: task, value: titre}
      text: {source: task, value: raison}

  # --- L'étape 2 : concevoir, critiquer, construire, relire (lot 10, Q91) ---
  # Un business choisi pour un POC est conçu, critiqué (3 tours au plus),
  # validé par un humain (ticket « Plan », 48 heures), construit dans son
  # chantier, publié en staging et relu (3 passages au plus), essayé par un
  # humain (ticket « Tester le produit », sans délai), publié en prod, et sa
  # campagne de test est prête. Les boucles sont bornées par « Compter les
  # tours » ; rien n'est propre à une invocation dans le code.
  - id: concevoir_poc
    title: Concevoir le POC
    role: >-
      Écrit le plan de A à Z du POC d'un business (hypothèse, cible, canal,
      durée, prix indicatif, livrable, ce que le constructeur doit faire,
      scénarios de test), sa fiche produit, ses questions fréquentes et sa
      campagne de test. Au tour suivant, corrige
      son plan d'après le critique ou les consignes d'un humain.
    step: conception_poc
    type: llm
    model_tier: smart
    queue: works
    priority: 30
    gets_serge_intro: true
    max_tool_turns: 6
    settings:
      duree_max_jours: {value: 10, min: 1, max: 60, policy: true, description: "La durée d'un test léger, en jours, au plus."}
    compare:
      product_plans: false
      product_sheets: false
      product_faq: false
      campaigns: false
    prompt: |
      Tu conçois le POC d'un business que Serge va tester auprès de vrais
      prospects. Un POC est un petit produit web qu'on peut vraiment
      essayer, pas une promesse. Exemple : « un générateur de devis en
      ligne : on crée un compte et on fait trois devis gratuits ». Il est
      gratuit pour les prospects : il mesure leur intérêt. Le vrai produit,
      payant, viendra plus tard, pour le business retenu.

      Tu reçois la fiche du business, les pages qui prouvent le besoin, et
      ce que Serge sait faire. À partir du deuxième tour, tu reçois aussi ton
      plan précédent et les remarques du critique ; les paramètres de la
      tâche peuvent contenir les consignes d'un humain (« consignes ») :
      corrige d'abord ce qu'ils demandent.

      Pour construire, Serge a un chantier (un conteneur Linux avec Node,
      Python et git, où un modèle code et lance le produit), un navigateur
      pour l'essayer, et la mise en ligne d'un site web sur un sous-domaine
      de Serge ; le produit garde ses données dans un dossier à lui. Il n'y
      a pas d'humain pour faire le travail, pas de compte à créer sur
      d'autres sites, pas d'API payante, pas de connexion au logiciel des
      prospects : un plan qui en a besoin est irréaliste, trouve autre
      chose.

      Écris un plan de A à Z, réalisable avec ça :
      - hypothese : ce qu'on veut vérifier, en une phrase ;
      - cible : les prospects, des professionnels (métier, taille, lieu) ;
      - canal : le canal du test, parmi les canaux branchés (tu en vois la
        liste) : son numéro, tel quel ;
      - duree_jours : la durée du test, {duree_max_jours} jours au plus ;
      - prix : le prix indicatif du futur produit payant ;
      - livrable : ce que le prospect peut essayer, en deux phrases ;
      - plan : ce que le constructeur doit faire, page par page et fonction
        par fonction, pourquoi, et comment le prospect s'en sert ;
      - scenarios : 3 à 6 scénarios de test ; chacun dit ce que fait un
        prospect ordinaire, pas à pas, du début à la fin, et ce qu'il doit
        voir. Le relecteur et l'humain qui essaie le POC les suivent tels
        quels ;
      - la fiche produit : fiche_resume (ce que fait le produit et pour
        qui), fiche_limites (ce qu'il ne fait pas), fiche_prix,
        fiche_delais, fiche_usage (comment on s'en sert) ;
      - faq : 3 à 6 questions qu'un prospect posera, avec leur réponse.

      Ce qui est réglé pour tous les produits, à ne pas redemander :
      l'éditeur des mentions légales est Julien Pesquet, une personne qui
      répond du produit, et le service est construit et tenu par Serge, un
      agent IA. Pas d'adresse ni de formulaire de contact pour l'instant :
      n'en prévois pas. Le produit peut envoyer des e-mails à ses clients
      (valider une inscription, changer un mot de passe oublié, un reçu) :
      Serge règle leur envoi.

      Le business doit être légal. Ne t'arrête pas sur des considérations
      morales qui ne sont pas contraires à la loi.
    tools:
      - tool: fiche_business
        mode: given
        label: Le business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: preuves_du_business
        mode: given
        label: Les pages qui prouvent le besoin
        max_rows: 20
        params:
          venture_id: {source: task, value: venture_id}
      - tool: capacites_de_serge
        mode: given
        label: Ce que Serge sait faire
      - tool: plan_par_numero
        mode: given
        label: Ton plan précédent (vide au premier tour)
        params:
          plan_id: {source: task, value: plan_precedent}
      - tool: critiques_du_plan
        mode: given
        label: Les remarques du critique sur ce plan
        params:
          plan_id: {source: task, value: plan_precedent}
      - tool: web_search
        mode: callable
        max_calls: 3
      - tool: canaux_branches
        mode: given
        label: Les canaux branchés
    output:
      - {path: hypothese, type: text, description: Ce qu'on veut vérifier.}
      - {path: cible, type: text, description: Les prospects visés.}
      - {path: canal, type: text, description: 'Le canal du test : le numéro d''un canal branché.'}
      - {path: duree_jours, type: number, description: La durée du test en jours.}
      - {path: prix, type: text, description: Le prix indicatif du futur produit.}
      - {path: livrable, type: text, description: Ce que le prospect peut essayer.}
      - {path: plan, type: text, description: 'Le plan de A à Z pour le constructeur.'}
      - {path: scenarios, type: text, description: "Les scénarios de test, pas à pas."}
      - {path: fiche_resume, type: text, description: Ce que fait le produit et pour qui.}
      - {path: fiche_limites, type: text, description: Ce qu'il ne fait pas.}
      - {path: fiche_prix, type: text, description: Son prix.}
      - {path: fiche_delais, type: text, description: Ses délais habituels.}
      - {path: fiche_usage, type: text, description: Comment on s'en sert.}
      - {path: faq, type: list, min_items: 1, description: Les questions fréquentes.}
      - {path: faq.question, type: text, description: La question.}
      - {path: faq.reponse, type: text, description: Sa réponse.}
    writes:
      - table: product_plans
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          kind: {source: fixed, value: poc}
          round: {source: task, value: tour}
          status: {source: fixed, value: draft}
          hypothesis: {source: field, value: hypothese}
          target: {source: field, value: cible}
          channel: {source: field, value: canal}
          duration_days: {source: field, value: duree_jours}
          price: {source: field, value: prix}
          deliverable: {source: field, value: livrable}
          plan: {source: field, value: plan}
          scenarios: {source: field, value: scenarios}
          owner_notes: {source: task, value: consignes}
      - table: product_sheets
        operation: delete
        key: {column: venture_id, source: task, value: venture_id}
      - table: product_sheets
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          summary: {source: field, value: fiche_resume}
          limits: {source: field, value: fiche_limites}
          price: {source: field, value: fiche_prix}
          delays: {source: field, value: fiche_delais}
          usage: {source: field, value: fiche_usage}
      - table: product_faq
        operation: delete
        key: {column: venture_id, source: task, value: venture_id}
      - table: product_faq
        operation: insert
        for_each: faq
        values:
          venture_id: {source: task, value: venture_id}
          question: {source: field, value: faq.question}
          answer: {source: field, value: faq.reponse}
      - table: campaigns
        operation: delete
        key: {column: venture_id, source: task, value: venture_id}
      - table: campaigns
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          phase: {source: fixed, value: smoke}
          channel: {source: field, value: canal}
          state: {source: fixed, value: DRAFT}

  - id: challenger_poc
    title: Challenger le POC
    role: >-
      Critique le plan d'un POC avant qu'un humain le valide : faisabilité
      technique, limites du produit, réalisme commercial, scénarios de
      test. Rend « bon » ou « à corriger » avec ses remarques ; un manque de
      Serge passe par « Demander une nouvelle capacité » (Q35).
    step: conception_poc
    type: llm
    model_tier: smart
    queue: works
    priority: 30
    gets_serge_intro: true
    max_tool_turns: 4
    compare:
      plan_critiques: false
      product_plans: false
    prompt: |
      Tu critiques le plan du POC d'un business, avant qu'un humain le
      valide et qu'un modèle le construise. Tu reçois le plan, la fiche
      produit, ses questions fréquentes, la fiche du business et ce que
      Serge sait faire.

      Cherche ce qui empêcherait le POC de marcher :
      - la faisabilité technique : Serge code dans un conteneur Linux avec
        Node, Python et git, essaie dans un navigateur et publie un site
        web ; pas d'humain, pas de compte sur d'autres sites, pas d'API
        payante, pas de connexion au logiciel des prospects ;
      - les limites du produit : ce qui manque pour qu'un prospect en tire
        quelque chose ;
      - le réalisme commercial : des prospects contactés par e-mail ou par
        téléphone vont-ils vraiment l'essayer ?
      - les scénarios de test : chacun doit pouvoir être suivi pas à pas
        par quelqu'un qui découvre le site.
      Exemple de remarque attendue : « le plan commence par se connecter à
      l'ERP d'une grande entreprise contactée par e-mail : c'est
      irréaliste ».

      Ce qui est réglé pour tous les produits n'est pas une remarque :
      l'éditeur des mentions légales est Julien Pesquet, une personne, et
      le service est tenu par Serge, un agent IA ; pas d'adresse ni de
      formulaire de contact pour l'instant ; le produit peut envoyer des
      e-mails (valider une inscription, changer un mot de passe), et Serge
      règle leur envoi.

      Chaque remarque est « à corriger » : le plan est mal fait mais
      faisable avec ce que Serge sait déjà faire ; dis précisément quoi
      changer. S'il manque à Serge un outil ou un accès, n'en fais pas une
      remarque : appelle l'outil « Demander une nouvelle capacité ».

      Rends le verdict « bon » si le plan peut être construit tel quel,
      sinon « a_corriger » avec tes remarques. Ne cherche pas la petite
      bête : un plan réaliste et clair est bon.
    tools:
      - tool: plan_par_numero
        mode: given
        label: Le plan
        params:
          plan_id: {source: task, value: plan_id}
      - tool: fiche_business
        mode: given
        label: Le business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: capacites_de_serge
        mode: given
        label: Ce que Serge sait faire
    output:
      - {path: verdict, type: choice, choices: [bon, a_corriger], description: 'Le plan peut-il être construit tel quel ?'}
      - {path: avis, type: text, description: 'Ton avis en deux phrases.'}
      - {path: remarques, type: list, required: false, description: Les remarques à corriger.}
      - {path: remarques.texte, type: text, description: 'La remarque : quoi changer, précisément.'}
    writes:
      - table: plan_critiques
        operation: insert
        for_each: remarques
        values:
          plan_id: {source: task, value: plan_id}
          venture_id: {source: task, value: venture_id}
          round: {source: task, value: tour}
          text: {source: field, value: remarques.texte}
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        values:
          status: {source: fixed, value: challenged}
          challenge: {source: field, value: avis}

  - id: compter_tours_plan
    title: Compter les tours de critique
    role: >-
      Après une critique « à corriger » : renvoie le plan à la conception
      tant qu'il reste des tours, sinon au ticket « Plan » tel qu'il est
      (Q35). Sans LLM.
    step: conception_poc
    type: capability
    capability: next_round
    queue: works
    priority: 30
    settings:
      tours_max: {value: 3, min: 1, max: 10, policy: true, description: "Les tours de critique d'un plan, au plus."}
    params:
      round: {source: task, value: tour}
      max: {source: setting, value: tours_max}

  - id: demander_validation_plan
    title: Faire valider le plan du POC
    role: >-
      Ouvre le ticket « Plan » : le business, le plan, la critique, la
      fiche produit. Valider lance la construction ; sans réponse sous 48
      heures, le plan s'applique (Q34). Sans LLM.
    step: conception_poc
    type: capability
    capability: ask_owners
    queue: conversations
    priority: 80
    params:
      ticket_type: {source: fixed, value: PLAN_POC}
      ref_table: {source: fixed, value: product_plans}
      ref_id: {source: task, value: plan_id}
      raison: {source: fixed, value: 'Le plan de ce POC est prêt : le valider lance sa construction.'}
      title: {source: fixed, value: Le plan d'un POC attend ton avis}

  - id: suite_plan_poc
    title: Suite du ticket « Plan »
    role: >-
      La réponse au ticket « Plan » : « Valider » lance la construction,
      « À corriger » renvoie le plan à la conception avec les consignes,
      « Arrêter le business » l'arrête et libère sa place de test. Sans
      LLM.
    step: conception_poc
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      acte: {source: task, value: acte}
      texte: {source: task, value: texte}
      plan_id: {source: task, value: plan_id}
      venture_id: {source: task, value: venture_id}
    writes:
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        condition: {field: acte, op: '=', value: valider}
        values:
          status: {source: fixed, value: validated}
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        condition: {field: acte, op: '=', value: a_corriger}
        values:
          status: {source: fixed, value: to_fix}
          owner_notes: {source: task, value: texte}
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        condition: {field: acte, op: '=', value: arreter_business}
        values:
          status: {source: fixed, value: refused}
      - table: ventures
        operation: update
        key: {column: id, source: task, value: venture_id}
        condition: {field: acte, op: '=', value: arreter_business}
        values:
          lifecycle: {source: fixed, value: KILLED}

  - id: construire_poc
    title: Construire le POC
    role: >-
      Construit le POC dans le chantier du business, le vérifie par des
      commandes (le relecteur l'essaie dans le navigateur), et rend son compte
      rendu. Il reprend le passage précédent : les remarques du relecteur, les
      consignes d'un humain, ou une publication ratée.
    step: conception_poc
    type: llm
    model_tier: code
    queue: works
    priority: 30
    max_tool_turns: 200
    compare:
      builds: false
    prompt: |
      Tu construis le POC d'un business : un petit produit web que des
      prospects vont vraiment essayer. Il doit marcher pour eux du premier
      coup.

      Tu reçois le plan validé (ce qu'il faut faire, et les scénarios de
      test), la fiche produit et ses questions fréquentes, et les passages
      de construction précédents : le compte rendu du constructeur d'avant,
      le verdict et les remarques du relecteur, qui a essayé le produit en
      ligne. Les paramètres de la tâche peuvent contenir les consignes d'un
      humain (« consignes ») ou la raison d'une publication ratée
      (« probleme », « journal ») : traite-les d'abord.

      Tu travailles dans un chantier : un conteneur Linux (Debian, avec
      git, Python 3 et Node), dossier /work, où tes fichiers restent d'une
      tâche à l'autre. Tes outils : lancer une commande (au besoin en
      arrière-plan, pour un serveur), lire, écrire et modifier un fichier.
      Tu peux appeler plusieurs outils d'un coup.

      Les e-mails que le produit envoie à ses clients (valider une
      inscription, changer un mot de passe oublié, un reçu) :
      - envoie-les par SMTP avec les variables d'environnement SMTP_HOST,
        SMTP_PORT, SMTP_USER, SMTP_PASS et MAIL_FROM (l'expéditeur), lues
        au démarrage ; utilise STARTTLS quand le serveur le propose, et ne
        t'identifie pas si SMTP_USER est vide. Dans le chantier et en
        staging, une boîte d'essai garde les e-mails, quel que soit le
        destinataire, et rien ne part : le relecteur et Julien les y
        lisent. En prod, ils partent vraiment ;
      - n'envoie que ce qu'un client attend, jamais de lettre
        d'information : tous les produits de Serge partagent 100 e-mails
        par jour. Au plus quelques e-mails par heure et par adresse, et un
        nombre limité d'inscriptions par heure et par adresse IP, contre
        les robots ;
      - pas d'adresse ni de formulaire de contact pour l'instant, même si
        le plan ou la fiche produit en parlent ;
      - les mentions légales nomment l'éditeur, Julien Pesquet, une
        personne qui répond du produit, et disent que le service est
        construit et tenu par Serge, un agent IA.

      Règles :
      - choisis les langages et les outils que tu veux ; fais simple et
        solide ;
      - à la racine de /work, un Dockerfile qui construit et lance le
        produit. Le produit écoute sur le port de la variable PORT (8080),
        garde ses données dans le dossier de la variable DATA_DIR (/data),
        et connaît son adresse publique par PUBLIC_URL ;
      - le POC est gratuit : aucun paiement ;
      - en français, propre et clair sur ordinateur comme sur mobile ;
      - n'essaie pas le POC dans un navigateur : le relecteur le fera en
        ligne, scénario par scénario, sur ordinateur et sur mobile.
        Vérifie ton travail par des commandes : des tests automatiques et
        quelques requêtes au serveur lancé dans le chantier (curl). Docker
        n'est pas dans le chantier : lance le produit comme le ferait le
        Dockerfile ;
      - vérifie toujours les certificats TLS, du SMTP comme des API : ne
        désactive jamais leur vérification ;
      - s'il te manque un outil ou un accès, appelle « Demander une
        nouvelle capacité ».

      Rends fini « oui » si le produit est prêt à être publié, sinon
      « non » ; ton compte rendu : ce que tu as fait, comment tu l'as
      vérifié, ce qui reste.
    tools:
      - tool: plan_valide_du_poc
        mode: given
        label: Le plan validé
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: passages_du_livrable
        mode: given
        label: Les passages de construction précédents
        max_rows: 3
        params:
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: poc}
      - tool: chantier_commande
        mode: callable
        params: &chantier_poc
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: poc}
          profile: {source: fixed, value: chantier}
      - tool: chantier_lire
        mode: callable
        params: *chantier_poc
      - tool: chantier_ecrire
        mode: callable
        params: *chantier_poc
      - tool: chantier_modifier
        mode: callable
        params: *chantier_poc
    output:
      - {path: fini, type: choice, choices: [oui, non], description: 'Le produit est-il prêt à être publié ?'}
      - {path: compte_rendu, type: text, description: 'Ce qui a été fait, vérifié, et ce qui reste.'}
    writes:
      - table: builds
        operation: insert
        condition: {field: fini, op: '=', value: oui}
        values:
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: poc}
          pass: {source: task, value: passage}
          status: {source: fixed, value: built}
          report: {source: field, value: compte_rendu}
          owner_notes: {source: task, value: consignes}
      - table: builds
        operation: insert
        condition: {field: fini, op: '=', value: non}
        values:
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: poc}
          pass: {source: task, value: passage}
          status: {source: fixed, value: unfinished}
          report: {source: field, value: compte_rendu}
          owner_notes: {source: task, value: consignes}

  - id: compter_reprises
    title: Compter les reprises de la construction
    role: >-
      Une construction pas finie (plafond du jour atteint, travail trop
      long) ou une publication ratée : la construction reprend, dans le même
      passage, tant qu'il reste des reprises ; sinon le produit est publié
      tel qu'il est. Sans LLM.
    step: conception_poc
    type: capability
    capability: next_round
    queue: works
    priority: 30
    settings:
      reprises_max: {value: 3, min: 1, max: 10, policy: true, description: "Les reprises d'un même passage de construction, au plus."}
    params:
      round: {source: task, value: reprise}
      max: {source: setting, value: reprises_max}

  - id: publier_staging_poc
    title: Publier le POC en staging
    role: >-
      Fige le chantier du POC en une version, la construit et la met en
      ligne sur staging-<produit>.<domaine>, non indexé. Sans LLM.
    step: conception_poc
    type: capability
    capability: publish_version
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
      deliverable: {source: fixed, value: poc}
      target: {source: fixed, value: staging}
      task_id: {source: task, value: task_id}

  - id: relire_poc
    title: Relire le POC
    role: >-
      Essaie le POC en ligne comme un prospect ordinaire, sans voir son
      code : suit chaque scénario de test sur ordinateur puis sur mobile,
      garde ses captures, et rend « bon » ou « à corriger » avec ses
      remarques.
    step: conception_poc
    type: llm
    model_tier: web
    queue: works
    priority: 30
    max_tool_turns: 60
    compare:
      builds: false
    prompt: |
      Tu essaies le POC d'un business comme le ferait un prospect ordinaire
      qui le découvre : tu ne vois pas son code, seulement le site en ligne
      (son adresse est dans les paramètres de la tâche, « url »). Tu
      reçois le plan validé, avec ses scénarios de test, et la fiche
      produit.

      Suis chaque scénario pas à pas, d'abord sur ordinateur, puis sur
      mobile : lis la page, clique, tape, comme une personne. Si le POC te demande une adresse e-mail,
      prends la tienne : « Ma boîte e-mail » te la donne, et te montre les
      e-mails qu'il t'envoie. Prends une
      capture à chaque étape importante, garde-la (keep), et lis les
      erreurs de la page. Regarde vraiment l'écran : un bouton qui sort de
      l'écran, un texte illisible, un formulaire qui ne réagit pas, une
      page blanche, un message d'erreur, ce qui manque par rapport à la
      fiche produit.

      Rends le verdict « bon » si un prospect peut faire chaque scénario
      sans aide et sans tomber sur une erreur ; sinon « a_corriger ». Tes
      remarques disent, pour chaque problème, le scénario, l'étape, ce que
      tu as vu, ce qui était attendu, et le numéro de la capture. Ton
      compte rendu dit ce que tu as essayé et ce qui marche.
    tools:
      - tool: plan_valide_du_poc
        mode: given
        label: Le plan validé et ses scénarios de test
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: navigateur_agir
        mode: callable
        params: &navigateur_poc
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: poc}
          task_id: {source: task, value: task_id}
      - tool: navigateur_lire
        mode: callable
        params: *navigateur_poc
      - tool: navigateur_capture
        mode: callable
        params: *navigateur_poc
      - tool: boite_mail
        mode: callable
        params: &boite_de_la_tache
          task_id: {source: task, value: task_id}
    output:
      - {path: verdict, type: choice, choices: [bon, a_corriger], description: 'Un prospect peut-il faire chaque scénario ?'}
      - {path: remarques, type: text, description: 'Les problèmes trouvés, un par ligne ; vide si tout va bien.'}
      - {path: compte_rendu, type: text, description: Ce qui a été essayé et ce qui marche.}
    writes:
      - table: builds
        operation: update
        key: {column: id, source: task, value: build_id}
        values:
          status: {source: fixed, value: reviewed}
          verdict: {source: field, value: verdict}
          remarks: {source: field, value: remarques}
          review: {source: field, value: compte_rendu}

  - id: compter_passages
    title: Compter les passages de construction
    role: >-
      Après une relecture « à corriger » : la construction reprend pour un
      nouveau passage tant qu'il en reste, sinon le POC va au ticket
      « Tester le produit » tel qu'il est (Q41). Sans LLM.
    step: conception_poc
    type: capability
    capability: next_round
    queue: works
    priority: 30
    settings:
      passages_max: {value: 3, min: 1, max: 10, policy: true, description: "Les passages de construction et de relecture, au plus."}
    params:
      round: {source: task, value: passage}
      max: {source: setting, value: passages_max}

  - id: demander_test_poc
    title: Faire essayer le POC
    role: >-
      Ouvre le ticket « Tester le produit » : le business, les scénarios de
      test, l'adresse du staging et le verdict du relecteur. Il n'expire
      jamais : rien ne part vers des prospects sans qu'un humain ait essayé
      le produit (Q91). Sans LLM.
    step: conception_poc
    type: capability
    capability: ask_owners
    queue: conversations
    priority: 80
    params:
      ticket_type: {source: fixed, value: TEST_POC}
      ref_table: {source: fixed, value: builds}
      ref_id: {source: task, value: build_id}
      raison: {source: fixed, value: 'Le POC est en ligne en staging : essaie-le comme un prospect, avec les scénarios de test.'}
      title: {source: fixed, value: Un POC attend que tu l'essaies}

  - id: suite_test_poc
    title: Suite du ticket « Tester le produit »
    role: >-
      La réponse au ticket « Tester le produit » : « Valider » met le POC
      en prod, « À corriger » relance la construction avec les consignes,
      « Arrêter le business » l'arrête et libère sa place de test. Sans
      LLM.
    step: conception_poc
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      acte: {source: task, value: acte}
      texte: {source: task, value: texte}
      build_id: {source: task, value: build_id}
      venture_id: {source: task, value: venture_id}
    writes:
      - table: builds
        operation: update
        key: {column: id, source: task, value: build_id}
        condition: {field: acte, op: '=', value: a_corriger}
        values:
          owner_notes: {source: task, value: texte}
      - table: ventures
        operation: update
        key: {column: id, source: task, value: venture_id}
        condition: {field: acte, op: '=', value: arreter_business}
        values:
          lifecycle: {source: fixed, value: KILLED}

  - id: publier_prod_poc
    title: Publier le POC en prod
    role: >-
      Passe la version du staging en prod, sur <produit>.<domaine> : rien
      n'est reconstruit. Sans LLM.
    step: conception_poc
    type: capability
    capability: publish_version
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
      deliverable: {source: fixed, value: poc}
      target: {source: fixed, value: prod}
      task_id: {source: task, value: task_id}

  - id: poc_pret
    title: POC prêt pour le test léger
    role: >-
      Le POC est en ligne et validé : sa campagne de test passe à prête, et
      le business au test léger (étape 3). Sans LLM.
    step: conception_poc
    type: capability
    capability: echo
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
    writes:
      - table: campaigns
        operation: update
        key: {column: venture_id, source: task, value: venture_id}
        values:
          state: {source: fixed, value: READY}
      - table: ventures
        operation: update
        key: {column: id, source: task, value: venture_id}
        values:
          lifecycle: {source: fixed, value: SMOKE_READY}

  - id: prevenir_prod_ratee
    title: Prévenir d'une mise en prod ratée
    role: >-
      La version validée n'a pas pu passer en prod : un ticket
      d'information prévient Julien et Clem, avec la raison. Sans LLM.
    step: conception_poc
    type: capability
    capability: inform_owners
    queue: conversations
    priority: 80
    params:
      title: {source: fixed, value: Un POC validé n'a pas pu passer en prod}
      text: {source: task, value: raison}

  - id: supprimer_de_stripe
    title: Supprimer un business de Stripe
    role: >-
      Archive dans Stripe les prix et les produits d'un business (ceux qui
      portent son identifiant), dans le mode donné : test ou vrai. Stripe ne
      permet pas de supprimer un prix : archivé, il ne peut plus être payé.
      Lancé depuis la fiche du business, pour nettoyer après un essai
      (Q91).
    type: llm
    model_tier: fast
    queue: works
    priority: 30
    max_tool_turns: 12
    prompt: |
      Tu nettoies Stripe pour un business : son numéro est dans les
      paramètres de la tâche (venture_id). Cherche ses produits avec la
      recherche metadata['venture_id']:'<son numéro>' ; pour chaque
      produit, liste ses prix, archive chaque prix encore actif, puis
      archive le produit. Ne touche à aucun produit qui ne porte pas ce
      numéro. Rends le nombre de produits archivés et un compte rendu.
    tools:
      - tool: stripe_chercher_produits
        mode: callable
        params:
          service: {source: task, value: service}
          task_id: {source: task, value: task_id}
      - tool: stripe_lister_prix
        mode: callable
        params:
          service: {source: task, value: service}
          task_id: {source: task, value: task_id}
      - tool: stripe_archiver_prix
        mode: callable
        params:
          service: {source: task, value: service}
          task_id: {source: task, value: task_id}
          active: {source: fixed, value: 'false'}
      - tool: stripe_archiver_produit
        mode: callable
        params:
          service: {source: task, value: service}
          task_id: {source: task, value: task_id}
          active: {source: fixed, value: 'false'}
    output:
      - {path: produits, type: number, description: Le nombre de produits archivés.}
      - {path: compte_rendu, type: text, description: "Ce qui a été archivé, et ce qui a raté."}

  - id: concevoir_produit
    title: Concevoir le produit
    role: >-
      Écrit le plan de A à Z du produit fini, payant, d'un business : à
      partir du POC, des demandes de ses clients et des réponses de ses
      prospects ; son prix définitif, son nom de domaine (libre), sa fiche
      produit, et ce qu'il fait de chaque demande des clients. Au tour
      suivant, corrige son plan d'après le critique ou un humain.
    step: build_venture
    type: llm
    model_tier: smart
    queue: works
    priority: 30
    gets_serge_intro: true
    max_tool_turns: 8
    compare:
      product_plans: false
      product_sheets: false
      product_faq: false
      customer_requests: false
    prompt: |
      Tu conçois le vrai produit d'un business : un service web payant, que
      ses clients vont utiliser et payer chaque mois. On paie pour avoir un
      compte et utiliser le service ; c'est le seul modèle de paiement.

      Tu reçois la fiche du business, le plan de son POC (le petit produit
      gratuit qui a servi au test léger), la fiche produit, ses questions
      fréquentes, les demandes de ses clients (bugs, insatisfactions,
      idées), ce qu'ont répondu ses prospects, et ce que Serge sait faire.
      À partir du deuxième tour, tu reçois aussi ton plan précédent et les
      remarques du critique ; les paramètres de la tâche peuvent contenir
      les consignes d'un humain (« consignes ») : corrige d'abord ce
      qu'elles demandent.

      Pour construire, Serge a un chantier (un conteneur Linux avec Node,
      Python et git, où un modèle code et lance le produit), un navigateur
      pour l'essayer, la mise en ligne d'un site web, et Stripe pour les
      paiements (une page de paiement Stripe, des abonnements). Le produit
      garde ses données dans un dossier à lui. Pas d'humain pour faire le
      travail, pas de compte sur d'autres sites, pas d'API payante, pas de
      connexion au logiciel des clients.

      Écris un plan de A à Z, réalisable avec ça :
      - hypothese : ce que le produit doit prouver, en une phrase ;
      - cible : ses clients (métier, taille, lieu) ;
      - prix : le prix définitif, par mois ou par an, en euros (exemple :
        « 19 € par mois ») ; ce que l'on a gratuitement avant de payer, s'il
        y a quelque chose ;
      - livrable : ce que le client obtient, en deux phrases ;
      - plan : ce que le constructeur doit faire, page par page et fonction
        par fonction : l'inscription, la connexion, le paiement de
        l'abonnement par Stripe, ce que le compte payant débloque, et
        comment le client s'en sert ;
      - scenarios : 4 à 8 scénarios de test ; chacun dit ce que fait un
        client ordinaire, pas à pas, et ce qu'il doit voir. L'un d'eux va
        jusqu'au paiement de l'abonnement, avec la carte de test de Stripe,
        et vérifie ce qu'il débloque ;
      - domaine : un nom de domaine court, facile à dire, libre (vérifie-le
        avec l'outil « Un nom de domaine est-il libre ? ») ; un .com est
        mieux, mais une autre extension convient ; exemple :
        devis-artisan.com ;
      - la fiche produit : fiche_resume, fiche_limites, fiche_prix,
        fiche_delais, fiche_usage ;
      - faq : 3 à 8 questions qu'un client posera, avec leur réponse ;
      - demandes : pour chaque demande des clients que tu reçois, son
        numéro, ta décision (retenue ou refusee) et sa raison, en une
        phrase. Retiens ce qui fera payer ou rester des clients ; refuse ce
        qui est trop rare, trop cher à faire, ou hors du produit.

      Ce qui est réglé pour tous les produits, à ne pas redemander :
      l'éditeur des mentions légales est Julien Pesquet, une personne qui
      répond du produit, et le service est construit et tenu par Serge, un
      agent IA. Pas d'adresse ni de formulaire de contact pour l'instant :
      n'en prévois pas. Le produit peut envoyer des e-mails à ses clients
      (valider une inscription, changer un mot de passe oublié, un reçu) :
      Serge règle leur envoi.

      Le business doit être légal. Ne t'arrête pas sur des considérations
      morales qui ne sont pas contraires à la loi.
    tools:
      - tool: fiche_business
        mode: given
        label: Le business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: plan_valide_du_poc
        mode: given
        label: Le plan du POC
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: demandes_des_clients
        mode: given
        label: Les demandes des clients
        max_rows: 60
        params:
          venture_id: {source: task, value: venture_id}
      - tool: reponses_des_prospects
        mode: given
        label: Ce qu'ont répondu les prospects
        max_rows: 40
        params:
          venture_id: {source: task, value: venture_id}
      - tool: capacites_de_serge
        mode: given
        label: Ce que Serge sait faire
      - tool: plan_produit_par_numero
        mode: given
        label: Ton plan précédent (vide au premier tour)
        params:
          plan_id: {source: task, value: plan_precedent}
      - tool: critiques_du_plan
        mode: given
        label: Les remarques du critique sur ce plan
        params:
          plan_id: {source: task, value: plan_precedent}
      - tool: cloudflare_disponibilite
        mode: callable
        max_calls: 4
      - tool: web_search
        mode: callable
        max_calls: 3
    output:
      - {path: hypothese, type: text, description: Ce que le produit doit prouver.}
      - {path: cible, type: text, description: Ses clients.}
      - {path: prix, type: text, description: 'Le prix définitif, par mois ou par an.'}
      - {path: livrable, type: text, description: Ce que le client obtient.}
      - {path: plan, type: text, description: 'Le plan de A à Z pour le constructeur.'}
      - {path: scenarios, type: text, description: "Les scénarios de test, pas à pas."}
      - {path: domaine, type: text, description: 'Le nom de domaine proposé, libre : devis-artisan.fr.'}
      - {path: fiche_resume, type: text, description: Ce que fait le produit et pour qui.}
      - {path: fiche_limites, type: text, description: Ce qu'il ne fait pas.}
      - {path: fiche_prix, type: text, description: Son prix.}
      - {path: fiche_delais, type: text, description: Ses délais habituels.}
      - {path: fiche_usage, type: text, description: Comment on s'en sert.}
      - {path: faq, type: list, min_items: 1, description: Les questions fréquentes.}
      - {path: faq.question, type: text, description: La question.}
      - {path: faq.reponse, type: text, description: Sa réponse.}
      - {path: demandes, type: list, required: false, description: Ce que le plan fait de chaque demande des clients.}
      - {path: demandes.numero, type: text, description: Le numéro de la demande.}
      - {path: demandes.decision, type: choice, choices: [retenue, refusee], description: Retenue ou refusée.}
      - {path: demandes.raison, type: text, description: 'Pourquoi, en une phrase.'}
    writes:
      - table: product_plans
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          kind: {source: fixed, value: product}
          round: {source: task, value: tour}
          status: {source: fixed, value: draft}
          hypothesis: {source: field, value: hypothese}
          target: {source: field, value: cible}
          price: {source: field, value: prix}
          deliverable: {source: field, value: livrable}
          plan: {source: field, value: plan}
          scenarios: {source: field, value: scenarios}
          domain: {source: field, value: domaine}
          owner_notes: {source: task, value: consignes}
      - table: product_sheets
        operation: delete
        key: {column: venture_id, source: task, value: venture_id}
      - table: product_sheets
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          summary: {source: field, value: fiche_resume}
          limits: {source: field, value: fiche_limites}
          price: {source: field, value: fiche_prix}
          delays: {source: field, value: fiche_delais}
          usage: {source: field, value: fiche_usage}
      - table: product_faq
        operation: delete
        key: {column: venture_id, source: task, value: venture_id}
      - table: product_faq
        operation: insert
        for_each: faq
        values:
          venture_id: {source: task, value: venture_id}
          question: {source: field, value: faq.question}
          answer: {source: field, value: faq.reponse}
      - table: customer_requests
        operation: update
        for_each: demandes
        parent: 0
        key: {column: id, source: field, value: demandes.numero}
        condition: {field: demandes.decision, op: '=', value: retenue}
        values:
          status: {source: fixed, value: kept}
          reason: {source: field, value: demandes.raison}
          plan_id: {source: parent_row, value: id}
      - table: customer_requests
        operation: update
        for_each: demandes
        parent: 0
        key: {column: id, source: field, value: demandes.numero}
        condition: {field: demandes.decision, op: '=', value: refusee}
        values:
          status: {source: fixed, value: refused}
          reason: {source: field, value: demandes.raison}
          plan_id: {source: parent_row, value: id}

  - id: challenger_produit
    title: Challenger le produit
    role: >-
      Critique le plan du produit fini avant qu'un humain le valide :
      faisabilité technique, paiement, prix, nom de domaine, demandes des
      clients retenues, scénarios de test. Rend « bon » ou « à corriger »
      avec ses remarques.
    step: build_venture
    type: llm
    model_tier: smart
    queue: works
    priority: 30
    gets_serge_intro: true
    max_tool_turns: 4
    compare:
      plan_critiques: false
      product_plans: false
    prompt: |
      Tu critiques le plan du produit fini d'un business, avant qu'un
      humain le valide et qu'un modèle le construise. C'est un service web
      payant : on paie un abonnement par Stripe pour avoir un compte. Tu
      reçois le plan, la fiche produit, ses questions fréquentes, les
      demandes des clients avec ce que le plan en a fait, la fiche du
      business et ce que Serge sait faire.

      Cherche ce qui empêcherait le produit de marcher ou de se vendre :
      - la faisabilité technique : Serge code dans un conteneur Linux avec
        Node, Python et git, essaie dans un navigateur, publie un site web
        et encaisse par Stripe ; pas d'humain, pas de compte sur d'autres
        sites, pas d'API payante ;
      - le paiement : l'inscription, le paiement de l'abonnement, ce qu'il
        débloque, ce qui se passe quand il s'arrête ;
      - le prix : réaliste pour ces clients ?
      - le nom de domaine : court, facile à dire, en rapport avec le
        produit ;
      - les demandes des clients : ce qui est retenu est-il faisable, et
        ce qui est refusé l'est-il pour une bonne raison ?
      - les scénarios de test : chacun doit pouvoir être suivi pas à pas
        par quelqu'un qui découvre le site, et l'un va jusqu'au paiement.

      Ce qui est réglé pour tous les produits n'est pas une remarque :
      l'éditeur des mentions légales est Julien Pesquet, une personne, et
      le service est tenu par Serge, un agent IA ; pas d'adresse ni de
      formulaire de contact pour l'instant ; le produit peut envoyer des
      e-mails (valider une inscription, changer un mot de passe), et Serge
      règle leur envoi.

      Chaque remarque est « à corriger » : dis précisément quoi changer.
      S'il manque à Serge un outil ou un accès, n'en fais pas une
      remarque : appelle l'outil « Demander une nouvelle capacité ».

      Rends le verdict « bon » si le plan peut être construit et vendu tel
      quel, sinon « a_corriger » avec tes remarques. Ne cherche pas la
      petite bête : un plan réaliste et clair est bon.
    tools:
      - tool: plan_produit_par_numero
        mode: given
        label: Le plan
        params:
          plan_id: {source: task, value: plan_id}
      - tool: fiche_business
        mode: given
        label: Le business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: demandes_des_clients
        mode: given
        label: Les demandes des clients
        max_rows: 60
        params:
          venture_id: {source: task, value: venture_id}
      - tool: capacites_de_serge
        mode: given
        label: Ce que Serge sait faire
    output:
      - {path: verdict, type: choice, choices: [bon, a_corriger], description: 'Le plan peut-il être construit et vendu tel quel ?'}
      - {path: avis, type: text, description: 'Ton avis en deux phrases.'}
      - {path: remarques, type: list, required: false, description: Les remarques à corriger.}
      - {path: remarques.texte, type: text, description: 'La remarque : quoi changer, précisément.'}
    writes:
      - table: plan_critiques
        operation: insert
        for_each: remarques
        values:
          plan_id: {source: task, value: plan_id}
          venture_id: {source: task, value: venture_id}
          round: {source: task, value: tour}
          text: {source: field, value: remarques.texte}
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        values:
          status: {source: fixed, value: challenged}
          challenge: {source: field, value: avis}

  - id: compter_tours_produit
    title: Compter les tours de critique du produit
    role: >-
      Après une critique « à corriger » : renvoie le plan du produit à la
      conception tant qu'il reste des tours, sinon au ticket « Plan » tel
      qu'il est (Q41). Sans LLM.
    step: build_venture
    type: capability
    capability: next_round
    queue: works
    priority: 30
    settings:
      tours_max: {value: 3, min: 1, max: 10, policy: true, description: "Les tours de critique du plan d'un produit, au plus."}
    params:
      round: {source: task, value: tour}
      max: {source: setting, value: tours_max}

  - id: demander_validation_produit
    title: Faire valider le plan du produit
    role: >-
      Ouvre le ticket « Plan » du produit fini : le plan, le prix définitif,
      le nom de domaine, la critique, la fiche produit et les demandes des
      clients. Il n'expire jamais : il fixe le prix et le domaine (Q91).
      Sans LLM.
    step: build_venture
    type: capability
    capability: ask_owners
    queue: conversations
    priority: 80
    params:
      ticket_type: {source: fixed, value: PLAN_PRODUIT}
      ref_table: {source: fixed, value: product_plans}
      ref_id: {source: task, value: plan_id}
      raison: {source: fixed, value: "Le plan du produit fini est prêt : son prix et son nom de domaine aussi. Le valider lance sa construction ; le domaine sera acheté après ton essai du produit."}
      title: {source: fixed, value: Le plan d'un produit attend ton avis}

  - id: suite_plan_produit
    title: Suite du ticket « Plan » du produit
    role: >-
      La réponse au ticket « Plan » du produit : « Valider » lance la
      construction (d'abord le produit dans Stripe, en mode test), « À
      corriger » renvoie le plan à la conception avec les consignes,
      « Arrêter le business » l'arrête. Sans LLM.
    step: build_venture
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      acte: {source: task, value: acte}
      texte: {source: task, value: texte}
      plan_id: {source: task, value: plan_id}
      venture_id: {source: task, value: venture_id}
    writes:
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        condition: {field: acte, op: '=', value: valider}
        values:
          status: {source: fixed, value: validated}
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        condition: {field: acte, op: '=', value: a_corriger}
        values:
          status: {source: fixed, value: to_fix}
          owner_notes: {source: task, value: texte}
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        condition: {field: acte, op: '=', value: arreter_business}
        values:
          status: {source: fixed, value: refused}
      - table: ventures
        operation: update
        key: {column: id, source: task, value: venture_id}
        condition: {field: acte, op: '=', value: arreter_business}
        values:
          lifecycle: {source: fixed, value: KILLED}

  - id: vendre_en_mode_test
    title: Créer le produit dans Stripe, en mode test
    role: >-
      Avant la construction : crée dans Stripe, en mode test, le produit du
      business et son prix (l'abonnement du plan validé), avec la clé de
      recherche que le produit utilisera. Le staging encaisse ainsi avec la
      carte de test de Stripe, comme la prod encaissera en vrai.
    step: build_venture
    type: llm
    model_tier: mid
    queue: works
    priority: 30
    max_tool_turns: 6
    prompt: &prompt_vendre |
      Tu mets en vente dans Stripe le produit d'un business, pour le mode
      de Stripe réglé sur tes outils. Tu reçois le plan validé, avec son
      prix (exemple : « 19 € par mois »), et la fiche du business.

      1. Cherche d'abord si le produit existe déjà dans Stripe pour ce
         business. « Trouver un prix Stripe par sa clé de recherche » rend
         son prix s'il en a un : son produit est le champ product. Sans
         prix rendu, la recherche (metadata['venture_id']:'<numéro du
         business>', le numéro est dans les paramètres de la tâche) dit
         s'il a un produit sans prix ; elle ne voit un produit qu'une
         minute environ après sa création. S'il existe, garde-le ; sinon,
         crée-le avec le nom du business et une phrase qui dit ce qu'il
         fait.
      2. Crée son prix : le montant en centimes (19 € : 1900), eur, et
         l'intervalle de l'abonnement (month ou year). L'identifiant du
         business et la clé de recherche sont ajoutés tout seuls.

      Rends ok « oui » si le produit et son prix existent, avec leurs
      identifiants ; sinon « non », et la raison donnée par Stripe.
    tools:
      - tool: plan_valide_du_produit
        mode: given
        label: Le plan validé
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_business
        mode: given
        label: Le business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: stripe_prix_par_cle
        mode: callable
        params:
          service: {source: fixed, value: stripe_test}
          'lookup_keys[0]': {source: task, value: venture_id}
          active: {source: fixed, value: 'true'}
          task_id: {source: task, value: task_id}
      - tool: stripe_chercher_produits
        mode: callable
        params:
          service: {source: fixed, value: stripe_test}
          task_id: {source: task, value: task_id}
      - tool: stripe_creer_produit
        mode: callable
        max_calls: 1
        params:
          service: {source: fixed, value: stripe_test}
          'metadata[venture_id]': {source: task, value: venture_id}
          task_id: {source: task, value: task_id}
      - tool: stripe_creer_prix_du_produit
        mode: callable
        max_calls: 1
        params:
          service: {source: fixed, value: stripe_test}
          'metadata[venture_id]': {source: task, value: venture_id}
          lookup_key: {source: task, value: venture_id}
          transfer_lookup_key: {source: fixed, value: 'true'}
          task_id: {source: task, value: task_id}
    output: &sortie_vendre
      - {path: ok, type: choice, choices: [oui, non], description: 'Le produit et son prix existent-ils dans Stripe ?'}
      - {path: produit, type: text, required: false, description: Le produit (prod_…).}
      - {path: prix, type: text, required: false, description: Le prix (price_…).}
      - {path: raison, type: text, required: false, description: "Ce que Stripe a répondu, si ça n'a pas marché."}

  - id: construire_produit
    title: Construire le produit
    role: >-
      Construit le produit fini, payant, dans son chantier : comptes, e-mails,
      abonnement par Stripe (en mode test dans le chantier et en staging), le
      service lui-même ; le vérifie par des commandes (le relecteur l'essaie
      dans le navigateur, paiement compris). Reprend le passage précédent :
      les remarques du relecteur, les consignes d'un humain, ou une
      publication ratée.
    step: build_venture
    type: llm
    model_tier: code
    queue: works
    priority: 30
    max_tool_turns: 200
    compare:
      builds: false
    prompt: |
      Tu construis le produit fini d'un business : un service web payant,
      que de vrais clients vont utiliser et payer. Il doit marcher pour eux
      du premier coup, paiement compris.

      Tu reçois le plan validé (ce qu'il faut faire, le prix, et les
      scénarios de test), la fiche produit, ses questions fréquentes, les
      demandes des clients (fais celles qui sont retenues), et les
      passages de construction précédents : le compte rendu du
      constructeur d'avant, le verdict et les remarques du relecteur, qui a
      essayé le produit en ligne. Les paramètres de la tâche contiennent le
      numéro du business (venture_id), et parfois les consignes d'un
      humain (« consignes ») ou la raison d'une publication ratée
      (« probleme », « journal ») : traite-les d'abord.

      Tu travailles dans un chantier : un conteneur Linux (Debian, avec
      git, Python 3 et Node), dossier /work, où tes fichiers restent d'une
      tâche à l'autre. Tes outils : lancer une commande (au besoin en
      arrière-plan, pour un serveur), lire, écrire et modifier un fichier.
      Tu peux appeler plusieurs outils d'un coup.

      Le paiement, par Stripe :
      - la clé secrète de Stripe est dans la variable d'environnement
        STRIPE_SECRET_KEY (en mode test dans le chantier et en staging, en
        vrai mode en prod) ; ne l'écris jamais dans un fichier ni dans une
        page ;
      - le prix de l'abonnement existe déjà dans Stripe ; retrouve-le par
        sa clé de recherche, le numéro du business : GET /v1/prices avec
        lookup_keys[]=<venture_id> et active=true ;
      - le client paie sur la page de paiement de Stripe : crée une
        session Checkout en mode subscription pour ce prix, avec
        success_url (qui revient sur le produit avec {CHECKOUT_SESSION_ID})
        et cancel_url, et l'identifiant du compte du client dans
        client_reference_id ;
      - au retour, relis la session et l'abonnement auprès de Stripe pour
        débloquer le compte ; avant chaque accès payant, vérifie que
        l'abonnement est actif (pas de webhook : le produit n'en reçoit
        pas) ;
      - la clé du vrai mode n'a droit qu'à ça : créer et lire des sessions
        Checkout, lire les prix et les produits, créer et lire des clients,
        lire les abonnements, ouvrir le portail client ; n'utilise rien
        d'autre ;
      - pour essayer : la carte 4242 4242 4242 4242, une date future, un
        code à 3 chiffres.

      Les e-mails que le produit envoie à ses clients (valider une
      inscription, changer un mot de passe oublié, un reçu) :
      - envoie-les par SMTP avec les variables d'environnement SMTP_HOST,
        SMTP_PORT, SMTP_USER, SMTP_PASS et MAIL_FROM (l'expéditeur), lues
        au démarrage ; utilise STARTTLS quand le serveur le propose, et ne
        t'identifie pas si SMTP_USER est vide. Dans le chantier et en
        staging, une boîte d'essai garde les e-mails, quel que soit le
        destinataire, et rien ne part : le relecteur et Julien les y
        lisent. En prod, ils partent vraiment ;
      - n'envoie que ce qu'un client attend, jamais de lettre
        d'information : tous les produits de Serge partagent 100 e-mails
        par jour. Au plus quelques e-mails par heure et par adresse, et un
        nombre limité d'inscriptions par heure et par adresse IP, contre
        les robots ;
      - pas d'adresse ni de formulaire de contact pour l'instant, même si
        le plan ou la fiche produit en parlent ;
      - les mentions légales nomment l'éditeur, Julien Pesquet, une
        personne qui répond du produit, et disent que le service est
        construit et tenu par Serge, un agent IA.

      Règles :
      - choisis les langages et les outils que tu veux ; fais simple et
        solide ;
      - à la racine de /work, un Dockerfile qui construit et lance le
        produit. Le produit écoute sur le port de la variable PORT (8080),
        garde ses données dans le dossier de la variable DATA_DIR (/data),
        et connaît son adresse publique par PUBLIC_URL ;
      - des comptes : inscription par e-mail et mot de passe (gardé haché),
        connexion, déconnexion ;
      - en français, propre et clair sur ordinateur comme sur mobile ;
      - n'essaie pas le produit dans un navigateur : le relecteur le fera
        en ligne, scénario par scénario, sur ordinateur et sur mobile,
        paiement compris. Vérifie ton travail par des commandes : des tests
        automatiques et quelques requêtes au serveur lancé dans le chantier
        (curl), par exemple l'inscription, l'e-mail qu'elle envoie (la boîte
        d'essai : http://serge-boite:8025/api/v1/messages) et la session de
        paiement. Docker n'est pas dans le chantier : lance le produit comme
        le ferait le Dockerfile ;
      - vérifie toujours les certificats TLS, du SMTP comme des API : ne
        désactive jamais leur vérification ;
      - s'il te manque un outil ou un accès, appelle « Demander une
        nouvelle capacité ».

      Rends fini « oui » si le produit est prêt à être publié, sinon
      « non » ; ton compte rendu : ce que tu as fait, comment tu l'as
      vérifié, ce qui reste.
    tools:
      - tool: plan_valide_du_produit
        mode: given
        label: Le plan validé
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: demandes_des_clients
        mode: given
        label: Les demandes des clients
        max_rows: 60
        params:
          venture_id: {source: task, value: venture_id}
      - tool: passages_du_livrable
        mode: given
        label: Les passages de construction précédents
        max_rows: 3
        params:
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: produit}
      - tool: chantier_commande
        mode: callable
        params: &chantier_produit
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: produit}
          profile: {source: fixed, value: chantier}
          env_secrets: {source: fixed, value: STRIPE_SECRET_KEY=stripe-test.key}
      - tool: chantier_lire
        mode: callable
        params: *chantier_produit
      - tool: chantier_ecrire
        mode: callable
        params: *chantier_produit
      - tool: chantier_modifier
        mode: callable
        params: *chantier_produit
    output:
      - {path: fini, type: choice, choices: [oui, non], description: 'Le produit est-il prêt à être publié ?'}
      - {path: compte_rendu, type: text, description: 'Ce qui a été fait, vérifié, et ce qui reste.'}
    writes:
      - table: builds
        operation: insert
        condition: {field: fini, op: '=', value: oui}
        values:
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: produit}
          pass: {source: task, value: passage}
          status: {source: fixed, value: built}
          report: {source: field, value: compte_rendu}
          owner_notes: {source: task, value: consignes}
      - table: builds
        operation: insert
        condition: {field: fini, op: '=', value: non}
        values:
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: produit}
          pass: {source: task, value: passage}
          status: {source: fixed, value: unfinished}
          report: {source: field, value: compte_rendu}
          owner_notes: {source: task, value: consignes}

  - id: compter_reprises_produit
    title: Compter les reprises de la construction du produit
    role: >-
      Une construction du produit pas finie, ou une publication ratée : la
      construction reprend, dans le même passage, tant qu'il reste des
      reprises ; sinon le produit va tel qu'il est au ticket « Tester le
      produit ». Sans LLM.
    step: build_venture
    type: capability
    capability: next_round
    queue: works
    priority: 30
    settings:
      reprises_max: {value: 3, min: 1, max: 10, policy: true, description: "Les reprises d'un même passage de construction du produit, au plus."}
    params:
      round: {source: task, value: reprise}
      max: {source: setting, value: reprises_max}

  - id: publier_staging_produit
    title: Publier le produit en staging
    role: >-
      Fige le chantier du produit en une version, la construit et la met en
      ligne sur staging-<produit>.<domaine>, non indexé, avec la clé Stripe
      du mode test. Sans LLM.
    step: build_venture
    type: capability
    capability: publish_version
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
      deliverable: {source: fixed, value: produit}
      target: {source: fixed, value: staging}
      env_secrets: {source: fixed, value: STRIPE_SECRET_KEY=stripe-test.key}
      task_id: {source: task, value: task_id}

  - id: relire_produit
    title: Relire le produit
    role: >-
      Essaie le produit en ligne comme un client ordinaire, sans voir son
      code : suit chaque scénario de test sur ordinateur puis sur mobile,
      jusqu'au paiement avec la carte de test de Stripe, garde ses
      captures, et rend « bon » ou « à corriger ».
    step: build_venture
    type: llm
    model_tier: web
    queue: works
    priority: 30
    max_tool_turns: 80
    compare:
      builds: false
    prompt: |
      Tu essaies le produit fini d'un business comme le ferait un client
      ordinaire qui le découvre : tu ne vois pas son code, seulement le
      site en ligne (son adresse est dans les paramètres de la tâche,
      « url »). Tu reçois le plan validé, avec ses scénarios de test, et la
      fiche produit.

      Suis chaque scénario pas à pas, d'abord sur ordinateur, puis sur
      mobile : lis la page, clique, tape, comme une personne. Crée un
      compte avec ton adresse : « Ma boîte e-mail » te la donne, et te
      montre les e-mails que le produit t'envoie (ouvre un lien de
      validation dans le navigateur) ; un e-mail attendu qui n'arrive pas
      est un problème. Si un scénario demande d'annuler un abonnement ou
      d'attendre la fin de la période payée, fais-le avec les outils Stripe
      du mode test (le client par son e-mail, ses abonnements, annuler) :
      c'est comme si le temps avait passé. Va jusqu'au paiement : la page de
      paiement de Stripe est en mode test, paie avec la carte 4242 4242
      4242 4242, une date future (12/34) et le code 123, puis vérifie ce
      que le paiement débloque. Prends une capture à chaque étape
      importante, garde-la (keep), et lis les erreurs de la page. Regarde
      vraiment l'écran : un bouton qui sort de l'écran, un texte illisible,
      un formulaire qui ne réagit pas, une page blanche, un message
      d'erreur, un paiement qui ne débloque rien, ce qui manque par rapport
      à la fiche produit.

      Rends le verdict « bon » si un client peut faire chaque scénario sans
      aide et sans tomber sur une erreur ; sinon « a_corriger ». Tes
      remarques disent, pour chaque problème, le scénario, l'étape, ce que
      tu as vu, ce qui était attendu, et le numéro de la capture. Ton
      compte rendu dit ce que tu as essayé et ce qui marche.
    tools:
      - tool: plan_valide_du_produit
        mode: given
        label: Le plan validé et ses scénarios de test
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: navigateur_agir
        mode: callable
        params: &navigateur_produit
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: produit}
          task_id: {source: task, value: task_id}
      - tool: navigateur_lire
        mode: callable
        params: *navigateur_produit
      - tool: navigateur_capture
        mode: callable
        params: *navigateur_produit
      - tool: boite_mail
        mode: callable
        params: *boite_de_la_tache
      - tool: stripe_chercher_clients
        mode: callable
        params: &stripe_test_de_la_tache
          service: {source: fixed, value: stripe_test}
          task_id: {source: task, value: task_id}
      - tool: stripe_abonnements
        mode: callable
        params: *stripe_test_de_la_tache
      - tool: stripe_annuler_abonnement
        mode: callable
        params: *stripe_test_de_la_tache
    output:
      - {path: verdict, type: choice, choices: [bon, a_corriger], description: 'Un client peut-il faire chaque scénario ?'}
      - {path: remarques, type: text, description: 'Les problèmes trouvés, un par ligne ; vide si tout va bien.'}
      - {path: compte_rendu, type: text, description: Ce qui a été essayé et ce qui marche.}
    writes:
      - table: builds
        operation: update
        key: {column: id, source: task, value: build_id}
        values:
          status: {source: fixed, value: reviewed}
          verdict: {source: field, value: verdict}
          remarks: {source: field, value: remarques}
          review: {source: field, value: compte_rendu}

  - id: compter_passages_produit
    title: Compter les passages de construction du produit
    role: >-
      Après une relecture « à corriger » : la construction du produit
      reprend pour un nouveau passage tant qu'il en reste, sinon il va tel
      qu'il est au ticket « Tester le produit » (Q41). Sans LLM.
    step: build_venture
    type: capability
    capability: next_round
    queue: works
    priority: 30
    settings:
      passages_max: {value: 3, min: 1, max: 10, policy: true, description: "Les passages de construction et de relecture du produit, au plus."}
    params:
      round: {source: task, value: passage}
      max: {source: setting, value: passages_max}

  - id: demander_test_produit
    title: Faire essayer le produit
    role: >-
      Ouvre le ticket « Tester le produit » du produit fini : l'adresse du
      staging, les scénarios de test et le verdict du relecteur. Il
      n'expire jamais : rien n'est mis en vente sans qu'un humain ait
      essayé le produit, paiement compris (Q91). Sans LLM.
    step: build_venture
    type: capability
    capability: ask_owners
    queue: conversations
    priority: 80
    params:
      ticket_type: {source: fixed, value: TEST_PRODUIT}
      ref_table: {source: fixed, value: builds}
      ref_id: {source: task, value: build_id}
      raison: {source: fixed, value: "Le produit est en ligne en staging, avec Stripe en mode test : essaie-le comme un client, jusqu'au paiement avec la carte 4242 4242 4242 4242. Le valider achète son domaine et le met en vente."}
      title: {source: fixed, value: Un produit attend que tu l'essaies}

  - id: suite_test_produit
    title: Suite du ticket « Tester le produit » du produit
    role: >-
      La réponse au ticket « Tester le produit » du produit fini :
      « Valider » achète son domaine puis le met en vente, « À corriger »
      relance la construction avec les consignes, « Arrêter le business »
      l'arrête. Sans LLM.
    step: build_venture
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      acte: {source: task, value: acte}
      texte: {source: task, value: texte}
      build_id: {source: task, value: build_id}
      venture_id: {source: task, value: venture_id}
    writes:
      - table: builds
        operation: update
        key: {column: id, source: task, value: build_id}
        condition: {field: acte, op: '=', value: a_corriger}
        values:
          owner_notes: {source: task, value: texte}
      - table: ventures
        operation: update
        key: {column: id, source: task, value: venture_id}
        condition: {field: acte, op: '=', value: arreter_business}
        values:
          lifecycle: {source: fixed, value: KILLED}

  - id: choisir_domaine
    title: Choisir le domaine du produit
    role: >-
      Après l'essai d'un humain : avec un domaine commun des produits finis
      (réglage, page Policy), le produit sera publié sur un sous-domaine de
      ce domaine et rien n'est acheté ; sans lui, Serge achète un domaine
      pour le produit. Sans LLM.
    step: build_venture
    type: capability
    capability: echo
    queue: works
    priority: 30
    settings:
      domaine_commun: {type: text, value: '', policy: true, description: "Le domaine commun des produits finis : chacun y est publié sur un sous-domaine (calculatrice.<ce domaine>) que Serge fait pointer vers le serveur, et il n'achète aucun domaine. Vide : Serge achète un domaine par produit. Le domaine doit être au compte Cloudflare de Serge."}
    params:
      venture_id: {source: task, value: venture_id}
      build_id: {source: task, value: build_id}
      domaine_commun: {source: setting, value: domaine_commun}

  - id: pointer_sous_domaine
    title: Faire pointer le sous-domaine du produit
    role: >-
      Avec un domaine commun des produits finis : crée, chez Cloudflare,
      l'enregistrement DNS du sous-domaine du produit vers le serveur,
      avant sa mise en vente. N'achète rien.
    step: build_venture
    type: llm
    model_tier: mid
    queue: works
    priority: 30
    max_tool_turns: 6
    prompt: |
      Tu fais pointer le sous-domaine d'un produit vers le serveur de
      Serge, chez Cloudflare. Tu reçois l'adresse du produit (le nom à
      faire pointer, exemple : calculatrice.<domaine commun>) et l'adresse
      IPv4 du serveur. Le domaine commun est dans les paramètres de la
      tâche (« domaine_commun »).

      1. Trouve la zone du domaine commun (« La zone DNS d'un domaine »).
      2. Lis ses enregistrements A pour le nom du produit.
      3. S'il y en a un, modifie-le ; sinon crée-le : ce nom, vers
         l'adresse IPv4 du serveur.

      Rends ok « oui » si le nom pointe vers le serveur, avec ce nom ;
      sinon « non », et ce que Cloudflare a répondu.
    tools:
      - tool: adresse_du_produit
        mode: given
        label: L'adresse du produit
        params:
          venture_id: {source: task, value: venture_id}
          target: {source: fixed, value: prod}
          base_domain: {source: task, value: domaine_commun}
      - tool: adresse_du_serveur
        mode: given
        label: Le serveur de Serge
      - tool: cloudflare_zone
        mode: callable
        max_calls: 3
      - tool: cloudflare_dns_lire
        mode: callable
        max_calls: 2
      - tool: cloudflare_dns_creer
        mode: callable
        max_calls: 2
        params:
          type: {source: fixed, value: A}
          ttl: {source: fixed, value: '300'}
          proxied: {source: fixed, value: 'false'}
          task_id: {source: task, value: task_id}
      - tool: cloudflare_dns_modifier
        mode: callable
        max_calls: 2
        params:
          type: {source: fixed, value: A}
          ttl: {source: fixed, value: '300'}
          proxied: {source: fixed, value: 'false'}
          task_id: {source: task, value: task_id}
    output:
      - {path: ok, type: choice, choices: [oui, non], description: 'Le sous-domaine pointe-t-il vers le serveur ?'}
      - {path: nom, type: text, description: 'Le nom : calculatrice.<domaine commun>.'}
      - {path: raison, type: text, required: false, description: "Ce que Cloudflare a répondu, si ça n'a pas marché."}

  - id: acheter_domaine
    title: Acheter le domaine du produit
    role: >-
      Après l'essai d'un humain : achète le nom de domaine validé dans le
      ticket « Plan » (ou celui qu'un humain a donné depuis), s'il est libre
      et sous le prix maximum, et le fait pointer vers le serveur. Sinon,
      dit pourquoi et propose d'autres noms libres.
    step: build_venture
    type: llm
    model_tier: smart
    queue: works
    priority: 30
    max_tool_turns: 10
    settings:
      prix_max_eur: {value: 30, min: 1, max: 500, policy: true, description: "Le prix maximum d'un domaine acheté pour un produit, en euros par an (la première année comme le renouvellement)."}
    prompt: |
      Tu achètes le nom de domaine du produit fini d'un business, chez
      Cloudflare, et tu le fais pointer vers le serveur de Serge. C'est un vrai
      achat, payé avec la carte de Serge enregistrée sur son compte Cloudflare :
      sois exact.

      Le nom à acheter est le paramètre « domaine » de la tâche s'il est
      donné (un humain l'a choisi), sinon le domaine du plan validé.

      1. Regarde s'il est déjà au compte (« Les domaines du compte ») : s'il y
         est, ne l'achète pas, passe au point 4.
      2. Vérifie qu'il est libre (« Un nom de domaine est-il libre ? ») :
         registrable doit valoir true, et il ne doit pas être premium.
         Cloudflare donne ses prix en dollars : la première année
         (registration_cost) et le renouvellement (renewal_cost). Compte
         1 $ = 1,10 € pour rester prudent : les deux doivent être sous
         {prix_max_eur} € par an. Cloudflare ne vend pas toutes les
         extensions : si celle-ci ne l'est pas, dis-le.
      3. S'il est libre et sous ce prix, achète-le. La durée (un an) et
         l'absence de renouvellement automatique sont réglées d'office.
      4. Fais-le pointer vers le serveur : trouve sa zone (« La zone DNS d'un
         domaine »), lis ses enregistrements A pour le domaine lui-même ; s'il
         y en a un, modifie-le, sinon crée-le, avec le domaine comme nom et
         l'adresse IPv4 du serveur. Juste après un achat, la zone peut mettre
         une minute à apparaître : relis-la une fois.

      Rends achete « oui » si le domaine est au compte et pointe vers le
      serveur, avec son nom et son prix ; sinon « non », la raison (pris, trop
      cher, extension non vendue, refusé par Cloudflare : dis ce qu'il a
      répondu), et deux ou trois noms libres sous le prix maximum, avec leur
      prix.
    tools:
      - tool: plan_valide_du_produit
        mode: given
        label: Le plan validé, avec son domaine
        params:
          venture_id: {source: task, value: venture_id}
      - tool: adresse_du_serveur
        mode: given
        label: Le serveur de Serge
      - tool: cloudflare_domaines
        mode: callable
        max_calls: 2
      - tool: cloudflare_disponibilite
        mode: callable
        max_calls: 4
      - tool: cloudflare_acheter_domaine
        mode: callable
        max_calls: 1
        params:
          years: {source: fixed, value: '1'}
          auto_renew: {source: fixed, value: 'false'}
          task_id: {source: task, value: task_id}
      - tool: cloudflare_zone
        mode: callable
        max_calls: 4
      - tool: cloudflare_dns_lire
        mode: callable
        max_calls: 2
      - tool: cloudflare_dns_creer
        mode: callable
        max_calls: 2
        params:
          type: {source: fixed, value: A}
          ttl: {source: fixed, value: '300'}
          proxied: {source: fixed, value: 'false'}
          task_id: {source: task, value: task_id}
      - tool: cloudflare_dns_modifier
        mode: callable
        max_calls: 2
        params:
          type: {source: fixed, value: A}
          ttl: {source: fixed, value: '300'}
          proxied: {source: fixed, value: 'false'}
          task_id: {source: task, value: task_id}
    output:
      - {path: achete, type: choice, choices: [oui, non], description: 'Le domaine est-il au compte et pointe-t-il vers le serveur ?'}
      - {path: domaine, type: text, description: 'Le nom complet : devis-artisan.fr.'}
      - {path: prix, type: text, required: false, description: "Son prix, la première année et au renouvellement."}
      - {path: raison, type: text, required: false, description: "Pourquoi il n'est pas acheté, et les noms libres proposés avec leur prix."}


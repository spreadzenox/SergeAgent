status_transitions:
  - {table: ventures, column: lifecycle, from: '', to: CANDIDATE}
  - {table: ventures, column: lifecycle, from: CANDIDATE, to: POC_SELECTED}
  - {table: listen_cycles, column: status, from: '', to: OPEN}
  - {table: listen_cycles, column: status, from: OPEN, to: CLOSED}
  - {table: listen_cycles, column: status, from: OPEN, to: ABANDONED}
  - {table: listen_docs, column: label, from: '', to: besoin_nouveau}
  - {table: listen_docs, column: label, from: '', to: bruit}
  - {table: listen_docs, column: label, from: '', to: enrichit}
  - {table: listen_docs, column: label, from: '', to: preuve}
  - {table: listen_docs, column: label, from: besoin_nouveau, to: preuve}
  - {table: listen_docs, column: label, from: bruit, to: preuve}
  # Un message reçu est rattaché ou non ; une absence (réponse
  # automatique) est ignorée : elle n'arrête pas les relances.
  - {table: inbound_events, column: status, from: '', to: attached}
  - {table: inbound_events, column: status, from: '', to: unattached}
  # Une réponse automatique, ou le message d'un contact arrêté : rangé dans
  # le fil sans être traité (lot 10 bis).
  - {table: inbound_events, column: status, from: '', to: ignored}
  - {table: inbound_events, column: status, from: attached, to: ignored}
  # Un envoi naît à rédiger (une relance) ou à envoyer ; seul un envoi à
  # rédiger passe à envoyer : une relance annulée entre-temps ne repart pas.
  # Ensuite, seule « Envoyer un message » change son statut.
  - {table: web_accounts, column: status, from: creating, to: active}
  - {table: web_accounts, column: status, from: active, to: blocked}
  - {table: web_accounts, column: status, from: creating, to: blocked}
  - {table: touches, column: status, from: '', to: pending}
  - {table: touches, column: status, from: '', to: to_write}
  - {table: touches, column: status, from: to_write, to: pending}
  # Un envoi qui attend un humain part quand il est validé, ou est annulé
  # (lot 8 bis, Q85).
  - {table: touches, column: status, from: waiting_owner, to: pending}
  - {table: touches, column: status, from: waiting_owner, to: cancelled}
  # L'étape d'un contact n'avance que dans un sens, d'après sa réponse.
  - {table: contacts, column: funnel_state, from: CONTACTING, to: ENGAGED}
  - {table: contacts, column: funnel_state, from: CONTACTING, to: INTENT}
  - {table: contacts, column: funnel_state, from: CONTACTING, to: MEETING}
  - {table: contacts, column: funnel_state, from: CONTACTING, to: REJECTED}
  - {table: contacts, column: funnel_state, from: ENGAGED, to: INTENT}
  - {table: contacts, column: funnel_state, from: ENGAGED, to: MEETING}
  - {table: contacts, column: funnel_state, from: ENGAGED, to: REJECTED}
  - {table: contacts, column: funnel_state, from: INTENT, to: MEETING}
  - {table: contacts, column: funnel_state, from: INTENT, to: REJECTED}
  - {table: contacts, column: funnel_state, from: MEETING, to: REJECTED}
  # Un contact qui avait refusé (au téléphone, par exemple) ou qu'on croyait
  # injoignable peut revenir : s'il écrit qu'il est intéressé, son étape
  # suit sa réponse. Une étape plus basse ne remplace jamais une plus haute
  # (une question après « intéressé » le laisse « intéressé »).
  - {table: contacts, column: funnel_state, from: REJECTED, to: ENGAGED}
  - {table: contacts, column: funnel_state, from: REJECTED, to: INTENT}
  - {table: contacts, column: funnel_state, from: REJECTED, to: MEETING}
  - {table: contacts, column: funnel_state, from: UNREACHABLE, to: ENGAGED}
  - {table: contacts, column: funnel_state, from: UNREACHABLE, to: INTENT}
  - {table: contacts, column: funnel_state, from: UNREACHABLE, to: MEETING}
  - {table: contacts, column: funnel_state, from: UNREACHABLE, to: REJECTED}
  # Le business d'essai (bouton « Lancer un essai ») n'entre jamais dans
  # la chaîne des étapes ; un contact à qui Serge écrit passe « en prise de
  # contact ».
  - {table: ventures, column: lifecycle, from: '', to: TEST}
  - {table: contacts, column: funnel_state, from: NEW, to: CONTACTING}
  - {table: contacts, column: funnel_state, from: QUALIFIED, to: CONTACTING}

  # L'étape 2 (lot 10, Q91) : un POC validé, en ligne et sa campagne prête
  # fait passer le business au test léger ; « Arrêter le business » sur
  # un ticket l'arrête et libère sa place de test.
  - {table: ventures, column: lifecycle, from: POC_SELECTED, to: SMOKE_READY}
  - {table: ventures, column: lifecycle, from: POC_SELECTED, to: KILLED}
  - {table: product_plans, column: status, from: '', to: draft}
  - {table: product_plans, column: status, from: draft, to: challenged}
  - {table: product_plans, column: status, from: challenged, to: validated}
  - {table: product_plans, column: status, from: challenged, to: to_fix}
  - {table: product_plans, column: status, from: challenged, to: refused}
  - {table: builds, column: status, from: '', to: built}
  - {table: builds, column: status, from: '', to: unfinished}
  - {table: builds, column: status, from: built, to: reviewed}
  - {table: builds, column: status, from: unfinished, to: reviewed}
  - {table: campaigns, column: state, from: '', to: DRAFT}
  - {table: campaigns, column: state, from: DRAFT, to: READY}
  # Le bout en bout du POC (temporaire) : une calculatrice naît choisie
  # pour un POC, avec un plan tout fait, déjà validé.
  - {table: ventures, column: lifecycle, from: '', to: POC_SELECTED}
  - {table: product_plans, column: status, from: '', to: validated}

  # L'étape 5 (lot 10, Q91) : un business passe en construction de son
  # produit fini depuis le test léger (bouton de sa fiche, en attendant
  # l'étape 4), puis « produit en vente » quand il est en ligne sur son
  # domaine et que le paiement test est arrivé ; la prospection lourde
  # (lot 12) part de là. Le bout en bout du produit fait naître une
  # calculatrice déjà en construction.
  - {table: ventures, column: lifecycle, from: SMOKE_READY, to: PRODUCT_BUILDING}
  - {table: ventures, column: lifecycle, from: SMOKE_DONE, to: PRODUCT_BUILDING}
  - {table: ventures, column: lifecycle, from: '', to: PRODUCT_BUILDING}
  - {table: ventures, column: lifecycle, from: PRODUCT_BUILDING, to: PRODUCT_READY}
  - {table: ventures, column: lifecycle, from: PRODUCT_BUILDING, to: KILLED}
  # Ce que le plan du produit fait d'une demande des clients ; un tour de
  # critique peut changer d'avis.
  - {table: customer_requests, column: status, from: new, to: kept}
  - {table: customer_requests, column: status, from: new, to: refused}
  - {table: customer_requests, column: status, from: kept, to: refused}
  - {table: customer_requests, column: status, from: refused, to: kept}
  - {table: customer_requests, column: status, from: kept, to: delivered}
  - {table: transactions, column: status, from: '', to: succeeded}

  # Le lot 12 : le test léger, le choix du principal, la prospection
  # lourde. Un business reste « test en cours » pendant qu'on mesure son
  # test : « test fini » veut toujours dire « test fini et retenu ».
  - {table: ventures, column: lifecycle, from: SMOKE_READY, to: SMOKE_RUNNING}
  - {table: ventures, column: lifecycle, from: SMOKE_RUNNING, to: SMOKE_DONE}
  - {table: ventures, column: lifecycle, from: SMOKE_RUNNING, to: KILLED}
  - {table: ventures, column: lifecycle, from: SMOKE_DONE, to: PARKED}
  - {table: ventures, column: lifecycle, from: PARKED, to: PRODUCT_BUILDING}
  - {table: ventures, column: lifecycle, from: PARKED, to: CANDIDATE}
  - {table: ventures, column: lifecycle, from: PRODUCT_READY, to: FULL_RUNNING}
  - {table: campaigns, column: state, from: '', to: READY}
  - {table: campaigns, column: state, from: READY, to: RUNNING}
  - {table: campaigns, column: state, from: READY, to: CANCELLED}
  - {table: campaigns, column: state, from: RUNNING, to: FINISHED}
  - {table: principal_choices, column: status, from: '', to: PROPOSED}
  - {table: principal_choices, column: status, from: PROPOSED, to: DECIDED}
  # L'essai total peut partir du milieu (Q99) : sa calculatrice, née
  # candidate, saute alors à l'état d'où part l'étape demandée, et son
  # plan tout fait naît déjà critiqué.
  - {table: ventures, column: lifecycle, from: CANDIDATE, to: SMOKE_READY}
  - {table: ventures, column: lifecycle, from: CANDIDATE, to: PRODUCT_BUILDING}
  - {table: ventures, column: lifecycle, from: CANDIDATE, to: PRODUCT_READY}
  - {table: product_plans, column: status, from: '', to: challenged}

# Les quotas : le code d'écriture refuse une ligne de trop, quelle que soit
# l'invocation, et un bouton ne lance rien si son quota est plein. Les
# chiffres se règlent sur la page Policy de Mission Control.
table_quotas:
  - id: places_de_test
    table: ventures
    column: lifecycle
    values: [POC_SELECTED, SMOKE_READY, SMOKE_RUNNING, SMOKE_DONE]
    # Un business d'essai (page Système) ne prend pas de place (Q98).
    where: {column: trial, value: '0'}
    max: 3
    description: Places de test occupées
  - id: cycles_ouverts
    table: listen_cycles
    column: status
    values: [OPEN]
    # Le cycle d'écoute d'un essai ne prend pas la place du vrai (Q99).
    where: {column: trial, value: '0'}
    max: 1
    policy: false
    description: Cycle d'écoute en cours
  # La place de prospection lourde (Q14) : un seul business principal, de
  # la construction de son produit à sa vente. Rien ne la libère avant le
  # lot 16.
  - id: place_lourde
    table: ventures
    column: lifecycle
    values: [PRODUCT_BUILDING, PRODUCT_READY, FULL_RUNNING]
    where: {column: trial, value: '0'}
    max: 1
    description: Place de prospection lourde occupée
  - id: propositions_de_principal
    table: principal_choices
    column: status
    values: [PROPOSED]
    where: {column: trial, value: '0'}
    max: 1
    policy: false
    description: Proposition de principal qui attend Julien

# Quand une ligne passe dans tel état, les tâches en attente qui portent
# son numéro sont annulées : abandonner un cycle arrête sa chaîne.
task_cancel_rules:
  - {table: listen_cycles, column: status, value: ABANDONED, param: cycle_id}

# Les doublons : une fiche trop proche d'un business existant (72 % de
# mots en commun sur le nom et la description) est écartée ; une page ou un
# flux déjà gardé (même adresse) n'est pas regardé une seconde fois.
dedup_rules:
  - id: business_proches
    table: ventures
    method: shared_words
    threshold: 72
    on_duplicate: skip
    columns: [name, description]
  - id: page_deja_gardee
    table: listen_docs
    method: exact
    on_duplicate: skip
    columns: [url]
  - id: flux_deja_suivi
    table: listen_feeds
    method: exact
    on_duplicate: skip
    columns: [url]


# Le pipeline de départ de Serge.
#
# Ce fichier ne sert qu'à remplir la base d'une nouvelle instance, et à
# ajouter sur une instance existante les objets nouveaux. Après
# l'initialisation, la base est la seule source de vérité : un objet déjà
# en base n'est jamais modifié par ce fichier, et un objet supprimé dans
# Mission Control n'est jamais recréé. Détails : docs/LOT6_CONCEPTION.md.
#
# C'est le seul endroit du dépôt où les noms des invocations apparaissent.

schema_version: 1

# Les files. Les deux premières sont celles du runner, chacune en parallèle
# de l'autre ; la troisième n'a pas de runner : chaque appel téléphonique
# devient une tâche de son invocation allumée, menée en direct par le pont
# téléphonique (serge/voice/agent.py).
queues:
  - id: conversations
    title: 'Conversations (tâches courtes : relever, répondre, envoyer)'
  - id: works
    title: 'Travaux (tâches longues : écoute, conception, construction)'
  - id: voice
    title: 'Appels (menés en direct par l’agent vocal, pas par une file)'

# Le modèle derrière chaque niveau. Un modèle vide veut dire : prendre
# celui choisi à l'installation de l'instance. La page Pipeline recommande,
# pour chaque niveau, le modèle au meilleur rapport note / prix : le prix
# maximum est en dollars par million de jetons, la tolérance est la part (en
# %) de la meilleure note sous ce prix qu'un modèle doit avoir pour être
# retenu (85 : jusqu'à 15 % de note en moins pour un prix plus bas). Seul le
# niveau rapide cherche la valeur ; les autres visent presque la meilleure
# note sous leur plafond (95, la valeur par défaut).
llm_models:
  - tier: fast
    max_price_usd: 0.30
    tolerance_pct: 85
  - tier: mid
    max_price_usd: 1.50
  - tier: smart
    max_price_usd: 8.00

# Les textes de Serge, modifiables sur la page Pipeline : ceux envoyés au
# modèle, et la phrase de fin de chaque e-mail. Un repère entre accolades
# ({erreurs}, {reste}) est remplacé au moment de l'envoi ; un texte vide
# n'est pas envoyé.
serge_texts:
  - id: presentation
    title: Qui est Serge
    help: >-
      En tête du prompt des invocations qui le demandent, suivi de la chaîne
      des 8 étapes et de leur place, lues en base.
    body: |
      Serge est un opérateur économique autonome. Il repère sur le web des
      besoins réels, en tire des idées de business, les teste auprès de
      vrais prospects, construit et vend le meilleur, livre ses clients et
      encaisse. Il agit seul la plupart du temps, et demande à Julien de
      valider les décisions importantes. Sa seule limite est la légalité :
      il ne trompe personne et assume d'être un agent IA.
  - id: tools_exhausted
    title: Quand le modèle ne peut plus appeler d’outils
    help: >-
      Ajouté quand ses tours d’outils sont épuisés, ou qu’un plafond de
      dépense est atteint en plein travail.
    body: >-
      Tu ne peux plus appeler d’outils. Rends maintenant ta réponse finale,
      au format demandé, avec ce que tu as déjà trouvé.
  - id: format_intro
    title: Début de la consigne de format
    help: En tête du format de réponse, avant l’exemple et la liste des champs.
    body: >-
      Ta réponse finale est un seul objet JSON, sans texte autour, de cette
      forme :
  - id: format_retry
    title: Quand la réponse est mal formée
    help: >-
      Envoyé pour redemander la réponse, sans outil ; {erreurs} est remplacé
      par ce qui ne va pas.
    body: >-
      Ta réponse ne respecte pas le format : {erreurs}. Rends la réponse
      corrigée, en JSON seulement.
  - id: result_truncated
    title: Quand un résultat d’outil est coupé
    help: >-
      Ajouté à la fin d’un résultat plus long que la taille maximale ;
      {reste} est remplacé par le nombre de caractères coupés.
    body: >-
      (résultat tronqué : {reste} caractères de plus ; demande moins à la
      fois)
  - id: footer_email
    title: Fin de chaque e-mail
    help: >-
      Ajoutée à la fin de chaque e-mail envoyé à un contact (pas au texte
      gardé dans son fil). Une réponse « STOP » est une désinscription
      (décision Q79). Vide : rien n’est ajouté.
    body: >-
      Pour ne plus recevoir de message de Serge, répondez STOP.
  - id: voice_opening
    title: Début d’un appel
    help: >-
      Envoyé à l’agent vocal au décrochage, pour qu’il parle le premier.
    body: >-
      L’appel commence : dis bonjour en une phrase, comme le dit ta
      consigne, puis écoute.
  - id: voice_backup_greeting
    title: Secours de la voix, accueil d’un appel entrant
    help: >-
      Quand la voix en direct ne répond pas, le secours tour par tour lit
      cette phrase à un appelant.
    body: Bonjour, vous êtes bien chez Serge. Que puis-je pour vous ?
  - id: voice_backup_pitch
    title: Secours de la voix, appel sortant sans but
    help: Lu au décrochage d’un appel sortant dont le but est inconnu.
    body: Bonjour, ici Serge. Je vous appelle suite à votre demande.
  - id: voice_backup_menu
    title: Secours de la voix, menu de rappel
    help: Lu à la fin d’un appel de secours ; la touche 1 demande un rappel.
    body: >-
      Pour être rappelé par un humain, tapez 1. Sinon, laissez votre message
      après le bip.
  - id: voice_backup_not_understood
    title: Secours de la voix, pas compris
    help: Lu quand une phrase n’a pas pu être transcrite.
    body: Pardon, je n’ai pas compris. Pouvez-vous répéter ?
  - id: voice_backup_cannot_hear
    title: Secours de la voix, plus de son
    help: Lu après deux phrases sans son.
    body: >-
      Je ne vous entends pas. Laissez votre message après le bip, nous vous
      rappellerons.
  - id: voice_backup_goodbye
    title: Secours de la voix, au revoir
    help: Lu avant de raccrocher.
    body: Merci, au revoir.

# Les outils : une capacité du code, réglée pour un usage précis. Une
# invocation s'en sert de deux façons : en lecture donnée d'office (Serge
# lit avant l'appel et met le résultat dans le prompt) ou en outil
# appelable (le modèle décide). Un outil « everywhere » est appelable par
# toutes les invocations LLM, quand il leur sert.
tools:
  - id: web_search
    title: Chercher sur le web public
    doc: Recherche publique en lecture seule, sans compte ni action externe.
    capability: web_search
  - id: memory_search
    title: Chercher dans la mémoire
    doc: >-
      Cherche des mots dans les leçons, les événements et les tickets de
      Serge, et rend quelques extraits. Lecture seule : ça informe, ça
      n'écrit pas.
    capability: memory_search
  - id: demande_capacite
    title: Demander une nouvelle capacité
    doc: >-
      Quand Serge ne peut pas faire ce qu'on lui demande (pas de canal, pas
      d'outil), il ouvre une demande à Julien (« j'ai besoin de X ») plutôt
      que d'inventer. Le même besoin déjà ouvert n'est pas recréé.
    capability: request_capability
    everywhere: true
  - id: lire_tables_vues
    title: Lire les tables que je vois
    doc: >-
      Lit toutes les colonnes lisibles d'une table que l'invocation voit
      déjà en version courte : une ligne par son numéro (colonne id), ou
      toutes les lignes où une colonne vaut une valeur, page par page.
    capability: seen_table_read
    everywhere: true
  - id: lire_historique
    title: Lire l'historique
    doc: >-
      Ce qui est arrivé à une ligne que l'invocation voit : ses derniers
      événements dans le journal (créée, modifiée, écriture refusée…).
    capability: row_history
    everywhere: true
  - id: current_listen_cycle
    title: Lire le cycle d'écoute
    doc: Le texte de guidage et l'état d'un cycle d'écoute.
    capability: db_read
    read:
      tables: [listen_cycles]
      columns:
        - {table: listen_cycles, name: id}
        - {table: listen_cycles, name: guide}
        - {table: listen_cycles, name: status}
        - {table: listen_cycles, name: created_at}
      filters:
        - {id: cycle, table: listen_cycles, column: id, param: cycle_id}
      params:
        - {name: cycle_id, required: true, description: Identifiant du cycle.}
  - id: apercu_page
    title: Lire l'aperçu d'une page
    doc: >-
      Les premières lignes d'une page web (une ligne = un titre, un
      paragraphe ou un élément de liste), pour juger si elle vaut la peine
      d'être gardée, sans la lire en entier.
    capability: page_read
  - id: lire_page_entiere
    title: Lire une page en entier
    doc: >-
      Le texte d'une page déjà gardée par Serge, donnée par son numéro,
      jusqu'au nombre de lignes réglé.
    capability: page_read
  - id: lire_flux_rss
    title: Lire un flux RSS
    doc: Les pages récentes d'un flux RSS, avec un aperçu de quelques lignes.
    capability: rss_read
  - id: pages_a_rattacher
    title: Les pages pas encore triées
    doc: Les pages gardées qui n'ont encore été ni triées ni rattachées à un cycle.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
      filters:
        - {id: pas_triee, table: listen_docs, column: label, fixed: ''}
        - {id: sans_cycle, table: listen_docs, column: cycle_id, fixed: ''}
      params:
        - {name: limit, type: integer, default: '60', description: Nombre maximal de pages.}
  - id: pages_a_trier
    title: Les pages du cycle à trier
    doc: Les pages rattachées au cycle et pas encore triées, avec leur aperçu.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
        - {table: listen_docs, name: title}
        - {table: listen_docs, name: excerpt, as: apercu}
        - {table: listen_docs, name: url}
      filters:
        - {id: cycle, table: listen_docs, column: cycle_id, param: cycle_id}
        - {id: pas_triee, table: listen_docs, column: label, fixed: ''}
      params:
        - {name: cycle_id, required: true, description: Identifiant du cycle.}
  - id: pages_besoin_nouveau
    title: Les pages « besoin nouveau »
    doc: Les pages qui montrent un besoin nouveau et n'ont pas encore servi de preuve.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
        - {table: listen_docs, name: title}
        - {table: listen_docs, name: excerpt, as: apercu}
        - {table: listen_docs, name: url}
      filters:
        - {id: besoin, table: listen_docs, column: label, fixed: besoin_nouveau}
  - id: business_candidats
    title: Les business candidats
    doc: Les business encore candidats, qu'on peut choisir de tester.
    capability: db_read
    read:
      tables: [ventures]
      columns:
        - {table: ventures, name: id}
        - {table: ventures, name: name}
        - {table: ventures, name: description}
        - {table: ventures, name: observations}
        - {table: ventures, name: sellable_offer}
        - {table: ventures, name: family}
      filters:
        - {id: candidats, table: ventures, column: lifecycle, fixed: CANDIDATE}
  - id: preuves_des_candidats
    title: Les preuves des candidats
    doc: Pour chaque business candidat, les pages qui prouvent son besoin.
    capability: db_read
    read:
      tables: [venture_sources, ventures, listen_docs]
      columns:
        - {table: venture_sources, name: venture_id}
        - {table: listen_docs, name: title}
        - {table: listen_docs, name: excerpt, as: apercu}
      joins:
        - {id: business, left: venture_sources.venture_id, right: ventures.id}
        - {id: page, left: venture_sources.doc_id, right: listen_docs.id}
      filters:
        - {id: candidats, table: ventures, column: lifecycle, fixed: CANDIDATE}
  - id: business_en_test
    title: Les business en test
    doc: Les business qui occupent une place de test.
    capability: db_read
    read:
      tables: [ventures]
      columns:
        - {table: ventures, name: id}
        - {table: ventures, name: name}
        - {table: ventures, name: lifecycle}
      filters:
        - {id: en_test, table: ventures, column: lifecycle, fixed: [POC_SELECTED, SMOKE_READY, SMOKE_RUNNING, SMOKE_DONE]}
  - id: pages_a_oublier
    title: Les pages à oublier
    doc: Les pages « bruit » ou jamais triées, plus vieilles que le nombre de jours donné.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
      filters:
        - {id: inutiles, table: listen_docs, column: label, fixed: ['', bruit]}
        - {id: vieilles, table: listen_docs, column: fetched_at, operator: '<', days_ago: jours}
      params:
        - {name: jours, type: integer, required: true, description: Age minimum en jours.}
        - {name: limit, type: integer, default: '500', description: Nombre maximal de pages.}
  - id: besoins_a_oublier
    title: Les besoins jamais utilisés
    doc: Les pages « besoin nouveau » jamais utilisées, plus vieilles que le nombre de jours donné.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
      filters:
        - {id: besoin, table: listen_docs, column: label, fixed: besoin_nouveau}
        - {id: vieilles, table: listen_docs, column: fetched_at, operator: '<', days_ago: jours}
      params:
        - {name: jours, type: integer, required: true, description: Age minimum en jours.}
        - {name: limit, type: integer, default: '500', description: Nombre maximal de pages.}
  - id: idees
    title: Les idées de business
    doc: Les business encore candidats ou choisis pour un test (pas plus loin).
    capability: db_read
    read:
      tables: [ventures]
      columns:
        - {table: ventures, name: id}
      filters:
        - {id: idees, table: ventures, column: lifecycle, fixed: [CANDIDATE, POC_SELECTED]}
      params:
        - {name: limit, type: integer, default: '500', description: Nombre maximal de business.}

  # --- Les conversations (lot 8, décision Q79) ---
  - id: fil_du_contact
    title: Le fil du contact
    doc: >-
      Tout ce qui s'est dit avec le contact, tous canaux confondus, du plus
      ancien au plus récent : les messages partis et les messages reçus.
    capability: contact_thread
  - id: fiche_contact
    title: La fiche du contact
    doc: Le nom du contact et son étape (engagé, intention d'achat…).
    capability: db_read
    read:
      tables: [contacts]
      columns:
        - {table: contacts, name: id}
        - {table: contacts, name: display}
        - {table: contacts, name: funnel_state}
      filters:
        - {id: contact, table: contacts, column: id, param: contact_id}
      params:
        - {name: contact_id, required: true, description: Le numéro du contact.}
  - id: fiche_business
    title: La fiche du business
    doc: Ce que vend le business, à qui, et l'offre qu'on peut vendre tout de suite.
    capability: db_read
    read:
      tables: [ventures]
      columns:
        - {table: ventures, name: name}
        - {table: ventures, name: description}
        - {table: ventures, name: sellable_offer}
      filters:
        - {id: business, table: ventures, column: id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: fiche_produit
    title: La fiche produit
    doc: >-
      Ce que fait le produit et pour qui, ce qu'il ne fait pas, son prix, ses
      délais habituels et comment on l'utilise.
    capability: db_read
    read:
      tables: [product_sheets]
      columns:
        - {table: product_sheets, name: summary}
        - {table: product_sheets, name: limits}
        - {table: product_sheets, name: price}
        - {table: product_sheets, name: delays}
        - {table: product_sheets, name: usage}
      filters:
        - {id: business, table: product_sheets, column: venture_id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: questions_produit
    title: Les questions fréquentes sur le produit
    doc: Les questions qu'on pose souvent sur le produit, et leurs réponses.
    capability: db_read
    read:
      tables: [product_faq]
      columns:
        - {table: product_faq, name: question}
        - {table: product_faq, name: answer}
      filters:
        - {id: business, table: product_faq, column: venture_id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: chercher_contact
    title: Chercher un contact
    doc: >-
      Cherche la fiche d'un appelant par son e-mail, son numéro, ou un
      morceau de son nom ou de son entreprise. Rend son nom, son business
      et son étape ; jamais ses adresses ni son fil.
    capability: contact_search
  - id: noter_adresse
    title: Noter une adresse
    doc: >-
      Ajoute à la fiche d'un contact une adresse e-mail ou un numéro qu'il
      vient de donner, après l'avoir fait épeler et relue.
    capability: add_contact_address
  - id: but_de_l_appel
    title: Le but de l'appel
    doc: >-
      Pour un appel sortant, l'envoi qui l'a lancé : son objet et son
      texte disent pourquoi Serge appelle.
    capability: db_read
    read:
      tables: [touches]
      columns:
        - {table: touches, name: subject}
        - {table: touches, name: body}
      filters:
        - {id: envoi, table: touches, column: id, param: touch_id}
      params:
        - {name: touch_id, required: true, description: Le numéro de l'envoi.}

# Ce qu'une invocation a le droit d'écrire, et les protections des tables.
# Ces règles valent pour toutes les invocations : elles sont réglées sur la
# table, pas sur l'invocation. Sur une instance existante, une colonne ou
# une opération nouvelle s'ajoute ; rien n'est jamais retiré.
writable_tables:
  - table: listen_cycles
    insert: true
    update: true
    description: Les cycles d'écoute de l'étape 1.
    columns:
      - {name: guide, description: Le texte de guidage écrit dans Mission Control.}
      - {name: status, description: L'état du cycle.}
      - {name: started_at, description: Son début.}
      - {name: finished_at, description: Sa fin.}
      - {name: choice_note, description: Ce que « Choisir » dit du cycle.}
  - table: ventures
    insert: true
    update: true
    delete: true
    description: Les business.
    columns:
      - {name: name, description: Le nom du business.}
      - {name: description, description: Ce qu'il vend et à qui.}
      - {name: observations, description: Ce qu'on a observé dans les pages.}
      - {name: sellable_offer, description: L'offre qu'on peut vendre tout de suite.}
      - {name: lifecycle, description: Le statut du business.}
      - {name: family, description: Sa famille de business.}
      - {name: choice_reason, description: Pourquoi il a été choisi.}
  - table: listen_docs
    insert: true
    update: true
    delete: true
    description: Les pages gardées par Serge (adresse et aperçu).
    columns:
      - {name: url, description: L'adresse de la page.}
      - {name: title, description: Son titre.}
      - {name: excerpt, description: Son aperçu.}
      - {name: published, description: Sa date de publication.}
      - {name: source, description: D'où elle vient (web ou rss).}
      - {name: feed_id, description: Le flux qui l'a ramenée.}
      - {name: cycle_id, description: Le cycle où elle a été triée.}
      - {name: label, description: Son étiquette de tri.}
      - {name: labelled_at, description: Quand elle a été triée.}
      - {name: fetched_at, description: Quand elle a été gardée.}
  - table: listen_feeds
    insert: true
    update: true
    description: Les flux RSS que Serge suit.
    columns:
      - {name: url, description: L'adresse du flux.}
      - {name: title, description: Son titre.}
      - {name: added_by, description: L'invocation qui l'a ajouté.}
      - {name: active, description: Suivi ou coupé.}
      - {name: last_read_at, description: Sa dernière lecture.}
  - table: venture_sources
    insert: true
    delete: true
    description: Les pages qui prouvent le besoin d'un business.
    columns:
      - {name: venture_id, description: Le business.}
      - {name: doc_id, description: La page.}
      - {name: cycle_id, description: Le cycle.}
  # --- Les conversations (lot 8) ---
  - table: inbound_events
    insert: true
    update: true
    description: Les messages reçus des contacts.
    columns:
      - {name: channel, description: Le canal.}
      - {name: contact_id, description: 'Le contact, s''il est rattaché.'}
      - {name: venture_id, description: Le business du contact.}
      - {name: native_type, description: La sorte de message chez le canal.}
      - {name: address, description: L'adresse de l'expéditeur.}
      - {name: subject, description: L'objet.}
      - {name: body, description: Le texte.}
      - {name: message_ref, description: 'Sa référence, pour lui répondre dans le même fil.'}
      - {name: external_ref, description: Sa référence chez le canal (jamais écrit deux fois).}
      - {name: status, description: 'Rattaché, non rattaché, ou ignoré (une absence).'}
      - {name: reaction, description: 'Ce que fait le message (question, refus…).'}
      - {name: received_at, description: Quand Serge l'a reçu.}
  - table: touches
    insert: true
    update: true
    description: Les messages que Serge envoie.
    columns:
      - {name: contact_id, description: Le contact.}
      - {name: venture_id, description: Le business.}
      - {name: channel, description: Le canal.}
      - {name: address, description: L'adresse du destinataire.}
      - {name: kind, description: 'Premier message, réponse ou relance.'}
      - {name: status, description: 'À rédiger, à envoyer, envoyé, annulé…'}
      - {name: subject, description: L'objet.}
      - {name: body, description: Le texte.}
      - {name: reply_to, description: Le message reçu auquel il répond.}
      - {name: followup_of, description: L'envoi qu'il relance.}
  - table: canaux
    update: true
    description: Les canaux de Serge.
    columns:
      - {name: polled_at, description: La dernière relève réussie.}
  - table: contacts
    update: true
    description: Les contacts des business.
    columns:
      - {name: funnel_state, description: L'étape du contact.}
  - table: customer_requests
    insert: true
    description: Les demandes des contacts sur le produit.
    columns:
      - {name: venture_id, description: Le business.}
      - {name: contact_id, description: Le contact.}
      - {name: inbound_id, description: Le message d'où elle vient.}
      - {name: kind, description: 'Bug, insatisfaction ou idée.'}
      - {name: text, description: La demande.}
  - table: product_sheets
    insert: true
    description: Les fiches produit des business.
    columns:
      - {name: venture_id, description: Le business.}
      - {name: summary, description: Ce que fait le produit et pour qui.}
      - {name: limits, description: Ce qu'il ne fait pas.}
      - {name: price, description: Son prix.}
      - {name: delays, description: Ses délais habituels.}
      - {name: usage, description: Comment on l'utilise.}
  - table: product_faq
    insert: true
    description: Les questions fréquentes sur un produit.
    columns:
      - {name: venture_id, description: Le business.}
      - {name: question, description: La question.}
      - {name: answer, description: Sa réponse.}

# Les changements d'étiquette et de statut permis. Un business naît
# candidat, et seul un candidat peut être choisi : un business déjà en test
# est refusé par le code d'écriture.
status_transitions:
  - {table: ventures, column: lifecycle, from: '', to: CANDIDATE}
  - {table: ventures, column: lifecycle, from: CANDIDATE, to: POC_SELECTED}
  - {table: listen_cycles, column: status, from: '', to: OPEN}
  - {table: listen_cycles, column: status, from: OPEN, to: CLOSED}
  - {table: listen_cycles, column: status, from: OPEN, to: ABANDONED}
  - {table: listen_docs, column: label, from: '', to: besoin_nouveau}
  - {table: listen_docs, column: label, from: '', to: bruit}
  - {table: listen_docs, column: label, from: '', to: enrichit}
  - {table: listen_docs, column: label, from: '', to: preuve}
  - {table: listen_docs, column: label, from: besoin_nouveau, to: preuve}
  - {table: listen_docs, column: label, from: bruit, to: preuve}
  # Un message reçu est rattaché ou non ; une absence (réponse
  # automatique) est ignorée : elle n'arrête pas les relances.
  - {table: inbound_events, column: status, from: '', to: attached}
  - {table: inbound_events, column: status, from: '', to: unattached}
  - {table: inbound_events, column: status, from: attached, to: ignored}
  # Un envoi naît à rédiger (une relance) ou à envoyer ; seul un envoi à
  # rédiger passe à envoyer : une relance annulée entre-temps ne repart pas.
  # Ensuite, seule « Envoyer un message » change son statut.
  - {table: touches, column: status, from: '', to: pending}
  - {table: touches, column: status, from: '', to: to_write}
  - {table: touches, column: status, from: to_write, to: pending}
  # L'étape d'un contact n'avance que dans un sens, d'après sa réponse.
  - {table: contacts, column: funnel_state, from: CONTACTING, to: ENGAGED}
  - {table: contacts, column: funnel_state, from: CONTACTING, to: INTENT}
  - {table: contacts, column: funnel_state, from: CONTACTING, to: MEETING}
  - {table: contacts, column: funnel_state, from: CONTACTING, to: REJECTED}
  - {table: contacts, column: funnel_state, from: ENGAGED, to: INTENT}
  - {table: contacts, column: funnel_state, from: ENGAGED, to: MEETING}
  - {table: contacts, column: funnel_state, from: ENGAGED, to: REJECTED}
  - {table: contacts, column: funnel_state, from: INTENT, to: MEETING}
  - {table: contacts, column: funnel_state, from: INTENT, to: REJECTED}
  - {table: contacts, column: funnel_state, from: MEETING, to: REJECTED}
  # Le business d'essai (bouton « Lancer un essai ») n'entre jamais dans
  # la chaîne des étapes ; un contact à qui Serge écrit passe « en prise de
  # contact ».
  - {table: ventures, column: lifecycle, from: '', to: TEST}
  - {table: contacts, column: funnel_state, from: NEW, to: CONTACTING}
  - {table: contacts, column: funnel_state, from: QUALIFIED, to: CONTACTING}

# Les quotas : le code d'écriture refuse une ligne de trop, quelle que soit
# l'invocation, et un bouton ne lance rien si son quota est plein. Les
# chiffres se règlent sur la page Policy de Mission Control.
table_quotas:
  - id: places_de_test
    table: ventures
    column: lifecycle
    values: [POC_SELECTED, SMOKE_READY, SMOKE_RUNNING, SMOKE_DONE]
    max: 3
    description: Places de test occupées
  - id: cycles_ouverts
    table: listen_cycles
    column: status
    values: [OPEN]
    max: 1
    policy: false
    description: Cycle d'écoute en cours

# Quand une ligne passe dans tel état, les tâches en attente qui portent
# son numéro sont annulées : abandonner un cycle arrête sa chaîne.
task_cancel_rules:
  - {table: listen_cycles, column: status, value: ABANDONED, param: cycle_id}

# Les doublons : une fiche trop proche d'un business existant (72 % de
# mots en commun sur le nom et la description) est écartée ; une page ou un
# flux déjà gardé (même adresse) n'est pas regardé une seconde fois.
dedup_rules:
  - id: business_proches
    table: ventures
    method: shared_words
    threshold: 72
    on_duplicate: skip
    columns: [name, description]
  - id: page_deja_gardee
    table: listen_docs
    method: exact
    on_duplicate: skip
    columns: [url]
  - id: flux_deja_suivi
    table: listen_feeds
    method: exact
    on_duplicate: skip
    columns: [url]

# Ce qu'une invocation peut voir de chaque table, réglé une fois par
# table. La version courte (short) est donnée d'office, pour comparer, à
# toute invocation qui écrit dans la table ; les autres colonnes listées se
# lisent avec l'outil « Lire les tables que je vois ». Une colonne absente
# de la liste n'est jamais lue par une invocation. `order` : la colonne qui
# dit quelles lignes sont les plus récentes (données en premier).
table_views:
  - table: ventures
    title: Les business
    description: Chaque business, de l'idée au client, avec son statut.
    order: created_at
    columns:
      - {name: id, short: true, description: Le numéro du business.}
      - {name: name, short: true, description: Son nom.}
      - {name: description, description: Ce qu'il vend et à qui.}
      - {name: sellable_offer, description: L'offre qu'on peut vendre tout de suite.}
      - {name: observations, description: Ce qu'on a observé.}
      - {name: lifecycle, description: Son statut.}
      - {name: family, description: Sa famille de business.}
      - {name: choice_reason, description: Pourquoi il a été choisi.}
      - {name: created_at, description: Sa date de création.}
      - {name: updated_at, description: Sa dernière modification.}
  - table: listen_cycles
    title: Les cycles d'écoute
    description: Chaque cycle d'écoute de l'étape 1, avec son texte de guidage.
    order: created_at
    columns:
      - {name: id, short: true, description: Le numéro du cycle.}
      - {name: guide, short: true, description: Le texte de guidage.}
      - {name: status, short: true, description: L'état du cycle.}
      - {name: choice_note, description: Ce que « Choisir » a dit du cycle.}
      - {name: created_at, description: Sa date de création.}
      - {name: started_at, description: Son début.}
      - {name: finished_at, description: Sa fin.}
  - table: listen_docs
    title: Les pages gardées
    description: Les pages que Serge a gardées, avec leur aperçu et leur étiquette.
    order: fetched_at

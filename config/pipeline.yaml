  - id: mettre_en_vente
    title: Mettre le produit en vente dans Stripe
    role: >-
      Crée dans Stripe, en vrai mode, le produit du business et son prix
      (l'abonnement du plan validé), avec la clé de recherche que le
      produit utilise ; la prod encaisse alors pour de vrai.
    step: build_venture
    type: llm
    model_tier: mid
    queue: works
    priority: 30
    max_tool_turns: 6
    prompt: *prompt_vendre
    tools:
      - tool: plan_valide_du_produit
        mode: given
        label: Le plan validé
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_business
        mode: given
        label: Le business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: stripe_prix_par_cle
        mode: callable
        params:
          service: {source: fixed, value: stripe_live}
          'lookup_keys[0]': {source: task, value: venture_id}
          active: {source: fixed, value: 'true'}
          task_id: {source: task, value: task_id}
      - tool: stripe_chercher_produits
        mode: callable
        params:
          service: {source: fixed, value: stripe_live}
          task_id: {source: task, value: task_id}
      - tool: stripe_creer_produit
        mode: callable
        max_calls: 1
        params:
          service: {source: fixed, value: stripe_live}
          'metadata[venture_id]': {source: task, value: venture_id}
          task_id: {source: task, value: task_id}
      - tool: stripe_creer_prix_du_produit
        mode: callable
        max_calls: 1
        params:
          service: {source: fixed, value: stripe_live}
          'metadata[venture_id]': {source: task, value: venture_id}
          lookup_key: {source: task, value: venture_id}
          transfer_lookup_key: {source: fixed, value: 'true'}
          task_id: {source: task, value: task_id}
    output: *sortie_vendre

  - id: publier_prod_produit
    title: Publier le produit en prod
    role: >-
      Passe la version du staging en prod, sur le domaine du produit, avec
      la clé Stripe restreinte du vrai mode : rien n'est reconstruit. Sans
      LLM.
    step: build_venture
    type: capability
    capability: publish_version
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}

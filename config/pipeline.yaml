# Le pipeline de départ de Serge.
#
# Ce fichier ne sert qu'à remplir la base d'une nouvelle instance, et à
# ajouter sur une instance existante les objets nouveaux. Après
# l'initialisation, la base est la seule source de vérité : un objet déjà
# en base n'est jamais modifié par ce fichier, et un objet supprimé dans
# Mission Control n'est jamais recréé. Détails : docs/LOT6_CONCEPTION.md.
#
# C'est le seul endroit du dépôt où les noms des invocations apparaissent.

schema_version: 1

# Les files. Les deux premières sont celles du runner, chacune en parallèle
# de l'autre ; la troisième n'a pas de runner : chaque appel téléphonique
# devient une tâche de son invocation allumée, menée en direct par le pont
# téléphonique (serge/voice/agent.py).
queues:
  - id: conversations
    title: 'Conversations (tâches courtes : relever, répondre, envoyer)'
  - id: works
    title: 'Travaux (tâches longues : écoute, conception, construction)'
  - id: voice
    title: 'Appels (menés en direct par l’agent vocal, pas par une file)'

# Le modèle derrière chaque niveau. Un modèle vide veut dire : prendre
# celui choisi à l'installation de l'instance. La page Pipeline recommande,
# pour chaque niveau, le modèle au meilleur rapport note / prix : le prix
# maximum est en dollars par million de jetons, la tolérance est la part (en
# %) de la meilleure note sous ce prix qu'un modèle doit avoir pour être
# retenu (85 : jusqu'à 15 % de note en moins pour un prix plus bas). Seul le
# niveau rapide cherche la valeur ; les autres visent presque la meilleure
# note sous leur plafond (95, la valeur par défaut).
llm_models:
  - tier: fast
    max_price_usd: 0.30
    tolerance_pct: 85
  - tier: mid
    max_price_usd: 1.50
  - tier: smart
    max_price_usd: 8.00
  # Le niveau « code » (lot 10, Q91) : construire et relire un produit,
  # voir des pages. Le meilleur modèle sous son prix maximum (tolérance
  # 100 %), parmi ceux qui lisent les images.
  - tier: code
    model: anthropic/claude-opus-5.5
    max_price_usd: 12.00
    tolerance_pct: 100
    needs_image: true
  # Le niveau « web » (lot 11, Q96) : voir et cliquer des pages comme un
  # humain, pour le relecteur et le paiement test. Un modèle qui lit les
  # images, bien moins cher que « code » : chaque clic est un appel.
  - tier: web
    model: anthropic/claude-sonnet-5.5
    max_price_usd: 3.00
    needs_image: true

# Les textes de Serge, modifiables sur la page Pipeline : ceux envoyés au
# modèle, et la phrase de fin de chaque e-mail. Un repère entre accolades
# ({erreurs}, {reste}) est remplacé au moment de l'envoi ; un texte vide
# n'est pas envoyé.
serge_texts:
  - id: presentation
    title: Qui est Serge
    help: >-
      En tête du prompt des invocations qui le demandent, suivi de la chaîne
      des 8 étapes et de leur place, lues en base.
    body: |
      Serge est un opérateur économique autonome. Il repère sur le web des
      besoins réels, en tire des idées de business, les teste auprès de
      vrais prospects, construit et vend le meilleur, livre ses clients et
      encaisse. Il agit seul la plupart du temps, et demande à Julien de
      valider les décisions importantes. Sa seule limite est la légalité :
      il ne trompe personne et assume d'être un agent IA.

      Ce que Serge vend aujourd'hui : des produits web, et seulement cela (un
      site, un outil ou une application en ligne, un contenu ou un service
      rendu par le web). Serge les construit et les tient lui-même : c'est un
      programme, pas une équipe. Il sait mettre en ligne, encaisser par
      Stripe, envoyer des e-mails et acheter un nom de domaine. Brancher un
      service extérieur de plus (l'API d'un fournisseur, un compte à ouvrir
      quelque part, une intégration avec le logiciel d'un client) lui est
      long et fragile : un produit garde ces branchements au strict
      nécessaire, et un business qui en dépend de plusieurs n'est pas
      tenable pour lui. Il ne vend ni objet à expédier, ni présence humaine,
      ni intervention sur place. Dans ces limites il peut beaucoup, et quand
      il lui manque quelque chose de précis (un compte, une clé, un accès,
      une décision), il le demande à Julien et Clem plutôt que de promettre
      ce qu'il ne tiendra pas.

      Pour l'instant, Serge ne téléphone pas : il prospecte et répond par
      écrit (e-mail, LinkedIn et les autres réseaux branchés). Le canal
      « voice » ne se choisit pas pour une campagne, et Serge ne propose ni
      ne promet jamais d'appel, de visioconférence ou de rendez-vous
      téléphonique.

      Le canal « x » ne se choisit pas non plus pour une campagne : X sert à
      chercher ce que disent les gens et à vérifier une idée, pas à
      prospecter des entreprises. Serge prospecte par e-mail, sur LinkedIn
      et sur Instagram.
  - id: tools_exhausted
    title: Quand le modèle ne peut plus appeler d’outils
    help: >-
      Ajouté quand ses tours d’outils sont épuisés, ou qu’un plafond de
      dépense est atteint en plein travail.
    body: >-
      Tu ne peux plus appeler d’outils. Rends maintenant ta réponse finale,
      au format demandé, avec ce que tu as déjà trouvé.
  - id: format_intro
    title: Début de la consigne de format
    help: En tête du format de réponse, avant l’exemple et la liste des champs.
    body: >-
      Ta réponse finale est un seul objet JSON, sans texte autour, de cette
      forme :
  - id: recherche_web
    title: Recherche web, consigne du modèle qui cherche
    help: >-
      Envoyé au petit modèle d’Anthropic qui fait la recherche web pour les
      invocations ; {nombre} est remplacé par le nombre de résultats voulus.
      Les adresses et les titres rendus viennent de l’outil de recherche,
      le modèle n’écrit que les extraits.
    body: |
      Tu es l’outil de recherche web de Serge. Le message que tu reçois est
      une recherche : lance-la telle quelle avec l’outil de recherche web,
      une seule fois, sans la reformuler ni y répondre toi-même.

      Ensuite, écris une ligne par résultat, pour les {nombre} premiers au
      plus, sous cette forme exacte :
      adresse de la page | extrait

      L’adresse est recopiée telle que l’outil la donne. L’extrait tient en
      une ou deux phrases tirées de la page, dans sa langue : ce qu’on y
      trouve. N’écris rien d’autre : ni introduction, ni conclusion, ni
      avis.
  - id: format_retry
    title: Quand la réponse est mal formée
    help: >-
      Envoyé pour redemander la réponse, sans outil ; {erreurs} est remplacé
      par ce qui ne va pas.
    body: >-
      Ta réponse ne respecte pas le format : {erreurs}. Rends la réponse
      corrigée, en JSON seulement.
  - id: result_truncated
    title: Quand un résultat d’outil est coupé
    help: >-
      Ajouté à la fin d’un résultat plus long que la taille maximale ;
      {reste} est remplacé par le nombre de caractères coupés.
    body: >-
      (résultat tronqué : {reste} caractères de plus ; demande moins à la
      fois)
  - id: captures_intro
    title: Avant les captures d’écran
    help: >-
      Envoyé avec les captures qu’une invocation vient de prendre, juste
      après les résultats de ses outils.
    body: Les captures d'écran que tu viens de prendre, dans l'ordre.
  - id: capture_retiree
    title: À la place d’une ancienne capture
    help: >-
      Seules les dernières captures restent dans l’historique (page
      Pipeline, « Captures gardées ») ; {n} est remplacé par leur nombre.
    body: >-
      (capture retirée : seules les {n} dernières restent ; reprends-en une
      si tu as besoin de revoir l'écran)
  - id: footer_email
    title: Fin de chaque e-mail
    help: >-
      Ajoutée à la fin de chaque e-mail envoyé à un contact (pas au texte
      gardé dans son fil). Une réponse « STOP » est une désinscription
      (décision Q79). Vide : rien n’est ajouté.
    body: >-
      Pour ne plus recevoir de message de Serge, répondez STOP.
  - id: voice_opening_outbound
    title: Début d’un appel que Serge passe
    help: >-
      Envoyé à l’agent vocal quand la personne décroche, pour qu’il parle
      le premier.
    body: >-
      C’est toi qui appelles, la personne vient de décrocher. Dis bonjour,
      présente-toi et dis tout de suite pourquoi tu appelles (le but de
      l’appel), en deux phrases au plus, puis demande si c’est le bon
      moment.
  - id: voice_opening_inbound
    title: Début d’un appel que Serge reçoit
    help: >-
      Envoyé à l’agent vocal quand il décroche un appel entrant, pour qu’il
      parle le premier.
    body: >-
      On t’appelle, tu viens de décrocher. Dis bonjour, présente-toi en une
      phrase et demande en quoi tu peux aider, puis écoute.
  - id: voice_backup_greeting
    title: Secours de la voix, accueil d’un appel entrant
    help: >-
      Quand la voix en direct ne répond pas, le secours tour par tour lit
      cette phrase à un appelant.
    body: Bonjour, vous êtes bien chez Serge. Que puis-je pour vous ?
  - id: voice_backup_pitch
    title: Secours de la voix, appel sortant sans but
    help: Lu au décrochage d’un appel sortant dont le but est inconnu.
    body: Bonjour, ici Serge. Je vous appelle suite à votre demande.
  - id: voice_backup_menu
    title: Secours de la voix, menu de rappel
    help: Lu à la fin d’un appel de secours ; la touche 1 demande un rappel.
    body: >-
      Pour être rappelé par un humain, tapez 1. Sinon, laissez votre message
      après le bip.
  - id: voice_backup_not_understood
    title: Secours de la voix, pas compris
    help: Lu quand une phrase n’a pas pu être transcrite.
    body: Pardon, je n’ai pas compris. Pouvez-vous répéter ?
  - id: voice_backup_cannot_hear
    title: Secours de la voix, plus de son
    help: Lu après deux phrases sans son.
    body: >-
      Je ne vous entends pas. Laissez votre message après le bip, nous vous
      rappellerons.
  - id: voice_backup_goodbye
    title: Secours de la voix, au revoir
    help: Lu avant de raccrocher.
    body: Merci, au revoir.

# Les outils : une capacité du code, réglée pour un usage précis. Une
# invocation s'en sert de deux façons : en lecture donnée d'office (Serge
# lit avant l'appel et met le résultat dans le prompt) ou en outil
# appelable (le modèle décide). Un outil « everywhere » est appelable par
# toutes les invocations LLM, quand il leur sert.
# Les services qu'on sait appeler (lot 10, Q56 et Q91) : un connecteur
# n'est pas du code, mais la description d'un service. Le secret est le
# nom d'un fichier des secrets de l'instance, jamais sa valeur.
api_services:
  - id: stripe_test
    title: Stripe, mode test
    base_url: https://api.stripe.com
    auth: bearer
    secret_file: stripe-test.key
    body: form
    doc: >-
      Stripe en mode test : des paiements avec la carte 4242 4242 4242 4242,
      sans argent réel. Sert au staging et aux essais.
  - id: stripe_live
    title: Stripe, vrai mode
    base_url: https://api.stripe.com
    auth: bearer
    secret_file: stripe-live.key
    body: form
    doc: >-
      Stripe en vrai mode : de vrais paiements. Sert à la prod d'un produit
      fini et au paiement test de 1 € (étape 5).
  # Le bureau d'enregistrement de Serge : Cloudflare (lot 10, Q91). Serge
  # y a déjà acheté un domaine en août 2026, avec sa carte, enregistrée sur
  # son compte Cloudflare. Deux jetons : l'un pour le registrar (vérifier,
  # acheter), l'autre pour le DNS des zones du compte.
  - id: cloudflare_registrar
    title: Cloudflare, le bureau d'enregistrement
    base_url: https://api.cloudflare.com/client/v4
    auth: bearer
    secret_file: cloudflare-registrar.key
    body: json
    doc: >-
      Le registrar de Cloudflare : la disponibilité et le prix d'un nom (en
      dollars), l'achat (payé avec la carte de Serge enregistrée sur son
      compte Cloudflare), les domaines du compte. L'identifiant du compte
      est lu sur le serveur (config_root/cloudflare-account-id).
  - id: cloudflare_dns
    title: Cloudflare, le DNS
    base_url: https://api.cloudflare.com/client/v4
    auth: bearer
    secret_file: cloudflare-infra.key
    body: json
    doc: >-
      Les zones DNS du compte Cloudflare de Serge : faire pointer un domaine
      acheté vers le serveur (un enregistrement A, sans le proxy de
      Cloudflare, pour que Caddy obtienne son certificat).
  # Les e-mails des produits (lot 11, Q96) : Resend envoie ceux de la prod
  # et reçoit ceux du relecteur. La clé maîtresse ne sert qu'à Serge : il
  # crée une clé d'envoi par produit, et lit la boîte du relecteur.
  - id: resend
    title: Resend, les e-mails des produits
    base_url: https://api.resend.com
    auth: bearer
    secret_file: resend.key
    body: json
    doc: >-
      Envoie les e-mails des produits en prod (par SMTP, avec une clé par
      produit) et reçoit ceux du relecteur. Gratuit jusqu'à 100 e-mails par
      jour et 3 000 par mois, réception comprise.
# Les canaux qui passent par le navigateur (lot 13, décision Q104). Chacun
# dit le compte web de Serge qui lui sert, l'invocation qui envoie un
# message et celle qui relève la messagerie : ce sont des missions
# (serge/missions.py), les mêmes pour tous. Un canal de plus, c'est : une
# ligne ici, ses réglages dans policy.yaml (plafond du jour, validation,
# relève, points), ses volumes dans « Démarrer une campagne », et le lien
# vers son invocation de premier message. Un canal déjà en base n'est pas
# modifié par ce fichier.
web_channels:
  - id: linkedin
    title: LinkedIn
    account: linkedin
    send: envoyer_par_le_web
    poll: lire_messagerie
    doc: >-
      Écrire à un professionnel sur LinkedIn, avec le compte de Serge, dans
      le vrai Chrome : une demande de connexion avec une note pour un
      inconnu, un message pour une relation. Sa messagerie est relevée
      toutes les 4 heures, tant qu'une conversation est en cours.
  - id: instagram
    title: Instagram
    account: instagram
    send: envoyer_par_le_web
    poll: lire_messagerie
    doc: >-
      Écrire à un compte professionnel sur Instagram, avec le compte de
      Serge, dans le vrai Chrome : un message privé. Sa messagerie est
      relevée toutes les 4 heures, tant qu'une conversation est en cours.
  - id: x
    title: X
    account: x
    send: envoyer_par_le_web
    poll: lire_messagerie
    doc: >-
      Écrire à quelqu'un sur X, avec le compte de Serge, dans le vrai
      Chrome : un message privé, si la personne en accepte. Sa messagerie
      est relevée toutes les 4 heures, tant qu'une conversation est en
      cours.

tools:
  - id: web_search
    title: Chercher sur le web public
    doc: Recherche publique en lecture seule, sans compte ni action externe.
    capability: web_search
  - id: memory_search
    title: Chercher dans la mémoire
    doc: >-
      Cherche des mots dans les leçons, les événements et les tickets de
      Serge, et rend quelques extraits. Lecture seule : ça informe, ça
      n'écrit pas.
    capability: memory_search
  - id: demande_capacite
    title: Demander une nouvelle capacité
    doc: >-
      Quand Serge ne peut pas faire ce qu'on lui demande (pas de canal, pas
      d'outil), il ouvre une demande à Julien (« j'ai besoin de X ») plutôt
      que d'inventer. Le même besoin déjà ouvert n'est pas recréé.
    capability: request_capability
    everywhere: true
  - id: lire_tables_vues
    title: Lire les tables que je vois
    doc: >-
      Lit toutes les colonnes lisibles d'une table que l'invocation voit
      déjà en version courte : une ligne par son numéro (colonne id), ou
      toutes les lignes où une colonne vaut une valeur, page par page.
    capability: seen_table_read
    everywhere: true
  - id: lire_historique
    title: Lire l'historique
    doc: >-
      Ce qui est arrivé à une ligne que l'invocation voit : ses derniers
      événements dans le journal (créée, modifiée, écriture refusée…).
    capability: row_history
    everywhere: true
  - id: current_listen_cycle
    title: Lire le cycle d'écoute
    doc: Le texte de guidage et l'état d'un cycle d'écoute.
    capability: db_read
    read:
      tables: [listen_cycles]
      columns:
        - {table: listen_cycles, name: id}
        - {table: listen_cycles, name: guide}
        - {table: listen_cycles, name: status}
        - {table: listen_cycles, name: created_at}
      filters:
        - {id: cycle, table: listen_cycles, column: id, param: cycle_id}
      params:
        - {name: cycle_id, required: true, description: Identifiant du cycle.}
  - id: apercu_page
    title: Lire l'aperçu d'une page
    doc: >-
      Les premières lignes d'une page web (une ligne = un titre, un
      paragraphe ou un élément de liste), pour juger si elle vaut la peine
      d'être gardée, sans la lire en entier.
    capability: page_read
  - id: lire_page_entiere
    title: Lire une page en entier
    doc: >-
      Le texte d'une page déjà gardée par Serge, donnée par son numéro,
      jusqu'au nombre de lignes réglé.
    capability: page_read
  - id: lire_flux_rss
    title: Lire un flux RSS
    doc: Les pages récentes d'un flux RSS, avec un aperçu de quelques lignes.
    capability: rss_read
  - id: pages_a_rattacher
    title: Les pages pas encore triées
    doc: Les pages gardées qui n'ont encore été ni triées ni rattachées à un cycle.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
      filters:
        - {id: pas_triee, table: listen_docs, column: label, fixed: ''}
        - {id: sans_cycle, table: listen_docs, column: cycle_id, fixed: ''}
      params:
        - {name: limit, type: integer, default: '60', description: Nombre maximal de pages.}
  - id: pages_a_trier
    title: Les pages du cycle à trier
    doc: Les pages rattachées au cycle et pas encore triées, avec leur aperçu.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
        - {table: listen_docs, name: title}
        - {table: listen_docs, name: excerpt, as: apercu}
        - {table: listen_docs, name: url}
      filters:
        - {id: cycle, table: listen_docs, column: cycle_id, param: cycle_id}
        - {id: pas_triee, table: listen_docs, column: label, fixed: ''}
      params:
        - {name: cycle_id, required: true, description: Identifiant du cycle.}
  - id: pages_besoin_nouveau
    title: Les pages « besoin nouveau »
    doc: Les pages qui montrent un besoin nouveau et n'ont pas encore servi de preuve.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
        - {table: listen_docs, name: title}
        - {table: listen_docs, name: excerpt, as: apercu}
        - {table: listen_docs, name: url}
      filters:
        - {id: besoin, table: listen_docs, column: label, fixed: besoin_nouveau}
  - id: business_candidats
    title: Les business candidats
    doc: Les business encore candidats, qu'on peut choisir de tester.
    capability: db_read
    read:
      tables: [ventures]
      columns:
        - {table: ventures, name: id}
        - {table: ventures, name: name}
        - {table: ventures, name: description}
        - {table: ventures, name: observations}
        - {table: ventures, name: sellable_offer}
        - {table: ventures, name: family}
      filters:
        - {id: candidats, table: ventures, column: lifecycle, fixed: CANDIDATE}
  - id: preuves_des_candidats
    title: Les preuves des candidats
    doc: Pour chaque business candidat, les pages qui prouvent son besoin.
    capability: db_read
    read:
      tables: [venture_sources, ventures, listen_docs]
      columns:
        - {table: venture_sources, name: venture_id}
        - {table: listen_docs, name: title}
        - {table: listen_docs, name: excerpt, as: apercu}
      joins:
        - {id: business, left: venture_sources.venture_id, right: ventures.id}
        - {id: page, left: venture_sources.doc_id, right: listen_docs.id}
      filters:
        - {id: candidats, table: ventures, column: lifecycle, fixed: CANDIDATE}
  - id: business_en_test
    title: Les business en test
    doc: Les business qui occupent une place de test.
    capability: db_read
    read:
      tables: [ventures]
      columns:
        - {table: ventures, name: id}
        - {table: ventures, name: name}
        - {table: ventures, name: lifecycle}
      filters:
        - {id: en_test, table: ventures, column: lifecycle, fixed: [POC_SELECTED, SMOKE_READY, SMOKE_RUNNING, SMOKE_DONE]}
  - id: pages_a_oublier
    title: Les pages à oublier
    doc: Les pages « bruit » ou jamais triées, plus vieilles que le nombre de jours donné.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
      filters:
        - {id: inutiles, table: listen_docs, column: label, fixed: ['', bruit]}
        - {id: vieilles, table: listen_docs, column: fetched_at, operator: '<', days_ago: jours}
      params:
        - {name: jours, type: integer, required: true, description: Age minimum en jours.}
        - {name: limit, type: integer, default: '500', description: Nombre maximal de pages.}
  - id: besoins_a_oublier
    title: Les besoins jamais utilisés
    doc: Les pages « besoin nouveau » jamais utilisées, plus vieilles que le nombre de jours donné.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
      filters:
        - {id: besoin, table: listen_docs, column: label, fixed: besoin_nouveau}
        - {id: vieilles, table: listen_docs, column: fetched_at, operator: '<', days_ago: jours}
      params:
        - {name: jours, type: integer, required: true, description: Age minimum en jours.}
        - {name: limit, type: integer, default: '500', description: Nombre maximal de pages.}

  # --- Les conversations (lot 8, décision Q79) ---
  - id: fil_du_contact
    title: Le fil du contact
    doc: >-
      Tout ce qui s'est dit avec le contact, tous canaux confondus, du plus
      ancien au plus récent : les messages partis et les messages reçus.
    capability: contact_thread
  - id: fiche_contact
    title: La fiche du contact
    doc: Le nom du contact et son étape (engagé, intention d'achat…).
    capability: db_read
    read:
      tables: [contacts]
      columns:
        - {table: contacts, name: id}
        - {table: contacts, name: display}
        - {table: contacts, name: funnel_state}
      filters:
        - {id: contact, table: contacts, column: id, param: contact_id}
      params:
        - {name: contact_id, required: true, description: Le numéro du contact.}
  - id: fiche_business
    title: La fiche du business
    doc: Ce que vend le business, à qui, et l'offre qu'on peut vendre tout de suite.
    capability: db_read
    read:
      tables: [ventures]
      columns:
        - {table: ventures, name: name}
        - {table: ventures, name: description}
        - {table: ventures, name: sellable_offer}
      filters:
        - {id: business, table: ventures, column: id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: fiche_produit
    title: La fiche produit
    doc: >-
      Ce que fait le produit et pour qui, ce qu'il ne fait pas, son prix, ses
      délais habituels et comment on l'utilise.
    capability: db_read
    read:
      tables: [product_sheets]
      columns:
        - {table: product_sheets, name: summary}
        - {table: product_sheets, name: limits}
        - {table: product_sheets, name: price}
        - {table: product_sheets, name: delays}
        - {table: product_sheets, name: usage}
      filters:
        - {id: business, table: product_sheets, column: venture_id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: questions_produit
    title: Les questions fréquentes sur le produit
    doc: Les questions qu'on pose souvent sur le produit, et leurs réponses.
    capability: db_read
    read:
      tables: [product_faq]
      columns:
        - {table: product_faq, name: question}
        - {table: product_faq, name: answer}
      filters:
        - {id: business, table: product_faq, column: venture_id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: chercher_contact
    title: Chercher un contact
    doc: >-
      Cherche la fiche d'un appelant par son e-mail, son numéro, ou un
      morceau de son nom ou de son entreprise. Rend son nom, son business
      et son étape ; jamais ses adresses ni son fil.
    capability: contact_search
  - id: noter_adresse
    title: Noter une adresse
    doc: >-
      Ajoute à la fiche d'un contact une adresse e-mail ou un numéro qu'il
      vient de donner, une fois qu'il l'a confirmée. Une adresse qu'il
      corrige est désactivée.
    capability: add_contact_address
  - id: email_du_contact
    title: L'e-mail du contact
    doc: >-
      Les adresses e-mail actives du contact. Au téléphone, Serge propose
      celle qu'il a au lieu de la faire épeler.
    capability: db_read
    read:
      tables: [contact_addresses]
      columns:
        - {table: contact_addresses, name: value, as: email}
      filters:
        - {id: contact, table: contact_addresses, column: contact_id, param: contact_id}
        - {id: e-mail, table: contact_addresses, column: channel, fixed: email}
        - {id: active, table: contact_addresses, column: active, fixed: '1'}
      params:
        - {name: contact_id, required: true, description: Le numéro du contact.}
  - id: brouillon_de_l_envoi
    title: Le brouillon de l'envoi
    doc: Le canal, l'objet et le texte d'un envoi qui attend.
    capability: db_read
    read:
      tables: [touches]
      columns:
        - {table: touches, name: channel}
        - {table: touches, name: subject}
        - {table: touches, name: body}
      filters:
        - {id: envoi, table: touches, column: id, param: touch_id}
      params:
        - {name: touch_id, required: true, description: Le numéro de l'envoi.}
  - id: envoi_en_attente
    title: L'envoi qui attend
    doc: >-
      À qui et par où part un envoi qui attend un humain : son contact, son
      business, son canal, son adresse, son objet et le message auquel il
      répond. Sert à lui préparer une réponse d'attente.
    capability: db_read
    read:
      tables: [touches]
      columns:
        - {table: touches, name: contact_id}
        - {table: touches, name: venture_id}
        - {table: touches, name: channel}
        - {table: touches, name: address}
        - {table: touches, name: subject}
        - {table: touches, name: reply_to}
      filters:
        - {id: envoi, table: touches, column: id, param: touch_id}
      params:
        - {name: touch_id, required: true, description: Le numéro de l'envoi.}
  - id: but_de_l_appel
    title: Le but de l'appel
    doc: >-
      Pour un appel sortant, l'envoi qui l'a lancé : son objet et son
      texte disent pourquoi Serge appelle.
    capability: db_read
    read:
      tables: [touches]
      columns:
        - {table: touches, name: subject}
        - {table: touches, name: body}
      filters:
        - {id: envoi, table: touches, column: id, param: touch_id}
      params:
        - {name: touch_id, required: true, description: Le numéro de l'envoi.}

# Ce qu'une invocation a le droit d'écrire, et les protections des tables.
# Ces règles valent pour toutes les invocations : elles sont réglées sur la
# table, pas sur l'invocation. Sur une instance existante, une colonne ou
# une opération nouvelle s'ajoute ; rien n'est jamais retiré.
  # Le chantier (lot 10, Q91) : un conteneur par business et par
  # livrable. Le business, le livrable et le profil sont figés sur chaque
  # invocation qui s'en sert : le modèle ne choisit pas son chantier.
  - id: chantier_commande
    title: Lancer une commande dans le chantier
    doc: >-
      Lance une commande shell dans le chantier (dossier /work) : installer,
      compiler, lancer les tests, démarrer un serveur en arrière-plan. Rend
      la sortie et le code de retour.
    capability: sandbox_command
  - id: chantier_lire
    title: Lire un fichier du chantier
    doc: Rend des lignes d'un fichier du chantier, à partir d'une ligne.
    capability: sandbox_read_file
  - id: chantier_ecrire
    title: Écrire un fichier du chantier
    doc: Écrit un fichier entier dans le chantier.
    capability: sandbox_write_file
  - id: chantier_modifier
    title: Modifier un fichier du chantier
    doc: >-
      Remplace un passage exact d'un fichier du chantier, présent une seule
      fois, par un autre.
    capability: sandbox_edit_file

  # L'interface web (lot 10, Q91) : voir une page et y agir comme un
  # humain, dans un navigateur qui tourne dans son propre conteneur. Le
  # business, le livrable et la tâche sont figés sur chaque invocation.
  - id: navigateur_agir
    title: Agir dans une page
    doc: >-
      Agir dans une page comme une personne avec une souris et un clavier :
      ouvrir une adresse, cliquer, survoler, glisser et déposer, taper,
      choisir, appuyer sur une touche, faire défiler, revenir, recharger,
      attendre, déposer un fichier, passer en écran ordinateur ou mobile.
      Rend la page relue en version courte, avec un repère par élément
      ([e7]), et ce qui arrive hors de la page : un fichier téléchargé, un
      nouvel onglet, une boîte de dialogue du navigateur.
    capability: browser_action
  - id: navigateur_lire
    title: Lire la page
    doc: >-
      La page entière, lue comme par un lecteur d'écran, et ses dernières
      erreurs (JavaScript, requêtes ratées).
    capability: browser_read
  - id: navigateur_capture
    title: Prendre une capture
    doc: >-
      Une capture de l'écran, montrée au modèle comme une image ; gardée,
      elle sert de preuve et se voit dans Mission Control.
    capability: browser_screenshot

  # Le vrai Chrome (Q97) : un Chromium normal, sur un écran virtuel, pour
  # les pages qui refusent un navigateur sans écran (le captcha d'un
  # paiement). Une invocation passe de l'un à l'autre en changeant ses
  # outils sur la page Pipeline : ces trois-là au lieu des trois d'avant.
  - id: vrai_chrome_agir
    title: Agir dans le vrai Chrome
    doc: >-
      Comme « Agir dans une page », dans le vrai Chrome : un humain peut voir
      son écran et y agir depuis Mission Control.
    capability: real_browser_action
  - id: vrai_chrome_lire
    title: Lire la page du vrai Chrome
    doc: Comme « Lire la page », dans le vrai Chrome.
    capability: real_browser_read
  - id: vrai_chrome_capture
    title: Capture du vrai Chrome
    doc: Comme « Prendre une capture », dans le vrai Chrome.
    capability: real_browser_screenshot
  - id: appeler_un_humain
    title: Appeler un humain
    doc: >-
      Quand une page demande un humain (un captcha). La première fois, la
      tâche s'arrête, et repart du début quand un humain se dit prêt ; la
      fois suivante, au même blocage, l'humain le résout dans l'écran du
      vrai Chrome pendant que la tâche attend, puis elle continue.
    capability: human_help

  # --- Les comptes web (lot 13, Q104) ---
  - id: compte_web
    title: Le compte web
    doc: >-
      Un compte de Serge sur un site : son nom, l'adresse du site, son
      identifiant de connexion, son nom public et son état. Jamais son mot
      de passe ni sa session, que Serge utilise à ta place.
    capability: db_read
    read:
      tables: [web_accounts]
      columns:
        - {table: web_accounts, name: id, as: compte}
        - {table: web_accounts, name: url, as: site}
        - {table: web_accounts, name: login, as: identifiant}
        - {table: web_accounts, name: handle, as: nom_public}
        - {table: web_accounts, name: status, as: etat}
      filters:
        - {id: compte, table: web_accounts, column: id, param: account}
      params:
        - {name: account, required: true, description: Le nom du compte.}
  - id: changer_mot_de_passe_du_compte
    title: Changer le mot de passe du compte
    doc: >-
      Un nouveau mot de passe pour le compte en cours de création, quand le
      site refuse le premier : la longueur que le site accepte, avec ou
      sans signes. Tu ne le vois pas : retape-le avec taper_secret.
    capability: change_web_password
  - id: identite_de_serge
    title: L'identité de Serge
    doc: >-
      Ce que Serge donne à un site pour s'y inscrire : prénom, nom, pseudo,
      adresse e-mail, numéro pour les SMS.
    capability: serge_identity
  - id: messages_de_verification
    title: Mes messages de vérification
    doc: >-
      Les e-mails et les SMS reçus depuis le début de la tâche : le code ou
      le lien de confirmation d'une inscription ou d'une connexion. Attend
      qu'un message arrive, quelques minutes au plus.
    capability: verification_messages
  - id: fouiller_reddit
    title: Fouiller Reddit
    doc: >-
      Confie à une autre invocation une recherche sur Reddit, connectée au
      compte de Serge : ce que des gens y demandent, y conseillent ou y reprochent, dans les communautés d'un métier ou d'un sujet. Rend des discussions, chacune avec son
      adresse, son titre et un extrait. Plus lent et plus cher qu'une
      recherche sur le web : pour quand elle ne suffit pas.
    capability: mission
  - id: fouiller_instagram
    title: Fouiller Instagram
    doc: >-
      Confie à une autre invocation une recherche sur Instagram, connectée au
      compte de Serge : ce que des comptes publient sur un sujet et ce que leurs abonnés en disent en commentaire. Rend des discussions, chacune avec son
      adresse, son titre et un extrait. Plus lent et plus cher qu'une
      recherche sur le web : pour quand elle ne suffit pas.
    capability: mission
  - id: fouiller_x
    title: Fouiller X
    doc: >-
      Confie à une autre invocation une recherche sur X, connectée au
      compte de Serge : ce que des gens y écrivent sur un sujet, leurs plaintes et leurs questions. Rend des discussions, chacune avec son
      adresse, son titre et un extrait. Plus lent et plus cher qu'une
      recherche sur le web : pour quand elle ne suffit pas.
    capability: mission
  - id: chercher_sur_apollo
    title: Chercher des contacts sur Apollo
    doc: >-
      Confie à une autre invocation une recherche sur Apollo, un annuaire
      de contacts professionnels, connectée au compte de Serge : des
      personnes par métier, taille d'entreprise ou lieu. Rend des
      personnes, chacune avec l'adresse de sa fiche, son nom et son rôle,
      et en extrait son entreprise, son adresse e-mail si Apollo l'affiche
      en entier, et son profil LinkedIn. Sans compte Apollo en service,
      l'outil le dit : cherche alors sur le web.
    capability: mission
  - id: fouiller_linkedin
    title: Fouiller LinkedIn
    doc: >-
      Confie à une autre invocation une recherche sur LinkedIn, connectée
      au compte de Serge : des personnes par métier, entreprise ou ville,
      ou ce qu'un métier y publie. Rend des profils ou des publications,
      chacun avec son adresse exacte, son titre et un extrait. Plus lent
      et plus cher qu'une recherche sur le web.
    capability: mission
  - id: conversations_du_canal
    title: Les conversations en cours sur un canal
    doc: >-
      Les messages que Serge a envoyés par un canal depuis un nombre de
      jours : à qui (son adresse sur le canal), quand, et le texte.
    capability: db_read
    read:
      tables: [touches]
      columns:
        - {table: touches, name: address, as: adresse}
        - {table: touches, name: sent_at, as: envoye_le}
        - {table: touches, name: kind, as: sorte}
        - {table: touches, name: body, as: message}
      filters:
        - {id: canal, table: touches, column: channel, param: channel}
        - {id: parti, table: touches, column: status, fixed: sent}
        - {id: recents, table: touches, column: sent_at, operator: '>=', days_ago: jours}
      params:
        - {name: channel, required: true, description: Le canal.}
        - {name: jours, type: integer, required: true, description: 'Depuis combien de jours, au plus.'}

  # --- L'étape 2 : concevoir, critiquer, construire, relire (lot 10, Q91) ---
  - id: capacites_de_serge
    title: Ce que Serge sait faire
    doc: Les capacités du code de Serge, avec ce que chacune fait.
    capability: db_read
    read:
      tables: [capabilities]
      columns:
        - {table: capabilities, name: title}
        - {table: capabilities, name: doc_md, as: ce_qu_elle_fait}
      filters:
        - {id: disponibles, table: capabilities, column: available, fixed: '1'}
  - id: preuves_du_business
    title: Les preuves du business
    doc: Les pages qui prouvent le besoin derrière un business.
    capability: db_read
    read:
      tables: [venture_sources, listen_docs]
      columns:
        - {table: listen_docs, name: title}
        - {table: listen_docs, name: url}
        - {table: listen_docs, name: excerpt, as: apercu}
      joins:
        - {id: page, left: venture_sources.doc_id, right: listen_docs.id}
      filters:
        - {id: business, table: venture_sources, column: venture_id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: plan_par_numero
    title: Un plan
    doc: Un plan de POC ou de produit, par son numéro.
    capability: db_read
    read:
      tables: [product_plans]
      columns:
        - {table: product_plans, name: id}
        - {table: product_plans, name: round, as: tour}
        - {table: product_plans, name: status, as: statut}
        - {table: product_plans, name: hypothesis, as: hypothese}
        - {table: product_plans, name: target, as: cible}
        - {table: product_plans, name: channel, as: canal}
        - {table: product_plans, name: duration_days, as: duree_jours}
        - {table: product_plans, name: price, as: prix}
        - {table: product_plans, name: deliverable, as: livrable}
        - {table: product_plans, name: plan}
        - {table: product_plans, name: scenarios}
        - {table: product_plans, name: challenge, as: avis_du_critique}
        - {table: product_plans, name: owner_notes, as: consignes_d_un_humain}
      filters:
        - {id: plan, table: product_plans, column: id, param: plan_id}
      params:
        - {name: plan_id, required: true, description: Le numéro du plan.}
  - id: plan_valide_du_poc
    title: Le plan validé du POC
    doc: Le dernier plan validé du POC d'un business.
    capability: db_read
    read:
      tables: [product_plans]
      columns:
        - {table: product_plans, name: id}
        - {table: product_plans, name: round, as: tour}
        - {table: product_plans, name: hypothesis, as: hypothese}
        - {table: product_plans, name: target, as: cible}
        - {table: product_plans, name: price, as: prix}
        - {table: product_plans, name: deliverable, as: livrable}
        - {table: product_plans, name: plan}
        - {table: product_plans, name: scenarios}
        - {table: product_plans, name: owner_notes, as: consignes_d_un_humain}
      filters:
        - {id: business, table: product_plans, column: venture_id, param: venture_id}
        - {id: valide, table: product_plans, column: status, fixed: validated}
        - {id: poc, table: product_plans, column: kind, fixed: poc}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: critiques_du_plan
    title: Les remarques du critique
    doc: Les remarques « à corriger » du critique sur un plan.
    capability: db_read
    read:
      tables: [plan_critiques]
      columns:
        - {table: plan_critiques, name: round, as: tour}
        - {table: plan_critiques, name: text, as: remarque}
      filters:
        - {id: plan, table: plan_critiques, column: plan_id, param: plan_id}
      params:
        - {name: plan_id, required: true, description: Le numéro du plan.}
  - id: passages_du_livrable
    title: Les passages de construction
    doc: >-
      Les passages de construction d'un livrable, du plus récent au plus
      ancien : le compte rendu du constructeur, puis le verdict et les
      remarques du relecteur.
    capability: db_read
    read:
      tables: [builds]
      columns: &colonnes_passage
        - {table: builds, name: id}
        - {table: builds, name: pass, as: passage}
        - {table: builds, name: status, as: statut}
        - {table: builds, name: report, as: compte_rendu_du_constructeur}
        - {table: builds, name: verdict, as: verdict_du_relecteur}
        - {table: builds, name: remarks, as: remarques_du_relecteur}
        - {table: builds, name: review, as: ce_que_le_relecteur_a_essaye}
        - {table: builds, name: owner_notes, as: consignes_d_un_humain}
      filters:
        - {id: business, table: builds, column: venture_id, param: venture_id}
        - {id: livrable, table: builds, column: deliverable, param: deliverable}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
        - {name: deliverable, required: true, description: 'Le livrable : poc ou produit.'}
  - id: passage_par_numero
    title: Un passage de construction
    doc: Un passage de construction, par son numéro.
    capability: db_read
    read:
      tables: [builds]
      columns: *colonnes_passage
      filters:
        - {id: passage, table: builds, column: id, param: build_id}
      params:
        - {name: build_id, required: true, description: Le numéro du passage.}
  - id: staging_du_business
    title: Le staging du business
    doc: L'adresse du staging d'un business, sa version et son état.
    capability: db_read
    read:
      tables: [deployments]
      columns:
        - {table: deployments, name: hostname, as: adresse}
        - {table: deployments, name: version}
        - {table: deployments, name: status, as: etat}
        - {table: deployments, name: last_error, as: erreur}
      filters:
        - {id: business, table: deployments, column: venture_id, param: venture_id}
        - {id: staging, table: deployments, column: target, fixed: staging}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}

  # Stripe, par « Appeler une API » (lot 10, Q91). Le mode (service) et
  # l'identifiant du business sont figés sur l'invocation, jamais choisis
  # par le modèle (Q76).
  - id: stripe_creer_produit
    title: Créer un produit Stripe
    doc: Crée un produit dans Stripe ; rend son identifiant (prod_…).
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/products
      params:
        - {name: name, required: true, description: Le nom du produit.}
        - {name: description, description: "Ce que c'est, en une phrase."}
        - {name: 'metadata[venture_id]', description: Le business (figé en base).}
  - id: stripe_creer_prix
    title: Créer un prix Stripe
    doc: >-
      Crée un prix pour un produit Stripe ; rend son identifiant (price_…).
      L'identifiant du business est inscrit sur le prix (Q76).
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/prices
      params:
        - {name: product, required: true, description: Le produit (prod_…).}
        - {name: unit_amount, type: number, required: true, description: 'Le prix en centimes : 2900 pour 29 €.'}
        - {name: currency, required: true, description: 'La monnaie : eur.'}
        - {name: 'recurring[interval]', description: 'month ou year pour un abonnement ; rien pour un paiement unique.'}
        - {name: nickname, description: Un nom court pour ce prix.}
        - {name: 'metadata[venture_id]', description: Le business (figé en base).}
  - id: stripe_creer_lien_paiement
    title: Créer un lien de paiement Stripe
    doc: Crée un lien de paiement pour un prix ; rend son adresse (url).
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/payment_links
      params:
        - {name: 'line_items[0][price]', required: true, description: Le prix (price_…).}
        - {name: 'line_items[0][quantity]', type: number, required: true, description: 'La quantité : 1.'}
        - {name: 'metadata[venture_id]', description: Le business (figé en base).}
  - id: stripe_chercher_produits
    title: Chercher des produits Stripe
    doc: >-
      Cherche des produits Stripe. Exemple de recherche :
      metadata['venture_id']:'ven_123' pour les produits d'un business.
    capability: call_api
    api:
      service: stripe_test
      method: GET
      path: /v1/products/search
      params:
        - {name: query, required: true, description: La recherche Stripe.}
        - {name: limit, type: number, description: Le nombre de produits (100 au plus).}
  - id: stripe_lister_prix
    title: Lister les prix d'un produit Stripe
    doc: Les prix d'un produit Stripe, actifs ou archivés.
    capability: call_api
    api:
      service: stripe_test
      method: GET
      path: /v1/prices
      params:
        - {name: product, required: true, description: Le produit (prod_…).}
        - {name: limit, type: number, description: Le nombre de prix (100 au plus).}
  - id: stripe_prix_par_cle
    title: Trouver un prix Stripe par sa clé de recherche
    doc: >-
      Le prix actif qui porte une clé de recherche (lookup_key), avec son
      produit (le champ product). Un prix créé à l'instant y est déjà : la
      recherche de produits, elle, ne voit un produit qu'une minute
      environ après sa création. Exemple : la clé d'un business est son
      numéro, figé en base.
    capability: call_api
    api:
      service: stripe_test
      method: GET
      path: /v1/prices
      params:
        - {name: 'lookup_keys[0]', required: true, description: La clé de recherche (figée en base).}
        - {name: active, type: bool, description: 'true : seulement les prix actifs (figé en base).'}
  - id: stripe_archiver_prix
    title: Archiver un prix Stripe
    doc: Archive un prix (Stripe ne permet pas de le supprimer) ; il ne peut plus être payé.
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/prices/{id}
      params:
        - {name: id, required: true, description: Le prix (price_…).}
        - {name: active, type: bool, description: 'false pour l''archiver (figé en base).'}
  - id: stripe_archiver_produit
    title: Archiver un produit Stripe
    doc: Archive un produit Stripe ; il ne peut plus être vendu.
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/products/{id}
      params:
        - {name: id, required: true, description: Le produit (prod_…).}
        - {name: active, type: bool, description: 'false pour l''archiver (figé en base).'}
  - id: stripe_rembourser
    title: Rembourser un paiement Stripe
    doc: Rembourse un paiement en entier.
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/refunds
      params:
        - {name: payment_intent, required: true, description: Le paiement (pi_…).}
        - {name: 'metadata[venture_id]', description: Le business (figé en base).}

  # --- L'étape 5 : le vrai produit (lot 10, Q41, Q43 et Q91) ---
  - id: plan_valide_du_produit
    title: Le plan validé du produit
    doc: Le dernier plan validé du produit fini d'un business, avec son domaine.
    capability: db_read
    read:
      tables: [product_plans]
      columns: &colonnes_plan_produit
        - {table: product_plans, name: id}
        - {table: product_plans, name: round, as: tour}
        - {table: product_plans, name: status, as: statut}
        - {table: product_plans, name: hypothesis, as: hypothese}
        - {table: product_plans, name: target, as: cible}
        - {table: product_plans, name: price, as: prix}
        - {table: product_plans, name: domain, as: domaine}
        - {table: product_plans, name: deliverable, as: livrable}
        - {table: product_plans, name: plan}
        - {table: product_plans, name: scenarios}
        - {table: product_plans, name: challenge, as: avis_du_critique}
        - {table: product_plans, name: owner_notes, as: consignes_d_un_humain}
      filters:
        - {id: business, table: product_plans, column: venture_id, param: venture_id}
        - {id: valide, table: product_plans, column: status, fixed: validated}
        - {id: produit, table: product_plans, column: kind, fixed: product}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: plan_produit_par_numero
    title: Un plan de produit
    doc: Un plan de produit fini, par son numéro, avec son prix et son domaine.
    capability: db_read
    read:
      tables: [product_plans]
      columns: *colonnes_plan_produit
      filters:
        - {id: plan, table: product_plans, column: id, param: plan_id}
      params:
        - {name: plan_id, required: true, description: Le numéro du plan.}
  - id: plan_produit_en_bref
    title: Un plan de produit en bref
    doc: Le nom du business, le domaine et le prix d'un plan de produit fini.
    capability: db_read
    read:
      tables: [product_plans, ventures]
      columns:
        - {table: ventures, name: name, as: nom}
        - {table: product_plans, name: domain, as: domaine}
        - {table: product_plans, name: price, as: prix}
      joins:
        - {id: business, left: product_plans.venture_id, right: ventures.id}
      filters:
        - {id: plan, table: product_plans, column: id, param: plan_id}
      params:
        - {name: plan_id, required: true, description: Le numéro du plan.}
  - id: demandes_des_clients
    title: Les demandes des clients
    doc: >-
      Les bugs, insatisfactions et idées des clients d'un business, avec ce
      que le plan du produit en a fait (nouvelle, retenue, refusée, livrée).
    capability: db_read
    read:
      tables: [customer_requests]
      columns:
        - {table: customer_requests, name: id, as: numero}
        - {table: customer_requests, name: kind, as: sorte}
        - {table: customer_requests, name: text, as: demande}
        - {table: customer_requests, name: status, as: etat}
        - {table: customer_requests, name: reason, as: raison}
      filters:
        - {id: business, table: customer_requests, column: venture_id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: reponses_des_prospects
    title: Ce qu'ont répondu les prospects
    doc: >-
      Les messages reçus des contacts d'un business, avec leur réaction :
      les objections, les questions, l'intérêt.
    capability: db_read
    read:
      tables: [inbound_events, contacts]
      columns:
        - {table: inbound_events, name: reaction}
        - {table: inbound_events, name: subject, as: objet}
        - {table: inbound_events, name: body, as: texte}
      joins:
        - {id: contact, left: inbound_events.contact_id, right: contacts.id}
      filters:
        - {id: business, table: contacts, column: venture_id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: staging_du_produit
    title: Le staging du produit
    doc: L'adresse du staging du produit fini d'un business, sa version et son état.
    capability: db_read
    read:
      tables: [deployments]
      columns:
        - {table: deployments, name: hostname, as: adresse}
        - {table: deployments, name: version}
        - {table: deployments, name: status, as: etat}
        - {table: deployments, name: last_error, as: erreur}
      filters:
        - {id: business, table: deployments, column: venture_id, param: venture_id}
        - {id: staging, table: deployments, column: target, fixed: staging}
        - {id: produit, table: deployments, column: deliverable, fixed: produit}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: adresse_du_serveur
    title: L'adresse du serveur de Serge
    doc: >-
      Le domaine de l'instance et l'adresse IPv4 publique du serveur, pour
      faire pointer le domaine d'un produit vers lui.
    capability: server_address
  - id: adresse_du_produit
    title: L'adresse d'un produit
    doc: >-
      Le nom où un produit est, ou sera, publié en prod, calculé comme la
      publication le calcule : exemple, calculatrice.<domaine commun>.
    capability: product_address
  - id: stripe_creer_prix_du_produit
    title: Créer le prix d'un produit Stripe
    doc: >-
      Crée le prix de vente d'un produit fini ; rend son identifiant
      (price_…). Le prix porte l'identifiant du business et une clé de
      recherche (lookup_key) égale au numéro du business, figées en base :
      le produit retrouve son prix par cette clé, en mode test comme en vrai
      mode. Un nouveau prix reprend la clé de l'ancien.
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/prices
      params:
        - {name: product, required: true, description: Le produit (prod_…).}
        - {name: unit_amount, type: number, required: true, description: 'Le prix en centimes : 1900 pour 19 €.'}
        - {name: currency, required: true, description: 'La monnaie : eur.'}
        - {name: 'recurring[interval]', description: 'month ou year pour un abonnement ; rien pour un paiement unique.'}
        - {name: nickname, description: Un nom court pour ce prix.}
        - {name: lookup_key, description: La clé de recherche (figée en base).}
        - {name: transfer_lookup_key, type: bool, description: Reprendre la clé d'un ancien prix (figé en base).}
        - {name: 'metadata[venture_id]', description: Le business (figé en base).}
  - id: stripe_sessions_du_lien
    title: Les paiements d'un lien de paiement Stripe
    doc: >-
      Les sessions de paiement ouvertes par un lien de paiement (plink_…),
      les plus récentes d'abord : leur état (status : complete), leur
      paiement (payment_status : paid), leur montant et leur paiement
      (payment_intent : pi_…).
    capability: call_api
    api:
      service: stripe_test
      method: GET
      path: /v1/checkout/sessions
      params:
        - {name: payment_link, required: true, description: Le lien de paiement (plink_…).}
        - {name: limit, type: number, description: Le nombre de sessions (10).}
  - id: stripe_desactiver_lien
    title: Désactiver un lien de paiement Stripe
    doc: Désactive un lien de paiement ; il ne peut plus être payé.
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/payment_links/{id}
      params:
        - {name: id, required: true, description: Le lien de paiement (plink_…).}
        - {name: active, type: bool, description: 'false pour le désactiver (figé en base).'}
  # Pour le relecteur : finir un abonnement de test, comme si la période
  # payée était passée (lot 11).
  - id: stripe_chercher_clients
    title: Chercher un client Stripe par son e-mail
    doc: Les clients Stripe qui ont cette adresse e-mail, avec leur numéro (cus_…).
    capability: call_api
    api:
      service: stripe_test
      method: GET
      path: /v1/customers
      params:
        - {name: email, required: true, description: L'adresse e-mail du client.}
        - {name: limit, type: number, description: Le nombre de clients (10).}
  - id: stripe_abonnements
    title: Les abonnements d'un client Stripe
    doc: >-
      Les abonnements d'un client (cus_…), avec leur numéro (sub_…) et leur
      état (status : active, canceled…).
    capability: call_api
    api:
      service: stripe_test
      method: GET
      path: /v1/subscriptions
      params:
        - {name: customer, required: true, description: Le client (cus_…).}
        - {name: status, description: 'all pour tous, même annulés.'}
  - id: stripe_annuler_abonnement
    title: Annuler un abonnement Stripe tout de suite
    doc: >-
      Annule un abonnement immédiatement, comme à la fin de la période
      payée : le produit doit retirer ce qu'il débloquait.
    capability: call_api
    api:
      service: stripe_test
      method: DELETE
      path: /v1/subscriptions/{id}
      params:
        - {name: id, required: true, description: L'abonnement (sub_…).}

  # Les e-mails des produits, par Resend (lot 11). Seul le code de Serge
  # s'en sert : la clé d'envoi d'un produit ne passe jamais par un modèle.
  - id: resend_creer_cle
    title: Créer une clé d'envoi Resend
    doc: Une clé qui ne sait qu'envoyer des e-mails, pour un produit.
    capability: call_api
    api:
      service: resend
      method: POST
      path: /api-keys
      params:
        - {name: name, required: true, description: Le nom de la clé.}
        - {name: permission, required: true, description: sending_access.}
  - id: resend_recus
    title: Les e-mails reçus par Resend
    doc: Les derniers e-mails reçus, les plus récents d'abord.
    capability: call_api
    api:
      service: resend
      method: GET
      path: /emails/receiving
      params:
        - {name: limit, type: number, description: Le nombre d'e-mails (100 au plus).}
  - id: resend_recu
    title: Un e-mail reçu par Resend
    doc: Le texte et la page d'un e-mail reçu.
    capability: call_api
    api:
      service: resend
      method: GET
      path: /emails/receiving/{id}
      params:
        - {name: id, required: true, description: Le numéro de l'e-mail reçu.}
  - id: boite_mail
    title: Ma boîte e-mail
    doc: >-
      Ton adresse e-mail pour cet essai (inscris-toi avec), et les e-mails
      qu'elle a reçus : expéditeur, objet, texte et liens.
    capability: mail_read

  # Le bureau d'enregistrement : Cloudflare (lot 10, Q91). Les prix sont
  # en dollars ; l'achat paie avec la carte de Serge, enregistrée sur son
  # compte Cloudflare.
  - id: cloudflare_disponibilite
    title: Un nom de domaine est-il libre ?
    doc: >-
      Dit si des noms complets sont libres chez Cloudflare (registrable),
      premium ou non, et leur prix en dollars (pricing.registration_cost :
      la première année ; pricing.renewal_cost : le renouvellement).
      Exemple : domains = ["devis-artisan.com"]. Cloudflare ne vend pas
      toutes les extensions.
    capability: call_api
    api:
      service: cloudflare_registrar
      method: POST
      path: /accounts/{config:cloudflare-account-id}/registrar/domain-check
      params:
        - {name: domains, type: json, required: true, description: 'Les noms complets : ["devis-artisan.com"].'}
  - id: cloudflare_domaines
    title: Les domaines du compte
    doc: Les noms de domaine déjà au compte Cloudflare de Serge.
    capability: call_api
    api:
      service: cloudflare_registrar
      method: GET
      path: /accounts/{config:cloudflare-account-id}/registrar/domains
      params:
        - {name: per_page, type: number, description: Le nombre de domaines (50).}
  - id: cloudflare_acheter_domaine
    title: Acheter un nom de domaine
    doc: >-
      Achète un nom de domaine chez Cloudflare, payé avec la carte de Serge
      enregistrée sur son compte. La durée et le renouvellement sont figés
      en base (un an, pas de renouvellement automatique).
    capability: call_api
    api:
      service: cloudflare_registrar
      method: POST
      path: /accounts/{config:cloudflare-account-id}/registrar/registrations
      params:
        - {name: domain_name, required: true, description: 'Le nom complet : devis-artisan.com.'}
        - {name: years, type: number, description: La durée en années (figée en base).}
        - {name: auto_renew, type: bool, description: Le renouvellement automatique (figé en base).}
      # Le verrou de prix : avant l'achat, Serge redemande le prix à
      # Cloudflare et refuse un nom pris, premium, ou dont le prix (la
      # première année comme le renouvellement, en dollars fois 1,10 par
      # prudence) dépasse le réglage « prix_max_eur » de l'invocation qui
      # achète (page Policy). Un modèle ne peut pas passer outre.
      garde:
        verifier: cloudflare_disponibilite
        avec: {domains: ['{domain_name}']}
        exiger: {result.domains.0.registrable: true}
        refuser: {result.domains.0.tier: premium}
        prix: [result.domains.0.pricing.registration_cost, result.domains.0.pricing.renewal_cost]
        taux: 1.10
        plafond: prix_max_eur
  - id: cloudflare_zone
    title: La zone DNS d'un domaine
    doc: >-
      La zone DNS d'un domaine du compte : son identifiant (result[0].id)
      et son état. Juste après un achat, elle peut mettre une minute à
      apparaître.
    capability: call_api
    api:
      service: cloudflare_dns
      method: GET
      path: /zones
      params:
        - {name: name, required: true, description: 'Le nom complet : devis-artisan.com.'}
  - id: cloudflare_dns_lire
    title: Les enregistrements DNS d'une zone
    doc: Les enregistrements d'une zone, filtrés par nom et par type.
    capability: call_api
    api:
      service: cloudflare_dns
      method: GET
      path: /zones/{zone_id}/dns_records
      params:
        - {name: zone_id, required: true, description: La zone.}
        - {name: name, description: 'Le nom : devis-artisan.com.'}
        - {name: type, description: 'Le type : A.'}
  - id: cloudflare_dns_creer
    title: Créer un enregistrement DNS
    doc: >-
      Crée un enregistrement dans une zone. Pour faire pointer un domaine
      vers le serveur : name = le domaine, content = l'IPv4 du serveur. Le
      type, la durée et le proxy sont figés en base.
    capability: call_api
    api:
      service: cloudflare_dns
      method: POST
      path: /zones/{zone_id}/dns_records
      params:
        - {name: zone_id, required: true, description: La zone.}
        - {name: name, required: true, description: 'Le nom : devis-artisan.com.'}
        - {name: content, required: true, description: "L'adresse IPv4 du serveur."}
        - {name: type, description: 'Le type (figé en base : A).'}
        - {name: ttl, type: number, description: La durée de vie en secondes (figée en base).}
        - {name: proxied, type: bool, description: 'Le proxy de Cloudflare (figé en base : non).'}
  - id: cloudflare_dns_modifier
    title: Modifier un enregistrement DNS
    doc: Remplace un enregistrement d'une zone (son id vient de la lecture).
    capability: call_api
    api:
      service: cloudflare_dns
      method: PUT
      path: /zones/{zone_id}/dns_records/{record_id}
      params:
        - {name: zone_id, required: true, description: La zone.}
        - {name: record_id, required: true, description: "L'enregistrement."}
        - {name: name, required: true, description: 'Le nom : devis-artisan.com.'}
        - {name: content, required: true, description: "L'adresse IPv4 du serveur."}
        - {name: type, description: 'Le type (figé en base : A).'}
        - {name: ttl, type: number, description: La durée de vie en secondes (figée en base).}
        - {name: proxied, type: bool, description: 'Le proxy de Cloudflare (figé en base : non).'}

  # Le lot 12 : les campagnes, les prospects, la fin d'un test, le choix
  # du principal (conception du lot 12, parties 3 à 7).

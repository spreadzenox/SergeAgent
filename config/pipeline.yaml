  - id: prospects_essai
    title: "Essai total : le prospect de l'essai"
    role: >-
      Dans l'essai total, la prospection n'a pas lieu (décision Q99) : au
      lieu de chercher des prospects, la campagne reçoit un premier message
      à rédiger pour le contact tapé au lancement, sur son canal. Sans LLM.
    type: capability
    capability: db_read
    queue: works
    priority: 30
    params:
      tool_id: {source: fixed, value: contacts_a_contacter}
      venture_id: {source: task, value: venture_id}
      address_kind: {source: task, value: address_kind}
    writes:
      - table: touches
        operation: insert
        for_each: rows
        values:
          campaign_id: {source: task, value: campaign_id}
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          channel: {source: task, value: channel}
          address: {source: field, value: rows.address}
          kind: {source: fixed, value: first}
          status: {source: fixed, value: to_write}
links:
  - id: cycle_ouvert_vers_exploration
    title: Le cycle ouvert part en exploration
    from: ouvrir_cycle
    to: explorer_web
    mode: per_row
    write: 0
    params:
      cycle_id: {source: row, value: id}
  - id: exploration_vers_rattachement
    title: Les pages trouvées rejoignent le cycle
    from: explorer_web
    to: rattacher_pages
    params:
      cycle_id: {source: task, value: cycle_id}
  - id: rattachement_vers_tri
    title: Les pages du cycle sont triées
    from: rattacher_pages
    to: trier_pages
    params:
      cycle_id: {source: task, value: cycle_id}
  - id: tri_vers_formuler_a
    title: Les besoins nouveaux vont à A
    from: trier_pages
    to: formuler_a
    params:
      cycle_id: {source: task, value: cycle_id}
  - id: formuler_a_vers_b
    title: Puis à B, qui voit les idées de A
    from: formuler_a
    to: formuler_b
    params:
      cycle_id: {source: task, value: cycle_id}
  - id: formuler_b_vers_choix
    title: Les idées passent au choix
    from: formuler_b
    to: choisir_business
    params:
      cycle_id: {source: task, value: cycle_id}
  - id: reponse_vers_envoi
    title: La réponse part après le délai du canal
    from: traiter_reponse
    to: envoyer_message
    mode: per_row
    write: 2
    delay:
      min: 'channels.{channel}.reply_delay_min_minutes'
      max: 'channels.{channel}.reply_delay_max_minutes'
    params:
      touch_id: {source: row, value: id}
  - id: reponse_vers_desinscription
    title: Une désinscription bloque partout
    from: traiter_reponse
    to: desinscrire
    condition: {field: reaction, op: '=', value: désinscription}
    params:
      contact_id: {source: task, value: contact_id}
  - id: reponse_vers_arret
    title: Une conversation sans issue s'arrête
    from: traiter_reponse
    to: arreter_contact
    condition: {field: arreter, op: '=', value: oui}
    params:
      contact_id: {source: task, value: contact_id}
      reason: {source: fixed, value: conversation sans issue (Traiter une réponse)}
  - id: desinscription_vers_ticket
    title: Julien et Clem sont prévenus
    from: desinscrire
    to: prevenir_julien_et_clem
    params:
      contact_id: {source: task, value: contact_id}
  - id: envoi_valide_part
    title: Le brouillon validé part
    from: valider_envoi
    to: envoyer_message
    params:
      touch_id: {source: task, value: touch_id}
  - id: reponse_de_julien_part
    title: La réponse de Julien part
    from: envoyer_reponse_de_julien
    to: envoyer_message
    params:
      touch_id: {source: task, value: touch_id}
  - id: brouillon_reecrit_revient
    title: Le brouillon réécrit revient dans le ticket
    from: reecrire_brouillon
    to: envoyer_message
    params:
      touch_id: {source: task, value: touch_id}
  - id: reponse_attente_part
    title: La réponse d'attente part
    from: preparer_reponse_attente
    to: envoyer_message
    mode: per_row
    write: 0
    params:
      touch_id: {source: row, value: id}
  - id: relance_a_rediger
    title: Chaque relance à faire est rédigée
    from: preparer_relances
    to: ecrire_relance
    mode: per_row
    write: 0
    params:
      touch_id: {source: row, value: id}
      contact_id: {source: row, value: contact_id}
      venture_id: {source: row, value: venture_id}
  - id: relance_vers_envoi
    title: La relance rédigée part
    from: ecrire_relance
    to: envoyer_message
    params:
      touch_id: {source: task, value: touch_id}

  # --- L'étape 2 : du choix d'un business à son test léger (lot 10, Q91) ---
  - id: choix_vers_conception_poc
    lane: real
    title: Un business choisi pour un POC part en conception
    from: choisir_business
    to: concevoir_poc
    mode: per_row
    write: 0
    condition: {field: lifecycle, op: '=', value: POC_SELECTED}
    params:
      venture_id: {source: row, value: id}
      tour: {source: fixed, value: '1'}
  - id: plan_vers_critique
    title: Le plan part à la critique
    from: concevoir_poc
    to: challenger_poc
    mode: per_row
    write: 0
    params:
      plan_id: {source: row, value: id}
      venture_id: {source: row, value: venture_id}
      tour: {source: task, value: tour}
  - id: critique_a_corriger_vers_compte
    title: Un plan à corriger
    from: challenger_poc
    to: compter_tours_plan
    condition: {field: verdict, op: '=', value: a_corriger}
    params:
      venture_id: {source: task, value: venture_id}
      plan_id: {source: task, value: plan_id}
      tour: {source: task, value: tour}
  - id: critique_bonne_vers_ticket
    title: Un plan bon part au ticket « Plan »
    from: challenger_poc
    to: demander_validation_plan
    condition: {field: verdict, op: '=', value: bon}
    params:
      plan_id: {source: task, value: plan_id}
  - id: tours_restants_vers_conception
    title: Il reste des tours de critique
    from: compter_tours_plan
    to: concevoir_poc
    condition: {field: suite, op: '=', value: encore}
    params:
      venture_id: {source: task, value: venture_id}
      tour: {source: field, value: tour_suivant}
      plan_precedent: {source: task, value: plan_id}
  - id: tours_finis_vers_ticket
    title: Plus de tours de critique
    from: compter_tours_plan
    to: demander_validation_plan
    condition: {field: suite, op: '=', value: fini}
    params:
      plan_id: {source: task, value: plan_id}
  - id: plan_valide_vers_construction
    title: Le plan validé part en construction
    from: suite_plan_poc
    to: construire_poc
    condition: {field: acte, op: '=', value: valider}
    params:
      venture_id: {source: task, value: venture_id}
      passage: {source: fixed, value: '1'}
      reprise: {source: fixed, value: '1'}
  - id: plan_a_corriger_vers_conception
    title: Le plan est à corriger d'après un humain
    from: suite_plan_poc
    to: concevoir_poc
    condition: {field: acte, op: '=', value: a_corriger}
    params:
      venture_id: {source: task, value: venture_id}
      tour: {source: fixed, value: '1'}
      plan_precedent: {source: task, value: plan_id}
      consignes: {source: task, value: texte}
  - id: construction_finie_vers_staging
    title: Le POC construit part en staging
    from: construire_poc
    to: publier_staging_poc
    mode: per_row
    write: 0
    params:
      venture_id: {source: row, value: venture_id}
      build_id: {source: row, value: id}
      passage: {source: task, value: passage}
      reprise: {source: task, value: reprise}
  - id: construction_pas_finie_vers_reprise
    title: Une construction pas finie reprend
    from: construire_poc
    to: compter_reprises
    mode: per_row
    write: 1
    params:
      venture_id: {source: row, value: venture_id}
      build_id: {source: row, value: id}
      passage: {source: task, value: passage}
      reprise: {source: task, value: reprise}
  - id: reprise_vers_construction
    title: La construction reprend, dans le même passage
    from: compter_reprises
    to: construire_poc
    condition: {field: suite, op: '=', value: encore}
    params:

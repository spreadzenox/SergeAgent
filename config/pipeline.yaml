# Le pipeline de départ de Serge.
#
# Ce fichier ne sert qu'à remplir la base d'une nouvelle instance, et à
# ajouter sur une instance existante les objets nouveaux. Après
# l'initialisation, la base est la seule source de vérité : un objet déjà
# en base n'est jamais modifié par ce fichier, et un objet supprimé dans
# Mission Control n'est jamais recréé. Détails : docs/LOT6_CONCEPTION.md.
#
# C'est le seul endroit du dépôt où les noms des invocations apparaissent.

schema_version: 1

# Les files. Les deux premières sont celles du runner, chacune en parallèle
# de l'autre ; la troisième n'a pas de runner : chaque appel téléphonique
# devient une tâche de son invocation allumée, menée en direct par le pont
# téléphonique (serge/voice/agent.py).
queues:
  - id: conversations
    title: 'Conversations (tâches courtes : relever, répondre, envoyer)'
  - id: works
    title: 'Travaux (tâches longues : écoute, conception, construction)'
  - id: voice
    title: 'Appels (menés en direct par l’agent vocal, pas par une file)'

# Le modèle derrière chaque niveau. Un modèle vide veut dire : prendre
# celui choisi à l'installation de l'instance. La page Pipeline recommande,
# pour chaque niveau, le modèle au meilleur rapport note / prix : le prix
# maximum est en dollars par million de jetons, la tolérance est la part (en
# %) de la meilleure note sous ce prix qu'un modèle doit avoir pour être
# retenu (85 : jusqu'à 15 % de note en moins pour un prix plus bas). Seul le
# niveau rapide cherche la valeur ; les autres visent presque la meilleure
# note sous leur plafond (95, la valeur par défaut).
llm_models:
  - tier: fast
    max_price_usd: 0.30
    tolerance_pct: 85
  - tier: mid
    max_price_usd: 1.50
  - tier: smart
    max_price_usd: 8.00
  # Le niveau « code » (lot 10, Q91) : construire et relire un produit,
  # voir des pages. Le meilleur modèle sous son prix maximum (tolérance
  # 100 %), parmi ceux qui lisent les images.
  - tier: code
    model: anthropic/claude-opus-5.5
    max_price_usd: 12.00
    tolerance_pct: 100
    needs_image: true

# Les textes de Serge, modifiables sur la page Pipeline : ceux envoyés au
# modèle, et la phrase de fin de chaque e-mail. Un repère entre accolades
# ({erreurs}, {reste}) est remplacé au moment de l'envoi ; un texte vide
# n'est pas envoyé.
serge_texts:
  - id: presentation
    title: Qui est Serge
    help: >-
      En tête du prompt des invocations qui le demandent, suivi de la chaîne
      des 8 étapes et de leur place, lues en base.
    body: |
      Serge est un opérateur économique autonome. Il repère sur le web des
      besoins réels, en tire des idées de business, les teste auprès de
      vrais prospects, construit et vend le meilleur, livre ses clients et
      encaisse. Il agit seul la plupart du temps, et demande à Julien de
      valider les décisions importantes. Sa seule limite est la légalité :
      il ne trompe personne et assume d'être un agent IA.
  - id: tools_exhausted
    title: Quand le modèle ne peut plus appeler d’outils
    help: >-
      Ajouté quand ses tours d’outils sont épuisés, ou qu’un plafond de
      dépense est atteint en plein travail.
    body: >-
      Tu ne peux plus appeler d’outils. Rends maintenant ta réponse finale,
      au format demandé, avec ce que tu as déjà trouvé.
  - id: format_intro
    title: Début de la consigne de format
    help: En tête du format de réponse, avant l’exemple et la liste des champs.
    body: >-
      Ta réponse finale est un seul objet JSON, sans texte autour, de cette
      forme :
  - id: format_retry
    title: Quand la réponse est mal formée
    help: >-
      Envoyé pour redemander la réponse, sans outil ; {erreurs} est remplacé
      par ce qui ne va pas.
    body: >-
      Ta réponse ne respecte pas le format : {erreurs}. Rends la réponse
      corrigée, en JSON seulement.
  - id: result_truncated
    title: Quand un résultat d’outil est coupé
    help: >-
      Ajouté à la fin d’un résultat plus long que la taille maximale ;
      {reste} est remplacé par le nombre de caractères coupés.
    body: >-
      (résultat tronqué : {reste} caractères de plus ; demande moins à la
      fois)
  - id: captures_intro
    title: Avant les captures d’écran
    help: >-
      Envoyé avec les captures qu’une invocation vient de prendre, juste
      après les résultats de ses outils.
    body: Les captures d'écran que tu viens de prendre, dans l'ordre.
  - id: capture_retiree
    title: À la place d’une ancienne capture
    help: >-
      Seules les dernières captures restent dans l’historique (page
      Pipeline, « Captures gardées ») ; {n} est remplacé par leur nombre.
    body: >-
      (capture retirée : seules les {n} dernières restent ; reprends-en une
      si tu as besoin de revoir l'écran)
  - id: footer_email
    title: Fin de chaque e-mail
    help: >-
      Ajoutée à la fin de chaque e-mail envoyé à un contact (pas au texte
      gardé dans son fil). Une réponse « STOP » est une désinscription
      (décision Q79). Vide : rien n’est ajouté.
    body: >-
      Pour ne plus recevoir de message de Serge, répondez STOP.
  - id: voice_opening_outbound
    title: Début d’un appel que Serge passe
    help: >-
      Envoyé à l’agent vocal quand la personne décroche, pour qu’il parle
      le premier.
    body: >-
      C’est toi qui appelles, la personne vient de décrocher. Dis bonjour,
      présente-toi et dis tout de suite pourquoi tu appelles (le but de
      l’appel), en deux phrases au plus, puis demande si c’est le bon
      moment.
  - id: voice_opening_inbound
    title: Début d’un appel que Serge reçoit
    help: >-
      Envoyé à l’agent vocal quand il décroche un appel entrant, pour qu’il
      parle le premier.
    body: >-
      On t’appelle, tu viens de décrocher. Dis bonjour, présente-toi en une
      phrase et demande en quoi tu peux aider, puis écoute.
  - id: voice_backup_greeting
    title: Secours de la voix, accueil d’un appel entrant
    help: >-
      Quand la voix en direct ne répond pas, le secours tour par tour lit
      cette phrase à un appelant.
    body: Bonjour, vous êtes bien chez Serge. Que puis-je pour vous ?
  - id: voice_backup_pitch
    title: Secours de la voix, appel sortant sans but
    help: Lu au décrochage d’un appel sortant dont le but est inconnu.
    body: Bonjour, ici Serge. Je vous appelle suite à votre demande.
  - id: voice_backup_menu
    title: Secours de la voix, menu de rappel
    help: Lu à la fin d’un appel de secours ; la touche 1 demande un rappel.
    body: >-
      Pour être rappelé par un humain, tapez 1. Sinon, laissez votre message
      après le bip.
  - id: voice_backup_not_understood
    title: Secours de la voix, pas compris
    help: Lu quand une phrase n’a pas pu être transcrite.
    body: Pardon, je n’ai pas compris. Pouvez-vous répéter ?
  - id: voice_backup_cannot_hear
    title: Secours de la voix, plus de son
    help: Lu après deux phrases sans son.
    body: >-
      Je ne vous entends pas. Laissez votre message après le bip, nous vous
      rappellerons.
  - id: voice_backup_goodbye
    title: Secours de la voix, au revoir
    help: Lu avant de raccrocher.
    body: Merci, au revoir.

# Les outils : une capacité du code, réglée pour un usage précis. Une
# invocation s'en sert de deux façons : en lecture donnée d'office (Serge
# lit avant l'appel et met le résultat dans le prompt) ou en outil
# appelable (le modèle décide). Un outil « everywhere » est appelable par
# toutes les invocations LLM, quand il leur sert.
# Les services qu'on sait appeler (lot 10, Q56 et Q91) : un connecteur
# n'est pas du code, mais la description d'un service. Le secret est le
# nom d'un fichier des secrets de l'instance, jamais sa valeur.
api_services:
  - id: stripe_test
    title: Stripe, mode test
    base_url: https://api.stripe.com
    auth: bearer
    secret_file: stripe-test.key
    body: form
    doc: >-
      Stripe en mode test : des paiements avec la carte 4242 4242 4242 4242,
      sans argent réel. Sert au staging et aux essais.
  - id: stripe_live
    title: Stripe, vrai mode
    base_url: https://api.stripe.com
    auth: bearer
    secret_file: stripe-live.key
    body: form
    doc: >-
      Stripe en vrai mode : de vrais paiements. Sert à la prod d'un produit
      fini et au paiement test de 1 € (étape 5).

tools:
  - id: web_search
    title: Chercher sur le web public
    doc: Recherche publique en lecture seule, sans compte ni action externe.
    capability: web_search
  - id: memory_search
    title: Chercher dans la mémoire
    doc: >-
      Cherche des mots dans les leçons, les événements et les tickets de
      Serge, et rend quelques extraits. Lecture seule : ça informe, ça
      n'écrit pas.
    capability: memory_search
  - id: demande_capacite
    title: Demander une nouvelle capacité
    doc: >-
      Quand Serge ne peut pas faire ce qu'on lui demande (pas de canal, pas
      d'outil), il ouvre une demande à Julien (« j'ai besoin de X ») plutôt
      que d'inventer. Le même besoin déjà ouvert n'est pas recréé.
    capability: request_capability
    everywhere: true
  - id: lire_tables_vues
    title: Lire les tables que je vois
    doc: >-
      Lit toutes les colonnes lisibles d'une table que l'invocation voit
      déjà en version courte : une ligne par son numéro (colonne id), ou
      toutes les lignes où une colonne vaut une valeur, page par page.
    capability: seen_table_read
    everywhere: true
  - id: lire_historique
    title: Lire l'historique
    doc: >-
      Ce qui est arrivé à une ligne que l'invocation voit : ses derniers
      événements dans le journal (créée, modifiée, écriture refusée…).
    capability: row_history
    everywhere: true
  - id: current_listen_cycle
    title: Lire le cycle d'écoute
    doc: Le texte de guidage et l'état d'un cycle d'écoute.
    capability: db_read
    read:
      tables: [listen_cycles]
      columns:
        - {table: listen_cycles, name: id}
        - {table: listen_cycles, name: guide}
        - {table: listen_cycles, name: status}
        - {table: listen_cycles, name: created_at}
      filters:
        - {id: cycle, table: listen_cycles, column: id, param: cycle_id}
      params:
        - {name: cycle_id, required: true, description: Identifiant du cycle.}
  - id: apercu_page
    title: Lire l'aperçu d'une page
    doc: >-
      Les premières lignes d'une page web (une ligne = un titre, un
      paragraphe ou un élément de liste), pour juger si elle vaut la peine
      d'être gardée, sans la lire en entier.
    capability: page_read
  - id: lire_page_entiere
    title: Lire une page en entier
    doc: >-
      Le texte d'une page déjà gardée par Serge, donnée par son numéro,
      jusqu'au nombre de lignes réglé.
    capability: page_read
  - id: lire_flux_rss
    title: Lire un flux RSS
    doc: Les pages récentes d'un flux RSS, avec un aperçu de quelques lignes.
    capability: rss_read
  - id: pages_a_rattacher
    title: Les pages pas encore triées
    doc: Les pages gardées qui n'ont encore été ni triées ni rattachées à un cycle.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
      filters:
        - {id: pas_triee, table: listen_docs, column: label, fixed: ''}
        - {id: sans_cycle, table: listen_docs, column: cycle_id, fixed: ''}
      params:
        - {name: limit, type: integer, default: '60', description: Nombre maximal de pages.}
  - id: pages_a_trier
    title: Les pages du cycle à trier
    doc: Les pages rattachées au cycle et pas encore triées, avec leur aperçu.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
        - {table: listen_docs, name: title}
        - {table: listen_docs, name: excerpt, as: apercu}
        - {table: listen_docs, name: url}
      filters:
        - {id: cycle, table: listen_docs, column: cycle_id, param: cycle_id}
        - {id: pas_triee, table: listen_docs, column: label, fixed: ''}
      params:
        - {name: cycle_id, required: true, description: Identifiant du cycle.}
  - id: pages_besoin_nouveau
    title: Les pages « besoin nouveau »
    doc: Les pages qui montrent un besoin nouveau et n'ont pas encore servi de preuve.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
        - {table: listen_docs, name: title}
        - {table: listen_docs, name: excerpt, as: apercu}
        - {table: listen_docs, name: url}
      filters:
        - {id: besoin, table: listen_docs, column: label, fixed: besoin_nouveau}
  - id: business_candidats
    title: Les business candidats
    doc: Les business encore candidats, qu'on peut choisir de tester.
    capability: db_read
    read:
      tables: [ventures]
      columns:
        - {table: ventures, name: id}
        - {table: ventures, name: name}
        - {table: ventures, name: description}
        - {table: ventures, name: observations}
        - {table: ventures, name: sellable_offer}
        - {table: ventures, name: family}
      filters:
        - {id: candidats, table: ventures, column: lifecycle, fixed: CANDIDATE}
  - id: preuves_des_candidats
    title: Les preuves des candidats
    doc: Pour chaque business candidat, les pages qui prouvent son besoin.
    capability: db_read
    read:
      tables: [venture_sources, ventures, listen_docs]
      columns:
        - {table: venture_sources, name: venture_id}
        - {table: listen_docs, name: title}
        - {table: listen_docs, name: excerpt, as: apercu}
      joins:
        - {id: business, left: venture_sources.venture_id, right: ventures.id}
        - {id: page, left: venture_sources.doc_id, right: listen_docs.id}
      filters:
        - {id: candidats, table: ventures, column: lifecycle, fixed: CANDIDATE}
  - id: business_en_test
    title: Les business en test
    doc: Les business qui occupent une place de test.
    capability: db_read
    read:
      tables: [ventures]
      columns:
        - {table: ventures, name: id}
        - {table: ventures, name: name}
        - {table: ventures, name: lifecycle}
      filters:
        - {id: en_test, table: ventures, column: lifecycle, fixed: [POC_SELECTED, SMOKE_READY, SMOKE_RUNNING, SMOKE_DONE]}
  - id: pages_a_oublier
    title: Les pages à oublier
    doc: Les pages « bruit » ou jamais triées, plus vieilles que le nombre de jours donné.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
      filters:
        - {id: inutiles, table: listen_docs, column: label, fixed: ['', bruit]}
        - {id: vieilles, table: listen_docs, column: fetched_at, operator: '<', days_ago: jours}
      params:
        - {name: jours, type: integer, required: true, description: Age minimum en jours.}
        - {name: limit, type: integer, default: '500', description: Nombre maximal de pages.}
  - id: besoins_a_oublier
    title: Les besoins jamais utilisés
    doc: Les pages « besoin nouveau » jamais utilisées, plus vieilles que le nombre de jours donné.
    capability: db_read
    read:
      tables: [listen_docs]
      columns:
        - {table: listen_docs, name: id}
      filters:
        - {id: besoin, table: listen_docs, column: label, fixed: besoin_nouveau}
        - {id: vieilles, table: listen_docs, column: fetched_at, operator: '<', days_ago: jours}
      params:
        - {name: jours, type: integer, required: true, description: Age minimum en jours.}
        - {name: limit, type: integer, default: '500', description: Nombre maximal de pages.}
  - id: idees
    title: Les idées de business
    doc: Les business encore candidats ou choisis pour un test (pas plus loin).
    capability: db_read
    read:
      tables: [ventures]
      columns:
        - {table: ventures, name: id}
      filters:
        - {id: idees, table: ventures, column: lifecycle, fixed: [CANDIDATE, POC_SELECTED]}
      params:
        - {name: limit, type: integer, default: '500', description: Nombre maximal de business.}

  # --- Les conversations (lot 8, décision Q79) ---
  - id: fil_du_contact
    title: Le fil du contact
    doc: >-
      Tout ce qui s'est dit avec le contact, tous canaux confondus, du plus
      ancien au plus récent : les messages partis et les messages reçus.
    capability: contact_thread
  - id: fiche_contact
    title: La fiche du contact
    doc: Le nom du contact et son étape (engagé, intention d'achat…).
    capability: db_read
    read:
      tables: [contacts]
      columns:
        - {table: contacts, name: id}
        - {table: contacts, name: display}
        - {table: contacts, name: funnel_state}
      filters:
        - {id: contact, table: contacts, column: id, param: contact_id}
      params:
        - {name: contact_id, required: true, description: Le numéro du contact.}
  - id: fiche_business
    title: La fiche du business
    doc: Ce que vend le business, à qui, et l'offre qu'on peut vendre tout de suite.
    capability: db_read
    read:
      tables: [ventures]
      columns:
        - {table: ventures, name: name}
        - {table: ventures, name: description}
        - {table: ventures, name: sellable_offer}
      filters:
        - {id: business, table: ventures, column: id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: fiche_produit
    title: La fiche produit
    doc: >-
      Ce que fait le produit et pour qui, ce qu'il ne fait pas, son prix, ses
      délais habituels et comment on l'utilise.
    capability: db_read
    read:
      tables: [product_sheets]
      columns:
        - {table: product_sheets, name: summary}
        - {table: product_sheets, name: limits}
        - {table: product_sheets, name: price}
        - {table: product_sheets, name: delays}
        - {table: product_sheets, name: usage}
      filters:
        - {id: business, table: product_sheets, column: venture_id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: questions_produit
    title: Les questions fréquentes sur le produit
    doc: Les questions qu'on pose souvent sur le produit, et leurs réponses.
    capability: db_read
    read:
      tables: [product_faq]
      columns:
        - {table: product_faq, name: question}
        - {table: product_faq, name: answer}
      filters:
        - {id: business, table: product_faq, column: venture_id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: chercher_contact
    title: Chercher un contact
    doc: >-
      Cherche la fiche d'un appelant par son e-mail, son numéro, ou un
      morceau de son nom ou de son entreprise. Rend son nom, son business
      et son étape ; jamais ses adresses ni son fil.
    capability: contact_search
  - id: noter_adresse
    title: Noter une adresse
    doc: >-
      Ajoute à la fiche d'un contact une adresse e-mail ou un numéro qu'il
      vient de donner, une fois qu'il l'a confirmée. Une adresse qu'il
      corrige est désactivée.
    capability: add_contact_address
  - id: email_du_contact
    title: L'e-mail du contact
    doc: >-
      Les adresses e-mail actives du contact. Au téléphone, Serge propose
      celle qu'il a au lieu de la faire épeler.
    capability: db_read
    read:
      tables: [contact_addresses]
      columns:
        - {table: contact_addresses, name: value, as: email}
      filters:
        - {id: contact, table: contact_addresses, column: contact_id, param: contact_id}
        - {id: e-mail, table: contact_addresses, column: channel, fixed: email}
        - {id: active, table: contact_addresses, column: active, fixed: '1'}
      params:
        - {name: contact_id, required: true, description: Le numéro du contact.}
  - id: brouillon_de_l_envoi
    title: Le brouillon de l'envoi
    doc: Le canal, l'objet et le texte d'un envoi qui attend.
    capability: db_read
    read:
      tables: [touches]
      columns:
        - {table: touches, name: channel}
        - {table: touches, name: subject}
        - {table: touches, name: body}
      filters:
        - {id: envoi, table: touches, column: id, param: touch_id}
      params:
        - {name: touch_id, required: true, description: Le numéro de l'envoi.}
  - id: envoi_en_attente
    title: L'envoi qui attend
    doc: >-
      À qui et par où part un envoi qui attend un humain : son contact, son
      business, son canal, son adresse, son objet et le message auquel il
      répond. Sert à lui préparer une réponse d'attente.
    capability: db_read
    read:
      tables: [touches]
      columns:
        - {table: touches, name: contact_id}
        - {table: touches, name: venture_id}
        - {table: touches, name: channel}
        - {table: touches, name: address}
        - {table: touches, name: subject}
        - {table: touches, name: reply_to}
      filters:
        - {id: envoi, table: touches, column: id, param: touch_id}
      params:
        - {name: touch_id, required: true, description: Le numéro de l'envoi.}
  - id: but_de_l_appel
    title: Le but de l'appel
    doc: >-
      Pour un appel sortant, l'envoi qui l'a lancé : son objet et son
      texte disent pourquoi Serge appelle.
    capability: db_read
    read:
      tables: [touches]
      columns:
        - {table: touches, name: subject}
        - {table: touches, name: body}
      filters:
        - {id: envoi, table: touches, column: id, param: touch_id}
      params:
        - {name: touch_id, required: true, description: Le numéro de l'envoi.}

# Ce qu'une invocation a le droit d'écrire, et les protections des tables.
# Ces règles valent pour toutes les invocations : elles sont réglées sur la
# table, pas sur l'invocation. Sur une instance existante, une colonne ou
# une opération nouvelle s'ajoute ; rien n'est jamais retiré.
  # Le chantier (lot 10, Q91) : un conteneur par business et par
  # livrable. Le business, le livrable et le profil sont figés sur chaque
  # invocation qui s'en sert : le modèle ne choisit pas son chantier.
  - id: chantier_commande
    title: Lancer une commande dans le chantier
    doc: >-
      Lance une commande shell dans le chantier (dossier /work) : installer,
      compiler, lancer les tests, démarrer un serveur en arrière-plan. Rend
      la sortie et le code de retour.
    capability: sandbox_command
  - id: chantier_lire
    title: Lire un fichier du chantier
    doc: Rend des lignes d'un fichier du chantier, à partir d'une ligne.
    capability: sandbox_read_file
  - id: chantier_ecrire
    title: Écrire un fichier du chantier
    doc: Écrit un fichier entier dans le chantier.
    capability: sandbox_write_file
  - id: chantier_modifier
    title: Modifier un fichier du chantier
    doc: >-
      Remplace un passage exact d'un fichier du chantier, présent une seule
      fois, par un autre.
    capability: sandbox_edit_file

  # L'interface web (lot 10, Q91) : voir une page et y agir comme un
  # humain, dans un navigateur qui tourne dans son propre conteneur. Le
  # business, le livrable et la tâche sont figés sur chaque invocation.
  - id: navigateur_agir
    title: Agir dans une page
    doc: >-
      Ouvrir une adresse, cliquer, taper, choisir, appuyer sur une touche,
      faire défiler, revenir, attendre, passer en écran ordinateur ou
      mobile. Rend la page relue en version courte, avec un repère par
      élément ([e7]).
    capability: browser_action
  - id: navigateur_lire
    title: Lire la page
    doc: >-
      La page entière, lue comme par un lecteur d'écran, et ses dernières
      erreurs (JavaScript, requêtes ratées).
    capability: browser_read
  - id: navigateur_capture
    title: Prendre une capture
    doc: >-
      Une capture de l'écran, montrée au modèle comme une image ; gardée,
      elle sert de preuve et se voit dans Mission Control.
    capability: browser_screenshot

  # --- L'étape 2 : concevoir, critiquer, construire, relire (lot 10, Q91) ---
  - id: capacites_de_serge
    title: Ce que Serge sait faire
    doc: Les capacités du code de Serge, avec ce que chacune fait.
    capability: db_read
    read:
      tables: [capabilities]
      columns:
        - {table: capabilities, name: title}
        - {table: capabilities, name: doc_md, as: ce_qu_elle_fait}
      filters:
        - {id: disponibles, table: capabilities, column: available, fixed: '1'}
  - id: preuves_du_business
    title: Les preuves du business
    doc: Les pages qui prouvent le besoin derrière un business.
    capability: db_read
    read:
      tables: [venture_sources, listen_docs]
      columns:
        - {table: listen_docs, name: title}
        - {table: listen_docs, name: url}
        - {table: listen_docs, name: excerpt, as: apercu}
      joins:
        - {id: page, left: venture_sources.doc_id, right: listen_docs.id}
      filters:
        - {id: business, table: venture_sources, column: venture_id, param: venture_id}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: plan_par_numero
    title: Un plan
    doc: Un plan de POC ou de produit, par son numéro.
    capability: db_read
    read:
      tables: [product_plans]
      columns:
        - {table: product_plans, name: id}
        - {table: product_plans, name: round, as: tour}
        - {table: product_plans, name: status, as: statut}
        - {table: product_plans, name: hypothesis, as: hypothese}
        - {table: product_plans, name: target, as: cible}
        - {table: product_plans, name: channel, as: canal}
        - {table: product_plans, name: prospects}
        - {table: product_plans, name: duration_days, as: duree_jours}
        - {table: product_plans, name: price, as: prix}
        - {table: product_plans, name: deliverable, as: livrable}
        - {table: product_plans, name: plan}
        - {table: product_plans, name: scenarios}
        - {table: product_plans, name: challenge, as: avis_du_critique}
        - {table: product_plans, name: owner_notes, as: consignes_d_un_humain}
      filters:
        - {id: plan, table: product_plans, column: id, param: plan_id}
      params:
        - {name: plan_id, required: true, description: Le numéro du plan.}
  - id: plan_valide_du_poc
    title: Le plan validé du POC
    doc: Le dernier plan validé du POC d'un business.
    capability: db_read
    read:
      tables: [product_plans]
      columns:
        - {table: product_plans, name: id}
        - {table: product_plans, name: round, as: tour}
        - {table: product_plans, name: hypothesis, as: hypothese}
        - {table: product_plans, name: target, as: cible}
        - {table: product_plans, name: price, as: prix}
        - {table: product_plans, name: deliverable, as: livrable}
        - {table: product_plans, name: plan}
        - {table: product_plans, name: scenarios}
        - {table: product_plans, name: owner_notes, as: consignes_d_un_humain}
      filters:
        - {id: business, table: product_plans, column: venture_id, param: venture_id}
        - {id: valide, table: product_plans, column: status, fixed: validated}
        - {id: poc, table: product_plans, column: kind, fixed: poc}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
  - id: critiques_du_plan
    title: Les remarques du critique
    doc: Les remarques « à corriger » du critique sur un plan.
    capability: db_read
    read:
      tables: [plan_critiques]
      columns:
        - {table: plan_critiques, name: round, as: tour}
        - {table: plan_critiques, name: text, as: remarque}
      filters:
        - {id: plan, table: plan_critiques, column: plan_id, param: plan_id}
      params:
        - {name: plan_id, required: true, description: Le numéro du plan.}
  - id: passages_du_livrable
    title: Les passages de construction
    doc: >-
      Les passages de construction d'un livrable, du plus récent au plus
      ancien : le compte rendu du constructeur, puis le verdict et les
      remarques du relecteur.
    capability: db_read
    read:
      tables: [builds]
      columns: &colonnes_passage
        - {table: builds, name: id}
        - {table: builds, name: pass, as: passage}
        - {table: builds, name: status, as: statut}
        - {table: builds, name: report, as: compte_rendu_du_constructeur}
        - {table: builds, name: verdict, as: verdict_du_relecteur}
        - {table: builds, name: remarks, as: remarques_du_relecteur}
        - {table: builds, name: review, as: ce_que_le_relecteur_a_essaye}
        - {table: builds, name: owner_notes, as: consignes_d_un_humain}
      filters:
        - {id: business, table: builds, column: venture_id, param: venture_id}
        - {id: livrable, table: builds, column: deliverable, param: deliverable}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}
        - {name: deliverable, required: true, description: 'Le livrable : poc ou produit.'}
  - id: passage_par_numero
    title: Un passage de construction
    doc: Un passage de construction, par son numéro.
    capability: db_read
    read:
      tables: [builds]
      columns: *colonnes_passage
      filters:
        - {id: passage, table: builds, column: id, param: build_id}
      params:
        - {name: build_id, required: true, description: Le numéro du passage.}
  - id: staging_du_business
    title: Le staging du business
    doc: L'adresse du staging d'un business, sa version et son état.
    capability: db_read
    read:
      tables: [deployments]
      columns:
        - {table: deployments, name: hostname, as: adresse}
        - {table: deployments, name: version}
        - {table: deployments, name: status, as: etat}
        - {table: deployments, name: last_error, as: erreur}
      filters:
        - {id: business, table: deployments, column: venture_id, param: venture_id}
        - {id: staging, table: deployments, column: target, fixed: staging}
      params:
        - {name: venture_id, required: true, description: Le numéro du business.}

  # Stripe, par « Appeler une API » (lot 10, Q91). Le mode (service) et
  # l'identifiant du business sont figés sur l'invocation, jamais choisis
  # par le modèle (Q76).
  - id: stripe_creer_produit
    title: Créer un produit Stripe
    doc: Crée un produit dans Stripe ; rend son identifiant (prod_…).
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/products
      params:
        - {name: name, required: true, description: Le nom du produit.}
        - {name: description, description: "Ce que c'est, en une phrase."}
        - {name: 'metadata[venture_id]', description: Le business (figé en base).}
  - id: stripe_creer_prix
    title: Créer un prix Stripe
    doc: >-
      Crée un prix pour un produit Stripe ; rend son identifiant (price_…).
      L'identifiant du business est inscrit sur le prix (Q76).
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/prices
      params:
        - {name: product, required: true, description: Le produit (prod_…).}
        - {name: unit_amount, type: number, required: true, description: 'Le prix en centimes : 2900 pour 29 €.'}
        - {name: currency, required: true, description: 'La monnaie : eur.'}
        - {name: 'recurring[interval]', description: 'month ou year pour un abonnement ; rien pour un paiement unique.'}
        - {name: nickname, description: Un nom court pour ce prix.}
        - {name: 'metadata[venture_id]', description: Le business (figé en base).}
  - id: stripe_creer_lien_paiement
    title: Créer un lien de paiement Stripe
    doc: Crée un lien de paiement pour un prix ; rend son adresse (url).
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/payment_links
      params:
        - {name: 'line_items[0][price]', required: true, description: Le prix (price_…).}
        - {name: 'line_items[0][quantity]', type: number, required: true, description: 'La quantité : 1.'}
        - {name: 'metadata[venture_id]', description: Le business (figé en base).}
  - id: stripe_chercher_produits
    title: Chercher des produits Stripe
    doc: >-
      Cherche des produits Stripe. Exemple de recherche :
      metadata['venture_id']:'ven_123' pour les produits d'un business.
    capability: call_api
    api:
      service: stripe_test
      method: GET
      path: /v1/products/search
      params:
        - {name: query, required: true, description: La recherche Stripe.}
        - {name: limit, type: number, description: Le nombre de produits (100 au plus).}
  - id: stripe_lister_prix
    title: Lister les prix d'un produit Stripe
    doc: Les prix d'un produit Stripe, actifs ou archivés.
    capability: call_api
    api:
      service: stripe_test
      method: GET
      path: /v1/prices
      params:
        - {name: product, required: true, description: Le produit (prod_…).}
        - {name: limit, type: number, description: Le nombre de prix (100 au plus).}
  - id: stripe_archiver_prix
    title: Archiver un prix Stripe
    doc: Archive un prix (Stripe ne permet pas de le supprimer) ; il ne peut plus être payé.
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/prices/{id}
      params:
        - {name: id, required: true, description: Le prix (price_…).}
        - {name: active, type: bool, description: 'false pour l''archiver (figé en base).'}
  - id: stripe_archiver_produit
    title: Archiver un produit Stripe
    doc: Archive un produit Stripe ; il ne peut plus être vendu.
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/products/{id}
      params:
        - {name: id, required: true, description: Le produit (prod_…).}
        - {name: active, type: bool, description: 'false pour l''archiver (figé en base).'}
  - id: stripe_rembourser
    title: Rembourser un paiement Stripe
    doc: Rembourse un paiement en entier.
    capability: call_api
    api:
      service: stripe_test
      method: POST
      path: /v1/refunds
      params:
        - {name: payment_intent, required: true, description: Le paiement (pi_…).}
        - {name: 'metadata[venture_id]', description: Le business (figé en base).}


      - {name: display, short: true, description: Son nom.}
      - {name: funnel_state, short: true, description: 'Son étape (engagé, intention d''achat…).'}
      - {name: venture_id, description: Son business.}
      - {name: created_at, description: Sa date de création.}
  - table: touches
    title: Les envois
    description: Les messages que Serge envoie ou va envoyer, avec leur statut.
    order: created_at

        - {table: test_reports, name: venture_id}
        - {table: test_reports, name: contacted, as: prospects_contactes}
        - {table: test_reports, name: replies, as: reponses}
        - {table: test_reports, name: points}
        - {table: test_reports, name: spend_eur, as: depense_eur}
        - {table: test_reports, name: points_per_eur, as: points_par_euro}
        - {table: test_reports, name: figures, as: detail}
        - {table: test_reports, name: verdict}
        - {table: test_reports, name: verdict_reason, as: raison}
        - {table: test_reports, name: summary, as: bilan}

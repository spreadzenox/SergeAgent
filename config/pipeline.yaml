          observations: {source: field, value: fiches.observations}
          sellable_offer: {source: field, value: fiches.offre}
          family: {source: field, value: fiches.famille}
          lifecycle: {source: fixed, value: CANDIDATE}
      - table: venture_sources
        operation: insert
        for_each: fiches.pages
        parent: 0
        values:
          venture_id: {source: parent_row, value: id}
          doc_id: {source: field, value: fiches.pages}
          cycle_id: {source: task, value: cycle_id}
      - table: listen_docs
        operation: update
        for_each: fiches.pages
        parent: 0
        key: {column: id, source: field, value: fiches.pages}
        values:
          label: {source: fixed, value: preuve}
          labelled_at: {source: now}

  - id: choisir_business
    title: Choisir les business à tester
    role: >-
      Choisit parmi tous les candidats au plus autant de business qu'il
      reste de places de test, garde la raison de chaque choix, puis ferme
      le cycle.
    step: pre_prospection
    type: llm
    model_tier: mid
    queue: works
    priority: 10
    gets_serge_intro: true
    default_max_rows: 50
    max_tool_turns: 4
    compare:
      ventures: false
      listen_cycles: false
    prompt: |
      Tu choisis les business que Serge va tester. Serge a
      {quota.places_de_test} places de test en tout ; tu vois les
      business qui en occupent déjà une. Choisis au plus autant de
      business qu'il reste de places libres, parmi les candidats.

      Tes critères, dans l'ordre :
      1. la force des preuves : des pages qui montrent un vrai besoin,
         exprimé par de vraies personnes ;
      2. la facilité d'un test rapide : on peut proposer vite quelque chose
         de concret ;
      3. un premier revenu rapide ;
      4. la légalité.

      Pour chaque business choisi, donne son numéro et la raison du choix,
      en une phrase. Tu peux n'en choisir aucun si aucun candidat n'est
      assez solide : dis alors pourquoi dans la note. N'invente jamais un
      numéro.
    tools:
      - tool: business_en_test
        mode: given
        label: Les business en test
      - tool: business_candidats
        mode: given
        label: Les business candidats
      - tool: preuves_des_candidats
        mode: given
        label: Les preuves des candidats
        max_rows: 150
    output:
      - {path: choix, type: list, required: false, description: Les business choisis.}
      - {path: choix.business, type: text, description: Le numéro du business.}
      - {path: choix.raison, type: text, description: 'Pourquoi, en une phrase.'}
      - {path: note, type: text, required: false, description: "Ce que tu dis du cycle, par exemple pourquoi tu n'as rien choisi."}
    writes:
      - table: ventures
        operation: update
        for_each: choix
        key: {column: id, source: field, value: choix.business}
        values:
          lifecycle: {source: fixed, value: POC_SELECTED}
          choice_reason: {source: field, value: choix.raison}
      - table: listen_cycles
        operation: update
        key: {column: id, source: task, value: cycle_id}
        values:
          status: {source: fixed, value: CLOSED}
          finished_at: {source: now}
          choice_note: {source: field, value: note}

  - id: abandonner_cycle
    title: Abandonner le cycle en cours
    role: >-
      Ferme le cycle resté ouvert (une invocation qui a échoué, par
      exemple), et annule ses tâches en attente, pour pouvoir en lancer un
      autre. Sans LLM.
    step: pre_prospection
    type: capability
    capability: echo
    queue: works
    priority: 20
    writes:
      - table: listen_cycles
        operation: update
        key: {column: status, source: fixed, value: OPEN}
        values:
          status: {source: fixed, value: ABANDONED}
          finished_at: {source: now}

  - id: lire_un_flux
    title: Lire un flux RSS
    role: >-
      La veille : lit un flux RSS suivi et garde ses pages nouvelles, avec
      un aperçu tiré du résumé du flux. Sans LLM.
    step: pre_prospection
    type: capability
    capability: rss_read
    queue: works
    priority: 5
    settings:
      pages_par_flux: {value: 20, min: 1, max: 100, policy: true, description: Les pages lues au plus dans un flux à chaque passage.}
      lignes_apercu: {value: 5, min: 1, max: 30, policy: true, description: Les lignes de l'aperçu d'une page de flux.}
    params:
      url: {source: task, value: url}
      max_items: {source: setting, value: pages_par_flux}
      max_lines: {source: setting, value: lignes_apercu}
    writes:
      - table: listen_docs
        operation: insert
        for_each: rows
        values:
          url: {source: field, value: rows.url}
          title: {source: field, value: rows.title}
          excerpt: {source: field, value: rows.excerpt}
          published: {source: field, value: rows.published}
          source: {source: fixed, value: rss}
          feed_id: {source: task, value: feed_id}
          fetched_at: {source: now}
      - table: listen_feeds
        operation: update
        key: {column: id, source: task, value: feed_id}
        values:
          last_read_at: {source: now}

  - id: oublier_pages
    title: Oublier les vieilles pages
    role: >-
      Supprime les pages « bruit » et les pages jamais triées plus vieilles
      que le nombre de jours réglé. Une page qui sert de preuve n'est
      jamais supprimée. Sans LLM.
    step: pre_prospection
    type: capability
    capability: db_read
    queue: works
    priority: 1
    settings:
      jours: {value: 30, min: 1, max: 365, policy: true, description: Les jours avant d'oublier une page bruit ou jamais triée.}
    params:
      tool_id: {source: fixed, value: pages_a_oublier}
      jours: {source: setting, value: jours}
    writes:
      - table: listen_docs
        operation: delete
        for_each: rows
        key: {column: id, source: field, value: rows.id}

  - id: oublier_besoins
    title: Oublier les besoins jamais utilisés
    role: >-
      Supprime les pages « besoin nouveau » jamais utilisées plus vieilles
      que le nombre de jours réglé. Sans LLM.
    step: pre_prospection
    type: capability
    capability: db_read
    queue: works
    priority: 1
    settings:
      jours: {value: 60, min: 1, max: 365, policy: true, description: Les jours avant d'oublier une page « besoin nouveau » jamais utilisée.}
    params:
      tool_id: {source: fixed, value: besoins_a_oublier}
      jours: {source: setting, value: jours}
    writes:
      - table: listen_docs
        operation: delete
        for_each: rows
        key: {column: id, source: field, value: rows.id}

  - id: effacer_idees
    title: Effacer les idées (test)
    role: >-
      Bouton temporaire, pour tester le cycle en production autant de fois
      qu'on veut : détruit tous les business encore candidats ou choisis,
      et leurs preuves. Les pages restent. À retirer avant le vrai
      lancement de Serge. Sans LLM.
    step: pre_prospection
    type: capability
    capability: db_read
    queue: works
    priority: 20
    params:
      tool_id: {source: fixed, value: idees}
    writes:
      - table: ventures
        operation: delete
        for_each: rows
        key: {column: id, source: field, value: rows.id}
      - table: venture_sources
        operation: delete
        for_each: rows
        key: {column: venture_id, source: field, value: rows.id}

# --- Les conversations (lot 8, décision Q79) -------------------------------
# Un message reçu réveille « Traiter une réponse », qui écrit la réponse ;
# « Envoyer un message » la fait partir après le délai du canal. Les
# relances sont cherchées toutes les 15 minutes. Une désinscription bloque
# partout et prévient Julien et Clem. Détail : docs/LOT8_CONCEPTION.md.
  - id: relever_messages
    title: Relever les messages
    role: >-
      Lit les messages reçus sur un canal depuis sa dernière relève, les
      rattache à leur contact (par le fil, sinon par l'adresse) et les
      écrit dans les messages reçus. Sans LLM.
    type: capability
    capability: receive_messages
    queue: conversations
    priority: 80
    params:
      channel: {source: task, value: channel}
    writes:
      - table: inbound_events
        operation: insert
        for_each: rows
        values:
          channel: {source: task, value: channel}
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          native_type: {source: field, value: rows.native_type}
          address: {source: field, value: rows.address}
          subject: {source: field, value: rows.subject}
          body: {source: field, value: rows.body}
          message_ref: {source: field, value: rows.message_ref}
          external_ref: {source: field, value: rows.external_ref}
          status: {source: field, value: rows.status}
          received_at: {source: now}
      - table: canaux
        operation: update
        key: {column: id, source: task, value: channel}
        values:
          polled_at: {source: now}

  - id: traiter_reponse
    title: Traiter une réponse
    role: >-
      Lit le message d'un contact avec tout son fil, dit ce qu'il fait
      (question, refus, désinscription…), écrit la réponse de Serge et note
      les demandes sur le produit. Une seule tâche attend par contact :
      deux messages coup sur coup n'ont qu'une réponse.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 100
    gets_serge_intro: true
    max_tool_turns: 3
    single_pending: contact_id
    compare:
      inbound_events: false
      touches: false
      contacts: false
      customer_requests: false
    prompt: &consigne_traiter_reponse |
      Tu réponds, au nom de Serge, à un contact qui vient d'écrire à propos
      d'un business que Serge teste.

      Tu reçois le fil du contact (tout ce qui s'est dit, tous canaux
      confondus, du plus ancien au plus récent), sa fiche, la fiche du
      business, la fiche produit et ses questions fréquentes. Tu réponds au
      dernier message du fil ; si le contact a écrit plusieurs fois depuis
      la dernière réponse de Serge, réponds à tout d'un coup.

      Le dernier message peut être la transcription d'un appel (canal
      voice). La suite part alors par e-mail si Serge a son adresse, sinon
      Serge rappelle : écris-la comme un e-mail court qui reprend ce qui a
      été promis (un document, un devis), ou laisse-la vide s'il n'y a
      rien à ajouter après l'appel.

      Rends :
      - reaction : ce que fait le message, l'une de : intéressé, question,
        objection, rendez-vous, refus, désinscription, absence, hors sujet.
        « désinscription » : la personne demande à ne plus être contactée
        (« STOP », « ne m'écrivez plus »). « absence » : une réponse
        automatique (congés, absence).
      - reply : le texte de ta réponse, prêt à partir, sans objet ni
        signature d'humain. Laisse-le vide pour une désinscription, une
        absence ou un message hors sujet : Serge ne répond rien.
      - requests : les demandes sur le produit que contient le message, s'il
        y en a : un bug, une insatisfaction, une idée (une fonctionnalité
        qui manque).
      - besoin_julien : vide si tu peux répondre seul. Sinon, en une phrase,
        pourquoi un humain doit voir ta réponse avant qu'elle parte : une
        question sur le produit à laquelle la fiche produit et les
        questions fréquentes ne répondent pas, un prix, une date ou un
        engagement que tu ne peux pas prendre, une proposition faite à
        Serge (un partenariat, une offre), un échange tendu, ou un doute
        réel. Écris quand même ton meilleur brouillon dans reply : Julien
        l'enverra, le remplacera par sa réponse, ou te demandera de le
        réécrire.
      - question_produit : si le message pose une question sur le produit
        à laquelle la fiche produit ne répond pas, cette question en une
        phrase ; sinon vide. La réponse de Julien rejoindra les questions
        fréquentes, et la fois suivante tu répondras seul.
      - arreter : « oui » pour que Serge arrête avec ce contact, sinon
        « non ». Réponds « oui » quand la conversation ne mène nulle part :
        un robot qui répond à chaque message, un accusé de réception
        automatique (« votre demande n° 1234 est bien reçue »), une liste
        de diffusion, ou une conversation qui tourne en rond sans personne
        en face. Laisse alors reply vide : Serge ne lui écrira plus, et ce
        qu'il écrira ensuite ne sera plus traité.

      Règles :
      - Un refus : remercie poliment, sans insister.
      - Un rendez-vous : confirme-le.
      - Ne promets jamais une date, un prix ou une fonctionnalité absents de
        la fiche produit. Une fonctionnalité qui manque devient une demande
        « idée ». En cas de doute, réponds sans t'engager et remplis
        besoin_julien.
      - Écris dans la langue du contact, simplement et brièvement.
      - Serge assume d'être un agent IA : ne prétends jamais être un humain.
    tools:
      - tool: fil_du_contact
        mode: given
        label: Le fil du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_contact
        mode: given
        label: La fiche du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: reaction, type: choice, choices: [intéressé, question, objection, rendez-vous, refus, désinscription, absence, hors sujet], description: Ce que fait le message.}
      - {path: reply, type: text, description: 'Le texte de la réponse, ou vide pour ne rien répondre.'}
      - {path: requests, type: list, required: false, description: Les demandes sur le produit.}
      - {path: requests.kind, type: choice, choices: [bug, insatisfaction, idée], description: La sorte de demande.}
      - {path: requests.text, type: text, description: 'La demande, en une phrase.'}
      - &sortie_besoin_julien {path: besoin_julien, type: text, required: false, description: 'Vide si Serge répond seul ; sinon pourquoi un humain doit voir la réponse avant qu''elle parte.'}
      - &sortie_question_produit {path: question_produit, type: text, required: false, description: 'La question du contact sur le produit à laquelle la fiche ne répond pas, ou vide.'}
      - &sortie_arreter {path: arreter, type: choice, choices: [non, oui], required: false, description: '« oui » pour que Serge arrête avec ce contact : la conversation ne mène nulle part (un robot qui répond à chaque message, un accusé de réception automatique, une liste de diffusion). Sinon « non ».'}
    writes:
      - table: inbound_events
        operation: update
        key: {column: id, source: task, value: inbound_id}
        values:
          reaction: {source: field, value: reaction}
      - table: inbound_events
        operation: update
        key: {column: id, source: task, value: inbound_id}
        condition: {field: reaction, op: '=', value: absence}
        values:
          status: {source: fixed, value: ignored}
      - table: touches
        operation: insert
        condition: {field: reply, op: non_vide}
        values:
          contact_id: {source: task, value: contact_id}
          venture_id: {source: task, value: venture_id}
          channel: {source: task, value: channel}
          address: {source: task, value: address}
          subject: {source: task, value: subject}
          body: {source: field, value: reply}
          kind: {source: fixed, value: reply}
          status: {source: fixed, value: pending}
          reply_to: {source: task, value: inbound_id}
          needs_owner: &valeur_besoin_julien {source: field, value: besoin_julien}
          owner_question: &valeur_question_produit {source: field, value: question_produit}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: question}
        values:
          funnel_state: {source: fixed, value: ENGAGED}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: objection}
        values:
          funnel_state: {source: fixed, value: ENGAGED}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: intéressé}
        values:
          funnel_state: {source: fixed, value: INTENT}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: rendez-vous}
        values:
          funnel_state: {source: fixed, value: MEETING}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        condition: {field: reaction, op: '=', value: refus}
        values:
          funnel_state: {source: fixed, value: REJECTED}
      - table: customer_requests
        operation: insert
        for_each: requests
        values:
          venture_id: {source: task, value: venture_id}
          contact_id: {source: task, value: contact_id}
          inbound_id: {source: task, value: inbound_id}
          kind: {source: field, value: requests.kind}
          text: {source: field, value: requests.text}

  - id: envoyer_message
    title: Envoyer un message
    role: >-
      Fait partir un envoi par son canal, après les garde-fous, sans jamais
      l'envoyer deux fois. Annule un envoi devenu inutile (le contact a
      écrit depuis, ou s'est désinscrit). Sans LLM.
    type: capability
    capability: send_message
    queue: conversations
    priority: 50
    params:
      touch_id: {source: task, value: touch_id}

  # --- Julien dans la conversation (lot 8 bis, décisions Q85 et Q86) ------
  # Un envoi qui attend un humain ouvre un ticket « Conversation », dans le
  # forum « tickets » du serveur Discord (Q88). Chaque bouton est une réponse
  # (table ticket_answers) qui réveille une de ces invocations.
  - id: demander_julien
    title: Demander à Julien
    role: >-
      Un envoi attend un humain : ouvre son ticket « Conversation » (le
      business, le prospect, le fil, le brouillon, pourquoi Serge demande,
      la question), ou le met à jour et le rouvre si le brouillon a été
      réécrit. Sans LLM.
    type: capability
    capability: ask_owners
    queue: conversations
    priority: 90
    params:
      ticket_type: {source: fixed, value: CONVERSATION}
      ref_table: {source: fixed, value: touches}
      ref_id: {source: task, value: touch_id}
      raison: {source: task, value: raison}
      question: {source: task, value: question}
      title: {source: fixed, value: Une réponse attend ton avis}

  - id: valider_envoi
    title: Envoyer le brouillon validé
    role: >-
      « Envoyer le brouillon » : l'envoi qui attendait est validé, et part.
      Sans LLM.
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      touch_id: {source: task, value: touch_id}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          status: {source: fixed, value: pending}
          owner_ok_at: {source: now}

  - id: envoyer_reponse_de_julien
    title: Envoyer la réponse de Julien
    role: &role_ma_reponse >-
      « Ma réponse » : le texte et l'objet de Julien remplacent le
      brouillon, et partent tels quels. Sans LLM.
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      touch_id: {source: task, value: touch_id}
      texte: {source: task, value: texte}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          body: {source: task, value: texte}
          subject: &objet_de_julien {source: task, value: objet}
          status: {source: fixed, value: pending}
          owner_ok_at: {source: now}

  - id: ajouter_question_frequente
    title: Ajouter aux questions fréquentes
    role: >-
      « Ma réponse » à une question sur le produit : la question du contact
      et la réponse de Julien rejoignent les questions fréquentes de la
      fiche produit ; la fois suivante, Serge répond seul (Q50). Sans LLM.
    type: capability
    capability: echo
    queue: conversations
    priority: 70
    params:
      venture_id: {source: task, value: venture_id}
      question: {source: task, value: question}
      texte: {source: task, value: texte}
    writes:
      - table: product_faq
        operation: insert
        condition: {field: question, op: non_vide}
        values:
          venture_id: {source: task, value: venture_id}
          question: {source: task, value: question}
          answer: {source: task, value: texte}

  - id: annuler_envoi
    title: Ne rien envoyer
    role: >-
      « Ne rien envoyer » : l'envoi qui attendait est annulé. Sans LLM.
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      touch_id: {source: task, value: touch_id}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          status: {source: fixed, value: cancelled}
          last_error: {source: fixed, value: annulé par un administrateur}

  - id: reecrire_brouillon
    title: Réécrire un brouillon
    role: >-
      « Réécrire » : réécrit le brouillon qui attend selon les consignes de
      Julien ; le nouveau brouillon revient dans le même ticket.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 80
    gets_serge_intro: true
    max_tool_turns: 2
    compare:
      touches: false
    prompt: |
      Tu réécris, au nom de Serge, une réponse à un contact. Julien a lu le
      brouillon et te donne ses consignes (dans les paramètres de la tâche,
      « consignes ») : suis-les à la lettre.

      Tu reçois le brouillon, le fil du contact, la fiche du business, la
      fiche produit et ses questions fréquentes.

      Rends reply : la nouvelle réponse, prête à partir, sans objet ni
      signature d'humain. Écris dans la langue du contact, simplement et
      brièvement. Ne promets jamais une date, un prix ou une fonctionnalité
      absents de la fiche produit, sauf si Julien te le demande. Serge
      assume d'être un agent IA.
    tools:
      - tool: brouillon_de_l_envoi
        mode: given
        label: Le brouillon
        params:
          touch_id: {source: task, value: touch_id}
      - tool: fil_du_contact
        mode: given
        label: Le fil du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: reply, type: text, description: 'La nouvelle réponse, prête à partir.'}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          body: {source: field, value: reply}

  - id: preparer_reponse_attente
    title: Préparer une réponse d'attente
    role: >-
      Personne n'a répondu au ticket à temps : prépare une réponse
      d'attente prudente au contact, par le même canal ; le ticket reste
      ouvert et le brouillon attend toujours Julien (Q85). Sans LLM.
    type: capability
    capability: db_read
    queue: conversations
    priority: 80
    params:
      tool_id: {source: fixed, value: envoi_en_attente}
      touch_id: {source: task, value: touch_id}
    writes:
      - table: touches
        operation: insert
        for_each: rows
        values:
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          channel: {source: field, value: rows.channel}
          address: {source: field, value: rows.address}
          subject: {source: field, value: rows.subject}
          reply_to: {source: field, value: rows.reply_to}
          body: {source: fixed, value: 'Merci pour votre message. Je vérifie ce point et je reviens vers vous très vite.'}
          kind: {source: fixed, value: reply}
          status: {source: fixed, value: pending}
          owner_ok_at: {source: now}

  - id: passer_la_main
    title: Passer à la suite (ticket)
    role: >-
      Le feu vert d'un ticket « Passage » : fait partir le passage qui
      attendait un clic, comme le bouton de Mission Control (Q62). Sans
      LLM.
    type: capability
    capability: pass_link
    queue: conversations
    priority: 90
    params:
      passage: {source: task, value: passage}

  - id: preparer_relances
    title: Préparer les relances
    role: >-
      Cherche les contacts qui n'ont pas répondu au dernier message de Serge
      depuis le délai réglé, et écrit pour chacun une relance à rédiger, sur
      le canal du premier message. Sans LLM.
    type: capability
    capability: due_followups
    queue: conversations
    priority: 50
    settings:
      premiere_relance_minutes: {value: 4320, min: 0, max: 43200, policy: true, description: Les minutes entre le premier message et la première relance (4320 = 3 jours).}
      relance_suivante_minutes: {value: 10080, min: 0, max: 43200, policy: true, description: Les minutes entre deux relances (10080 = 7 jours).}
      relances_max: {value: 2, min: 0, max: 5, policy: true, description: Le nombre maximum de relances par contact.}
    params:
      first_delay_minutes: {source: setting, value: premiere_relance_minutes}
      next_delay_minutes: {source: setting, value: relance_suivante_minutes}
      max_followups: {source: setting, value: relances_max}
    writes:
      - table: touches
        operation: insert
        for_each: rows
        values:
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          channel: {source: field, value: rows.channel}
          address: {source: field, value: rows.address}
          subject: {source: field, value: rows.subject}
          followup_of: {source: field, value: rows.followup_of}
          kind: {source: fixed, value: followup}
          status: {source: fixed, value: to_write}

  - id: ecrire_relance
    title: Écrire une relance
    role: >-
      Rédige une relance courte pour un contact qui n'a pas répondu, à
      partir de son fil et de la fiche produit.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 50
    gets_serge_intro: true
    max_tool_turns: 3
    compare:
      touches: false
    prompt: |
      Tu écris une relance, au nom de Serge, à un contact qui n'a pas
      répondu au dernier message de Serge.

      Tu reçois le fil du contact, sa fiche, la fiche du business et la
      fiche produit. Écris un message court et poli, qui rappelle l'offre en
      une phrase et apporte quelque chose de neuf (un détail de la fiche
      produit, une question simple). Ne répète pas le message précédent.
      Ne promets rien qui ne soit pas dans la fiche produit. Écris dans la
      langue du fil, sans objet ni signature d'humain : Serge assume d'être
      un agent IA.
    tools:
      - tool: fil_du_contact
        mode: given
        label: Le fil du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_contact
        mode: given
        label: La fiche du contact
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
    output:
      - {path: body, type: text, description: Le texte de la relance.}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          body: {source: field, value: body}
          status: {source: fixed, value: pending}

  - id: desinscrire
    title: Désinscrire
    role: >-
      Une personne demande à ne plus être contactée : bloque toutes ses
      adresses sur tous les canaux, passe toutes ses fiches, dans tous les
      business, à « Désinscrit », et annule ses envois en attente. Sans LLM.
    type: capability
    capability: unsubscribe_contact
    queue: conversations
    priority: 100
    params:
      contact_id: {source: task, value: contact_id}

  - id: arreter_contact
    title: Arrêter avec un contact
    role: >-
      Une conversation ne mène nulle part (un robot qui répond à chaque
      message, un accusé de réception automatique) : passe le contact à
      « Arrêté » ; Serge ne lui écrit plus et ne lui répond plus, et ses
      envois en attente sont annulés. Ce qu'il écrit ensuite reste dans son
      fil, sans être traité. Sans LLM (lot 10 bis, Q93).
    type: capability
    capability: stop_contact
    queue: conversations
    priority: 100
    params:
      contact_id: {source: task, value: contact_id}
      reason: {source: task, value: reason}

  - id: prevenir_julien_et_clem
    title: Prévenir Julien et Clem
    role: >-
      Ouvre un ticket d'information quand un contact s'est désinscrit, pour
      que Julien et Clem voient ce qui se passe. Sans LLM.
    type: capability
    capability: inform_owners
    queue: conversations
    priority: 100
    params:
      title: {source: fixed, value: Un contact s'est désinscrit}
      text: {source: fixed, value: 'Serge ne le contactera plus, sur aucun canal ni pour aucun business.'}
      contact_id: {source: task, value: contact_id}

  - id: parler_au_telephone
    title: Parler au téléphone
    role: >-
      L'agent vocal : il mène chaque appel, entrant ou sortant, en direct.
      Il reçoit au décrochage la fiche du contact, son fil, la fiche du
      business et la fiche produit ; il peut chercher un appelant inconnu
      et noter une adresse. À la fin, ce qui s'est dit entre dans le fil
      du contact, ce qui lance la suite.
    type: llm
    model_tier: ''
    queue: voice
    priority: 100
    gets_serge_intro: true
    compare:
      inbound_events: false
    settings:
      duree_max_secondes: {value: 180, min: 30, max: 1800, policy: true, description: 'La durée maximale d''un appel, en secondes.'}
      fournisseurs: {type: text, value: 'xai,openai', description: 'Les fournisseurs de la voix en direct, dans l''ordre (xai, openai) : le second sert si le premier ne répond pas.'}
      modele_xai: {type: text, value: grok-voice-think-fast-2.0, description: Le modèle vocal chez xAI.}
      voix_xai: {type: text, value: eve, description: La voix chez xAI.}
      modele_openai: {type: text, value: gpt-realtime-2.1-mini, description: Le modèle vocal chez OpenAI.}
      voix_openai: {type: text, value: alloy, description: La voix chez OpenAI.}
      modele_secours: {type: text, value: openai/gpt-4o-mini, description: 'Le modèle du secours tour par tour (OpenRouter), quand la voix en direct ne répond pas.'}
      tours_secours: {value: 4, min: 1, max: 20, description: Les tours de parole au plus dans le secours tour par tour.}
    prompt: &consigne_parler_au_telephone |
      Tu es Serge, au téléphone. Tu parles français, simplement, une ou
      deux phrases courtes à la fois, sans liste ni formule écrite.

      Tu reçois peut-être la fiche de ton interlocuteur, son e-mail, son
      fil (ce qui s'est déjà dit, tous canaux confondus), la fiche du
      business et la fiche produit, et, pour un appel que tu passes, son
      but.

      - Un appel que tu passes : présente-toi, dis pourquoi tu appelles
        (son but), demande si c'est le bon moment.
      - Un appel que tu reçois d'un numéro inconnu : « Bonjour, je suis
        Serge, en quoi puis-je vous aider ? ». Demande à qui tu parles,
        puis cherche sa fiche avec l'outil « Chercher un contact » (son
        nom, son entreprise, son e-mail ou son numéro).
      - Une personne reconnue seulement par son nom : ne lui répète
        aucune information sensible (montants, adresses, propos d'un
        collègue).
      - Une proposition faite à Serge (un partenariat, une offre) :
        réponds poliment que tu ne peux pas traiter ce genre de demande
        pour l'instant.
      - Un document à envoyer (une documentation, un devis) : il part par
        e-mail. Si tu as son e-mail (« Son e-mail »), propose-le : « Je
        vous l'envoie à cette adresse, c'est bien la bonne ? ». Sinon,
        ou si elle n'est plus bonne, demande-lui son adresse, fais-la
        épeler et relis-la lettre par lettre.
      - Une adresse ne se note qu'une fois confirmée : attends que la
        personne dise « oui » à ta relecture avant d'appeler « Noter une
        adresse ». Si elle corrige, reprends la relecture depuis le
        début. Si elle remplace une adresse que tu avais, passe
        l'ancienne dans « replaces » : elle ne servira plus.
        Ensuite seulement, dis que le document arrive par e-mail.
      - Ne promets jamais une date, un prix ou une fonctionnalité absents
        de la fiche produit. En cas de doute, dis que tu vérifies et que
        tu reviens vers la personne.
      - Une personne qui ne veut plus être contactée : dis que c'est noté,
        puis au revoir.
      - Tu es un agent IA : dis-le si on te le demande, ne prétends
        jamais être un humain.
      - Pour finir, dis au revoir.
    tools:
      - tool: but_de_l_appel
        mode: given
        label: Le but de l'appel
        params:
          touch_id: {source: task, value: touch_id}
      - tool: fil_du_contact
        mode: given
        label: Le fil de ton interlocuteur
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_contact
        mode: given
        label: Sa fiche
        params:
          contact_id: {source: task, value: contact_id}
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: chercher_contact
        mode: callable
      - tool: noter_adresse
        mode: callable
      - &outil_email_du_contact
        tool: email_du_contact
        mode: given
        label: Son e-mail
        params:
          contact_id: {source: task, value: contact_id}
    output:
      - {path: transcript, type: text, description: 'Ce qui s''est dit, une ligne par phrase.'}
      - {path: contact_id, type: text, required: false, description: Le contact de l'appel.}
      - {path: venture_id, type: text, required: false, description: Son business.}
      - {path: status, type: text, description: 'attached (contact connu) ou unattached.'}
    writes:
      - table: inbound_events
        operation: insert
        values:
          channel: {source: fixed, value: voice}
          contact_id: {source: field, value: contact_id}
          venture_id: {source: field, value: venture_id}
          native_type: {source: fixed, value: call}
          address: {source: task, value: phone}
          subject: {source: fixed, value: Suite à notre appel}
          body: {source: field, value: transcript}
          external_ref: {source: task, value: cdr_id}
          status: {source: field, value: status}
          received_at: {source: now}

# --- Le kit d'essai (lot 8, PR 4, décision Q79) -----------------------------
# Temporaire : à retirer avant le vrai lancement de Serge. Le bouton
# « Lancer un essai » (page Système) crée un business bidon avec une
# demi-fiche produit, la fiche de la personne qui essaie (ses coordonnées
# restent en base, jamais dans le dépôt) avec son accord pour l'appel de
# test, puis Serge lui écrit et l'appelle.
  - id: lancer_essai
    title: Lancer un essai (temporaire)
    role: >-
      Temporaire, pour essayer les canaux : remplace le business d'essai
      précédent par un business bidon neuf, avec sa demi-fiche produit et
      ses questions fréquentes. Sans LLM.
    type: capability
    capability: echo
    queue: conversations
    priority: 60
    params:
      name: {source: task, value: name}
      email: {source: task, value: email}
      phone: {source: task, value: phone}
    writes:
      - table: ventures
        operation: delete
        key: {column: lifecycle, source: fixed, value: TEST}
      - table: ventures
        operation: insert
        values:
          name: {source: fixed, value: Devis Vocal}
          description: {source: fixed, value: 'Les artisans dictent leurs devis au téléphone ; Devis Vocal les met en page et les envoie au client.'}
          sellable_offer: {source: fixed, value: 'Un mois d''essai gratuit, puis 29 € par mois, sans engagement.'}
          lifecycle: {source: fixed, value: TEST}
          validate_drafts: &valeur_essai_valider {source: task, value: valider}
      - table: product_sheets
        operation: insert
        parent: 1
        values:
          venture_id: {source: parent_row, value: id}
          summary: {source: fixed, value: 'Pour les artisans du bâtiment : on appelle un numéro, on dicte son devis en parlant normalement, et le devis mis en page part au client par e-mail en moins de 10 minutes.'}
          limits: {source: fixed, value: 'Pas d''export vers un logiciel de comptabilité ; pas de factures, seulement des devis ; en français seulement.'}
          price: {source: fixed, value: 'Un mois d''essai gratuit, puis 29 € par mois, sans engagement.'}
          delays: {source: fixed, value: 'Un devis part en moins de 10 minutes après l''appel.'}
          usage: {source: fixed, value: 'On appelle le numéro Devis Vocal, on dit le nom du client, les prestations et les prix ; on relit le devis reçu par e-mail avant qu''il parte.'}
      - table: product_faq
        operation: insert
        parent: 1
        values:
          venture_id: {source: parent_row, value: id}
          question: {source: fixed, value: 'Est-ce que je peux corriger un devis avant qu''il parte ?'}
          answer: {source: fixed, value: 'Oui : vous le recevez d''abord par e-mail, et il ne part au client que quand vous répondez « OK ».'}
      - table: product_faq
        operation: insert
        parent: 1
        values:
          venture_id: {source: parent_row, value: id}
          question: {source: fixed, value: 'Ça marche avec mon logo ?'}
          answer: {source: fixed, value: 'Oui : vous envoyez votre logo une fois par e-mail, il est mis sur tous vos devis.'}

  - id: creer_contact_essai
    title: Créer le contact d'essai (temporaire)
    role: >-
      Temporaire : crée la fiche de la personne qui essaie, avec son accord
      pour l'appel de test (à toute heure, décision Q79), puis un premier
      e-mail et un premier appel à rédiger. Sans LLM.
    type: capability
    capability: add_contact
    queue: conversations
    priority: 60
    params:
      venture_id: {source: task, value: venture_id}
      name: {source: task, value: name}
      email: {source: task, value: email}
      phone: {source: task, value: phone}
      call_consent: {source: fixed, value: test}
    writes:
      - table: touches
        operation: insert
        for_each: rows
        condition: {field: rows.email, op: non_vide}
        values:
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          channel: {source: fixed, value: email}
          address: {source: field, value: rows.email}
          kind: {source: fixed, value: first}
          status: {source: fixed, value: to_write}
      - table: touches
        operation: insert
        for_each: rows
        condition: {field: rows.phone, op: non_vide}
        values:
          contact_id: {source: field, value: rows.contact_id}
          venture_id: {source: field, value: rows.venture_id}
          channel: {source: fixed, value: voice}
          address: {source: field, value: rows.phone}
          kind: {source: fixed, value: first}
          status: {source: fixed, value: to_write}

  - id: ecrire_premier_message
    title: Écrire le premier message (temporaire)
    role: >-
      Temporaire : rédige le premier e-mail au contact d'essai, qui lui
      présente le business et son offre.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 50
    gets_serge_intro: true
    max_tool_turns: 3
    compare:
      touches: false
      contacts: false
    prompt: |
      Tu écris le premier e-mail de Serge à une personne qu'il ne connaît
      pas encore, pour lui présenter un business.

      Tu reçois la fiche du business, la fiche produit et ses questions
      fréquentes, et la fiche de la personne. Écris un objet court et un
      message de quelques phrases : le problème que le produit résout, ce
      qu'il fait, l'offre, et une question simple pour l'inviter à
      répondre. Ne promets rien qui ne soit pas dans la fiche produit.
      Serge assume d'être un agent IA : pas de signature d'humain.
    tools:
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_contact
        mode: given
        label: La fiche de la personne
        params:
          contact_id: {source: task, value: contact_id}
    output:
      - {path: subject, type: text, description: L'objet de l'e-mail.}
      - {path: body, type: text, description: Le texte de l'e-mail.}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          subject: {source: field, value: subject}
          body: {source: field, value: body}
          status: {source: fixed, value: pending}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        values:
          funnel_state: {source: fixed, value: CONTACTING}

  - id: preparer_premier_appel
    title: Préparer le premier appel (temporaire)
    role: >-
      Temporaire : écrit le but du premier appel au contact d'essai, que
      l'agent vocal reçoit au décrochage.
    type: llm
    model_tier: mid
    queue: conversations
    priority: 50
    gets_serge_intro: true
    max_tool_turns: 3
    compare:
      touches: false
      contacts: false
    prompt: |
      Tu prépares le premier appel de Serge à une personne qu'il ne connaît
      pas encore, pour lui présenter un business.

      Tu reçois la fiche du business, la fiche produit et la fiche de la
      personne. Écris le but de l'appel en deux ou trois phrases, pour
      l'agent vocal : ce qu'il présente, l'offre, et ce qu'il veut obtenir
      (un intérêt, un rendez-vous, une adresse e-mail pour envoyer la
      documentation).
    tools:
      - tool: fiche_business
        mode: given
        label: La fiche du business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_contact
        mode: given
        label: La fiche de la personne
        params:
          contact_id: {source: task, value: contact_id}
    output:
      - {path: body, type: text, description: Le but de l'appel.}
    writes:
      - table: touches
        operation: update
        key: {column: id, source: task, value: touch_id}
        values:
          subject: {source: fixed, value: 'Appel d''essai'}
          body: {source: field, value: body}
          status: {source: fixed, value: pending}
      - table: contacts
        operation: update
        key: {column: id, source: task, value: contact_id}
        values:
          funnel_state: {source: fixed, value: CONTACTING}

  - id: essayer_chantier
    title: Essayer le chantier (temporaire)
    role: >-
      Temporaire, pour essayer le chantier depuis Mission Control (lot 10,
      Q91) : reçoit une mission, travaille dans le chantier d'essai avec
      ses quatre outils (commande, lire, écrire, modifier), vérifie que ça
      marche, puis rend un compte rendu.
    type: llm
    model_tier: smart
    queue: works
    priority: 30
    max_tool_turns: 40
    prompt: |
      Tu travailles dans un chantier : un conteneur Linux (Debian, avec git,
      Python 3 et Node), dans le dossier /work. Il est à toi : tu peux y
      installer ce qu'il te faut. Tu as quatre outils : lancer une
      commande, lire un fichier, écrire un fichier, modifier un passage
      d'un fichier. Tu peux en appeler plusieurs d'un coup.

      Fais la mission donnée dans les paramètres de la tâche. Avant de
      répondre, vérifie que ce que tu as fait marche vraiment : lance-le,
      lis ce qu'il rend. Un serveur se lance en arrière-plan ; interroge-le
      ensuite avec curl.

      Rends ton compte rendu : ce que tu as fait, les commandes qui l'ont
      vérifié et ce qu'elles ont rendu, et ce qui ne marche pas encore.
    tools:
      - tool: chantier_commande
        mode: callable
        params:
          venture_id: {source: fixed, value: essai}
          deliverable: {source: fixed, value: chantier}
          profile: {source: fixed, value: chantier}
      - tool: chantier_lire
        mode: callable
        params:
          venture_id: {source: fixed, value: essai}
          deliverable: {source: fixed, value: chantier}
          profile: {source: fixed, value: chantier}
      - tool: chantier_ecrire
        mode: callable
        params:
          venture_id: {source: fixed, value: essai}
          deliverable: {source: fixed, value: chantier}
          profile: {source: fixed, value: chantier}
      - tool: chantier_modifier
        mode: callable
        params:
          venture_id: {source: fixed, value: essai}
          deliverable: {source: fixed, value: chantier}
          profile: {source: fixed, value: chantier}
    output:
      - {path: marche, type: choice, choices: [oui, non], description: 'La mission marche-t-elle, vérifiée dans le chantier ?'}
      - {path: compte_rendu, type: text, description: 'Ce qui a été fait, vérifié, et ce qui ne marche pas.'}

  - id: essayer_navigateur
    title: Essayer l'interface web (temporaire)
    role: >-
      Temporaire, pour essayer l'interface web depuis Mission Control (lot
      10, Q91) : ouvre une adresse, y fait la mission comme le ferait une
      personne (lire, cliquer, taper, sur ordinateur et sur mobile), garde
      des captures, puis dit ce qu'elle a vu et ce qui ne marche pas.
    type: llm
    model_tier: code
    queue: works
    priority: 30
    max_tool_turns: 40
    prompt: |
      Tu essaies un site web comme le ferait une personne ordinaire qui le
      découvre. Tu as trois outils : agir dans la page (ouvrir une adresse,
      cliquer sur un repère [e7], taper dans un champ, choisir dans une
      liste, appuyer sur une touche, faire défiler, revenir, attendre un
      texte, passer en écran ordinateur ou mobile), lire la page entière,
      et prendre une capture. Après chaque action, tu reçois la page relue.

      Commence par ouvrir l'adresse donnée dans les paramètres de la
      tâche, puis fais la mission. L'adresse http://chantier:<port> mène au
      chantier d'essai, si un serveur y tourne. Regarde vraiment l'écran :
      prends au moins une capture sur ordinateur et une sur mobile, et
      garde-les (keep). Lis les erreurs de la page.

      Rends ce qui marche (oui ou non) et ton compte rendu : ce que tu as
      fait, ce que tu as vu, ce qui ne marche pas ou gêne, avec le numéro
      de la capture qui le montre.
    tools:
      - tool: navigateur_agir
        mode: callable
        params:
          venture_id: {source: fixed, value: essai}
          deliverable: {source: fixed, value: chantier}
          task_id: {source: task, value: task_id}
      - tool: navigateur_lire
        mode: callable
        params:
          venture_id: {source: fixed, value: essai}
          deliverable: {source: fixed, value: chantier}
          task_id: {source: task, value: task_id}
      - tool: navigateur_capture
        mode: callable
        params:
          venture_id: {source: fixed, value: essai}
          deliverable: {source: fixed, value: chantier}
          task_id: {source: task, value: task_id}
    output:
      - {path: marche, type: choice, choices: [oui, non], description: 'Le site fait-il ce que demande la mission ?'}
      - {path: compte_rendu, type: text, description: 'Ce qui a été fait, vu, et ce qui ne marche pas, captures à l''appui.'}

  - id: publier_essai
    title: Publier le chantier d'essai (temporaire)
    role: >-
      Temporaire, pour essayer la publication depuis Mission Control (lot
      10, Q91) : fige le chantier d'essai en une version, la construit et
      la met en ligne en staging, ou passe la version du staging en prod.
      Sans LLM.
    type: capability
    capability: publish_version
    queue: works
    priority: 30
    params:
      venture_id: {source: fixed, value: essai}
      deliverable: {source: fixed, value: chantier}
      slug: {source: fixed, value: essai}
      target: {source: task, value: cible}
      task_id: {source: task, value: task_id}

  # --- L'étape 2 : concevoir, critiquer, construire, relire (lot 10, Q91) ---
  # Un business choisi pour un POC est conçu, critiqué (3 tours au plus),
  # validé par un humain (ticket « Plan », 48 heures), construit dans son
  # chantier, publié en staging et relu (3 passages au plus), essayé par un
  # humain (ticket « Tester le produit », sans délai), publié en prod, et sa
  # campagne de test est prête. Les boucles sont bornées par « Compter les
  # tours » ; rien n'est propre à une invocation dans le code.
  - id: concevoir_poc
    title: Concevoir le POC
    role: >-
      Écrit le plan de A à Z du POC d'un business (hypothèse, cible, canal,
      prospects, durée, prix indicatif, livrable, ce que le constructeur
      doit faire, scénarios de test), sa fiche produit, ses
      questions fréquentes et sa campagne de test. Au tour suivant, corrige
      son plan d'après le critique ou les consignes d'un humain.
    step: conception_poc
    type: llm
    model_tier: smart
    queue: works
    priority: 30
    gets_serge_intro: true
    max_tool_turns: 6
    settings:
      prospects_min: {value: 30, min: 5, max: 200, policy: true, description: "Le nombre de prospects d'un test léger, au moins."}
      prospects_max: {value: 50, min: 5, max: 200, policy: true, description: "Le nombre de prospects d'un test léger, au plus."}
      duree_max_jours: {value: 10, min: 1, max: 60, policy: true, description: "La durée d'un test léger, en jours, au plus."}
    compare:
      product_plans: false
      product_sheets: false
      product_faq: false
      campaigns: false
    prompt: |
      Tu conçois le POC d'un business que Serge va tester auprès de vrais
      prospects. Un POC est un petit produit web qu'on peut vraiment
      essayer, pas une promesse. Exemple : « un générateur de devis en
      ligne : on crée un compte et on fait trois devis gratuits ». Il est
      gratuit pour les prospects : il mesure leur intérêt. Le vrai produit,
      payant, viendra plus tard, pour le business retenu.

      Tu reçois la fiche du business, les pages qui prouvent le besoin, et
      ce que Serge sait faire. À partir du deuxième tour, tu reçois aussi ton
      plan précédent et les remarques du critique ; les paramètres de la
      tâche peuvent contenir les consignes d'un humain (« consignes ») :
      corrige d'abord ce qu'ils demandent.

      Pour construire, Serge a un chantier (un conteneur Linux avec Node,
      Python et git, où un modèle code et lance le produit), un navigateur
      pour l'essayer, et la mise en ligne d'un site web sur un sous-domaine
      de Serge ; le produit garde ses données dans un dossier à lui. Il n'y
      a pas d'humain pour faire le travail, pas de compte à créer sur
      d'autres sites, pas d'API payante, pas de connexion au logiciel des
      prospects : un plan qui en a besoin est irréaliste, trouve autre
      chose.

      Écris un plan de A à Z, réalisable avec ça :
      - hypothese : ce qu'on veut vérifier, en une phrase ;
      - cible : les prospects, des professionnels (métier, taille, lieu) ;
      - canal : email ou voice (le téléphone) ;
      - prospects : combien, entre {prospects_min} et {prospects_max} ;
      - duree_jours : la durée du test, {duree_max_jours} jours au plus ;
      - prix : le prix indicatif du futur produit payant ;
      - livrable : ce que le prospect peut essayer, en deux phrases ;
      - plan : ce que le constructeur doit faire, page par page et fonction
        par fonction, pourquoi, et comment le prospect s'en sert ;
      - scenarios : 3 à 6 scénarios de test ; chacun dit ce que fait un
        prospect ordinaire, pas à pas, du début à la fin, et ce qu'il doit
        voir. Le relecteur et l'humain qui essaie le POC les suivent tels
        quels ;
      - la fiche produit : fiche_resume (ce que fait le produit et pour
        qui), fiche_limites (ce qu'il ne fait pas), fiche_prix,
        fiche_delais, fiche_usage (comment on s'en sert) ;
      - faq : 3 à 6 questions qu'un prospect posera, avec leur réponse.

      Le business doit être légal. Ne t'arrête pas sur des considérations
      morales qui ne sont pas contraires à la loi.
    tools:
      - tool: fiche_business
        mode: given
        label: Le business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: preuves_du_business
        mode: given
        label: Les pages qui prouvent le besoin
        max_rows: 20
        params:
          venture_id: {source: task, value: venture_id}
      - tool: capacites_de_serge
        mode: given
        label: Ce que Serge sait faire
      - tool: plan_par_numero
        mode: given
        label: Ton plan précédent (vide au premier tour)
        params:
          plan_id: {source: task, value: plan_precedent}
      - tool: critiques_du_plan
        mode: given
        label: Les remarques du critique sur ce plan
        params:
          plan_id: {source: task, value: plan_precedent}
      - tool: web_search
        mode: callable
        max_calls: 3
    output:
      - {path: hypothese, type: text, description: Ce qu'on veut vérifier.}
      - {path: cible, type: text, description: Les prospects visés.}
      - {path: canal, type: choice, choices: [email, voice], description: Le canal du test.}
      - {path: prospects, type: number, description: Le nombre de prospects.}
      - {path: duree_jours, type: number, description: La durée du test en jours.}
      - {path: prix, type: text, description: Le prix indicatif du futur produit.}
      - {path: livrable, type: text, description: Ce que le prospect peut essayer.}
      - {path: plan, type: text, description: 'Le plan de A à Z pour le constructeur.'}
      - {path: scenarios, type: text, description: "Les scénarios de test, pas à pas."}
      - {path: fiche_resume, type: text, description: Ce que fait le produit et pour qui.}
      - {path: fiche_limites, type: text, description: Ce qu'il ne fait pas.}
      - {path: fiche_prix, type: text, description: Son prix.}
      - {path: fiche_delais, type: text, description: Ses délais habituels.}
      - {path: fiche_usage, type: text, description: Comment on s'en sert.}
      - {path: faq, type: list, min_items: 1, description: Les questions fréquentes.}
      - {path: faq.question, type: text, description: La question.}
      - {path: faq.reponse, type: text, description: Sa réponse.}
    writes:
      - table: product_plans
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          kind: {source: fixed, value: poc}
          round: {source: task, value: tour}
          status: {source: fixed, value: draft}
          hypothesis: {source: field, value: hypothese}
          target: {source: field, value: cible}
          channel: {source: field, value: canal}
          prospects: {source: field, value: prospects}
          duration_days: {source: field, value: duree_jours}
          price: {source: field, value: prix}
          deliverable: {source: field, value: livrable}
          plan: {source: field, value: plan}
          scenarios: {source: field, value: scenarios}
          owner_notes: {source: task, value: consignes}
      - table: product_sheets
        operation: delete
        key: {column: venture_id, source: task, value: venture_id}
      - table: product_sheets
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          summary: {source: field, value: fiche_resume}
          limits: {source: field, value: fiche_limites}
          price: {source: field, value: fiche_prix}
          delays: {source: field, value: fiche_delais}
          usage: {source: field, value: fiche_usage}
      - table: product_faq
        operation: delete
        key: {column: venture_id, source: task, value: venture_id}
      - table: product_faq
        operation: insert
        for_each: faq
        values:
          venture_id: {source: task, value: venture_id}
          question: {source: field, value: faq.question}
          answer: {source: field, value: faq.reponse}
      - table: campaigns
        operation: delete
        key: {column: venture_id, source: task, value: venture_id}
      - table: campaigns
        operation: insert
        values:
          venture_id: {source: task, value: venture_id}
          family: {source: fixed, value: test_leger}
          channel: {source: field, value: canal}
          n_target: {source: field, value: prospects}
          state: {source: fixed, value: DRAFT}

  - id: challenger_poc
    title: Challenger le POC
    role: >-
      Critique le plan d'un POC avant qu'un humain le valide : faisabilité
      technique, limites du produit, réalisme commercial, scénarios de
      test. Rend « bon » ou « à corriger » avec ses remarques ; un manque de
      Serge passe par « Demander une nouvelle capacité » (Q35).
    step: conception_poc
    type: llm
    model_tier: smart
    queue: works
    priority: 30
    gets_serge_intro: true
    max_tool_turns: 4
    compare:
      plan_critiques: false
      product_plans: false
    prompt: |
      Tu critiques le plan du POC d'un business, avant qu'un humain le
      valide et qu'un modèle le construise. Tu reçois le plan, la fiche
      produit, ses questions fréquentes, la fiche du business et ce que
      Serge sait faire.

      Cherche ce qui empêcherait le POC de marcher :
      - la faisabilité technique : Serge code dans un conteneur Linux avec
        Node, Python et git, essaie dans un navigateur et publie un site
        web ; pas d'humain, pas de compte sur d'autres sites, pas d'API
        payante, pas de connexion au logiciel des prospects ;
      - les limites du produit : ce qui manque pour qu'un prospect en tire
        quelque chose ;
      - le réalisme commercial : des prospects contactés par e-mail ou par
        téléphone vont-ils vraiment l'essayer ?
      - les scénarios de test : chacun doit pouvoir être suivi pas à pas
        par quelqu'un qui découvre le site.
      Exemple de remarque attendue : « le plan commence par se connecter à
      l'ERP d'une grande entreprise contactée par e-mail : c'est
      irréaliste ».

      Chaque remarque est « à corriger » : le plan est mal fait mais
      faisable avec ce que Serge sait déjà faire ; dis précisément quoi
      changer. S'il manque à Serge un outil ou un accès, n'en fais pas une
      remarque : appelle l'outil « Demander une nouvelle capacité ».

      Rends le verdict « bon » si le plan peut être construit tel quel,
      sinon « a_corriger » avec tes remarques. Ne cherche pas la petite
      bête : un plan réaliste et clair est bon.
    tools:
      - tool: plan_par_numero
        mode: given
        label: Le plan
        params:
          plan_id: {source: task, value: plan_id}
      - tool: fiche_business
        mode: given
        label: Le business
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: capacites_de_serge
        mode: given
        label: Ce que Serge sait faire
    output:
      - {path: verdict, type: choice, choices: [bon, a_corriger], description: 'Le plan peut-il être construit tel quel ?'}
      - {path: avis, type: text, description: 'Ton avis en deux phrases.'}
      - {path: remarques, type: list, required: false, description: Les remarques à corriger.}
      - {path: remarques.texte, type: text, description: 'La remarque : quoi changer, précisément.'}
    writes:
      - table: plan_critiques
        operation: insert
        for_each: remarques
        values:
          plan_id: {source: task, value: plan_id}
          venture_id: {source: task, value: venture_id}
          round: {source: task, value: tour}
          text: {source: field, value: remarques.texte}
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        values:
          status: {source: fixed, value: challenged}
          challenge: {source: field, value: avis}

  - id: compter_tours_plan
    title: Compter les tours de critique
    role: >-
      Après une critique « à corriger » : renvoie le plan à la conception
      tant qu'il reste des tours, sinon au ticket « Plan » tel qu'il est
      (Q35). Sans LLM.
    step: conception_poc
    type: capability
    capability: next_round
    queue: works
    priority: 30
    settings:
      tours_max: {value: 3, min: 1, max: 10, policy: true, description: "Les tours de critique d'un plan, au plus."}
    params:
      round: {source: task, value: tour}
      max: {source: setting, value: tours_max}

  - id: demander_validation_plan
    title: Faire valider le plan du POC
    role: >-
      Ouvre le ticket « Plan » : le business, le plan, la critique, la
      fiche produit. Valider lance la construction ; sans réponse sous 48
      heures, le plan s'applique (Q34). Sans LLM.
    step: conception_poc
    type: capability
    capability: ask_owners
    queue: conversations
    priority: 80
    params:
      ticket_type: {source: fixed, value: PLAN_POC}
      ref_table: {source: fixed, value: product_plans}
      ref_id: {source: task, value: plan_id}
      raison: {source: fixed, value: 'Le plan de ce POC est prêt : le valider lance sa construction.'}
      title: {source: fixed, value: Le plan d'un POC attend ton avis}

  - id: suite_plan_poc
    title: Suite du ticket « Plan »
    role: >-
      La réponse au ticket « Plan » : « Valider » lance la construction,
      « À corriger » renvoie le plan à la conception avec les consignes,
      « Arrêter le business » l'arrête et libère sa place de test. Sans
      LLM.
    step: conception_poc
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      acte: {source: task, value: acte}
      texte: {source: task, value: texte}
      plan_id: {source: task, value: plan_id}
      venture_id: {source: task, value: venture_id}
    writes:
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        condition: {field: acte, op: '=', value: valider}
        values:
          status: {source: fixed, value: validated}
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        condition: {field: acte, op: '=', value: a_corriger}
        values:
          status: {source: fixed, value: to_fix}
          owner_notes: {source: task, value: texte}
      - table: product_plans
        operation: update
        key: {column: id, source: task, value: plan_id}
        condition: {field: acte, op: '=', value: arreter_business}
        values:
          status: {source: fixed, value: refused}
      - table: ventures
        operation: update
        key: {column: id, source: task, value: venture_id}
        condition: {field: acte, op: '=', value: arreter_business}
        values:
          lifecycle: {source: fixed, value: KILLED}

  - id: construire_poc
    title: Construire le POC
    role: >-
      Construit le POC dans le chantier du business, l'essaie lui-même dans
      le navigateur, sur ordinateur et sur mobile, et rend son compte rendu.
      Il reprend le passage précédent : les remarques du relecteur, les
      consignes d'un humain, ou une publication ratée.
    step: conception_poc
    type: llm
    model_tier: code
    queue: works
    priority: 30
    max_tool_turns: 200
    compare:
      builds: false
    prompt: |
      Tu construis le POC d'un business : un petit produit web que des
      prospects vont vraiment essayer. Il doit marcher pour eux du premier
      coup.

      Tu reçois le plan validé (ce qu'il faut faire, et les scénarios de
      test), la fiche produit et ses questions fréquentes, et les passages
      de construction précédents : le compte rendu du constructeur d'avant,
      le verdict et les remarques du relecteur, qui a essayé le produit en
      ligne. Les paramètres de la tâche peuvent contenir les consignes d'un
      humain (« consignes ») ou la raison d'une publication ratée
      (« probleme », « journal ») : traite-les d'abord.

      Tu travailles dans un chantier : un conteneur Linux (Debian, avec
      git, Python 3 et Node), dossier /work, où tes fichiers restent d'une
      tâche à l'autre. Tes outils : lancer une commande (au besoin en
      arrière-plan, pour un serveur), lire, écrire et modifier un fichier,
      et un navigateur pour essayer ton produit : l'adresse
      http://chantier:<port> mène au serveur que tu as lancé dans le
      chantier. Tu peux appeler plusieurs outils d'un coup.

      Règles :
      - choisis les langages et les outils que tu veux ; fais simple et
        solide ;
      - à la racine de /work, un Dockerfile qui construit et lance le
        produit. Le produit écoute sur le port de la variable PORT (8080),
        garde ses données dans le dossier de la variable DATA_DIR (/data),
        et connaît son adresse publique par PUBLIC_URL ;
      - le POC est gratuit : aucun paiement ;
      - en français, propre et clair sur ordinateur comme sur mobile ;
      - avant de rendre, essaie toi-même chaque scénario de test dans le
        navigateur, sur ordinateur puis sur mobile, et corrige ce qui ne va
        pas. Docker n'est pas dans le chantier : lance le produit comme le
        ferait le Dockerfile ;
      - s'il te manque un outil ou un accès, appelle « Demander une
        nouvelle capacité ».

      Rends fini « oui » si le produit est prêt à être publié, sinon
      « non » ; ton compte rendu : ce que tu as fait, comment tu l'as
      vérifié, ce qui reste.
    tools:
      - tool: plan_valide_du_poc
        mode: given
        label: Le plan validé
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: questions_produit
        mode: given
        label: Les questions fréquentes
        params:
          venture_id: {source: task, value: venture_id}
      - tool: passages_du_livrable
        mode: given
        label: Les passages de construction précédents
        max_rows: 3
        params:
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: poc}
      - tool: chantier_commande
        mode: callable
        params: &chantier_poc
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: poc}
          profile: {source: fixed, value: chantier}
      - tool: chantier_lire
        mode: callable
        params: *chantier_poc
      - tool: chantier_ecrire
        mode: callable
        params: *chantier_poc
      - tool: chantier_modifier
        mode: callable
        params: *chantier_poc
      - tool: navigateur_agir
        mode: callable
        params: &navigateur_poc
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: poc}
          task_id: {source: task, value: task_id}
      - tool: navigateur_lire
        mode: callable
        params: *navigateur_poc
      - tool: navigateur_capture
        mode: callable
        params: *navigateur_poc
    output:
      - {path: fini, type: choice, choices: [oui, non], description: 'Le produit est-il prêt à être publié ?'}
      - {path: compte_rendu, type: text, description: 'Ce qui a été fait, vérifié, et ce qui reste.'}
    writes:
      - table: builds
        operation: insert
        condition: {field: fini, op: '=', value: oui}
        values:
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: poc}
          pass: {source: task, value: passage}
          status: {source: fixed, value: built}
          report: {source: field, value: compte_rendu}
          owner_notes: {source: task, value: consignes}
      - table: builds
        operation: insert
        condition: {field: fini, op: '=', value: non}
        values:
          venture_id: {source: task, value: venture_id}
          deliverable: {source: fixed, value: poc}
          pass: {source: task, value: passage}
          status: {source: fixed, value: unfinished}
          report: {source: field, value: compte_rendu}
          owner_notes: {source: task, value: consignes}

  - id: compter_reprises
    title: Compter les reprises de la construction
    role: >-
      Une construction pas finie (plafond du jour atteint, travail trop
      long) ou une publication ratée : la construction reprend, dans le même
      passage, tant qu'il reste des reprises ; sinon le produit est publié
      tel qu'il est. Sans LLM.
    step: conception_poc
    type: capability
    capability: next_round
    queue: works
    priority: 30
    settings:
      reprises_max: {value: 3, min: 1, max: 10, policy: true, description: "Les reprises d'un même passage de construction, au plus."}
    params:
      round: {source: task, value: reprise}
      max: {source: setting, value: reprises_max}

  - id: publier_staging_poc
    title: Publier le POC en staging
    role: >-
      Fige le chantier du POC en une version, la construit et la met en
      ligne sur staging-<produit>.<domaine>, non indexé. Sans LLM.
    step: conception_poc
    type: capability
    capability: publish_version
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
      deliverable: {source: fixed, value: poc}
      target: {source: fixed, value: staging}
      task_id: {source: task, value: task_id}

  - id: relire_poc
    title: Relire le POC
    role: >-
      Essaie le POC en ligne comme un prospect ordinaire, sans voir son
      code : suit chaque scénario de test sur ordinateur puis sur mobile,
      garde ses captures, et rend « bon » ou « à corriger » avec ses
      remarques.
    step: conception_poc
    type: llm
    model_tier: code
    queue: works
    priority: 30
    max_tool_turns: 60
    compare:
      builds: false
    prompt: |
      Tu essaies le POC d'un business comme le ferait un prospect ordinaire
      qui le découvre : tu ne vois pas son code, seulement le site en ligne
      (son adresse est dans les paramètres de la tâche, « url »). Tu
      reçois le plan validé, avec ses scénarios de test, et la fiche
      produit.

      Suis chaque scénario pas à pas, d'abord sur ordinateur, puis sur
      mobile : lis la page, clique, tape, comme une personne. Prends une
      capture à chaque étape importante, garde-la (keep), et lis les
      erreurs de la page. Regarde vraiment l'écran : un bouton qui sort de
      l'écran, un texte illisible, un formulaire qui ne réagit pas, une
      page blanche, un message d'erreur, ce qui manque par rapport à la
      fiche produit.

      Rends le verdict « bon » si un prospect peut faire chaque scénario
      sans aide et sans tomber sur une erreur ; sinon « a_corriger ». Tes
      remarques disent, pour chaque problème, le scénario, l'étape, ce que
      tu as vu, ce qui était attendu, et le numéro de la capture. Ton
      compte rendu dit ce que tu as essayé et ce qui marche.
    tools:
      - tool: plan_valide_du_poc
        mode: given
        label: Le plan validé et ses scénarios de test
        params:
          venture_id: {source: task, value: venture_id}
      - tool: fiche_produit
        mode: given
        label: La fiche produit
        params:
          venture_id: {source: task, value: venture_id}
      - tool: navigateur_agir
        mode: callable
        params: *navigateur_poc
      - tool: navigateur_lire
        mode: callable
        params: *navigateur_poc
      - tool: navigateur_capture
        mode: callable
        params: *navigateur_poc
    output:
      - {path: verdict, type: choice, choices: [bon, a_corriger], description: 'Un prospect peut-il faire chaque scénario ?'}
      - {path: remarques, type: text, description: 'Les problèmes trouvés, un par ligne ; vide si tout va bien.'}
      - {path: compte_rendu, type: text, description: Ce qui a été essayé et ce qui marche.}
    writes:
      - table: builds
        operation: update
        key: {column: id, source: task, value: build_id}
        values:
          status: {source: fixed, value: reviewed}
          verdict: {source: field, value: verdict}
          remarks: {source: field, value: remarques}
          review: {source: field, value: compte_rendu}

  - id: compter_passages
    title: Compter les passages de construction
    role: >-
      Après une relecture « à corriger » : la construction reprend pour un
      nouveau passage tant qu'il en reste, sinon le POC va au ticket
      « Tester le produit » tel qu'il est (Q41). Sans LLM.
    step: conception_poc
    type: capability
    capability: next_round
    queue: works
    priority: 30
    settings:
      passages_max: {value: 3, min: 1, max: 10, policy: true, description: "Les passages de construction et de relecture, au plus."}
    params:
      round: {source: task, value: passage}
      max: {source: setting, value: passages_max}

  - id: demander_test_poc
    title: Faire essayer le POC
    role: >-
      Ouvre le ticket « Tester le produit » : le business, les scénarios de
      test, l'adresse du staging et le verdict du relecteur. Il n'expire
      jamais : rien ne part vers des prospects sans qu'un humain ait essayé
      le produit (Q91). Sans LLM.
    step: conception_poc
    type: capability
    capability: ask_owners
    queue: conversations
    priority: 80
    params:
      ticket_type: {source: fixed, value: TEST_POC}
      ref_table: {source: fixed, value: builds}
      ref_id: {source: task, value: build_id}
      raison: {source: fixed, value: 'Le POC est en ligne en staging : essaie-le comme un prospect, avec les scénarios de test.'}
      title: {source: fixed, value: Un POC attend que tu l'essaies}

  - id: suite_test_poc
    title: Suite du ticket « Tester le produit »
    role: >-
      La réponse au ticket « Tester le produit » : « Valider » met le POC
      en prod, « À corriger » relance la construction avec les consignes,
      « Arrêter le business » l'arrête et libère sa place de test. Sans
      LLM.
    step: conception_poc
    type: capability
    capability: echo
    queue: conversations
    priority: 80
    params:
      acte: {source: task, value: acte}
      texte: {source: task, value: texte}
      build_id: {source: task, value: build_id}
      venture_id: {source: task, value: venture_id}
    writes:
      - table: builds
        operation: update
        key: {column: id, source: task, value: build_id}
        condition: {field: acte, op: '=', value: a_corriger}
        values:
          owner_notes: {source: task, value: texte}
      - table: ventures
        operation: update
        key: {column: id, source: task, value: venture_id}
        condition: {field: acte, op: '=', value: arreter_business}
        values:
          lifecycle: {source: fixed, value: KILLED}

  - id: publier_prod_poc
    title: Publier le POC en prod
    role: >-
      Passe la version du staging en prod, sur <produit>.<domaine> : rien
      n'est reconstruit. Sans LLM.
    step: conception_poc
    type: capability
    capability: publish_version
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
      deliverable: {source: fixed, value: poc}
      target: {source: fixed, value: prod}
      task_id: {source: task, value: task_id}

  - id: poc_pret
    title: POC prêt pour le test léger
    role: >-
      Le POC est en ligne et validé : sa campagne de test passe à prête, et
      le business au test léger (étape 3). Sans LLM.
    step: conception_poc
    type: capability
    capability: echo
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
    writes:
      - table: campaigns
        operation: update
        key: {column: venture_id, source: task, value: venture_id}
        values:
          state: {source: fixed, value: READY}
      - table: ventures
        operation: update
        key: {column: id, source: task, value: venture_id}
        values:
          lifecycle: {source: fixed, value: SMOKE_READY}

  - id: prevenir_prod_ratee
    title: Prévenir d'une mise en prod ratée
    role: >-
      La version validée n'a pas pu passer en prod : un ticket
      d'information prévient Julien et Clem, avec la raison. Sans LLM.
    step: conception_poc
    type: capability
    capability: inform_owners
    queue: conversations
    priority: 80
    params:
      title: {source: fixed, value: Un POC validé n'a pas pu passer en prod}
      text: {source: task, value: raison}

  # L'essai de l'étape 2 (temporaire, Q91) : un business tapé dans Mission
  # Control est choisi pour un POC, comme par « Choisir les business ».
  - id: creer_business_essai
    title: Créer le business d'un essai de l'étape 2 (temporaire)
    role: >-
      Temporaire : crée un business candidat à partir du formulaire du
      bouton « Essayer l'étape 2 ». Sans LLM.
    type: capability
    capability: echo
    queue: works
    priority: 30
    params:
      nom: {source: task, value: nom}
      description: {source: task, value: description}
      offre: {source: task, value: offre}
    writes:
      - table: ventures
        operation: insert
        values:
          name: {source: task, value: nom}
          description: {source: task, value: description}
          sellable_offer: {source: task, value: offre}
          lifecycle: {source: fixed, value: CANDIDATE}
          family: {source: fixed, value: autre}

  - id: choisir_business_essai
    title: Choisir le business d'un essai de l'étape 2 (temporaire)
    role: >-
      Temporaire : le business de l'essai est choisi pour un POC (il prend
      une place de test), et sa conception commence. Sans LLM.
    type: capability
    capability: echo
    queue: works
    priority: 30
    params:
      venture_id: {source: task, value: venture_id}
    writes:
      - table: ventures
        operation: update
        key: {column: id, source: task, value: venture_id}
        values:
          lifecycle: {source: fixed, value: POC_SELECTED}
          choice_reason: {source: fixed, value: Essai de l'étape 2 depuis Mission Control.}

  # Le bout en bout du POC (temporaire, Q91) : une calculatrice toute
  # prête (fiche produit, questions, campagne, plan validé) entre
  # directement en construction ; tout le reste est le vrai pipeline.
  - id: bout_en_bout_poc
    title: "Bout en bout : préparer le POC d'une calculatrice (temporaire)"
    role: >-
      Temporaire : met en base un business « Calculatrice », choisi pour un
      POC, avec sa fiche produit, ses questions fréquentes, sa campagne et
      un plan déjà validé, puis lance la construction du POC. La création
      du business et la conception du plan sont court-circuitées ; la
      suite est celle de l'étape 2. Sans LLM.
    type: capability
    capability: echo
    queue: works
    priority: 30
    writes:
      - table: ventures
        operation: insert
        dedup: false
        values:
          name: {source: fixed, value: Calculatrice}
          description: {source: fixed, value: "Une calculatrice en ligne, simple et lisible, sur ordinateur comme sur mobile."}
          sellable_offer: {source: fixed, value: "Gratuite pendant l'essai."}
          family: {source: fixed, value: autre}
          lifecycle: {source: fixed, value: POC_SELECTED}
          choice_reason: {source: fixed, value: "Essai de bout en bout du POC depuis Mission Control."}
      - table: product_sheets
        operation: insert
        parent: 0
        values:
          venture_id: {source: parent_row, value: id}
          summary: {source: fixed, value: "Une calculatrice en ligne pour les quatre opérations, lisible sur ordinateur et sur mobile, sans compte."}
          limits: {source: fixed, value: "Pas de fonctions scientifiques, pas d'historique des calculs."}
          price: {source: fixed, value: Gratuite.}
          delays: {source: fixed, value: "Tout de suite : on ouvre la page et on calcule."}
          usage: {source: fixed, value: "On tape le calcul avec les boutons ou le clavier, puis « = »."}
      - table: product_faq
        operation: insert
        parent: 0
        values:
          venture_id: {source: parent_row, value: id}
          question: {source: fixed, value: "Faut-il créer un compte ?"}
          answer: {source: fixed, value: "Non : on ouvre la page et on calcule."}
      - table: product_faq
        operation: insert
        parent: 0
        values:
          venture_id: {source: parent_row, value: id}
          question: {source: fixed, value: "Que se passe-t-il si je divise par zéro ?"}
          answer: {source: fixed, value: "L'écran affiche « Erreur » ; la touche C remet à zéro."}
      - table: campaigns
        operation: insert
        parent: 0
        values:
          venture_id: {source: parent_row, value: id}
          family: {source: fixed, value: test_leger}
          channel: {source: fixed, value: email}
          n_target: {source: fixed, value: '30'}
          state: {source: fixed, value: DRAFT}
      - table: product_plans
        operation: insert
        parent: 0
        values:
          venture_id: {source: parent_row, value: id}
          kind: {source: fixed, value: poc}
          round: {source: fixed, value: '1'}
          status: {source: fixed, value: validated}
          hypothesis: {source: fixed, value: "Des visiteurs veulent une calculatrice en ligne simple, qui marche aussi bien au doigt qu'au clavier."}
          target: {source: fixed, value: "Tout le monde ; c'est un essai de bout en bout de Serge."}
          channel: {source: fixed, value: email}
          prospects: {source: fixed, value: '30'}
          duration_days: {source: fixed, value: '10'}
          price: {source: fixed, value: Gratuite.}
          deliverable: {source: fixed, value: "Une calculatrice en ligne : les quatre opérations, les nombres à virgule, l'effacement."}
          plan: {source: fixed, value: "Une seule page, en français. En haut, l'écran : il affiche le calcul en cours et le résultat, avec une virgule décimale (3,5) ; 0 au départ. Dessous, le pavé : les chiffres 0 à 9, la virgule, les quatre opérations (+, −, ×, ÷), « = », « C » (tout effacer) et « ← » (effacer le dernier chiffre). Le clavier marche aussi : chiffres, + - * /, la virgule ou le point, Entrée pour « = », Échap pour « C », Retour arrière pour « ← ». Les calculs se font dans l'ordre où on les tape (12 + 7 × 2 = 38, comme une calculatrice de poche). Une division par zéro affiche « Erreur » jusqu'à « C ». Les résultats sont arrondis à 10 chiffres significatifs, pour que 0,1 + 0,2 donne 0,3. Sur mobile, tout le pavé tient dans l'écran sans défiler, avec des boutons d'au moins 48 pixels. Aucun compte, aucune donnée gardée, aucun service extérieur."}
          scenarios: {source: fixed, value: "1. Ouvrir la page : l'écran affiche 0 et tout le pavé est visible. 2. Taper 12 + 7 = avec les boutons : l'écran affiche 19. 3. Taper 7 ÷ 2 = : l'écran affiche 3,5. 4. Taper 5 ÷ 0 = : l'écran affiche Erreur ; appuyer sur C : l'écran affiche 0. 5. Taper 0,1 + 0,2 = : l'écran affiche 0,3. 6. Taper 123 puis ← : l'écran affiche 12. 7. Au clavier, taper 9*9 puis Entrée : l'écran affiche 81. 8. Sur mobile, refaire le scénario 2 au doigt : tout le pavé tient dans l'écran, sans défiler."}
          challenge: {source: fixed, value: "Plan tout fait de l'essai de bout en bout : pas de critique."}

  # Stripe depuis la fiche d'un business (lot 10, Q91).
  - id: essayer_stripe
    title: Essayer Stripe en mode test (temporaire)
    role: >-
      Temporaire, pour essayer « Appeler une API » depuis la fiche d'un
      business : crée dans Stripe, en mode test, un produit, un prix de 1 €
      par mois portant l'identifiant du business, et un lien de paiement.
    type: llm
    model_tier: mid
    queue: works
    priority: 30
    max_tool_turns: 6
    prompt: |
      Tu essaies Stripe, en mode test (aucun argent réel), pour le business
      dont le numéro est dans les paramètres de la tâche. Crée un produit
      nommé « Essai Serge », puis un prix de 1 € par mois pour ce produit
      (100 centimes, eur, month), puis un lien de paiement pour ce prix,
      quantité 1. Rends l'adresse du lien de paiement, et les identifiants
      du produit et du prix.
    tools:
      - tool: stripe_creer_produit
        mode: callable
        params:
          service: {source: fixed, value: stripe_test}
          'metadata[venture_id]': {source: task, value: venture_id}
          task_id: {source: task, value: task_id}
      - tool: stripe_creer_prix
        mode: callable
        params:
          service: {source: fixed, value: stripe_test}
          'metadata[venture_id]': {source: task, value: venture_id}
          task_id: {source: task, value: task_id}
      - tool: stripe_creer_lien_paiement
        mode: callable
        params:
          service: {source: fixed, value: stripe_test}
          'metadata[venture_id]': {source: task, value: venture_id}
          task_id: {source: task, value: task_id}
    output:
      - {path: lien, type: text, description: L'adresse du lien de paiement.}
      - {path: compte_rendu, type: text, description: Les identifiants créés et ce qui a raté.}

  - id: supprimer_de_stripe
    title: Supprimer un business de Stripe
    role: >-
      Archive dans Stripe les prix et les produits d'un business (ceux qui
      portent son identifiant), dans le mode donné : test ou vrai. Stripe ne
      permet pas de supprimer un prix : archivé, il ne peut plus être payé.
      Lancé depuis la fiche du business, pour nettoyer après un essai
      (Q91).
    type: llm
    model_tier: fast
    queue: works
    priority: 30
    max_tool_turns: 12
    prompt: |
      Tu nettoies Stripe pour un business : son numéro est dans les
      paramètres de la tâche (venture_id). Cherche ses produits avec la
      recherche metadata['venture_id']:'<son numéro>' ; pour chaque
      produit, liste ses prix, archive chaque prix encore actif, puis
      archive le produit. Ne touche à aucun produit qui ne porte pas ce
      numéro. Rends le nombre de produits archivés et un compte rendu.
    tools:
      - tool: stripe_chercher_produits
        mode: callable
        params:
          service: {source: task, value: service}
          task_id: {source: task, value: task_id}
      - tool: stripe_lister_prix
        mode: callable
        params:
          service: {source: task, value: service}
          task_id: {source: task, value: task_id}
      - tool: stripe_archiver_prix
        mode: callable
        params:
          service: {source: task, value: service}
          task_id: {source: task, value: task_id}
          active: {source: fixed, value: 'false'}
      - tool: stripe_archiver_produit
        mode: callable
        params:
          service: {source: task, value: service}
          task_id: {source: task, value: task_id}
          active: {source: fixed, value: 'false'}
    output:
      - {path: produits, type: number, description: Le nombre de produits archivés.}
      - {path: compte_rendu, type: text, description: "Ce qui a été archivé, et ce qui a raté."}


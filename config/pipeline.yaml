triggers:
  - id: lancer_cycle
    title: Lancer un cycle d'écoute
    invocation: ouvrir_cycle
    event: button
    only_if_room_in: [places_de_test, cycles_ouverts]
    params:
      guide: {source: form, value: guide}
  - id: bouton_abandonner_cycle
    title: Abandonner le cycle en cours
    invocation: abandonner_cycle
    event: button
    confirm: >-
      Le cycle ouvert est fermé et ses tâches en attente sont annulées ;
      sa chaîne s'arrête après la tâche en cours. On peut alors en lancer
      un autre.
  - id: bouton_effacer_idees
    title: Effacer les idées (test)
    invocation: effacer_idees
    event: button
    confirm: >-
      Tous les business encore candidats ou choisis, et leurs preuves, sont
      détruits. Les pages restent. Bouton temporaire, pour tester.
  - id: veille_flux
    title: Lire chaque flux RSS suivi
    invocation: lire_un_flux
    event: every
    every_minutes: 360
    table: listen_feeds
    filter_column: active
    filter_value: '1'
    params:
      url: {source: row, value: url}
      feed_id: {source: row, value: id}
  - id: oubli_quotidien_pages
    title: Oublier les vieilles pages, chaque jour
    invocation: oublier_pages
    event: every
    every_minutes: 1440
  - id: oubli_quotidien_besoins
    title: Oublier les besoins jamais utilisés, chaque jour
    invocation: oublier_besoins
    event: every
    every_minutes: 1440
  - id: releve_des_canaux
    title: Relever chaque canal qui se relève
    invocation: relever_messages
    event: every
    every_minutes: 2
    table: canaux
    filter_column: polls
    filter_value: '1'
    params:
      channel: {source: row, value: id}
  - id: message_recu
    title: Un contact a écrit
    invocation: traiter_reponse
    event: row_written
    table: inbound_events
    filter_column: status
    filter_value: attached
    params:
      inbound_id: {source: row, value: id}
      contact_id: {source: row, value: contact_id}
      venture_id: {source: row, value: venture_id}
      channel: {source: row, value: channel}
      address: {source: row, value: address}
      subject: {source: row, value: subject}
  - id: relances_regulieres
    title: Chercher les relances à faire
    invocation: preparer_relances
    event: every
    every_minutes: 15
  - id: bouton_lancer_essai
    title: Lancer un essai
    invocation: lancer_essai
    event: button
    confirm: >-
      Serge crée un business bidon (il remplace le précédent), puis écrit à
      cette adresse et appelle ce numéro pour lui présenter le business.
      L'appel part à toute heure : c'est un essai. Les coordonnées restent
      en base.
    params:
      name: {source: form, value: nom}
      email: {source: form, value: e-mail}
      phone: {source: form, value: 'téléphone (+33…)'}

# Les modifications d'objets déjà en base sur une instance existante (le
# fichier ne les écrase jamais) : chacune n'est appliquée qu'une fois, et
# seulement si la valeur en base est encore celle d'origine (`from`) ; une
# valeur changée dans Mission Control est gardée. Résultat : table
# pipeline_changes.
changes:
  - id: titre_qui_est_serge
    why: Les textes envoyés au modèle ont un titre et une aide (page Pipeline).
    table: serge_texts
    where: {id: presentation}
    set:
      title: {from: '', to: Qui est Serge}
      help:
        from: ''
        to: >-
          En tête du prompt des invocations qui le demandent, suivi de la
          chaîne des 8 étapes et de leur place, lues en base.
  - id: lot7_explorer_10_tours
    why: Moins de jetons renvoyés ; avec plusieurs outils par tour, 10 tours suffisent.
    table: invocations
    where: {id: explorer_web}
    set: {max_tool_turns: {from: 25, to: 10}}
  - id: lot7_formuler_a_5_tours
    why: Moins de jetons renvoyés ; les pages se lisent plusieurs à la fois.
    table: invocations
    where: {id: formuler_a}
    set: {max_tool_turns: {from: 10, to: 5}}
  - id: lot7_formuler_b_5_tours
    why: Moins de jetons renvoyés ; les pages se lisent plusieurs à la fois.
    table: invocations
    where: {id: formuler_b}
    set: {max_tool_turns: {from: 10, to: 5}}
  - id: lot7_formuler_a_pages_bornees
    why: Au plus 10 pages lues en entier par passage, même lues plusieurs à la fois.
    table: invocation_tools
    where: {invocation_id: formuler_a, tool_id: lire_page_entiere}
    set: {max_calls: {from: '', to: pages_entieres_max}}
  - id: lot7_formuler_b_pages_bornees
    why: Au plus 10 pages lues en entier par passage, même lues plusieurs à la fois.
    table: invocation_tools
    where: {invocation_id: formuler_b, tool_id: lire_page_entiere}
    set: {max_calls: {from: '', to: pages_entieres_max}}
  - id: lot7_formuler_a_150_lignes
    why: Moins de jetons renvoyés à chaque tour.
    table: invocation_settings
    where: {invocation_id: formuler_a, name: lignes_page_entiere}
    set: {value: {from: '300', to: '150'}}
  - id: lot7_formuler_b_150_lignes
    why: Moins de jetons renvoyés à chaque tour.
    table: invocation_settings
    where: {invocation_id: formuler_b, name: lignes_page_entiere}
    set: {value: {from: '300', to: '150'}}
  - id: lot7_explorer_plusieurs_recherches
    why: Plusieurs recherches d'un coup, pour moins d'allers-retours.
    table: invocations
    where: {id: explorer_web}
    set:
      prompt:
        from: &ancienne_consigne_explorer |
          Tu cherches sur le web des besoins réels, exprimés par de vraies
          personnes ou de vraies entreprises, qui pourraient donner des idées
          de business à Serge.

          Ton point de départ est le texte de guidage du cycle, s'il y en a
          un. Sans texte de guidage, cherche librement dans ces familles de
          business : produits numériques, petits logiciels en ligne, services
          faits par Serge, automatisation sur mesure, téléphone et SMS pour
          les autres, veille et rapports, médias et audience, mise en
          relation, formation, commerce sans stock, prospection pour les
          autres.

          Cherche d'abord en France : fais tes recherches en français. Une
          page en anglais est acceptée si elle montre un besoin utile.

          Méthode :
          - Fais au plus {recherches_max} recherches, sous des angles variés :
            plaintes, questions sur des forums, demandes d'aide, avis
            négatifs, offres d'emploi, appels d'offres.
          - Avant de retenir une page, lis son aperçu (ses {lignes_apercu}
            premières lignes) avec l'outil d'aperçu. Ne lis jamais une page
            en entier.
          - Ne retiens que les pages qui montrent un besoin concret :
            quelqu'un qui cherche une solution, se plaint d'un problème, ou
            paie déjà pour quelque chose. Écarte les publicités, les pages
            vides et les pages que Serge a déjà gardées (tu en vois la
            liste).
          - Tu vois les business que Serge connaît déjà : cherche d'autres
            besoins.
          - Retiens au plus {pages_max} pages. Pour chacune, recopie son
            adresse, son titre et un aperçu de quelques lignes.
          - Si tu trouves un flux RSS qui publie régulièrement ce genre de
            besoins (un forum, une rubrique, un site d'annonces), ajoute-le :
            au plus {flux_max} nouveaux flux, jamais un flux que Serge suit
            déjà.
        to: *consigne_explorer
  - id: lot7_formuler_a_plusieurs_pages
    why: Plusieurs pages lues d'un coup, au plus 10 par passage.
    table: invocations
    where: {id: formuler_a}
    set:
      prompt:
        from: &ancienne_consigne_formuler |
          Tu formules des idées de business pour Serge, à partir de pages web
          qui montrent des besoins nouveaux.

          Tu reçois l'aperçu des pages « besoin nouveau » pas encore
          utilisées. Lis en entier celles qui te semblent les plus
          prometteuses, avec l'outil de lecture (au plus
          {lignes_page_entiere} lignes par page).

          Propose au plus {nombre_idees} idées de business. Pour chacune :
          - un nom court ;
          - ce qu'il vend et à qui ;
          - ce que tu as observé dans les pages : le besoin, qui l'exprime, ce
            qu'on paie déjà ;
          - l'offre qu'on pourrait vendre tout de suite, si tu la vois ;
          - sa famille de business ;
          - les numéros des pages qui prouvent le besoin : au moins une.

          Règles :
          - Ne propose jamais un business qui ressemble à un business que
            Serge connaît déjà : tu vois leur liste, y compris ceux qu'une
            autre invocation vient d'écrire. Serge ne fait jamais deux fois la
            même chose.
          - Chaque idée repose sur les pages citées, pas sur ton imagination.
          - Le business doit être légal. En dehors de la loi, ne t'arrête pas
            sur des scrupules moraux : un business légal qui dérange est
            acceptable. Serge assume d'être un agent IA et ne trompe personne.
          - Si les pages ne montrent aucun besoin assez solide, propose moins
            d'idées, ou aucune.
        to: *consigne_formuler
  - id: lot7_formuler_b_plusieurs_pages
    why: Plusieurs pages lues d'un coup, au plus 10 par passage.
    table: invocations
    where: {id: formuler_b}
    set:

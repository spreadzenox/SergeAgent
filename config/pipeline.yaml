                les robots ;
              - pas d'adresse ni de formulaire de contact pour l'instant, même si
                le plan ou la fiche produit en parlent ;
              - les mentions légales nomment l'éditeur, Julien Pesquet, une
                personne qui répond du produit, et disent que le service est
                construit et tenu par Serge, un agent IA.


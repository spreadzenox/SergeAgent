# Les réglages généraux de Serge, ceux qui ne concernent aucune invocation.
#
# Ce fichier remplit une nouvelle instance. Ensuite, les réglages sont en
# base (tables policy_sections, policy_settings, policy_relations) et se
# changent dans Mission Control, page Policy : ce fichier n'écrase jamais
# une valeur déjà en base. Un réglage nouveau s'ajoute tout seul ; changer
# un réglage qui existe déjà passe par la section « changes » (une fois,
# et seulement s'il n'a pas été changé dans Mission Control) ; un réglage
# retiré est listé dans « deleted ».
#
# Chaque famille dit sur quelle page de Mission Control elle s'affiche :
# « page: pipeline » (ce qui touche au modèle), sinon la page Policy.
#
# Chaque réglage : sa valeur, son titre et son aide (affichés tels quels),
# sa sorte (kind), ses bornes et ses choix :
# - eur, pct, nombre : un nombre entre min et max (pct : 0,25 = 25 %) ;
# - curseur, heure : un nombre entier entre min et max ;
# - liste : une valeur parmi « choices » ;
# - canaux, jours : plusieurs valeurs parmi « choices » ([valeur, libellé]) ;
# - fenetres : des plages horaires [h, min, h, min] ;
# - nombres : une liste de nombres entiers entre min et max.
# Chaque réglage d'ici est lu par au moins un programme (un test le vérifie).
schema_version: 2

sections:
  - id: budget
    title: Argent
    why: Combien Serge a le droit de dépenser. Au-delà, il s’arrête.
    settings:
      - id: monthly_eur
        value: 50.0
        title: Plafond du mois
        help: >-
          Ce que Serge nous coûte en IA ce mois-ci (coût réel des modèles).
          Au-delà, plus aucune tâche n’appelle de modèle jusqu’au mois
          suivant. Les achats de Serge pour ses business n’y comptent pas.
        kind: eur
        min: 0
        max: 500
        step: 1
      - id: llm_daily_eur
        value: 5.0
        title: Modèles, par jour
        help: >-
          Ce que les appels aux modèles coûtent aujourd’hui (coût réel).
          Au-delà, plus aucune tâche n’appelle de modèle jusqu’au lendemain.
        kind: eur
        min: 0
        max: 50
        step: 0.5
      - id: eur_per_usd
        value: 0.9
        title: Un dollar en euros
        help: >-
          OpenRouter facture en dollars : ce taux convertit le coût réel des
          appels pour les plafonds du jour et du mois.
        kind: eur
        min: 0.5
        max: 1.5
        step: 0.01

  - id: quotas
    title: Plafonds par canal
    why: Combien de messages, appels ou invitations, pour ne pas spammer.
    settings:
      - id: email_per_mailbox_per_day
        value: 40
        title: E-mails par boîte, par jour
        help: Le compteur du jour est sur la page En direct.
        kind: curseur
        min: 0
        max: 200
        step: 1
      - id: voice_max_calls_per_day
        value: 50
        title: Appels par jour
        help: >-
          Au-delà, la voix refuse tout nouvel appel sortant jusqu’au
          lendemain. Le compteur du jour est sur En direct.
        kind: curseur
        min: 0
        max: 200
        step: 1
      - id: sms_per_sender_per_min
        value: 10
        title: SMS reçus par expéditeur, par minute
        help: Anti-rafale sur les SMS reçus. Au-delà, le SMS est refusé.
        kind: curseur
        min: 1
        max: 30
        step: 1
      - id: sms_global_per_min
        value: 60
        title: SMS reçus au total, par minute
        help: Toutes les lignes confondues. Au-delà, le SMS est refusé.
        kind: curseur
        min: 1
        max: 120
        step: 1
      - id: linkedin_connect_per_day
        value: 20
        title: Invitations LinkedIn par jour
        help: Le compteur du jour est sur la page En direct.
        kind: curseur
        min: 0
        max: 80
        step: 1

  - id: windows
    title: Horaires
    why: Quand on a le droit de parler aux gens, et quand on se tait.
    settings:
      - id: timezone
        value: Europe/Paris
        title: Fuseau
        help: >-
          Les heures des déclencheurs et du résumé du jour sont lues dans ce
          fuseau.
        kind: liste
        choices: [Europe/Paris, Europe/Brussels, Europe/London, UTC]
      - id: quiet_hours
        value: [[23, 0, 8, 0]]
        title: Heures silencieuses
        help: Pas de notification Discord, sauf un guichet qui expire très vite.
        kind: fenetres

  - id: calling_zones
    title: Pays et appels
    why: Les règles légales changent selon le pays.
    settings:
      - id: default
        value: FR
        title: Pays par défaut
        help: Si on ne sait pas où est la personne.
        kind: liste
        choices: [FR]
      - id: FR.contact_per_30d
        value: 4
        title: Prises de contact au plus, par personne, sur 30 jours (France)
        help: >-
          Règle légale en France. Au-delà, les garde-fous et la voix refusent
          de contacter la personne.
        kind: curseur
        min: 1
        max: 8
        step: 1

  - id: consent
    title: Accord des gens
    why: Sur quels canaux il faut un oui explicite avant d’écrire ou d’appeler.
    settings:
      - id: opt_in_channels
        value: [voice, sms, whatsapp]
        title: Canaux où il faut un oui explicite
        help: Sur les autres, on peut écrire, et la personne peut se retirer.
        kind: canaux
        choices:
          - [voice, Voix]
          - [sms, SMS]
          - [whatsapp, WhatsApp]
          - [email, E-mail]

  - id: testing
    title: Taille des essais
    why: >-
      Combien de personnes un essai touche, et quand on l’arrête ou on
      l’élargit.
    locked_while:
      table: campaigns
      column: state
      value: RUNNING
      reason: Un essai tourne, on ne change pas sa taille en cours de route.
    settings:
      - id: n_smoke_min
        value: 30
        title: Petit essai, personnes touchées
        help: Le nombre de personnes d’un petit essai.
        kind: curseur
        min: 1
        max: 500
        step: 1
      - id: n_full_target
        value: 200
        title: Grand essai, personnes touchées
        help: Le nombre de personnes d’un grand essai.
        kind: curseur
        min: 10
        max: 5000
        step: 10
      - id: kill_max_positives
        value: 1
        title: Arrêt, réponses positives au plus
        help: Un grand essai qui n’a pas plus de réponses positives est arrêté.
        kind: curseur
        min: 0
        max: 20
        step: 1
      - id: scale_min_positives
        value: 5
        title: Élargir, réponses positives au moins
        help: Il en faut au moins autant pour passer à un essai plus grand.
        kind: curseur
        min: 1
        max: 50
        step: 1
      - id: scale_min_meetings
        value: 2
        title: Élargir, rendez-vous au moins
        help: Il en faut au moins autant pour passer à un essai plus grand.
        kind: curseur
        min: 1
        max: 20
        step: 1
      - id: extend_max
        value: 1
        title: Prolongations au plus
        help: Combien de fois un essai peut être prolongé.
        kind: curseur
        min: 1
        max: 5
        step: 1

  - id: standing
    title: Santé des comptes
    why: >-
      Un capital qui baisse à l’usage et remonte au repos. En dessous du
      plancher, l’acte est refusé.
    settings:
      - id: cout_usage
        value: 0.10
        title: Coût d’un acte
        help: Retiré du capital après chaque usage.
        kind: pct
        min: 0
        max: 1
        step: 0.01
      - id: gain_par_heure
        value: 0.02
        title: Gain par heure de repos
        help: Quand le compte ne sert pas, le capital remonte de ce pas.
        kind: pct
        min: 0
        max: 1
        step: 0.01
      - id: idle_apres_heures
        value: 1
        title: Heures avant que ça remonte
        help: Rien ne remonte tant que ce délai n’est pas passé.
        kind: curseur
        min: 0
        max: 48
        step: 1
      - id: capital_min
        value: 0.20
        title: Plancher pour agir
        help: En dessous, l’acte est refusé.
        kind: pct
        min: 0
        max: 1
        step: 0.05
      - id: capital_max
        value: 1.0
        title: Plafond du capital
        help: Le repos ne le fait jamais dépasser.
        kind: pct
        min: 0
        max: 1
        step: 0.05

  - id: voice
    title: Téléphone
    why: La qualité des appels, et quand on les coupe.
    settings:
      - id: quality_window
        value: 10
        title: Fenêtre pour juger la qualité
        help: Le nombre de derniers appels regardés.
        kind: curseur
        min: 3
        max: 30
        step: 1
      - id: quality_min_score
        value: 2
        title: Note d’un mauvais appel
        help: Sur 5. Un appel noté autant ou moins est mauvais.
        kind: curseur
        min: 1
        max: 5
        step: 1
      - id: quality_max_bad
        value: 2
        title: Mauvais appels au plus dans la fenêtre
        help: Au-delà, les appels sont mis en pause.
        kind: curseur
        min: 1
        max: 8
        step: 1

  - id: collect
    title: Encaissement
    why: Les relances de paiement et les petits remboursements.
    settings:
      - id: refund_auto_max_eur
        value: 5.0
        title: Remboursement sans te demander, au plus
        help: Au-dessus, c’est toi qui décides.
        kind: eur
        min: 0
        max: 50
        step: 0.5
      - id: dunning_days
        value: [7, 14]
        title: Jours de relance d’un paiement
        help: Par exemple 7, 14 pour une relance 7 jours puis 14 jours après.
        kind: nombres
        min: 1
        max: 90

  - id: memory
    title: Mémoire
    why: Ce qu’on garde au quotidien, et ce qu’on archive.
    settings:
      - id: episode_archive_days
        value: 30
        title: Jours avant d’archiver un épisode
        help: Le détail brut quitte le quotidien.
        kind: curseur
        min: 7
        max: 180
        step: 1

  - id: tickets
    title: Tes questions
    why: À quelle heure arrive le résumé du jour.
    settings:
      - id: digest_hour
        value: 8
        title: Heure du résumé du jour
        help: Dans le fuseau des horaires.
        kind: heure
        min: 0
        max: 23
        step: 1

  - id: llm_calls
    page: pipeline
    title: Appels au modèle
    why: >-
      Combien de temps on attend une réponse, combien de fois on réessaie,
      et ce qu'un résultat d'outil peut peser.
    settings:
      - id: timeout_s
        value: 180
        title: Attente maximale d’une réponse, en secondes
        help: >-
          Au-delà, l’appel est raté (et réessayé). Une réponse longue, par
          exemple 30 pages retenues, peut dépasser une minute.
        kind: curseur
        min: 30
        max: 600
        step: 10
      - id: retry_pauses_s
        value: [3, 10]
        title: Pauses avant de réessayer un appel raté, en secondes
        help: >-
          Une pause par nouvel essai, pour une erreur passagère (réseau,
          réponse vide, trop de requêtes). Exemple : 3, 10 réessaie après
          3 secondes, puis après 10.
        kind: nombres
        min: 1
        max: 120
      - id: format_retries
        value: 2
        title: Nouveaux essais si la réponse est mal formée
        help: >-
          Combien de fois on redemande au modèle une réponse au bon format,
          sans outil.
        kind: curseur
        min: 0
        max: 5
        step: 1
      - id: tool_result_max_chars
        value: 20000
        title: Taille maximale d’un résultat d’outil
        help: >-
          En caractères. Au-delà, le résultat est coupé avant d’être renvoyé
          au modèle : il repart à chaque tour, et coûte à chaque fois.
        kind: curseur
        min: 1000
        max: 100000
        step: 1000

  - id: tools
    page: pipeline
    title: Outils, valeurs par défaut
    why: >-
      Ce que reçoit le modèle quand il appelle un outil sans dire combien il
      en veut.
    settings:
      - id: search_results
        value: 5
        title: Chercher sur le web, résultats
        help: Au plus le maximum de la famille « Lecture du web ».
        kind: curseur
        min: 1
        max: 20
        step: 1
      - id: memory_results
        value: 5
        title: Chercher dans la mémoire, extraits
        help: Les extraits les plus proches de la recherche.
        kind: curseur
        min: 1
        max: 50
        step: 1
      - id: feed_items
        value: 20
        title: Lire un flux RSS, pages
        help: Les pages les plus récentes du flux.
        kind: curseur
        min: 1
        max: 100
        step: 1
      - id: feed_preview_lines
        value: 5
        title: Lire un flux RSS, lignes d’aperçu par page
        help: Tirées du résumé que donne le flux.
        kind: curseur
        min: 1
        max: 50
        step: 1

  - id: model_choice
    page: pipeline
    title: Recommandation de modèle
    why: >-
      Quels modèles d’OpenRouter la page peut recommander, et comment leur
      prix est compté.
    settings:
      - id: min_context_tokens
        value: 128000
        title: Contexte minimum, en jetons
        help: >-
          Un modèle qui lit moins que ça n’est jamais recommandé : les
          historiques d’outils sont longs.
        kind: curseur
        min: 8000
        max: 1000000
        step: 1000
      - id: max_age_days
        value: 365
        title: Âge maximum d’un modèle, en jours
        help: Un modèle sorti avant n’est plus recommandé.
        kind: curseur
        min: 30
        max: 1000
        step: 5
      - id: mix_days
        value: 30
        title: Jours de mesure du mélange de jetons
        help: >-
          Le prix d’un modèle est compté au mélange de jetons lus et écrits
          de Serge sur ces derniers jours.
        kind: curseur
        min: 1
        max: 180
        step: 1
      - id: min_measured_tokens
        value: 100000
        title: Jetons mesurés avant de se fier au mélange réel
        help: >-
          En dessous, on suppose la part de jetons lus ci-dessous, et la
          page le dit.
        kind: curseur
        min: 0
        max: 10000000
        step: 10000
      - id: default_read_share
        value: 0.75
        title: Part de jetons lus supposée
        help: >-
          Tant que Serge n’a pas assez d’appels mesurés : 75 % veut dire
          trois jetons lus pour un écrit.
        kind: pct
        min: 0.05
        max: 0.99
        step: 0.01

  - id: web
    title: Lecture du web
    why: >-
      Ce que Serge lit d’une page, d’une recherche ou d’un flux, et combien
      de temps il attend.
    settings:
      - id: line_max_chars
        value: 300
        title: Longueur maximale d’une ligne de page, en caractères
        help: >-
          Un paragraphe plus long est coupé en plusieurs lignes : une seule
          ligne géante coûterait à chaque tour d’outils.
        kind: curseur
        min: 50
        max: 2000
        step: 10
      - id: page_max_kb
        value: 2000
        title: Taille maximale d’une page lue, en Ko
        help: Au-delà, la fin de la page n’est pas lue.
        kind: curseur
        min: 100
        max: 10000
        step: 100
      - id: page_timeout_s
        value: 15
        title: Attente maximale d’une page, en secondes
        help: Au-delà, la page est notée illisible.
        kind: curseur
        min: 1
        max: 60
        step: 1
      - id: search_timeout_s
        value: 8
        title: Attente maximale d’une recherche, en secondes
        help: Au-delà, la recherche rend une erreur au modèle.
        kind: curseur
        min: 1
        max: 60
        step: 1
      - id: search_max_results
        value: 10
        title: Résultats d’une recherche, au plus
        help: Même si le modèle en demande plus.
        kind: curseur
        min: 1
        max: 20
        step: 1
      - id: feed_timeout_s
        value: 20
        title: Attente maximale d’un flux RSS, en secondes
        help: Au-delà, le flux est noté illisible.
        kind: curseur
        min: 1
        max: 60
        step: 1

  - id: channels
    title: Canaux
    why: >-
      Comment Serge répond sur chaque canal : le délai avant de répondre, et
      ce qu'il faut pour relancer sans risque.
    settings:
      - id: email.reply_delay_min_minutes
        value: 5
        title: E-mail, réponse au plus tôt (minutes)
        help: >-
          Serge répond à un e-mail entre ce délai et le délai au plus tard,
          tiré au hasard, à toute heure et tous les jours. 0 pour une réponse
          immédiate (tests).
        kind: curseur
        min: 0
        max: 1440
        step: 1
      - id: email.reply_delay_max_minutes
        value: 20
        title: E-mail, réponse au plus tard (minutes)
        help: Voir « réponse au plus tôt ».
        kind: curseur
        min: 0
        max: 1440
        step: 1
      - id: email.max_poll_age_minutes
        value: 60
        title: E-mail, relève récente (minutes)
        help: >-
          Une relance ne part que si la boîte a été relevée il y a moins de ce
          délai : Serge ne relance jamais quelqu'un qui a peut-être déjà
          répondu.
        kind: curseur
        min: 5
        max: 1440
        step: 5

# « tel réglage ≤ tel autre » (« < » : strictement plus petit).
relations:
  - [standing.capital_min, '<=', standing.capital_max]
  - [tools.search_results, '<=', web.search_max_results]
  - [testing.kill_max_positives, '<', testing.scale_min_positives]
  - [channels.email.reply_delay_min_minutes, '<=', channels.email.reply_delay_max_minutes]

# Un réglage qui change de nom garde sa valeur (celle du serveur, peut-être
# changée dans Mission Control) : [ancien nom, nouveau nom].
renamed:
  - [quotas.llm_recalls_json, llm_calls.format_retries]
  - [quotas.llm_outil_resultat_max_caracteres, llm_calls.tool_result_max_chars]

# Changer un réglage déjà en base : même format que dans pipeline.yaml, sur
# la table policy_settings (une valeur s'écrit en JSON, par exemple 25.0).
changes:
  - id: plafonds_par_canal_sans_le_modele
    why: Les réglages des appels au modèle ont leur propre famille.
    table: policy_sections
    where: {id: quotas}
    set:
      why:
        from: >-
          Combien de messages, appels ou invitations, pour ne pas spammer, et
          combien de fois on redemande une réponse au modèle.
        to: Combien de messages, appels ou invitations, pour ne pas spammer.
  - id: aide_appels_par_jour
    why: La voix lit maintenant ce réglage (pas de réglage en double, Q78).
    table: policy_settings
    where: {id: quotas.voice_max_calls_per_day}
    set:
      help:
        from: Plafond d’appels sortants. Le compteur du jour est sur En direct.
        to: >-
          Au-delà, la voix refuse tout nouvel appel sortant jusqu’au
          lendemain. Le compteur du jour est sur En direct.
  - id: aide_contacts_30_jours
    why: La voix lit maintenant ce réglage (pas de réglage en double, Q78).
    table: policy_settings
    where: {id: calling_zones.FR.contact_per_30d}
    set:
      help:
        from: Règle légale en France.
        to: >-
          Règle légale en France. Au-delà, les garde-fous et la voix refusent
          de contacter la personne.

# Les réglages retirés de ce fichier, effacés aussi de la base.
deleted:
  # Rien ne s'en servait : ils ne bornaient que d'autres réglages (Q78).
  - testing.n_smoke_max
  - testing.n_full_min

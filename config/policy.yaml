# Policy Serge — semence git (R4). Runtime = dernier snapshot du canon.
# Tout nombre métier vit ici. MC / ticket POLICY écrivent un snapshot,
# jamais ce fichier. Zéro nombre magique ailleurs — test R4.
schema_version: 1

budget:
  monthly_eur: 50.0
  llm_daily_eur: 5.0               # plafond financier global P2
  llm_eur_per_1k_tokens: 0.004     # taux blendé conservateur (garde budget)
  test_provision_monthly_eur: 1.0   # canarys + micro-tests (E)
  browserbase_monthly_cap_eur: 10.0 # B6 arbitrage navigateur
  allocator_reserve_ratio: 0.20
  allocator_max_unproven_ratio: 0.30
  allocator_max_single_channel_ratio: 0.60
  allocator_reversal_points: 10     # revirement > 10 pts → justif obligatoire
  allocator_bandit_gap_points: 15   # écart vs bandit → justif étendue
  allocator_trigger_spent_ratio: 0.80
  allocator_bandit_cost_per_eur: 10.0  # pénalité coût (bandit B)

quotas:
  email_per_mailbox_per_day: 40
  voice_max_calls_per_day: 50       # ex-TOML (B4, fallback transitoire)
  sms_per_sender_per_min: 10
  sms_global_per_min: 60
  memory_search_per_cycle_per_point: 3
  llm_recalls_json: 2
  linkedin_connect_per_day: 20
  linkedin_inmail_per_month: 30

windows:
  timezone: Europe/Paris
  intent_sla_hours: 1
  intent_biz_hours: [[8, 0, 20, 0]]
  quiet_hours: [[23, 0, 8, 0]]       # notifs (GUICHET TTL<15min passe)

calling_zones:                       # F2 : une zone = un pays (extensible)
  default: FR
  FR:
    timezone: Europe/Paris
    voice_windows: [[10, 0, 13, 0], [14, 0, 20, 0]]
    voice_days: [mon, tue, wed, thu, fri]
    prospecting_days: [mon, tue, wed, thu, fri]
    contact_per_30d: 4               # légal FR — monter = ticket + motif
    appointment_margin_min: 10       # pas d'init à < 10 min de la borne
    holidays: FR                     # calculateur fériés (registre)

cooldowns:
  inbound_silence_days: 7            # retour OUTBOUND après silence
  thread_days_per_venue: 7
  guichet_repropose_backoff_days: [1, 3, 7]
  guichet_repropose_max: 3

voice:
  npv_per_venture: true              # F3a : 1 NPV / venture-campagne
  record_retention_hot_days: 90
  record_retention_archive_years: 1
  quality_window: 10                 # 2 appels ≤2/5 sur 10 → pause (F4c)
  quality_min_score: 2
  quality_max_bad: 2
  max_turns: 12
  max_duration_min: 10
  script_max_seconds: 120            # P4 : script pitch borné

observation:
  classify_confidence_min: 0.6
  meeting_confidence_min: 0.8
  other_batch_max_items: 20
  other_alert_pending: 50
  tech_fail_pattern_per_week: 3

builder:
  fix_max_items: 5
  passes_max: 3
  gate3_spotcheck_n: 5
  artifact_max_files: 20
  artifact_max_chars: 200000

prospection:
  qualify_confidence_min: 0.6
  lead_score_gray: [40, 60]          # zone grise P7 → départage LLM-1
  score_w_intent: 25                 # barème P7 (DET, 0-100 clampé)
  score_w_reply: 10
  score_w_engaged: 5
  score_w_meeting: 40
  score_w_negative: -20

collect:
  refund_auto_max_eur: 5.0
  draft_price_min_eur: 1.0
  draft_price_max_eur: 100000.0
  dunning_days: [7, 14]
  quote_required_above_eur: 150
  recanary_months: 1

memory:
  consolidation_days: 3
  consolidate_max_items: 10         # D1 : K max / batch
  lesson_infirm_deprecate: 3
  episode_archive_days: 30
  other_promote_per_week: 10
  judge_oscillation_days: 3
  serge_md_max_lines: 100

tickets:
  digest_hour: 8                     # digest quotidien (Europe/Paris)
  trust_min_approvals: 20            # >95 % sur 20 → candidate auto (H)
  trust_min_rate: 0.95

consent:
  opt_in_channels: [voice, sms, whatsapp]  # opt-in requis, autres = opt-out

listen:
  hot_min_volume: 0.7                # opportunité chaude (J1 + seuils)
  hot_min_willingness: 0.7
  cluster_jaccard_min: 0.25          # clustering dét v1

testing:                             # taille des essais (semence ; MC à froid)
  n_smoke_min: 30
  n_smoke_max: 50
  n_full_min: 150
  n_full_target: 200
  kill_max_positives: 1
  scale_min_positives: 5
  scale_min_meetings: 2
  extend_max: 1

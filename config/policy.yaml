# Les réglages généraux de Serge, ceux qui ne concernent aucune invocation.
# Ce fichier remplit une nouvelle instance ; ensuite, la policy en vigueur
# est en base, et Mission Control (page Policy) la modifie, jamais ce
# fichier. Chaque réglage d'ici est lu par au moins un programme (test).
schema_version: 1

budget:
  monthly_eur: 50.0                # ce que Serge nous coûte par mois (IA)
  llm_daily_eur: 5.0               # ce que les modèles coûtent par jour
  eur_per_usd: 0.9                 # 1 $ en € : OpenRouter facture en dollars

quotas:
  email_per_mailbox_per_day: 40
  voice_max_calls_per_day: 50       # ex-TOML (B4, fallback transitoire)
  sms_per_sender_per_min: 10        # SMS reçus : anti-rafale par expéditeur
  sms_global_per_min: 60            # SMS reçus : toutes lignes confondues
  llm_recalls_json: 2              # nouveaux essais d'une réponse mal formée
  llm_outil_resultat_max_caracteres: 20000  # au-delà, un résultat d'outil est coupé
  linkedin_connect_per_day: 20

windows:
  timezone: Europe/Paris
  quiet_hours: [[23, 0, 8, 0]]       # notifs (GUICHET TTL<15min passe)

calling_zones:                       # une zone = un pays
  default: FR
  FR:
    contact_per_30d: 4               # contacts max par personne sur 30 jours (légal)

standing:
  cout_usage: 0.10                   # débit à chaque acte
  gain_par_heure: 0.02               # crédit à l’inutilisation
  idle_apres_heures: 1.0             # rien ne remonte avant ça
  capital_min: 0.20                  # en dessous = refus
  capital_max: 1.0

voice:
  quality_window: 10                 # 2 appels ≤2/5 sur 10 → pause (F4c)
  quality_min_score: 2
  quality_max_bad: 2

collect:
  refund_auto_max_eur: 5.0
  dunning_days: [7, 14]

memory:
  episode_archive_days: 30

tickets:
  digest_hour: 8                     # digest quotidien (Europe/Paris)

consent:
  opt_in_channels: [voice, sms, whatsapp]  # opt-in requis, autres = opt-out

testing:                             # taille des essais (semence ; MC à froid)
  n_smoke_min: 30
  n_smoke_max: 50
  n_full_min: 150
  n_full_target: 200
  kill_max_positives: 1
  scale_min_positives: 5
  scale_min_meetings: 2
  extend_max: 1

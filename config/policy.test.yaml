# Les valeurs de départ en test (SERGE_ENV=test) : elles remplacent celles
# de policy.yaml, avec des plafonds au plancher, pour le test réel avec une
# clé. Seules les valeurs changent ; titres, aides et bornes viennent de
# policy.yaml. La liste des adresses permises est dans les variables
# d'environnement (.env.test, jamais commité).
schema_version: 2
extends: policy.yaml

budget:
  monthly_eur: 2.0                   # cap €/session de test
  llm_daily_eur: 2.0

quotas:
  sms_per_sender_per_min: 2
  sms_global_per_min: 4
  linkedin_connect_per_day: 0

voice:
  quality_window: 4

channels:
  email:
    max_per_day: 2
  voice:
    max_per_day: 0         # voix exclue du scope live (B8)

tickets:
  digest_hour: 8
